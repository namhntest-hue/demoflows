/* ── Nhớ vị trí cuộn của từng màn (17/08/2026, yêu cầu user) ──
   Bấm back từ PDP về PLP mà văng lên đầu danh sách thì người xem phải cuộn
   lại từ đầu để tìm chỗ cũ — lỗi cơ bản của mọi trang danh sách.
   CHỈ khôi phục khi đi LÙI (`opts.back`: nút back / vuốt back -> popstate);
   đi TỚI vẫn về đầu trang như cũ.
   Lúc sheet đang khoá cuộn thì `window.scrollY` = 0, vị trí thật nằm ở
   `__scrollLockY` — đọc nhầm là nhớ số 0. */
const SCROLL_MEM = {};
const curScrollY = () => (__scrollLockCount > 0 ? __scrollLockY
  : (window.scrollY || document.documentElement.scrollTop || 0));

/* Cuộn tới `y` rồi BÁM LẠI vài khung hình. Lý do: ngay sau khi thay DOM, trang
   mới chưa cao đủ (đo thật lúc chạy: 2072px, một lúc sau mới nở ra 5046px) nên
   cú scrollTo đầu tiên bị trình duyệt KẸP về đáy hiện có — nhớ 1400 mà về tới
   nơi chỉ còn 1260. Đặt lại mỗi khung cho tới khi trang đủ cao và toạ độ dính.
   Dừng ngay khi người dùng tự cuộn/chạm/gõ phím — không giành scroll với họ. */
function restoreScrollY(y) {
  window.scrollTo(0, y);
  if (!y) return;
  const EVS = ['wheel', 'touchstart', 'keydown'];
  let n = 0, stop = false;
  const bail = () => { stop = true; EVS.forEach(ev => window.removeEventListener(ev, bail)); };
  EVS.forEach(ev => window.addEventListener(ev, bail, { once: true, passive: true }));
  const put = () => { if (!stop && Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y); };
  const tick = () => {
    if (stop || n++ > 20 || Math.abs(window.scrollY - y) <= 1) { bail(); return; }
    put();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  /* 2 mốc thời gian dự phòng: tab nền / cửa sổ ẩn thì requestAnimationFrame bị
     đóng băng, vòng bám ở trên không chạy lấy một khung nào. */
  setTimeout(put, 80); setTimeout(put, 250);
}

function go(name, opts = {}) {
  if (name === current) return;
  if (current && !opts.back) history.push(current);
  if (current) SCROLL_MEM[current] = curScrollY();   // phải chốt TRƯỚC khi xoá DOM

  if (name === 'login' && current !== 'login') { loginFrom = current; if (!authViewIntent) authView = 'login'; authViewIntent = false; }

  scrollCleanups.forEach(fn => fn());
  scrollCleanups = [];

  viewport.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'screen';
  el.dataset.screen = name;
  el.innerHTML = RENDER[name]();
  viewport.appendChild(el);
  void el.offsetWidth;   // ép tính layout trước khi cuộn
  if (opts.back) restoreScrollY(SCROLL_MEM[name] || 0);
  else window.scrollTo(0, 0);
  el.classList.add('active');

  current = name;
  wire(el);
  localizeNew(el);
  if (name === 'done') confetti();

  // Đồng bộ với History API của trình duyệt: mỗi lần đi TỚI một màn mới
  // (không phải do popstate kích hoạt) sẽ tạo 1 entry mới trong lịch sử
  // trình duyệt, để nút back vật lý / vuốt back (mobile) hoạt động đúng.
  if (!opts.fromPopstate) {
    window.history.pushState({ screen: name }, '');
  }
}

/* Tắt khôi phục cuộn tự động của trình duyệt: router tự dựng lại DOM nên toạ độ
   trình duyệt nhớ theo entry là của một cây DOM đã biến mất — để 'auto' thì nó
   ghi đè lên vị trí SCROLL_MEM vừa khôi phục. */
if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual';

// Nút back của trình duyệt hoặc thao tác vuốt back (mobile) sẽ bắn sự kiện
// này — tra state đã lưu và render lại đúng màn trước đó trong router nội bộ.
window.addEventListener('popstate', (e) => {
  const target = (e.state && e.state.screen) || history.pop() || 'plp';
  if (e.state && e.state.screen) history.pop();
  go(target, { back: true, fromPopstate: true });
});

/* ── Khoá scroll nền khi có bottom sheet/drawer mở ──
   Dùng kỹ thuật position:fixed (thay vì chỉ overflow:hidden) để chặn
   triệt để scroll/rubber-band nền trên Safari iOS. Có đếm số sheet đang
   mở (lockCount) để xử lý đúng khi 2 sheet chồng nhau (vd: size sheet
   mở tiếp notify sheet) — chỉ mở khoá khi sheet cuối cùng đã đóng. */
let __scrollLockCount = 0, __scrollLockY = 0;
function lockBodyScroll() {
  if (__scrollLockCount === 0) {
    __scrollLockY = window.scrollY || document.documentElement.scrollTop || 0;
    /* BÙ CHỖ SCROLLBAR (17/08/2026, đồng bộ với desktop.html): position:fixed
       làm trang hết tràn -> mất thanh cuộn -> vùng nội dung rộng thêm, mọi thứ
       neo phải nhảy sang phải. Trên điện thoại thật scrollbar là overlay (0px)
       nên phép trừ ra 0 và không đổi gì; chỉ có tác dụng khi xem bằng máy tính.
       box-sizing: border-box (preflight) nên padding-right ăn vào width:100%. */
    const sbw = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
    Object.assign(document.body.style, {
      position: 'fixed', top: `-${__scrollLockY}px`, left: '0', right: '0', width: '100%',
      paddingRight: sbw ? `${sbw}px` : '',
    });
  }
  __scrollLockCount++;
}
function unlockBodyScroll() {
  __scrollLockCount = Math.max(0, __scrollLockCount - 1);
  if (__scrollLockCount === 0) {
    Object.assign(document.body.style, { position: '', top: '', left: '', right: '', width: '', paddingRight: '' });
    window.scrollTo(0, __scrollLockY);
  }
}

/* Nối nút mắt: đổi type input + đổi icon. Tách riêng vì ngoài các màn (wire)
   còn có popup đăng nhập nhanh nằm ngoài .screen, dựng 1 lần lúc khởi động. */
function wirePasswordToggles(root) {
  root.querySelectorAll('[data-pass-toggle]').forEach(btn => {
    if (btn.dataset.wired) return;
    btn.dataset.wired = '1';
    btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const input = btn.parentElement.querySelector('input');
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.querySelector('.eye-on').classList.toggle('hidden', show);
      btn.querySelector('.eye-off').classList.toggle('hidden', !show);
      btn.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    });
  });
}

/* Đổi nhãn hiển thị của ô chọn địa giới (rỗng -> về màu placeholder) */
function setPickLabel(btn, value, placeholder) {
  const lbl = btn.querySelector('.pick-label');
  lbl.textContent = value || placeholder;
  lbl.classList.toggle('text-foreground', !!value);
  lbl.classList.toggle('text-muted-foreground', !value);
}

/* ── Báo lỗi ngay dưới ô nhập ──
   App vốn không validate gì ở checkout (xem AUDIT). Ở bước nhận tại cửa hàng
   thì bắt buộc phải có: nhân viên cửa hàng cần đúng tên + số để giao hàng.
   Lỗi gắn vào input bằng aria-invalid + aria-describedby (trình đọc màn hình
   đọc được), viền đỏ bằng class .fld-err (tailwind build sẵn không có
   border-destructive), và focus nhảy tới ô sai ĐẦU TIÊN. */
function clearFieldErr(inp) {
  inp.classList.remove('fld-err');
  inp.removeAttribute('aria-invalid');
  const id = inp.getAttribute('aria-describedby');
  if (id) { const p = document.getElementById(id); if (p) p.remove(); inp.removeAttribute('aria-describedby'); }
}
function setFieldErr(inp, msg) {
  clearFieldErr(inp);
  inp.classList.add('fld-err');
  inp.setAttribute('aria-invalid', 'true');
  const eid = 'err-' + inp.id;
  inp.setAttribute('aria-describedby', eid);
  inp.insertAdjacentHTML('afterend', `<p id="${eid}" class="mt-1 text-[12px] leading-4 text-destructive">${msg}</p>`);
  const p = document.getElementById(eid);
  if (p) localizeNew(p);
}
/* 6 ô OTP không có ô nào là "ô chính" để gắn lỗi: setFieldErr chèn <p> vào
   `afterend` của phần tử truyền vào, mà afterend của một ô thì rơi vào GIỮA hàng
   flex. Nên truyền CẢ HÀNG `#otpRow` — <p> rơi ngay dưới hàng, đúng chỗ; lớp
   `.fld-err` bám vào div không viền nên vô hình, không hại gì.
   Tô đỏ 6 ô phải làm riêng, và gỡ khi gõ lại. */
function otpErr(root, msg) {
  const row = root.querySelector('#otpRow');
  if (!row) return;
  const cells = [...row.querySelectorAll('.otp-cell')];
  if (!msg) { clearFieldErr(row); cells.forEach(c => c.classList.remove('fld-err')); return; }
  setFieldErr(row, msg);
  cells.forEach(c => {
    c.classList.add('fld-err');
    c.addEventListener('input', () => otpErr(root, ''), { once: true });
  });
}
function validatePickup(root) {
  const get = k => root.querySelector(`[data-ckf="${k}"]`);
  const rules = [
    [get('name'),  v => !!v.trim(),                       'Vui lòng nhập họ và tên'],
    [get('phone'), v => /^0\d{8,10}$/.test(v.replace(/\s/g, '')), 'Số điện thoại chưa đúng'],
    [get('email'), v => !v.trim() || /^\S+@\S+\.\S+$/.test(v.trim()), 'Email chưa đúng'],
  ];
  let first = null;
  rules.forEach(([inp, ok, msg]) => {
    if (!inp) return;
    if (ok(inp.value)) { clearFieldErr(inp); return; }
    setFieldErr(inp, msg);
    if (!first) first = inp;
  });
  if (first) { first.focus({ preventScroll: true }); first.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  return !first;
}

/* Ô tỉnh/thành và phường/xã: mở sheet chọn. Phường phụ thuộc tỉnh nên đổi
   tỉnh là xoá phường đang chọn — giữ lại sẽ ra địa chỉ không tồn tại. */
function wireAddressPickers(root) {
  root.querySelectorAll('[data-pick]').forEach(btn => {
    btn.addEventListener('click', () => {
      /* ── Nhận tại cửa hàng: thành phố -> cửa hàng ──
         Cùng ràng buộc phụ thuộc như tỉnh -> phường: đổi thành phố là bỏ cửa
         hàng đang chọn, vì cửa hàng cũ không thuộc thành phố mới. */
      if (btn.dataset.pick === 'city') {
        window.__openPicker('Chọn thành phố', DAFC_STORES.map(([c]) => c), ckCity, picked => {
          if (picked === ckCity) return;
          ckCity = picked; ckStore = '';
          // đổi thành phố -> danh sách cửa hàng đổi theo, khối thông tin thu lại
          // (chữ đã gõ vẫn còn vì 3 ô người nhận đọc/ghi vào state)
          rerenderCheckout(root);
          const cityBtn = root.querySelector('[data-pick="city"]');
          if (cityBtn) cityBtn.focus({ preventScroll: true });   // trả con trỏ về đúng chỗ vừa thao tác
        });
        return;
      }
      /* Tỉnh/thành người nhận đang sinh sống — chỉ có ở luồng nhận tại cửa
         hàng, dùng lại đúng danh sách tỉnh của địa chỉ giao hàng. */
      if (btn.dataset.pick === 'home') {
        window.__openPicker('Chọn tỉnh / thành phố', VN_LOCATIONS.map(([pv]) => pv), ckHome, picked => {
          ckHome = picked;
          setPickLabel(btn, picked, 'Chọn tỉnh / thành phố');
        });
        return;
      }
      if (btn.dataset.pick === 'province') {
        window.__openPicker('Chọn tỉnh / thành phố', VN_LOCATIONS.map(([pv]) => pv), ckProvince, picked => {
          ckProvince = picked; ckWard = '';
          setPickLabel(btn, picked, 'Chọn tỉnh / thành phố');
          const w = root.querySelector('[data-pick="ward"]');
          if (w) setPickLabel(w, '', 'Chọn phường / xã');
        });
        return;
      }
      if (!ckProvince) { toast('Chọn tỉnh / thành phố trước'); return; }
      const wards = (VN_LOCATIONS.find(([pv]) => pv === ckProvince) || ['', []])[1];
      window.__openPicker('Chọn phường / xã', wards, ckWard, picked => {
        ckWard = picked;
        setPickLabel(btn, picked, 'Chọn phường / xã');
      });
    });
  });
}

/* ── Chặn bấm 2 lần khi nút đang "loading" ──
   10 handler trước đây gán spinner vào innerHTML rồi setTimeout 700ms mà KHÔNG
   disabled, nên bấm 2 lần là chạy 2 lần (đặt 2 đơn, gửi 2 OTP...). Giờ state
   Disabled của component (opacity .5) mới có ý nghĩa thực: btnBusy() trả về true
   nếu nút đang bận -> handler return sớm; btnDone() trả nút về bình thường. */
function btnBusy(btn) {
  if (!btn || btn.dataset.busy) return true;
  btn.dataset.busy = '1';
  btn.disabled = true;
  return false;
}
function btnDone(btn) {
  if (!btn) return;
  delete btn.dataset.busy;
  btn.disabled = false;
}

/* ── Wire behaviour for a screen ── */
function wire(root) {
  wirePasswordToggles(root);
  root.querySelectorAll('[data-size-chart]').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); openSizeChart(); }));
  wireAddressPickers(root);
  // images fade-in
  wireLazy(root);

  // ── Search screen ──
  const searchInput = root.querySelector('#searchInput');
  if (searchInput) {
    const sugEl = root.querySelector('#searchSug');
    const noresEl = root.querySelector('#searchNores');
    const emptyEl = root.querySelector('#searchEmpty');
    const clearBtn = root.querySelector('#searchClear');
    // hiện/ẩn pane có fade-rise nhẹ; gõ tiếp trong pane đang mở thì không chạy lại animation
    const setShown = (el, show) => {
      if (!el) return;
      if (!show) { el.style.display = 'none'; return; }
      if (el.style.display === 'none') {
        el.style.display = '';
        el.classList.remove('search-pane');
        void el.offsetWidth;
        el.classList.add('search-pane');
      }
    };
    // 3 khối theo Figma: gõ có kết quả → Gợi ý; gõ không kết quả → Gợi ý
    // ("Không tìm thấy kết quả") + Sản phẩm nổi bật; rỗng → lịch sử + trending
    const updatePanes = () => {
      const q = searchQuery.trim();
      if (clearBtn) clearBtn.style.display = searchInput.value ? '' : 'none';
      if (q) renderSearchSug(root);
      setShown(sugEl, !!q);
      setShown(noresEl, !!q && !searchSuggestions(q).length);
      setShown(emptyEl, !q);
    };
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value;
      updatePanes();

  // Cùng kiểu với #sortBtn/#sortMenu ở PLP: toggle .hidden, click ra ngoài thì
  // đóng. Item không phải trang hiện tại mang data-nav nên handler [data-nav]
  // bên dưới tự điều hướng; item của trang hiện tại chỉ đóng menu (go() return
  // sớm khi name === current nên tự nó không đóng được).
  const pMoreBtn  = root.querySelector('#policyMore');
  const pMoreMenu = root.querySelector('#policyMenu');
  if (pMoreBtn && pMoreMenu) {
    const setOpen = open => {
      pMoreMenu.classList.toggle('hidden', !open);
      pMoreBtn.classList.toggle('open', open);
      pMoreBtn.setAttribute('aria-expanded', String(open));
    };
    pMoreBtn.addEventListener('click', e => {
      e.stopPropagation();
      setOpen(pMoreMenu.classList.contains('hidden'));
    });
    pMoreMenu.querySelector('[data-policy-close]')
      ?.addEventListener('click', e => { e.stopPropagation(); setOpen(false); });
    const closePolicyMenu = () => setOpen(false);
    document.addEventListener('click', closePolicyMenu);
    scrollCleanups.push(() => document.removeEventListener('click', closePolicyMenu));
  }

  // Mục lục trang chính sách -> cuộn tới section tương ứng.
  // scroll-mt-[64px] trên section đã trừ sẵn chiều cao navbar sticky (48px)
  // + 16px thở, nên tiêu đề không bị nav che.
  root.querySelectorAll('[data-policy-toc]').forEach(btn => {
    btn.addEventListener('click', () => {
      root.querySelector(`[data-policy-sec="${btn.dataset.policyToc}"]`)
        ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  root.querySelectorAll('.acc-trigger').forEach(t => {
    t.addEventListener('click', e => {
      e.stopPropagation();
      const me = t.closest('.acc');
      const wasOpen = me.classList.contains('open');
      // đóng mọi mục cùng nhóm (cùng phần tử cha) trước
      [...me.parentElement.children].forEach(sib => {
        if (sib !== me && sib.classList && sib.classList.contains('acc')) sib.classList.remove('open');
      });
      me.classList.toggle('open', !wasOpen);
    });
  });

  // size trigger → bottom sheet (thay <select> gốc)
  root.querySelectorAll('[data-size-trigger]').forEach(btn => {
    btn.addEventListener('click', () => {
      const kind = btn.dataset.sizeTrigger;
      const label = btn.querySelector('.size-trigger-label');
      if (window.__openSizeSheet) {
        window.__openSizeSheet(kind, label.textContent, picked => {
          label.textContent = picked;
          label.classList.remove('text-muted-foreground');
          label.classList.add('text-foreground');
        });
      }
    });
  });

  // checkbox
  root.querySelectorAll('[data-check]').forEach(c => {
    c.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      c.classList.toggle('on');
      /* Riêng ô tick trong giỏ: tick = "sản phẩm này nằm trong đơn". Bỏ tick là
         rời tạm tính -> quà kèm sản phẩm rút theo và quà theo đơn tính lại
         (có thể rớt mốc). Các màn khác không có .cart-row nên không dính. */
      const row = c.closest('.cart-row');
      if (!row) return;
      const item = CART[+row.dataset.row];
      if (!item) return;
      item.sel = c.classList.contains('on');
      refreshCartAll(root);
    });
  });

  // radio option groups
  root.querySelectorAll('#shipOpts, #payOpts').forEach(group => {
    group.querySelectorAll('[data-opt]').forEach(o => {
      o.addEventListener('click', () => {
        group.querySelectorAll('[data-opt]').forEach(x => {
          x.classList.remove('on'); x.classList.replace('border-primary', 'border-border');
          x.querySelector('.radio').classList.remove('on');
          x.querySelector('.radio').classList.replace('border-primary', 'border-border');
          const d = x.parentElement.querySelector('.pay-detail');
          if (d) { d.classList.remove('max-h-40', 'mt-2'); d.classList.add('max-h-0'); }
        });
        o.classList.add('on'); o.classList.replace('border-border', 'border-primary');
        o.querySelector('.radio').classList.add('on');
        o.querySelector('.radio').classList.replace('border-border', 'border-primary');
        const d = o.parentElement.querySelector('.pay-detail');
        if (d) { d.classList.remove('max-h-0'); d.classList.add('max-h-40', 'mt-2'); }
      });
    });
  });

  // PDP: sizes / swatches / gallery
  const sizeBtns = [...root.querySelectorAll('[data-size]')];
  if (sizeBtns.length) {
    // dòng cảnh báo dưới chips (Figma: Regular 12 #d62845)
    const chipRow = sizeBtns[0].parentElement;
    let note = root.querySelector('#sizeNote');
    if (!note) {
      note = document.createElement('p');
      note.id = 'sizeNote';
      note.className = 'text-[12px] leading-4 text-destructive hidden pt-2';
      note.textContent = '*Tạm hết hàng';
      chipRow.insertAdjacentElement('afterend', note);
    }
    const cta      = root.querySelector('#pdpCta');
    const mainBtn  = cta ? cta.querySelector('button[data-add]') : null;
    // Khối trả góp nằm ngay dưới nút (payOfferRow) — ẩn khi size chọn đang hết
    // hàng, giống bản desktop: không còn mua được thì đừng chào trả góp.
    const payOffer = cta ? [...cta.children].find(c => c.textContent.includes('Trả trước')) : null;
    const stickyBtn = document.querySelector('#pdpStickyCta button[data-add]');
    const NORMAL = mainBtn ? mainBtn.innerHTML : '';
    const stickyNormal = stickyBtn ? stickyBtn.innerHTML : '';

    // state: '' bình thường | 'oos' Tạm hết hàng | 'notify' Nhận thông báo | 'done' đã đăng ký
    const lowStock = root.querySelector('#lowStock');
    // `size` = giá trị size vừa chọn — "Chỉ còn 01 sản phẩm" CHỈ hiện khi size đó
    // nằm trong SIZE_LOW_STOCK (cùng nguồn với dòng "Còn 1 sản phẩm" của size picker).
    function setCta(state, size) {
      if (!mainBtn) return;
      const LABEL = { oos: 'Tạm hết hàng', notify: 'Nhận thông báo khi có hàng', done: 'Đã đăng ký nhận thông báo' };
      if (state) {
        mainBtn.dataset.oosState = state;
        mainBtn.innerHTML = LABEL[state];
        if (stickyBtn) { stickyBtn.dataset.oosState = state; stickyBtn.innerHTML = LABEL[state]; }
        if (payOffer) payOffer.classList.add('hidden');   // hết hàng thì không chào trả góp
        if (lowStock) lowStock.classList.add('hidden');   // hết hàng / đã đăng ký thì không hiện "Chỉ còn 01 sản phẩm"
        if (state === 'oos') {
          // Tạm hết hàng: không còn hành động nào khả dụng -> disable hẳn nút, bỏ dòng cảnh báo đỏ (dư thừa)
          note.classList.add('hidden');
          mainBtn.disabled = true; mainBtn.style.opacity = '.4'; mainBtn.style.pointerEvents = 'none';
          if (stickyBtn) { stickyBtn.disabled = true; stickyBtn.style.opacity = '.4'; stickyBtn.style.pointerEvents = 'none'; }
        } else {
          note.classList.remove('hidden');
          mainBtn.disabled = false; mainBtn.style.opacity = ''; mainBtn.style.pointerEvents = '';
          if (stickyBtn) { stickyBtn.disabled = false; stickyBtn.style.opacity = ''; stickyBtn.style.pointerEvents = ''; }
        }
      } else {
        delete mainBtn.dataset.oosState;
        mainBtn.innerHTML = NORMAL;
        mainBtn.disabled = false; mainBtn.style.opacity = ''; mainBtn.style.pointerEvents = '';
        if (stickyBtn) { delete stickyBtn.dataset.oosState; stickyBtn.innerHTML = stickyNormal; stickyBtn.disabled = false; stickyBtn.style.opacity = ''; stickyBtn.style.pointerEvents = ''; }
        note.classList.add('hidden');
        if (payOffer) payOffer.classList.remove('hidden');
        if (lowStock) lowStock.classList.toggle('hidden', !SIZE_LOW_STOCK[size]);
      }
    }

    sizeBtns.forEach(b => {
      b.addEventListener('click', () => {
        sizeBtns.forEach(x => { x.classList.remove('on'); x.classList.replace('border-primary', 'border-border'); });
        b.classList.add('on'); b.classList.replace('border-border', 'border-primary');
        setCta(b.dataset.oos || '', b.dataset.size);   // '' | 'oos' | 'notify' — lấy thẳng từ size
      });
    });

    // 'notify' -> mở form điền email + SĐT
    [mainBtn, stickyBtn].forEach(btn => {
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (btn.dataset.oosState === 'notify' && window.__openNotify) window.__openNotify(() => setCta('done'));
      });
    });
  }
  root.querySelectorAll('[data-sw]').forEach(b => {
    b.addEventListener('click', () => {
      root.querySelectorAll('[data-sw]').forEach(x => { x.classList.remove('on'); x.classList.add('border-transparent'); });
      b.classList.add('on'); b.classList.remove('border-transparent');
      const cn = root.querySelector('#colorName'); if (cn) cn.textContent = b.dataset.color;
      const g = root.querySelector('#pdpGallery');
      if (g) g.scrollTo({ left: g.clientWidth * (+b.dataset.sw), behavior: 'smooth' });
    });
  });
  const gal = root.querySelector('#pdpGallery');
  if (gal) {
    gal.addEventListener('scroll', () => {
      const i = Math.round(gal.scrollLeft / gal.clientWidth);
      root.querySelectorAll('#pdpDots span').forEach((d, j) => {
        d.className = `h-1 rounded-full transition-all duration-300 ${j === i ? 'w-6 bg-primary' : 'w-4 bg-border-3'}`;
      });
    }, { passive: true });
  }

  // Dòng khuyến mãi ở PDP / PDP2 -> bottom sheet chi tiết chương trình.
  // Dùng lại #infoSheet (chrome + animation + lock scroll đã có), truyền HTML
  // nên phải bật cờ asHTML ở tham số thứ 3.
  root.querySelectorAll('[data-promo]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const p = PROMOS[btn.dataset.promo];
      if (!p || !window.__openInfoSheet) return;
      const body = `
        <div class="flex flex-col gap-4">
          <p class="text-[14px] font-medium leading-5 text-foreground">${p.line}</p>
          <div class="flex flex-col gap-3">
            ${p.rows.map(([k, v]) => `
              <div class="flex flex-col gap-1">
                <span class="text-[12px] leading-4 text-muted-foreground">${k}</span>
                <span class="text-[14px] leading-5 text-secondary-foreground">${v}</span>
              </div>`).join('')}
          </div>
        </div>`;
      window.__openInfoSheet(p.title, body, true);
    });
  });

  // Zoom khi chạm ảnh gallery (versace) — dragScroll đã chặn nếu vừa kéo
  root.querySelectorAll('.zoomable').forEach(btn => {
    btn.addEventListener('click', e => { if (window.__openZoom) window.__openZoom(btn.dataset.zoom); });
  });

  // WEAR IT WITH: counter "i / n" chạy theo cuộn
  const wiw = root.querySelector('#wiwRow'), wc = root.querySelector('#wiwCounter');
  if (wiw && wc) {
    const cards = wiw.querySelectorAll('[data-product]');
    wiw.addEventListener('scroll', () => {
      const i = Math.min(cards.length, Math.round(wiw.scrollLeft / (cards[0].offsetWidth + 4)) + 1);
      wc.textContent = i + ' / ' + cards.length;
    }, { passive: true });
  }

  // Cart (thành viên): Ưu đãi DAFC Rewards — radio đúng nghĩa, chọn 1 trong 2
  const rewardGroup = root.querySelector('#rewardOpts');
  if (rewardGroup) {
    rewardGroup.querySelectorAll('[data-reward]').forEach(b => {
      b.addEventListener('click', () => {
        if (b.dataset.reward === cartReward) return;
        cartReward = b.dataset.reward;
        rewardGroup.querySelectorAll('[data-reward]').forEach(x => {
          const on = x === b;
          x.classList.toggle('on', on);
          x.classList.toggle('border-border-5', on);
          x.classList.toggle('border-border', !on);
          const rd = x.querySelector('.radio');
          rd.classList.toggle('on', on);
          rd.classList.toggle('border-primary', on);
          rd.classList.toggle('border-border', !on);
        });
        refreshCartSummary(root);
        toast('Đã áp dụng: ' + (cartReward === 'member' ? 'Giảm giá thành viên' : 'Điểm thưởng'));
      });
    });
  }

  // Cart: "Chương trình khuyến mãi" — mặc định hiện mấp mé, bấm mới hiện hết
  const promoToggle = root.querySelector('#promoToggle');
  if (promoToggle) {
    const peek = root.querySelector('#promoPeek');
    promoToggle.addEventListener('click', () => {
      const open = peek.classList.toggle('open');
      promoToggle.textContent = open ? 'Thu gọn' : 'Xem tất cả 3 chương trình';
    });
  }

  // Cart: qty steppers — số lượng là STATE (CART[i].qty), không chỉ chữ trong DOM
  root.querySelectorAll('.qty-btn').forEach(b => {
    b.addEventListener('click', () => {
      const row = b.closest('.cart-row'), el = row.querySelector('.qty');
      let v = parseInt(el.textContent, 10) + parseInt(b.dataset.step, 10);
      v = Math.max(1, Math.min(99, v));
      el.textContent = String(v).padStart(2, '0');
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      const item = CART[+row.dataset.row];
      if (!item) return;
      item.qty = v;
      refreshCartAll(root);      // tăng đủ mốc là quà theo đơn hiện ngay ở đây
    });
  });

  // Cart: delete row
  root.querySelectorAll('.del').forEach(b => {
    b.addEventListener('click', () => {
      const row = b.closest('.cart-row');
      /* Đánh dấu removed NGAY (không chờ animation xong) để tạm tính + điều kiện
         quà phản ánh đúng lúc người dùng thấy dòng bắt đầu trượt đi. Không splice
         khỏi CART vì các dòng sau còn tham chiếu chỉ số qua data-row. */
      const item = CART[+row.dataset.row];
      if (item) { item.removed = true; item.sel = false; }
      const giftEl = row.nextElementSibling;   // dòng quà kèm của chính item này
      if (giftEl && giftEl.dataset.giftOf === row.dataset.row) giftEl.remove();
      row.style.transition = 'opacity .28s ease, transform .28s ease, max-height .32s ease, padding .32s ease';
      row.style.maxHeight = row.offsetHeight + 'px';
      requestAnimationFrame(() => {
        row.style.opacity = '0'; row.style.transform = 'translateX(-24px)';
        row.style.maxHeight = '0'; row.style.paddingTop = '0'; row.style.paddingBottom = '0';
      });
      setTimeout(() => { row.remove(); refreshCartCount(root); }, 330);
      refreshCartAll(root);
      toast('Đã xóa sản phẩm');
    });
  });

  /* Cart: đổi quà — UỶ QUYỀN ở gốc màn vì nhóm quà bị chèn/dựng lại lúc chạy,
     bind trực tiếp thì nút của nhóm dựng sau không có handler. Cờ trên root để
     không gắn chồng nếu wire() chạy lại. */
  if (root.querySelector('#cartList') && !root.dataset.giftWired) {
    root.dataset.giftWired = '1';
    root.addEventListener('click', e => {
      const sw = e.target.closest('[data-gift-swap]');
      if (!sw || !window.__openGiftSheet) return;
      const pk = sw.dataset.giftSwap;
      window.__openGiftSheet(pk, key => {
        if (key === (giftPick[pk] || GIFT_PROGRAMS[pk].gifts[0])) return;   // chọn lại chính món đang có -> không báo gì
        giftPick[pk] = key;
        refreshCartGifts(root);
        toast('Đã đổi quà tặng');
      });
    });
  }

  /* Cart: chọn tất cả — trước đây KHÔNG tự đổi trạng thái ô tick của chính nó
     nên bấm mấy lần cũng chỉ tick lại tất cả, không bỏ tick được. Giờ đảo trạng
     thái rồi mới áp xuống các dòng (bỏ qua dòng đã xoá). */
  const selAll = root.querySelector('#selectAll');
  if (selAll) selAll.addEventListener('click', () => {
    /* Trạng thái đích suy từ STATE (không đọc class của chính ô tổng): đang
       chọn hết -> bỏ hết, còn lại -> chọn hết. Đọc class thì sau khi bỏ tick 1
       dòng, cú bấm đầu tiên lại đi bỏ tick nốt phần còn lại. */
    const items = cartItems();
    const on = !(items.length && items.every(c => c.sel !== false));
    root.querySelectorAll('.cart-row .chk').forEach(c => c.classList.toggle('on', on));
    items.forEach(c => { c.sel = on; });
    refreshCartAll(root);
  });
  const delSel = root.querySelector('#delSelected');
  if (delSel) delSel.addEventListener('click', () => {
    root.querySelectorAll('.cart-row').forEach(r => { if (r.querySelector('.chk').classList.contains('on')) r.querySelector('.del').click(); });
  });

  // Cart: Đặt hàng — khách -> popup đăng nhập nhanh (2858:42899); đã đăng nhập -> checkout
  // (dùng data-checkout riêng, KHÔNG dùng chung data-order với nút "Chi tiết" đơn
  // hàng ở Account — trước đây trùng attribute nên bấm "Đặt hàng" cũng bị dính
  // luôn handler go('order') ở dưới, đẩy sang sai trang chi tiết đơn hàng.)
  root.querySelectorAll('[data-checkout]').forEach(b => b.addEventListener('click', () => {
    /* Không còn món nào được tick thì không cho sang thanh toán: trước khi giỏ
       có state thật, tạm tính là hằng số nên chuyện này không xảy ra được; giờ
       bỏ tick hết là đơn 0 đ với đủ 4 món in ra. */
    if (root.querySelector('#cartList') && !cartSelected().length) {
      toast('Hãy chọn ít nhất 1 sản phẩm');
      return;
    }
    /* Ép mở lại bước "Vận chuyển" mỗi lần vào checkout — kể cả lượt quay lại
       giỏ rồi vào lại. Không có dòng này thì ckStep còn giữ giá trị của lượt
       trước và rơi thẳng vào bước giữa. ckMaxStep GIỮ NGUYÊN nên các bước đã
       xong vẫn ở dạng tóm tắt, không mất dữ liệu. Xem ghi chú ở screenCHECKOUT. */
    ckStep = 0;
    if (ckAuth) go('checkout');
    else if (window.__openLoginPop) window.__openLoginPop();
  }));

  // Nút "Áp dụng" chỉ active khi input có nội dung (giống pattern szAdd ở size sheet)
  const bindApplyGate = (inputEl, btnEl) => {
    if (!inputEl || !btnEl) return;
    const update = () => {
      const has = (inputEl.value || '').trim().length > 0;
      btnEl.disabled = !has;
      btnEl.style.opacity = has ? '1' : '.4';
    };
    inputEl.addEventListener('input', update);
    update();
  };
  bindApplyGate(root.querySelector('#pbh'), root.querySelector('#applyPbh'));

  // Phiếu mua hàng: mỗi mã cộng dồn vào tổng (pbhAmount demo) + có dòng riêng
  // trong summary (theo Figma 3428:55499) — hỗ trợ nhiều mã cùng lúc, xoá qua ×.
  const renderPbhList = () => {
    const list = root.querySelector('#pbhList');
    if (!list) return;
    // Ẩn hẳn khi rỗng, tránh flex gap tạo khoảng trống thừa dưới ô input
    list.className = cartPbh.length ? 'flex gap-2 flex-wrap' : 'hidden';
    list.innerHTML = cartPbh.map((p, i) => `
      <span class="pbh-badge bg-secondary rounded flex items-center gap-1.5 px-2 py-0.5 h-6" data-pbh-idx="${i}">
        <span class="text-[12px] font-medium leading-4 text-secondary-foreground truncate max-w-[140px]">${p.code}</span>
        <button class="pbh-del w-3 h-3 flex items-center justify-center shrink-0 press [&_svg]:w-3 [&_svg]:h-3">${IcoCross}</button>
      </span>`).join('');
    list.querySelectorAll('.pbh-del').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const idx = Number(b.closest('.pbh-badge').dataset.pbhIdx);
      const removed = cartPbh.splice(idx, 1)[0];
      renderPbhList();
      refreshCartSummary(root);
      toast('Đã gỡ ' + (removed ? removed.code : 'phiếu mua hàng'));
    }));
  };
  const pbhBtn = root.querySelector('#applyPbh');
  if (pbhBtn) pbhBtn.addEventListener('click', () => {
    const inp = root.querySelector('#pbh');
    const v = inp.value.trim();
    if (!v) return;
    cartPbh.push({ code: v, amount: pbhAmount(v) });
    inp.value = '';
    pbhBtn.disabled = true; pbhBtn.style.opacity = '.4';
    renderPbhList();
    refreshCartSummary(root);
    toast('Đã thêm ' + v);
  });
  renderPbhList();

  // Cart: ưu đãi — dòng "Áp dụng ưu đãi" thu gọn, bấm mở sheet chọn nhiều mã
  // (xem #vcSheet). Ô nhập mã gõ tay đã dọn vào trong sheet.
  const vTrigger = root.querySelector('#voucherTrigger');
  if (vTrigger) vTrigger.addEventListener('click', () => window.__openVoucherSheet && window.__openVoucherSheet(() => {
    renderVoucherUI(root);
    refreshCartSummary(root);
  }));
  renderVoucherUI(root);

  // Show more → skeleton then append
  const sm = root.querySelector('#showMore');
  if (sm) sm.addEventListener('click', () => {
    const grid = sm.closest('[data-scroller]').querySelector('.grid');
    sm.innerHTML = `<svg class="spin" width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="var(--general-primary)" stroke-opacity=".2" stroke-width="2"/><path d="M14.5 8A6.5 6.5 0 0 0 8 1.5" stroke="var(--general-primary)" stroke-width="2" stroke-linecap="round"/></svg> Đang tải`;
    const skels = Array(4).fill(`<div class="flex flex-col"><div class="skel w-full" style="aspect-ratio:189/252"></div><div class="px-1 py-2 flex flex-col gap-1"><div class="skel h-3 w-2/3 rounded"></div><div class="skel h-3 w-full rounded"></div><div class="skel h-3 w-1/2 rounded"></div></div></div>`).join('');
    grid.insertAdjacentHTML('beforeend', skels);
    setTimeout(() => {
      grid.querySelectorAll('.skel').forEach(s => s.closest('.flex-col').remove());

/* Dựng lại phần quà cho khớp state hiện tại.
   · quà theo sản phẩm: chèn/gỡ ngay sau đúng dòng item (không đụng dòng khác)
   · quà theo đơn: vẽ lại ruột khối #orderGift
   Chỉ chạy animation .gift-in cho quà VỪA XUẤT HIỆN — quà đang có sẵn mà nháy
   lại mỗi lần bấm +/- thì rối mắt. */
function refreshCartGifts(root) {
  const list = root.querySelector('#cartList');
  if (list) {
    CART.forEach((c, i) => {
      const rowEl = list.querySelector(`.cart-row[data-row="${i}"]`);
      const cur   = list.querySelector(`.gift-group[data-gift-of="${i}"]`);
      const want  = !!(c.gift && GIFT_PROGRAMS[c.gift] && !c.removed && c.sel !== false && rowEl);
      if (want && !cur) {
        rowEl.insertAdjacentHTML('afterend', productGiftHTML(c, i));
        giftAppear(rowEl.nextElementSibling);
      } else if (!want && cur) {
        cur.remove();
      } else if (want && cur) {
        /* Đã có nhóm rồi nhưng nội dung có thể đổi (đổi quà, mở/đóng danh sách)
           -> dựng lại tại chỗ, KHÔNG chạy animation vì quà không mới xuất hiện.
           So bằng CHỮ KÝ (data-sig) chứ KHÔNG so outerHTML: wireLazy() đóng thêm
           class .loaded + data-lazy-wired vào thẻ <img> ngay sau khi chèn, nên
           outerHTML không bao giờ còn bằng chuỗi vừa sinh -> nhóm bị đập đi dựng
           lại mỗi lần bấm bất kỳ đâu trong giỏ (mất animation đang chạy, mất focus). */
        const sig = `${c.gift}|${giftPick[c.gift] || GIFT_PROGRAMS[c.gift].gifts[0]}`;
        if (cur.dataset.sig !== sig) {
          cur.outerHTML = productGiftHTML(c, i).trim();
          const el = list.querySelector(`.gift-group[data-gift-of="${i}"]`);
          wireLazy(el);
          if (LANG === 'en') applyLang(el, 'en');
        }
      }
    });
  }
  const box = root.querySelector('#orderGift');
  if (box) {
    const had = [...box.querySelectorAll('[data-gift-tier]')].map(el => el.dataset.giftTier);
    box.innerHTML = orderGiftInner();
    wireLazy(box);                       // ảnh vừa dựng lại cũng cần .loaded
    if (LANG === 'en') applyLang(box, 'en');
    box.querySelectorAll('[data-gift-tier]').forEach(el => {
      if (!had.includes(el.dataset.giftTier)) giftAppear(el, true);
    });
  }
}

/* img.lazy đứng ở opacity 0 cho tới khi có class .loaded. Chỗ gắn class đó nằm
   trong wire() — chỉ chạy lúc dựng màn — nên MỌI ảnh chèn lúc chạy (dòng quà)
   phải gọi lại hàm này, không thì ảnh quà trong suốt vĩnh viễn. */
function wireLazy(root) {
  root.querySelectorAll('img.lazy').forEach(img => {
    if (img.dataset.lazyWired) return;
    img.dataset.lazyWired = '1';
    if (img.complete) img.classList.add('loaded');
    else img.addEventListener('load', () => img.classList.add('loaded'));
    img.addEventListener('error', () => { img.style.background = 'var(--general-secondary)'; img.classList.add('loaded'); });
  });
}

/* Cho dòng quà chạy animation xuất hiện (và dịch sang EN nếu đang ở EN).

function giftAppear(el, skipLang) {
  if (!el) return;
  wireLazy(el);
  if (!skipLang && LANG === 'en') applyLang(el, 'en');

}

/* ── Kéo ngang carousel bằng chuột (mobile đã có vuốt native) ── */
function dragScroll(el) {
  let down = false, sx = 0, sl = 0, moved = false;
  const onDown = e => {
    if (e.pointerType === 'touch') return;      // để touch dùng cuộn native
    down = true; moved = false;
    sx = e.clientX; sl = el.scrollLeft;
    el.classList.add('dragging');
  };
  const onMove = e => {
    if (!down) return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 3) moved = true;
    el.scrollLeft = sl - dx;
    e.preventDefault();
  };
  const onUp = () => {
    if (!down) return;
    down = false;
    el.classList.remove('dragging');
  };
  // chặn click nếu vừa kéo (tránh lỡ mở sản phẩm)
  const onClick = e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } };
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('click', onClick, true);
  el.addEventListener('dragstart', e => e.preventDefault());
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  scrollCleanups.push(() => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
  });
}

/* ── Reveal observer ── */
let io;
function observeReveal(root) {
  if (!io) io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.08 });
  root.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));
}

/* ── Toast ── */
let toastT;
function toast(msg) {
  if (LANG === 'en') { const _t = tr(String(msg), 'en'); if (_t) msg = _t; }
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.remove('hidden'); t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.add('hidden'), 1800);
}

/* ── Fly to cart ── */
function flyToCart(srcImg) {
  const target = document.querySelector('.cart-badge');
  if (!target || !srcImg) return;
  const s = srcImg.getBoundingClientRect(), t = target.getBoundingClientRect();
  const clone = srcImg.cloneNode();
  clone.className = 'fly';
  Object.assign(clone.style, { left: s.left + 'px', top: s.top + 'px', width: s.width + 'px', height: s.height + 'px' });
  clone.style.setProperty('--dx', (t.left - s.left + t.width / 2 - s.width / 2) + 'px');
  clone.style.setProperty('--dy', (t.top - s.top + t.height / 2 - s.height / 2) + 'px');
  document.body.appendChild(clone);
  setTimeout(() => clone.remove(), 760);
}

}

/* Lora thêm 18/08/2026 làm mặt chữ của bộ da "Editorial · MR PORTER". Mặc định

/* Bộ font ĐƠN để thử. Lịch sử: 21/08 thay Inter/Jakarta bằng Mona Sans/Quicksand/
   Mulish/Manrope -> Inter trở lại thế chỗ Quicksand -> thêm Josefin Sans + Jost.
   24/08/2026 (yêu cầu user): BỎ Jost + Josefin Sans, rồi BỎ Mona Sans.
   Lý do kỹ thuật đứng sau việc bỏ Jost, đo cứng bằng cách tải CSS từ
   fonts.googleapis.com: **Jost KHÔNG có subset `vietnamese`** (không có
   unicode-range U+1EA0-1EF9) -> chữ Việt có dấu 2 tầng (ế/ộ/ậ/ữ) rơi sang font
   fallback, dòng chữ lẫn 2 mặt chữ. Josefin Sans có subset VN nhưng x-height
   rất thấp, đọc kém ở cỡ UI 12-14px của dự án.
   24/08/2026 (đợt sau, lệnh user): BỎ THÊM **Mulish + Lora**. Lora vào file 18/08 để
   làm mặt chữ serif của bộ da Editorial · MR PORTER, nhưng bộ da đó đã về Montserrat
   từ chốt 20/08 nên nó không còn chỗ dùng nào -> gỡ khỏi cả danh sách này lẫn thẻ
   <link>. Cùng lượt: cặp mix "Cormorant Garamond + Be Vietnam Pro" bỏ khỏi FONT_PAIRS
   và 2 family đó cũng ra khỏi <link>.
   Id cũ ('jakarta','quicksand','jost','josefin','mulish','lora') còn ghim trong hash
   chuyển bản sẽ trượt FONTS.find -> tự rơi về mặc định, vô hại. Cặp 'elegant' cũng

   Trả về bản ghi cặp để chỗ gọi tự lo toast/đóng popover; null nếu id lạ. */
function applyFontPair(id) {
  const p = FONT_PAIRS.find(x => x[0] === id);
  if (!p) return null;
  currentPair = p[0];
  currentFont = '';   // cặp đang bật — không font đơn nào được tick
  const html = document.documentElement;
  html.style.setProperty('--font-app', p[5]);   // body
  html.style.setProperty('--font-head', p[3]);  // heading
  /* MOCKUP best practice của cặp (chưa chốt): cân x-height + tracking/dòng heading.
     Thiếu `tune` thì rơi về default trong CSS. */
  const t = p[7] || {};
  html.style.setProperty('--pair-adj', t.adj ?? 0.53);
  html.style.setProperty('--pair-head-ls', t.headLs ?? '0.5px');
  html.style.setProperty('--pair-head-lh', t.headLh ?? 1.33);
  html.classList.add('font-override', 'font-pair');
  document.querySelectorAll('#settingsPanel [data-font] .fo-tick').forEach(x => x.classList.add('opacity-0'));
  document.querySelectorAll('#settingsPanel [data-font-pair]').forEach(x =>
    x.querySelector('.fp-tick').classList.toggle('opacity-0', x.dataset.fontPair !== p[0]));
  return p;
}

let currentSkin = 'mytheresa';   // khớp class skin-mt đặt sẵn trên thẻ <html>
/* Cùng khuôn applyTheme: gỡ mọi class skin rồi gắn class của skin đích. */
function applySkin(id) {
  const s = SKINS.find(x => x[0] === id);
  if (!s) return null;
  currentSkin = s[0];
  const html = document.documentElement;
  /* `.split(' ')` vì Maika mang 2 class (skin-mp + skin-mk) — classList.add/remove
     KHÔNG nhận chuỗi có khoảng trắng, sẽ ném InvalidCharacterError. */
  SKINS.forEach(x => { if (x[2]) html.classList.remove(...x[2].split(' ')); });
  if (s[2]) html.classList.add(...s[2].split(' '));
  /* Trả phông về mặc định của bộ da: xoá cả class .font-override lẫn biến inline
     --font-app (2 thứ mà nút chọn phông đặt lên <html>) để --font-app lại do CSS
     của bộ da cấp. */
  html.classList.remove('font-override');
  html.style.removeProperty('--font-app');
  /* đổi bộ da cũng rời chế độ CẶP font (cùng lý do reset font đơn) */
  html.classList.remove('font-pair');
  ['--font-head', '--pair-adj', '--pair-head-ls', '--pair-head-lh']
    .forEach(v => html.style.removeProperty(v));
  currentPair = '';
  document.querySelectorAll('#settingsPanel [data-font-pair] .fp-tick').forEach(t => t.classList.add('opacity-0'));
  currentFont = s[4];
  document.querySelectorAll('#settingsPanel [data-font]').forEach(x =>
    x.querySelector('.fo-tick').classList.toggle('opacity-0', x.dataset.font !== currentFont));
  document.querySelectorAll('#settingsPanel [data-skin]').forEach(x =>
    x.querySelector('.sk-tick').classList.toggle('opacity-0', x.dataset.skin !== s[0]));
  /* Bộ da có CẶP FONT MẶC ĐỊNH (ô thứ 6) thì áp luôn sau khi đã reset ở trên — phải
     đứng CUỐI vì `applyFontPair` ghi đè currentFont/tick mà khối reset vừa đặt. */
  if (s[5]) applyFontPair(s[5]);
  return s;
}

   [id, nhãn, class trên <html>, mô tả ngắn]. Class rỗng = mode D mặc định
   (:root trong tokens.css).

   chọn nào gắn class đó nữa nên nó nằm im — sẽ tự biến mất ở lần chạy lại
   gen_tokens.py sau khi export lại tokens07.json. */
const THEMES = [
  ['d',     'Mặc định',      '',             'Mode D — bản đang dùng'],
  ['dplus', 'D+ improved',   'theme-dplus',  'Accent warm black, focus rõ hơn'],

/* Gỡ mọi class theme rồi gắn class của theme đích. Gọi cả lúc bấm chọn lẫn
   lúc khôi phục từ hash khi đổi bản mobile/desktop. */
function applyTheme(id) {
  const t = THEMES.find(x => x[0] === id);
  if (!t) return null;
  currentTheme = t[0];
  const html = document.documentElement;
  THEMES.forEach(x => { if (x[2]) html.classList.remove(x[2]); });
  if (t[2]) html.classList.add(t[2]);
  document.querySelectorAll('#settingsPanel [data-theme]').forEach(x =>
    x.querySelector('.th-tick').classList.toggle('opacity-0', x.dataset.theme !== t[0]));
  return t;
}

(() => {
  const fab = document.getElementById('settingsFab');
  const panel = document.getElementById('settingsPanel');
  /* html.sp-open: nhường chỗ cho popover — thẻ #topFab nằm đúng vị trí popover
     sổ ra (bottom 144), xem CSS */
  const openP  = () => { panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); document.documentElement.classList.add('sp-open'); };
  const closeP = () => { panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); document.documentElement.classList.remove('sp-open'); };
  fab.addEventListener('click', e => { e.stopPropagation(); panel.classList.contains('open') ? closeP() : openP(); });
  panel.querySelector('.sp-backdrop').addEventListener('click', closeP);
  // ── đổi ngôn ngữ: dịch thật toàn bộ UI ──
  panel.querySelectorAll('[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => {
      const to = btn.dataset.lang;
      if (to === LANG) { closeP(); return; }
      applyLang(document.body, to);      // dịch mọi thứ đang có trong DOM
      LANG = to;
      panel.querySelectorAll('[data-lang]').forEach(x => {
        const on = x.dataset.lang === to;
        x.className = 'langopt flex-1 h-8 rounded-full text-[13px] leading-5 transition-colors press '
          + (on ? 'bg-background text-foreground font-medium shadow-sm' : 'text-muted-foreground');
      });
      closeP();
      toast(to === 'en' ? 'Switched to English' : 'Đã chuyển sang Tiếng Việt');
    });
  });

  panel.querySelectorAll('[data-skin]').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = applySkin(btn.dataset.skin);
      if (!s) return;
      closeP();
      toast('Bộ da: ' + s[1]);
    });
  });

  panel.querySelectorAll('[data-theme]').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = applyTheme(btn.dataset.theme);
      if (!t) return;
      closeP();
      toast('Giao diện: ' + t[1]);
    });
  });

  panel.querySelectorAll('[data-font]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.font;
      const f = FONTS.find(x => x[0] === id);
      if (!f) return;
      currentFont = id;
      document.documentElement.style.setProperty('--font-app', f[2]);
      document.documentElement.classList.add('font-override');
      /* chọn font ĐƠN là rời chế độ cặp: heading quay về cùng font body */
      currentPair = '';
      document.documentElement.classList.remove('font-pair');
      ['--font-head', '--pair-adj', '--pair-head-ls', '--pair-head-lh']
        .forEach(v => document.documentElement.style.removeProperty(v));
      panel.querySelectorAll('[data-font-pair] .fp-tick').forEach(t => t.classList.add('opacity-0'));
      panel.querySelectorAll('[data-font]').forEach(x =>
        x.querySelector('.fo-tick').classList.toggle('opacity-0', x.dataset.font !== id));
      closeP();
      toast('Phông chữ: ' + f[1]);
    });
  });

  panel.querySelectorAll('[data-font-pair]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = applyFontPair(btn.dataset.fontPair);
      if (!p) return;
      closeP();
      toast('Cặp font: ' + p[1]);
    });
  });
})();

function voucherSumOf(sel) {

/* Thẻ 1 ưu đãi. Mã chưa đủ điều kiện KHÔNG bị giấu đi — vẫn hiện, làm mờ, khoá

   giỏ hàng lên, giấu đi thì người mua không biết mình sắp có gì. */
function voucherCardHTML(v, on) {
  const ok = voucherEligible(v);
  const why = ok ? '' : voucherBlockReason(v);
  const cond = [];
  if (v.note)   cond.push(v.note);
  if (v.cap)    cond.push(`Tối đa ${v.cap.toLocaleString('en-US')}đ`);
  if (v.worth)  cond.push(`Trị giá ${v.worth.toLocaleString('en-US')}đ`);
  if (v.minSub) cond.push(`Đơn từ ${v.minSub.toLocaleString('en-US')}đ`);
  if (v.minQty) cond.push(`Mua từ ${v.minQty} sản phẩm`);
  return `
  <button class="vc-item opt ${on ? 'on' : ''} w-full flex gap-3 items-start border ${on ? 'border-border-5' : 'border-border'} rounded-md p-3 text-left ${ok ? 'press' : ''}"

    <span class="flex-1 min-w-0 flex flex-col gap-1">

        <span data-i18n-skip class="text-[12px] font-medium leading-4 text-muted-foreground shrink-0">${v.code}</span>
      </span>
      ${cond.map(c => `<span class="block text-[12px] leading-4 text-secondary-foreground">${c}</span>`).join('')}
      <span class="flex items-center gap-1 pt-0.5">
        <span data-i18n-skip class="text-[12px] leading-4 text-muted-foreground truncate">${v.prog}</span>
        <span class="text-[12px] leading-4 text-muted-foreground shrink-0">· HSD ${v.exp}</span>
      </span>
      ${why ? `<span class="block text-[12px] leading-4 text-destructive">${why}</span>` : ''}
    </span>
    <span class="radio ${on ? 'on' : ''} w-4 h-4 mt-0.5 rounded-full border-2 ${on ? 'border-primary' : 'border-border'} flex items-center justify-center shrink-0">
      <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
    </span>
  </button>`;
}
/* Danh sách theo nhóm. Mã `hidden` (bộ JUNE* cũ) chỉ hiện khi đang được chọn —
   gõ tay xong phải thấy nó ở đâu đó để còn bỏ chọn được. Trong mỗi nhóm, mã
   dùng được xếp lên trước. */
function voucherSheetHTML(sel) {
  return VOUCHER_GROUPS.map(g => {
    const items = VOUCHERS
      .filter(v => v.group === g.key && (!v.hidden || sel.includes(v.code)))
      .sort((a, b) => (voucherEligible(b) ? 1 : 0) - (voucherEligible(a) ? 1 : 0));
    if (!items.length) return '';
    return `
    <div class="flex flex-col gap-2 pt-4 first:pt-1">
      <div class="flex items-baseline justify-between gap-2">
        <p class="text-[14px] font-medium leading-5 text-foreground">${g.title}</p>
        <span class="text-[12px] leading-4 text-muted-foreground shrink-0">Chọn tối đa 1</span>
      </div>
      ${items.map(v => voucherCardHTML(v, sel.includes(v.code))).join('')}
    </div>`;
  }).join('');
}

      <!-- Bọc cột để dòng lỗi nằm dưới cặp [ô nhập | nút]. Lỗi ẩn bằng .hidden
           (display:none) nên KHÔNG tính là flex item -> lúc không lỗi khối này

(() => {
  const sh    = document.getElementById('vcSheet');
  const panel = sh.querySelector('.vc-panel');
  const list  = sh.querySelector('#vcList');
  const input = sh.querySelector('#vcCode');
  const codeBtn = sh.querySelector('#vcCodeApply');
  let temp = [], onDone = null;

  /* resetCode dọn luôn dòng lỗi: ô trống thì lỗi cũ không còn nghĩa. Cũng là
     chỗ duy nhất chạy khi MỞ LẠI sheet, nên lỗi không sống sót qua 2 lần mở. */
  const resetCode = () => { input.value = ''; codeBtn.disabled = true; codeBtn.style.opacity = '.4'; clearFieldErr(input); };
  const syncFoot = () => {
    const n = temp.filter(c => voucherEligible(voucherByCode(c))).length;
    const sum = voucherSumOf(temp);
    sh.querySelector('#vcCount').textContent = n ? `Đã chọn ${n} ưu đãi` : 'Chưa chọn ưu đãi nào';
    sh.querySelector('#vcSum').textContent   = sum ? `-${sum.toLocaleString('en-US')}đ` : '';
    localizeNew(sh.querySelector('#vcCount'));
  };
  const render = () => {
    list.innerHTML = voucherSheetHTML(temp);
    localizeNew(list);
    list.querySelectorAll('[data-vc]').forEach(b => b.addEventListener('click', () => {
      const v = voucherByCode(b.dataset.vc);
      if (!v || !voucherEligible(v)) return;
      pickVoucher(v, temp.includes(v.code));
    }));
    syncFoot();
  };
  /* 1 mã / nhóm: chọn mã mới thì mã cùng nhóm tự nhả; chạm lại đúng mã đang
     chọn = bỏ chọn (không cần nút "bỏ chọn" riêng). */
  const pickVoucher = (v, off) => {
    temp = temp.filter(c => { const o = voucherByCode(c); return !o || o.group !== v.group; });
    if (!off) temp.push(v.code);
    render();
  };

  input.addEventListener('input', () => {
    const has = input.value.trim().length > 0;
    codeBtn.disabled = !has; codeBtn.style.opacity = has ? '1' : '.4';
    clearFieldErr(input);   // gõ lại thì lỗi cũ hết nghĩa
  });
  const useCode = () => {
    const code = input.value.trim().toUpperCase();
    if (!code) return;
    const v = voucherByCode(code);
    if (!v) { setFieldErr(input, 'Mã không hợp lệ'); return; }
    if (!voucherEligible(v)) { setFieldErr(input, voucherBlockReason(v)); return; }
    if (temp.includes(code)) { setFieldErr(input, 'Mã đã được chọn'); return; }
    pickVoucher(v, false);
    resetCode();
    toast('Đã chọn ' + code);
  };
  codeBtn.addEventListener('click', useCode);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); useCode(); } });

  const close = () => {
    sh.querySelector('.vc-backdrop').classList.add('opacity-0');
    panel.classList.add('translate-y-full');
    sh.classList.add('pointer-events-none');
    unlockBodyScroll();
    setTimeout(() => sh.setAttribute('aria-hidden', 'true'), 300);
  };
  const open = done => {
    onDone = done || null;
    temp = [...cartVouchers];
    resetCode();
    render();
    localizeNew(panel);      // sheet nằm ngoài .screen nên không được applyLang lúc đổi ngôn ngữ
    list.scrollTop = 0;
    sh.classList.remove('pointer-events-none'); sh.setAttribute('aria-hidden', 'false');
    sh.querySelector('.vc-backdrop').classList.remove('opacity-0');
    panel.classList.remove('translate-y-full');
    lockBodyScroll();
  };

  sh.querySelector('#vcApply').addEventListener('click', () => {
    const had = cartVouchers.length;
    cartVouchers = temp.filter(c => voucherEligible(voucherByCode(c)));
    close();
    if (onDone) onDone();
    const n = cartVouchers.length;
    toast(n ? `Đã áp dụng ${n} ưu đãi` : (had ? 'Đã gỡ ưu đãi' : 'Chưa chọn ưu đãi nào'));
  });
  sh.querySelector('.vc-backdrop').addEventListener('click', close);
  sh.querySelector('#vcClose').addEventListener('click', close);
  // Esc đóng sheet (bàn phím cứng khi xem bằng máy tính) — chỉ khi đang mở
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sh.getAttribute('aria-hidden') === 'false') close(); });
  window.__openVoucherSheet = open;
})();

  const view = v => { intro.classList.toggle('hidden', v !== 'intro'); prefs.classList.toggle('hidden', v !== 'prefs'); };

    if (s.getAttribute('aria-disabled') === 'true') { toast('Cookie cần thiết luôn bật, không thể tắt'); return; }

  g.querySelector('[data-cg-privacy]').addEventListener('click', () => {

        <label class="search-field flex items-center gap-3 min-h-10 bg-secondary rounded-xs p-2">
          <span class="w-5 h-5 flex items-center justify-center shrink-0 [&_svg]:w-4 [&_svg]:h-4">${I.search}</span>
          <input id="pkSearch" type="search" placeholder="Tìm kiếm" autocomplete="off" enterkeyhint="search"
                 class="flex-1 min-w-0 outline-none text-[14px] leading-6 font-light text-foreground placeholder:text-muted-foreground"
                 style="background:transparent;border:0;padding:0;-webkit-appearance:none;appearance:none">
          <button id="pkClear" type="button" class="shrink-0 text-[14px] leading-5 text-muted-foreground press" style="display:none">Xóa</button>
        </label>
      </div>
      <div id="pkList" class="flex-1 min-h-0 overflow-y-auto no-scrollbar"></div>
      <div class="safe-b"></div>
    </div>
  </div>`);
(() => {
  const pk = document.getElementById('pickSheet');
  const panel = pk.querySelector('.pk-panel');
  const list = pk.querySelector('#pkList');
  const search = pk.querySelector('#pkSearch');
  const clear = pk.querySelector('#pkClear');
  let onPick = null, allOpts = [], curVal = '';

  /* Bỏ dấu + đ→d để gõ "da nang" vẫn ra "TP. Đà Nẵng" — người dùng hiếm khi
     gõ đủ dấu khi đang điền địa chỉ trên điện thoại. */
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                     .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();

  const tick = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="shrink-0"><path d="m3 8.5 3 3 7-7" stroke="var(--general-primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const paintList = () => {
    const raw = search.value.trim();
    const q = norm(raw);
    const shown = q ? allOpts.filter(o => norm(o).includes(q)) : allOpts;
    clear.style.display = raw ? '' : 'none';
    list.innerHTML = shown.length ? shown.map(o => `
      <button class="w-full min-h-[52px] flex items-center gap-2 px-4 py-4 press text-left transition-colors ${o === curVal ? 'bg-secondary' : ''}" data-pk-opt="${o}">
        <span class="flex-1 min-w-0 text-[14px] font-medium leading-5 text-foreground">${highlightMatch(o, raw)}</span>
        ${o === curVal ? tick : ''}
      </button>`).join('')
      : '<p class="px-4 py-6 text-[14px] leading-5 text-muted-foreground">Không tìm thấy kết quả</p>';
    list.querySelectorAll('[data-pk-opt]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.pkOpt;
      closePK();
      if (onPick) onPick(v);
    }));
    list.scrollTop = 0;
    localizeNew(list);
  };
  search.addEventListener('input', paintList);
  clear.addEventListener('click', () => { search.value = ''; paintList(); search.focus(); });

  const closePK = () => {
    pk.querySelector('.pk-backdrop').classList.add('opacity-0');
    panel.classList.add('translate-y-full');
    pk.classList.add('pointer-events-none');
    unlockBodyScroll();
    setTimeout(() => pk.setAttribute('aria-hidden', 'true'), 300);
  };
  const openPK = (title, opts, current, cb) => {
    onPick = cb; allOpts = opts; curVal = current || '';
    pk.querySelector('#pkTitle').textContent = title;
    search.value = '';        // mỗi lần mở là danh sách đầy đủ, không dính từ khoá cũ
    paintList();
    localizeNew(panel);   // cả tiêu đề + placeholder; tên địa giới không có trong I18N nên giữ nguyên
    pk.classList.remove('pointer-events-none'); pk.setAttribute('aria-hidden', 'false');
    pk.querySelector('.pk-backdrop').classList.remove('opacity-0');
    panel.classList.remove('translate-y-full');
    lockBodyScroll();
  };
  pk.querySelector('.pk-backdrop').addEventListener('click', closePK);
  pk.querySelector('#pkClose').addEventListener('click', closePK);
  window.__openPicker = openPK;
})();

/* Popup đăng nhập nhanh nằm ngoài .screen nên wire() không chạm tới */
wirePasswordToggles(document.getElementById('loginPop'));

wireFilter();

/* ── Khởi động: nhận trạng thái từ bản kia (nếu vừa đổi bản qua mốc 768) ──
   RESP dựng ở <head>. Khi trang đang bị chuyển sang file kia thì KHÔNG dựng
   màn hình nào nữa — đỡ vẽ thừa một trang sắp bị bỏ.
   Ngôn ngữ/phông lặp lại đúng các bước của nút trong bảng Cài đặt, chỉ bỏ
   toast vì đây là khôi phục trạng thái chứ không phải người dùng vừa bấm. */
if (!RESP.swapped) {
  const st = RESP.read();

  if (st.lang === 'en') {
    applyLang(document.body, 'en');
    LANG = 'en';
    document.querySelectorAll('#settingsPanel [data-lang]').forEach(x => {
      x.className = 'langopt flex-1 h-8 rounded-full text-[13px] leading-5 transition-colors press '
        + (x.dataset.lang === 'en' ? 'bg-background text-foreground font-medium shadow-sm' : 'text-muted-foreground');
    });
  }

  if (st.theme) applyTheme(st.theme);

  const f = FONTS.find(x => x[0] === st.font);
  if (f) {
    currentFont = f[0];
    document.documentElement.style.setProperty('--font-app', f[2]);
    document.documentElement.classList.add('font-override');
    document.querySelectorAll('#settingsPanel [data-font]').forEach(x =>
      x.querySelector('.fo-tick').classList.toggle('opacity-0', x.dataset.font !== f[0]));
  }

  /* hasOwnProperty chứ không phải RENDER[...] trực tiếp: hash là dữ liệu ngoài,
     mà key kế thừa từ Object.prototype (#screen=__proto__, =constructor) cũng
     "truthy" — lọt vào go() là ném lỗi giữa boot, trang trắng và mất luôn
     RESP.watch() bên dưới (hết chuyển bản khi kéo cửa sổ). */
  const first = Object.prototype.hasOwnProperty.call(RENDER, st.screen) ? st.screen : 'plp';
  window.history.replaceState({ screen: first }, '');
  /* fromPopstate: chặn go() push thêm một entry TRÙNG với replaceState vừa rồi
     — nếu không, mỗi lần tải trang để lại 2 entry cùng state và cú bấm back
     đầu tiên không làm gì (go() thoát sớm vì name === current). */
  go(first, { fromPopstate: true });

  /* Hash chỉ là kênh chuyển giao MỘT LẦN — dọn ngay sau khi nhận, để lát nữa
     người dùng đi sang màn khác rồi tải lại trang thì không bị kéo ngược về
     màn cũ. Bọc try vì một số trình duyệt chặn đổi URL trên file://. */
  if (location.hash) {
    try { window.history.replaceState({ screen: first }, '', location.pathname + location.search); } catch (e) {}
  }

  /* Kéo cửa sổ rộng ≥ 768 -> sang bản desktop, mang theo màn + cài đặt */
  RESP.watch(() => [current, LANG, currentFont, currentTheme]);
}
</script>
</body>
</html>

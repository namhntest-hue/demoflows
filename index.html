     2 THỨ CHƯA MANG SANG, đã báo user:
       · line-height: họ 12/16.8 (tỉ lệ 1.4), ta 12/20 (1.67) -> chữ ta thoáng hơn.
         Không đổi vì leading của dự án gắn với chiều cao hàng cố định (h-4/h-6/
         h-11/h-12…), ép 16.8px vào hàng h-4 (16px) là tràn.
       · mặt chữ SERIF OptimaLTPro cho 2 ô 18 và 24. User chỉ yêu cầu size+weight.
     Cả 2 là phần lệch còn lại lớn nhất nếu muốn giống hơn nữa. */
  html.skin-mt body { letter-spacing: 0.5px; }
  /* Mọi độ đậm về 400 — đè 5 utility weight + thẻ b/strong. KHÔNG có ngoại lệ:
     nhãn menu ở mục 4 cũng khai 400 nên không đấu nhau. */
  html.skin-mt .font-light, html.skin-mt .font-normal, html.skin-mt .font-medium,
  html.skin-mt .font-semibold, html.skin-mt .font-bold,
  html.skin-mt b, html.skin-mt strong { font-weight: 400; }
  /* ── §4.2 THI HÀNH: REMAP THEO CẶP CỠ + DÒNG, TOÀN APP (24/08/2026) ────────────
     Thay 2 rule "chỉ đổi cỡ" cũ — chính chúng là nguyên nhân gốc của 341 (mobile) /
     489 (desktop) điểm lệch cặp mà bản dò 24/08 đếm được: cỡ bị kéo về 12 nhưng
     `leading-5` (20) trong markup vẫn nguyên -> tỉ lệ 1.67, không có trong thang.
     Trước khi viết, đã dò TOÀN FILE các cặp `text-[Npx]` × `leading-*` thật sự tồn
     tại: mỗi utility dòng chỉ gặp ĐÚNG MỘT họ cỡ (leading-3 ⇢ 10px · leading-4/6 ⇢
     12px · leading-5 ⇢ 12px · leading-7 ⇢ 18px · leading-8/10/none/snug ⇢ 24px),
     nên khai theo utility là đủ, không cần liệt kê từng cặp.
     Bọc trong `:where()` cho cả khối có specificity (0,1,1): vẫn thắng utility
     Tailwind (0,1,0) nhưng NHƯỜNG mọi rule tường minh của bộ da (0,2,1)+ — nhờ vậy
     các vai T3 khai riêng (`.pc-brand`, `.ms-tab`, `.search-tab`, tiêu đề panel bộ
     lọc 14/20) và các khối scope theo màn vẫn giữ số của mình, không phải đi chèn
     `:not()` cho từng chỗ.
     Thang đích = §1.2: T7 10/14 · T4 12/16 · T5 12/18 · T2 18/24 · T1 24/32.
     KHAI GIỐNG HỆT ở desktop.html — luật §1.2 đòi 2 bản CÙNG thang (trước đây lệch
     5/12 cỡ: 16→14, 18→16, 22/24→18, 11 không remap). */
  html.skin-mt :where(.text-\[9px\], .text-\[10px\]) { font-size: 10px; line-height: 14px; }
  html.skin-mt :where(.text-\[11px\], .text-\[13px\], .text-\[14px\], .text-\[15px\], .text-\[16px\]) { font-size: 12px; line-height: 18px; }
  html.skin-mt :where(.text-\[18px\]) { font-size: 18px; line-height: 24px; }
  html.skin-mt :where(.text-\[22px\], .text-\[24px\], .text-\[32px\], .text-\[48px\]) { font-size: 24px; line-height: 32px; }
  /* Dòng theo utility — viết SAU khối cỡ để thắng nó (cùng specificity, sau thắng trước) */
  html.skin-mt :where(.leading-3) { line-height: 14px; }
  html.skin-mt :where(.leading-4, .leading-6) { line-height: 16px; }
  html.skin-mt :where(.leading-5, .leading-relaxed) { line-height: 18px; }
  html.skin-mt :where(.leading-7, .leading-\[28px\], .leading-\[25px\]) { line-height: 24px; }
  html.skin-mt :where(.leading-8, .leading-10, .leading-none, .leading-snug) { line-height: 32px; }
  /* Ô chọn của component `pickField` là chữ MỘT DÒNG (`truncate`) trong ô cao 40 ->
     1.33, không phải 1.50 mặc định của họ 12px (AUDIT 24/08 mục B-7; bảng bàn giao
     shadcn ghi hàng Select = `text-sm` 12/16). Sửa ở đây là sửa luôn ô chọn tỉnh /
     phường ở checkout — cùng một component. */
  html.skin-mt .pick-label { line-height: 16px; }
  /* BRAND = HỌ NỘI DUNG, CHỮ THƯỜNG (24/08/2026 — user: *"tên brand không cần
     uppercase toàn bộ"*, ĐẢO chốt C1 20/08 "brand = họ nhãn 500 + HOA").
     Gỡ hoa thì theo §1.1 phải gỡ luôn 500 (cặp không tách rời) -> brand về 400.
     Nhưng brand vẫn phải nổi hơn tên sản phẩm (yêu cầu gốc 18/08 còn hiệu lực),
     nên chuyển sang ĐÚNG đòn bẩy mà luật cho phép cho họ nội dung: LÊN 1 BẬC CỠ.
     Đo trước khi sửa: brand chỉ hơn tên sp 34/255 về mực (#0a0a0a vs #333) —
     chính STYLE-RULES việc 8 đã kết luận mức đó "không đọc ra bậc", nên mực
     một mình không đủ gánh phân cấp.
       · card + hàng gợi ý + hàng giỏ: T3 14/20 · 400 · thường (tên sp 12 · #333)
       · PDP + sheet quick-add (bám `.h-7`): T3 14/20 — giữ cỡ, chỉ bỏ hoa/500
     letter-spacing khai lại vì 1 chỗ PDP còn `tracking-normal` trong markup
     (rò tracking, AUDIT B9). PHẢI đứng SAU blanket 400 + SAU khối remap cỡ. */
  html.skin-mt .pc-brand {
    font-weight: 400; text-transform: none;
    font-size: 14px; line-height: 20px; letter-spacing: 0.5px;
  }

  /* ── 6. BỘ LỌC — HỆ GẠCH ĐỒNG BỘ (19/08/2026, yêu cầu user) ───────────────────
     ⚠ ĐÃ VIẾT LẠI sau khi user bắt lỗi: *"context là dựa trên style của mytheresa
     và dùng style có sẵn của tôi để điều chỉnh chứ không phải bê nguyên style của
     mytheresa vào"*.
     Bản đầu của mình BÊ NGUYÊN linh kiện của họ vào — nút chữ trần thay nút outline
     · ô tick 8×8 tô đen đặc thay checkbox 16px có dấu ✓ · chip chọn tô đen thay
     viền primary · "Đặt lại" nền #f2f2f2 thay nút outline · bỏ rail cây danh mục ·
     bỏ grabber · tiêu đề panel 16px chữ hoa · hạ hàng tiêu đề mục 72 -> 52.
     SAI HƯỚNG: mytheresa là THAM CHIẾU, linh kiện phải là của dự án. Cả 8 thứ đó
     đã trả lại nguyên trạng, bộ lọc dùng đúng component sẵn có (btn-o · .chk ·
     .chip · rail Figma · grabber · thang chữ của mục 5).

     CÒN LẠI ĐÚNG MỘT VIỆC — cũng là việc user nêu đích danh trong yêu cầu gốc:
     "dùng underline màu nhẹ nhàng ĐỒNG BỘ". Bộ lọc là chỗ DUY NHẤT trong bộ da
     chưa theo hệ gạch đã chốt 18/08/2026, nên kéo nó về #ececec — CÙNG MỘT sắc,
     CÙNG MỘT vai với vách hàng danh mục trong menu (mục 4b) và 2 hàng nav.
     3 chỗ:
       · hairline dưới thanh lọc (`.filterbar::after`, đang lấy --general-border)
       · gạch giữa các mục trong panel (TRƯỚC ĐÂY KHÔNG CÓ — panel chạy liền một
         dải, 6 mục dính nhau; đây là chỗ hệ gạch của dự án còn thiếu)
       · vách chân panel, tách cụm nút Đặt lại/Áp dụng khỏi danh sách
     Mục CUỐI cố ý không kẻ: chân panel đã có gạch trên, kẻ nữa là 2 vạch sát nhau.
     KHÔNG đụng markup/layout — đúng quy ước của mọi bộ da. */
  html.skin-mt .filterbar::after { background: var(--unofficial-border-1); }
  html.skin-mt #filterSheet .facc:not(:last-child) { border-bottom: 1px solid var(--unofficial-border-1); }
  html.skin-mt #filterSheet .safe-b { border-top: 1px solid var(--unofficial-border-1); }
  /* ── TIÊU ĐỀ MỤC TRONG BỘ LỌC: CHỮ THƯỜNG, ĐẬM HƠN 1 NẤC (19/08/2026) ────────
     Danh mục · Thương hiệu · Màu sắc · Kích thước · Khoảng giá · Ưu đãi · Khác
     — hàng tiêu đề của từng mục (`.facc-trigger`).
     Đường đi của yêu cầu (ghi lại để khỏi lặp): user bảo viết hoa -> mình hiểu
     nhầm sang cate trong cây Danh mục -> user làm rõ là TIÊU ĐỀ MỤC -> thử bỏ
     hoa đổi sang weight -> user hỏi cái nào hợp concept hơn -> CHỐT: DÙNG CẢ HAI,
     hoa + 500.
     LÝ DO chọn chữ hoa làm đòn bẩy DUY NHẤT (không kèm độ đậm):
       · Số đo mytheresa KHÔNG có phần tử 500/600/700 nào — họ phân cấp bằng cỡ
         chữ + chữ hoa, không bằng độ đậm. Nâng weight là lệch số đo, và làm
         loãng nét nhận dạng của bộ da.
       · Trên mobile tiêu đề mục và cate bên trong CÙNG 12px; chữ hoa đã đủ tách
         mà không phải đẻ thêm cỡ chữ hay nấc đậm nào.
     WEIGHT 400 (chốt cuối 19/08/2026, yêu cầu user "hạ font weight xuống 400
     bằng các nội dung bên trong filter, vẫn giữ uppercase"): tiêu đề mục nay
     CÙNG ĐỘ ĐẬM với hàng cate/thương hiệu bên trong, chỉ khác ở CHỮ HOA (và ở
     desktop thì thêm 1 nấc cỡ chữ 14 vs 12).
     ⚠ Vẫn phải KHAI 400 tường minh, không bỏ trắng: markup để `font-light` (300),
     mà khối blanket của bộ da chỉ kéo về 400 cho các class `.font-*` — bỏ rule
     này đi thì ra 300, nhạt hơn cả nội dung bên trong.
     Rule (1,3,2) nên thắng khối blanket, không cần !important.
     `> span:first-child` = nhãn chữ; span sau là icon +/- nên không dính.
     KHAI GIỐNG HỆT ở index.html và desktop.html — sửa 1 file nhớ sửa cả 2. */
  /* ── WEIGHT +1 NẤC TRONG PANEL BỘ LỌC (20/08/2026, yêu cầu user "tăng font weight
     của BỘ LỌC và các level danh mục lên 1 nấc") ──
     Bộ da ép toàn trang về 400 nên "1 nấc" ở đây là **500** (xem ghi chú cùng nội
     dung ở mục thang chữ). Tăng CẢ BA nhóm cùng lúc — tiêu đề panel, tiêu đề mục,
     và 3 tầng của cây danh mục — nên tương quan giữa chúng KHÔNG đổi, chỉ đậm hơn
     một nấc: phân cấp vẫn do chữ hoa (2 tầng nhãn) và indent 40/64/88 (3 tầng cate)
     lo, đúng như đã chốt.
     `.facc { font-weight: 500 }` phủ được các dòng lựa chọn vì chúng KHÔNG mang
     class `font-*` nào — chúng kế thừa, nên không bị khối blanket 400 của bộ da
     chặn lại. Đó cũng là lý do vẫn phải khai 500 tường minh cho 2 tầng nhãn: hai
     phần tử đó CÓ `font-medium` trong markup nên blanket kéo chúng về 400. */
  html.skin-mt #filterSheet .facc { font-weight: 500; }
  /* Nhãn nhóm trong panel Kích thước: ĐÃ HẠ về hàng cate con (20/08 tối, lời
     user "tạo cảm giác nó là cate con") — chữ thường 400 mực nội dung, thụt 32,
     khai ngay ở markup như hàng cate của cây Danh mục. Không còn rule hoa ở đây:
     bỏ hoa thì bỏ cả 500 (§1.1 cặp không tách rời). */
  html.skin-mt #filterSheet .facc-trigger > span:first-child {
    font-weight: 500; text-transform: uppercase;
    /* 12/16 KHAI TƯỜNG MINH (20/08/2026, yêu cầu user "cate danh mục … sẽ
       UPPERCASE font size 12"). Mobile vốn đã ra 12 nhưng là do khối blanket thang
       chữ của bộ da kéo `.text-[16px]` xuống 12 — tức đúng một cách TÌNH CỜ; ở
       desktop cùng markup đó ra 14. Khai thẳng cỡ tại đây thì hai bản chốt cùng
       một số, và sau này ai đổi blanket cũng không kéo tầng chữ này đi theo. */
    font-size: 12px; line-height: 16px;
  }
  /* ── TIÊU ĐỀ PANEL "Bộ lọc" CŨNG CHỮ HOA (20/08/2026, yêu cầu user) ───────────
     *"quay lại filter cho title 'Bộ lọc' khi bật bộ lọc sẽ uppercase lên luôn"*.
     Đây là thứ đã từng bị GỠ hồi 19/08 (xem mục 6): bản đầu mình bê nguyên cả cụm
     linh kiện của mytheresa, trong đó có "tiêu đề panel 16px chữ hoa", và user bắt
     trả lại nguyên trạng. Nay user gọi lại ĐÍCH DANH mỗi chữ hoa -> làm đúng bấy
     nhiêu: KHÔNG kèm đổi cỡ chữ (giữ 18px của dự án, không hạ về 16 như bản bị gỡ)
     và không đổi weight.
     Nhất quán trong panel: tiêu đề panel + tiêu đề từng mục nay cùng chữ hoa, còn
     cate/thương hiệu bên trong giữ chữ thường — đúng ba tầng đã chốt.
     Bám `div:has(> #filterClose) > p` thay vì cỡ chữ: hàng tiêu đề là hàng DUY
     NHẤT chứa nút đóng, nên selector không vỡ khi thang chữ đổi.
     CỠ 14/20 (20/08/2026, yêu cầu user "dialog title filter sẽ font 14 UPPERCASE"):
     markup để 18px, mà 2 bản lại ra 2 số khác nhau — mobile giữ 18, desktop bị
     khối blanket kéo về 16. Khai thẳng 14 ở đây để cả hai chốt cùng một số.
     Panel nay là hai tầng chữ hoa 14 > 12, cate/thương hiệu bên trong giữ chữ
     thường — vẫn đúng ba tầng đã chốt, chỉ siết lại khoảng cách giữa hai tầng đầu.
     KHAI GIỐNG HỆT ở index.html và desktop.html — sửa 1 file nhớ sửa cả 2. */
  html.skin-mt #filterSheet div:has(> #filterClose) > p {
    text-transform: uppercase;
    font-size: 14px; line-height: 20px;
    font-weight: 500;   /* +1 nấc, xem khối "WEIGHT +1 NẤC" bên dưới */
  }

  /* ── 6b. (ĐÃ ROLLBACK 25/08/2026 — user: *"ô hình vuông chọn màu ở product listing sẽ
     trả về hình tròn toàn bộ nhé"*, ĐẢO chốt 20/08 *"ở skin mt pick màu ở listing hãy cho
     hình vuông thay vì hình tròn nhé"*.) ────────────────────────────────────────────────
     Rule cũ `html.skin-mt [data-swatches] .cw, … .cw > span { border-radius: 0 }` GỠ HẲN.
     KHÔNG thay bằng rule bo tròn: markup thẻ sản phẩm vốn đã `rounded-full` ở CẢ nút lẫn
     span nền màu (3 bộ da kia vẫn tròn suốt từ đầu), nên gỡ đè là skin-mt tự tròn theo —
     thêm rule mới chỉ là khai lại thứ đã có. Phạm vi vì thế đúng bằng phạm vi cũ: thẻ sản
     phẩm ở PLP · hàng gợi ý · kết quả tìm. Ô màu trong sheet bộ lọc (`.fcolor-ring`) chưa
     bao giờ bị vuông hoá nên không phải đụng.
     Ô màu nay QUAY VỀ đúng ngoại lệ của §3.2: `w == h` và bản chất là chấm màu, nên tròn
     không phá mạch vuông của bộ da (cùng nhóm badge số giỏ, vòng radio). Đã sửa lại
     STYLE-RULES.md §3.2 — đính chính 20/08 "ô màu KHÔNG thuộc ngoại lệ" nay bỏ.
     KHAI GIỐNG HỆT ở index.html và desktop.html — gỡ 1 file nhớ gỡ cả 2. */

  /* ── 6c. TRANG GIỎ: NỀN TRẮNG, KHÔNG ĐÓNG HỘP — THEO HƯỚNG BỘ DA EDITORIAL ────
     (21/08/2026, user ĐẢO 2 chốt 20/08 "nền xám nhấn block" + "đóng hộp maison
     kitsuné": *"style ở cart kiểu của editorial đang đẹp, dùng nền trang cart màu
     trắng, cái nào quà tặng thì nhấn màu xuống, không bị trong khuông khổ — dùng
     style đó áp dụng lại cho skin-mt"*.)
     Chuẩn đích đo từ skin-mp trên trang chạy (mobile): canvas TRẮNG (body mặc
     định — rule nền cũ đã xóa) · mọi khối trong suốt, KHÔNG viền bao hộp — mỗi
     VÙNG ngăn nhau bằng đúng MỘT kẻ mảnh (--unofficial-border-1) · chỉ QUÀ TẶNG
     mang nền nhấn (tấm con accent-0, khối QUÀ TẶNG bên dưới) · thẻ khuyến mãi
     giữ viền (thẻ bấm được, không phải hộp bao).
     Kẻ duy nhất còn lại của cụm đầu trang: ngăn hàng "Chọn tất cả" với danh
     sách món — cùng vị trí kẻ mà skin-mp đặt bằng border-top của #cartList. */
  html.skin-mt [data-screen="cart"] > [data-scroller] > div:has(> #selectAll) {
    border-bottom: 1px solid var(--unofficial-border-1);
  }
  /* QUÀ THEO MỐC ĐƠN NỐI LIỀN DANH SÁCH (giữ tinh thần chốt 20/08 "nằm vô trong
     block giỏ hàng"; 21/08 gỡ mặt trắng + viền đáy của hộp — trên nền trắng chỉ
     cần MỘT kẻ mảnh ngăn với món cuối, cùng loại kẻ giữa các món, y như skin-mp.
     Rule "đáy hộp di chuyển" của khối maison cũ cũng gỡ theo — hết hộp thì hết
     viền đáy phải chuyền vai.) */
  html.skin-mt [data-screen="cart"] #orderGift {
    border-top: 1px solid var(--unofficial-border-1);
    margin-top: 0;
  }
  /* Quà theo sản phẩm phải NẰM CHUNG BLOCK với món của nó (20/08/2026, yêu cầu
     user: *"gift đang nằm rời rạc ra khỏi block thẻ sản phẩm hãy làm cho nó nằm
     vào chung block để k tạo cảm giác lạc"*).
     Nguyên nhân "lạc": `.gift-group` tự tô `bg-accent-0` và chạy full-bleed, nên
     trên tấm trắng nó thành một DẢI XÁM CẮT NGANG — đọc ra là khối thứ ba, không
     phải phần đuôi của món.
     2 việc, phải làm cùng nhau:
       · bỏ nền riêng của dải quà -> nó nối liền vào món ngay trên
       · kẻ mảnh TRƯỚC mỗi món (trừ món đầu) -> ranh giới ô nay nằm giữa các MÓN,
         nên món + quà của nó đọc ra là một ô. Không có kẻ này thì bỏ nền xong quà
         lại dính luôn vào món kế tiếp, lạc kiểu khác.
     `:not(:first-child)` chứ không `+`: dải quà chèn giữa các dòng, kẻ chỉ được
     rơi vào đầu mỗi món mới.
     Quà theo MỐC ĐƠN trong `#orderGift` GIỮ nền `bg-accent-0`: nó không thuộc món
     nào nên vẫn cần tự tách trên tấm trắng của khối riêng nó. */
  html.skin-mt [data-screen="cart"] #cartList .cart-row:not(:first-child) {
    border-top: 1px solid var(--unofficial-border-1);
  }
  /* ── QUÀ TẶNG: NHẤN BẰNG CHỮ, KHÔNG BẰNG MẢNG MÀU (20/08/2026, yêu cầu user
     "phần nhấn màu của quà tặng hơi dài, thử vài style phù hợp với skin mt") ──
     Đo hiện trạng: `.gift-group` tự tô `bg-accent-0` và chạy full-bleed -> mảng xám
     **375×185**, tức một khối màu cao gần bằng một dòng sản phẩm và rộng hết bề
     ngang. Trên bộ da này nó lạc: `skin-mt` không có chỗ nào nhấn bằng mảng màu —
     nav, menu, bộ lọc, footer đều phân cấp bằng CHỮ HOA + KẺ MẢNH.
     Nên đổi đòn bẩy chứ không thu nhỏ mảng:
       · bỏ hẳn mặt xám (cả quà theo sản phẩm lẫn quà theo mốc đơn);
       · tên chương trình lên NHÃN CHỮ HOA 12px — cùng bậc với 6 nhãn footer, nhãn
         menu và tiêu đề mục bộ lọc, nên nó tự đọc ra là nhãn nhóm;
       · "Đổi quà" vốn ĐÃ có `underline` trong markup — rule dưới chỉ chuẩn hoá về
         `1px / offset 2px`, cùng khuôn link hành động với nút "Thay đổi" ở
         checkout (mặc định của trình duyệt để gạch dày hơn và sát chữ hơn).
     Thứ giữ nguyên vì vẫn nói đúng việc: badge "Quà tặng" nền đen trên ảnh và giá
     0 ₫ — đó mới là chỗ phân biệt quà với hàng mua, không cần mảng nền tiếp sức.
     2 phương án đã cân nhắc rồi bỏ, ghi lại phòng khi muốn quay lại:
       (B) thu mảng xám thành CHIP nhỏ ôm mỗi tên chương trình — vẫn là nhấn bằng
           màu, mà bộ da này không có linh kiện chip nền nào khác;
       (C) rail dọc `border-left` 2px đen cho cả dải — nhấn bằng đường, nhưng đẻ
           thêm một kiểu vạch thứ hai bên cạnh hệ gạch ngang đang dùng. */
  /* 21/08/2026 — user ĐẢO 2 ý của chốt trên: (1) khối quà cần nền nhấn để nổi
     bật; (2) tên chương trình THÔI CHỮ HOA -> gỡ rule uppercase; theo §1.1
     (500+hoa là cặp không tách) weight cũng thôi 500 — rule khối dưới bỏ khai
     weight, blanket .font-* trả markup font-medium về 400. Đã ghi vào
     STYLE-RULES (§1.5 vai 4 + §2.3).
     CHỐT CUỐI (21/08, sau 2 nhịp thử): *"cho phần nhấn màu dài bằng cả thẻ chứ
     không thụt vô — tham khảo skin-mp"*. Bối cảnh mới là trang giỏ NỀN TRẮNG
     KHÔNG HỘP nên dải nhấn full-bleed đọc ra là một HÀNG trong dòng chảy (đúng
     như skin-mp user khen), không còn là mảng cắt ngang hộp như hồi 20/08.
     -> skin-mt KHÔNG đè gì lên .gift-group nữa: nền do markup bg-accent-0 ăn
     token --unofficial-accent-0 (#f7f7f7 ở bộ da này), spacer w-4 giữ nguyên
     để nhãn/ảnh quà thẳng cột ảnh món (x=40) như thiết kế gốc. Bản tấm-con
     inset 16px + ẩn spacer đã gỡ. Khối bare trong #orderGift vẫn không nền. */
  html.skin-mt [data-screen="cart"] .gift-group > div:first-child > button {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }
  /* Thẻ khuyến mãi: sẵn viền 4 cạnh + lề riêng, chỉ thiếu mặt trắng vì trước nay
     nền trang đã trắng. Kéo viền về cùng sắc gạch với 2 tấm trên. */
  html.skin-mt [data-screen="cart"] div:has(> #promoPeek) {
    background: var(--general-background);
    border-color: var(--unofficial-border-1);
  }
  /* KHỐI TỔNG (discountPanel): DẢI NHẤN MÀU FULL-BLEED, THEO BẢN FIGMA ───────────
     (24/08/2026, lệnh user: *"ở skin-mt ở cart cái block sum giá nên nhấn màu
     xuống tương tự bản figma"* — ĐẢO nhịp 21/08 "trần trên nền trắng, ngăn bằng
     kẻ" vốn thay hộp "CHECKOUT SUMMARY" của khối maison cũ.)
     Đo bản Figma trên trang chạy (skin mặc định, CÙNG markup): panel `bg-secondary`
     = **#f5f5f5 full-bleed 375, KHÔNG kẻ trên**, thẻ voucher trắng nổi bên trong;
     dải quà = #fafafa. Tức Figma đặt block sum **sâu hơn dải quà đúng 1 nấc**.
     Map sang thang xám skin-mt giữ nguyên quan hệ đó: sum = `--general-secondary`
     #f2f2f2 · quà giữ `--unofficial-accent-0` #f7f7f7 — không đẻ bậc xám mới.
     -> Bỏ HẲN override `background: transparent`: nền để markup `bg-secondary` tự
     ăn token (màu qua token, không hardcode). Không cần rule nào ở đây nữa.
     2 KẺ GỠ THEO: kẻ trên panel + kẻ trên `#cartCta` chỉ tồn tại vì hồi 21/08 cả
     hai khối đều trần trên nền trắng. Nay hai MÉP của dải màu đã tự ngăn — giữ kẻ
     nữa là ngăn hai lần ở cùng một mép (§2.3 "hết đòn bẩy thì dừng"), mà bản Figma
     cũng border 0 ở đúng 2 mép này.
     Ngoại lệ mảng-màu §2.3 nay có 2 mục: khối quà + block sum (STYLE-RULES đã ghi
     TRƯỚC khi sửa đây). Các kẻ khác của trang giỏ (Chọn tất cả · giữa các món ·
     trên #orderGift) không đổi. Chỉ MOBILE — cột phải desktop vẫn là hộp bg-card. */

  /* ── 2 KHỐI ƯU ĐÃI TRONG DẢI TỔNG: MỘT CONCEPT = NHÃN NHÓM + NỘI DUNG ──────────
     (24/08/2026, lệnh user: *"đồng bộ lại block Ưu đãi chương trình thành viên và
     ưu đãi khuyến mãi chung 1 concept hiển thị"*; chốt tiếp: *"thêm cái title tương
     tự ưu đãi thành viên, không đóng khung nguyên block ưu đãi thành viên nữa"* —
     radio GIỮ NGUYÊN tại chỗ, không dọn vào sheet.)
     Đo trước sửa (375, đã đăng nhập) — 3 thứ lệch, không chỉ là vỏ:
       (1) nhãn: rewards `12/16 · 400 · thường` vs voucher `12/16 · 500 · HOA`;
       (2) mô hình: rewards mở sẵn / voucher thu gọn 1 hàng → sheet;
       (3) rewards là HỘP LỒNG HỘP 3 tầng: dải xám → thẻ trắng 343×193 → thẻ radio
           có viền. §2.3 không cho nhấn bằng cách xếp hộp.
     Concept chốt: TITLE trần trên dải xám + NỘI DUNG trong mặt trắng. 4 rule dưới:
       · gỡ khung bao của khối rewards — markup GIỮ khung để bộ da mặc định vẫn là
         "bản Figma sống" dùng để đo đối chiếu (xem README);
       · 2 title = nhãn nhóm `12/16 · 500 · HOA` — cùng bậc nhãn với footer/menu/bộ
         lọc, §1.5 vai 5 (nhãn cũ trong nút voucher nhường vai này nên rule "3 chỗ
         +1 nấc weight" phía dưới đã rút `#voucherTrigger > span.flex-1`; hàng bấm
         về họ nội dung `12/18 · 400`, chữ đổi thành "Chọn mã ưu đãi" ở markup);
       · `.opt` lấy mặt trắng: bỏ khung bao rồi thì thẻ radio nằm TRỰC TIẾP trên dải
         xám, mà markup không khai nền → sẽ là xám-trên-xám, mất hẳn hình thẻ;
       · nhịp: title→nội dung 8 (markup gap-2 của khối voucher, khai lại 8 cho khối
         rewards vì markup nó là gap-4), giữa 2 khối 16 — nhóm phải thoáng hơn nội
         bộ nhóm, không thì 2 khối đọc ra một danh sách 4 dòng. */
  html.skin-mt [data-screen="cart"] .bg-secondary:has(#discountLines) > div:first-child {
    gap: 16px;
  }
  html.skin-mt [data-screen="cart"] div:has(> #rewardOpts) {
    background: transparent;
    border: 0;
    padding: 0;
    gap: 8px;
  }
  html.skin-mt [data-screen="cart"] #rewardOpts .opt {
    background: var(--general-background);
  }
  /* (Rule kéo viền thẻ hàng bấm #ececec -> #dfdfdf đã GỠ 24/08: ô chọn mã nay dựng
     theo component `pickField`, markup của nó vốn dùng `border-border` = #dfdfdf nên
     hai mặt trắng trên dải xám tự cùng sắc viền, không cần override. Lý do phải là
     #dfdfdf vẫn giữ: #ececec chỉ nhạt hơn nền #f2f2f2 đúng 6/255 nên MẤT vạch.) */
  /* Title bắt cả `label`: khối voucher đổi title sang `<label for>` khi dựng theo
     component (bấm title cũng mở sheet). Khối thành viên vẫn `<p>` vì nhãn của nó
     đứng trên một NHÓM radio, không trỏ vào một control đơn. */
  html.skin-mt [data-screen="cart"] .bg-secondary:has(#discountLines) :is(p, label).font-medium {
    text-transform: uppercase;
    font-weight: 500;
  }

  /* Thẻ khuyến mãi: khe quanh nó là 24 (từ `py-6` của phần bọc) trong khi khe giữa
     mọi hộp khác là 12 -> nhịp dọc nhảy 12·24·12. Bỏ padding dọc của phần bọc, để
     chính margin 12 lo khoảng cách, thành 12 đều. Thẻ bên trong không đổi gì.
     24/08/2026 — user chỉ đích danh phần tử này (`div.py-6.px-4.rise`, không phải thẻ
     viền bên trong): *"block Chương trình khuyến mãi bổ sung padding bottom 12px"*.
     `padding-bottom: 0` -> **12px**: dưới phần bọc là DẢI XÁM của khối tổng, nên 0 làm
     thẻ viền dán thẳng vào mép dải màu; 12 cho nó khe trắng bằng đúng khe trên (margin
     12), thành 12 đều cả hai đầu. Thẻ bên trong vẫn `py-2` — bản thử đổi padding của
     THẺ đã gỡ. KHAI GIỐNG HỆT ở desktop.html. */
  html.skin-mt [data-screen="cart"] div:has(> div > #promoPeek) {
    padding-top: 0;
    padding-bottom: 12px;
    margin-top: 12px;
  }
  /* Chân trang cũng `bg-secondary`: giữ nền, thêm đúng một kẻ để không dính liền
     khối cam kết phía trên (footer là component dùng chung mọi màn, đổi màu ở đây
     là lệch với các màn khác). */
  html.skin-mt [data-screen="cart"] .bg-secondary.mt-4 {
    border-top: 1px solid var(--unofficial-border-1);
  }
  /* ── 3 CHỖ +1 NẤC WEIGHT + BRAND ĐỒNG BỘ VỚI THẺ SP NGOÀI LISTING (20/08/2026) ──
     User: *"số tiền tổng cộng tăng font weight lên 500, ưu đãi & khuyến mãi tăng
     lên 500, Bạn có phiếu mua hàng tăng lên 500, brand name của thẻ sản phẩm trong
     cart chưa đồng bộ text style với bên ngoài"*.
     Cả 3 chỗ đầu đang w400 (blanket bộ da kéo `font-medium` về 400) -> khai 500
     tường minh. Hàng "Tổng cộng" lấy CẢ NHÃN LẪN SỐ: chỉ đậm con số mà để nhãn
     nhạt thì hai đầu một hàng lệch nấc, đọc ra như lỗi.

     BRAND trong giỏ lệch thẻ sản phẩm ở listing tới BA thứ, không chỉ weight —
     đo được: `.pc-brand` ngoài listing là **12/16 · w500 · UPPERCASE**, còn brand
     trong dòng giỏ là **12/20 · w400 · chữ thường**. Kéo cả ba về cho khớp; đây là
     cùng một thông tin (tên thương hiệu) nên phải cùng một text style.
     `p:has(+ .del)` = dòng brand: nó là `p` duy nhất đứng ngay trước nút xoá trong
     dòng giỏ, nên không cần thêm class hook vào markup. */
  /* HOÀN THIỆN THEO STYLE-RULES (20/08 tối): 500 phải đi trọn cặp CHỮ HOA (§1.1).
     2 trigger là vai hoa 5 (chốt việc 8A); "Tổng cộng" ghi thành nhãn hàng tổng —
     vai 5 mở rộng (C4a, đã sửa §1.5 TRƯỚC khi sửa đây). Nhịp 16 = 1 dòng ×1.33.
     Số tiền #cartTotal cũng ăn hoa: toàn chữ số nên vô hại, đổi lại 2 đầu hàng
     cùng một bậc. */
  /* 24/08/2026 — RÚT `#voucherTrigger > span.flex-1` khỏi nhóm này: nhãn đó đã lên
     thành TITLE của khối (rule nhãn nhóm ở trên lo), hàng bấm còn lại là hành động
     "Chọn mã ưu đãi" nên về họ nội dung 12/18 · 400 do blanket lo. Vai hoa 5 §1.5
     không mất chỗ nào — nó chuyển từ "nhãn trong nút" sang "title của khối". */
  html.skin-mt [data-screen="cart"] div:has(> #cartTotal) > span,
  html.skin-mt [data-screen="cart"] #cartCta .acc-trigger > span:first-child {
    font-weight: 500;
    text-transform: uppercase;
    line-height: 16px;
  }
  /* Brand trong hàng giỏ đi theo chốt 24/08 "brand không uppercase": họ nội dung
     400 chữ thường, nổi hơn tên sp bằng BẬC CỠ 14/20 — khớp `.pc-brand` ở mục 5c.
     (Trước 24/08 chỗ này là 500 + HOA + 16 theo vai nhãn của chốt C1.) */
  html.skin-mt [data-screen="cart"] .cart-row p:has(+ .del) {
    font-weight: 400;
    text-transform: none;
    font-size: 14px; line-height: 20px;
  }
  /* (Rule dải mờ #cartStickyCta fade về canvas xám đã gỡ 21/08 — canvas giỏ về
     TRẮNG nên gradient gốc của markup, fade về trắng, lại đúng.) */

  /* ── 6d. FOOTER: NHÃN NHÓM CHỮ HOA (20/08/2026, yêu cầu user) ─────────────────
     *"update lại footer theo skin mt luôn nhé"*. Footer là chỗ cuối còn sót của
     bộ da: nó có 6 NHÃN NHÓM ĐỨNG TRÊN DANH SÁCH — đúng cái vai mà bộ da này đã
     viết hoa ở 3 chỗ khác (nhãn menu drawer, nhãn nhóm mega panel, tiêu đề mục bộ
     lọc) — nhưng vẫn đang chữ thường. Kéo về cùng một bậc nhãn: 12/16 + chữ hoa.
     CẬP NHẬT 20/08 tối: weight lên 500 theo VIỆC 7 STYLE-RULES (mọi chữ hoa = 500,
     cặp không tách rời §1.1) — bỏ cách cũ "để blanket lo 400".

     Bắt nhãn nhóm bằng CẤU TRÚC, không bằng danh sách chuỗi:
       · `div:not(:has(img)) > p.font-medium` — cột nào chứa LOGO là khối thương
         hiệu, và `p` trong đó ("DAFC - A subsidiary of IPPG") là dòng mô tả công
         ty chứ không phải nhãn nhóm -> loại đúng nó ở cả 2 khổ. Ở desktop đây là
         cách DUY NHẤT phân biệt được: cả 4 cột đều là `p` + `div.flex-col` theo
         sau, chỉ khác ở chỗ có logo hay không.
       · `:not(.text-\[18px\])` — bỏ tiêu đề newsletter "Cập nhật thông tin mới
         nhất từ DAFC"; nó là tiêu đề khối, không phải nhãn danh sách.
       · `.acc-trigger > span:first-child` — mobile gói 3 nhóm link vào accordion
         nên nhãn nằm trong `span`, desktop trải thành 4 cột nên không có nhánh này.
     Hook `.bg-secondary.mt-4` = footer ở CẢ 2 khổ (mobile `bg-secondary pt-8 pb-8
     px-2 mt-4`, desktop `bg-secondary mt-4`), và KHÔNG trúng panel ưu đãi ở giỏ
     (`py-6 px-4 bg-secondary …`, không có `mt-4`) — chỗ đó có `p.font-medium` riêng.
     *(Cập nhật 24/08/2026: 2 `p.font-medium` trong panel ưu đãi giờ ĐÚNG là nhãn
     nhóm và ĐƯỢC viết hoa, nhưng bằng rule riêng ở khối 6c — hook footer vẫn phải
     không trúng chúng, vì bậc nhãn ở đó là chuyện của màn giỏ. "Tổng cộng" cũng đã
     thành nhãn hàng tổng viết hoa từ chốt C4a 20/08.)*

     KHÔNG đụng vách accordion footer: bộ da đang để `#dfdfdf` (chốt 18/08 "nội
     dung nhẹ nhàng hơn"). Hệ gạch `#ececec` chỉ nhạt hơn nền `#f2f2f2` đúng 6/255
     nên đưa về đó là mất luôn vạch. */
  html.skin-mt .bg-secondary.mt-4 div:not(:has(img)) > p.font-medium:not(.text-\[18px\]),
  html.skin-mt .bg-secondary.mt-4 .acc-trigger > span:first-child {
    text-transform: uppercase;
    font-size: 12px; line-height: 16px;
    font-weight: 500;
  }

  /* ── 6e. ÁP STYLE-RULES VÀO MÀN GIỎ — ĐỢT THỬ THEO LỆNH USER (20/08/2026 tối) ──
     Phạm vi CHỈ [data-screen="cart"] (+ đúng 1 fix global §4.1 vốn đã duyệt ở
     Phần 4 luật thi hành). Đây là bản thi hành các việc ĐÃ CHỐT trên màn giỏ:
       · việc 1+3 — cặp cỡ+dòng: 1 dòng 12/16 · nhiều dòng 12/18 · 18/24 · 10/14.
         leading-5 (20, tàn dư remap một trục) → 18; leading-6 (24, của cỡ 16 đã
         khai tử) → 16; các cặp đứng sau khối remap cỡ nên chỉ cần khai dòng.
       · việc 5 — badge -% giữ CHỮ đỏ, bỏ nền hồng + đệm (canvas + gradient sticky
         đã đổi tại rule gốc 6c).
       · việc 7 — nhãn nhóm quà tặng: hoa phải 500.
       · việc 8A — support khối phiếu mua hàng = mực phụ 12/18; nút "Áp dụng" bỏ
         mặt xám (mặt xám không phải đòn nhấn §2.3) → trắng + viền V1.
     Duyệt xong đợt này thì nhân rộng selector sang các màn còn lại. */
  html.skin-mt [class*="tracking-"] { letter-spacing: 0.5px; }
  /* Phần 5 luật: popover Cài đặt là công cụ dev, được miễn — trả lại eyebrow của nó */
  html.skin-mt #settingsPanel [class*="tracking-"] { letter-spacing: 0.12em; }
  /* (4 rule cặp cỡ/dòng của riêng màn giỏ đã GỠ 24/08: khối `:where()` toàn app ở
     mục 5 khai đúng các giá trị này cho MỌI màn — giữ lại là khai hai lần.) */
  html.skin-mt [data-screen="cart"] .bg-destructive-subtle {
    background: transparent;
    padding: 0;
  }
  html.skin-mt [data-screen="cart"] .gift-group > div:first-child > p {
    line-height: 16px;
    color: var(--general-foreground); /* tên chương trình = mực chính, markup đang #333
                                         (21/08: thôi hoa -> thôi 500, blanket .font-* trả về 400) */
  }
  html.skin-mt [data-screen="cart"] #cartCta .acc-inner p {
    color: var(--general-muted-foreground);

     Chrome (phiên đã đăng nhập, giỏ có hàng + địa chỉ đã lưu), ĐÚNG KHỔ MOBILE
     (thu cửa sổ về innerWidth 414). Vòng đầu mình đo bản desktop của họ rồi suy
     sang mobile -> nâng gần như mọi khối lên tấm trắng, sai hướng: nền xám khi đó
     chỉ còn là mấy khe hở. Số đo bản mobile:

       · thẻ sản phẩm         #ffffff, KHÔNG viền, lề ngang 16

       · thẻ LỰA CHỌN         #ffffff + viền 0.8px #e5e5e5 (gói quà, phương thức
                              giao, PayPal, các mục Help & Services)
       · "Total / Subtotal / Delivery / Taxes"  KHÔNG có tấm — chữ nằm TRẦN trên
                              nền xám; chỉ ô "Express · Tue, Aug 25 · Free"
                              (một lựa chọn) mới trắng
       · checkout: tiêu đề bước, câu dẫn, ghi chú đều nằm trần trên xám; chỉ thẻ

                   trắng lên. Bước chưa tới ("2. Shipping method") chỉ là chữ mờ.

     Chữ, tiêu đề, tổng tiền, ghi chú, nút — để trần trên nền.

     NHÓM HÀNG GỘP LẠI MỘT TẤM (yêu cầu user: *"cho nguyên nhóm thẻ sản phẩm ở
     cart group lại như cũ"*). Bản trước mình tách mỗi `.cart-row` thành một thẻ
     rời cách nhau 8px — đúng cách họ làm khi giỏ chỉ có 1 món, nhưng giỏ demo 5

     và `#orderGift` mỗi cái là MỘT tấm trắng liền, mọi dòng bên trong giữ y bản
     gốc — kể cả dải quà vẫn tự tô `bg-accent-0` để tách khỏi dòng hàng, vì nó
     đang nằm trên mặt trắng chứ không phải trên canvas.

     THAM CHIẾU ≠ BÊ NGUYÊN (bài học mục 6): không mượn linh kiện nào của họ,
     không đụng markup/layout. Đây thuần tuý là đảo LỚP NỀN của 2 màn; bỏ class
     `skin-mp` là về y như cũ.
     Số lấy từ BẢNG TOKEN CÓ SẴN của bộ da, không đẻ sắc mới (bài học
     `--general-background-blur`: hệ token đã có ô đúng vai thì dùng nó):
       · canvas   var(--unofficial-accent-0) = #f7f7f7  (họ #f8f8f8, lệch 1 nấc)
       · gạch     var(--unofficial-border-1) = #ebebeb
       · mặt nhấn var(--unofficial-secondary-active) = #ebebeb cho rãnh segmented
       · bo góc   0 — bộ da này vuông góc mọi chỗ (họ bo 4)
     Tấm chạy FULL-BLEED thay vì lề 16 như họ: nội dung bên trong vốn đã `px-4`,
     cho thêm lề ngoài nữa thì chữ rơi về x=32 trong khi tiêu đề màn ở x=16.

  /* ── MENU CHỮ HOA CHO skin-mp (24/08/2026, lệnh user: *"ở skin mr porter, hãy lấy

  /* ── VIỀN TRONG MENU: Y CHANG skin-mt (24/08/2026, user: *"skin-maika menu phải có

     Cách sửa: KHOANH 3 TOKEN VIỀN vào đúng phạm vi `#menuSheet` — biến CSS thừa kế
     nên mọi phần tử trong drawer tự lấy số của skin-mt, không phải liệt kê từng chỗ,

    --general-border: #dfdfdf;        /* V2 skin-mt — kẻ hàng tab, viền 2 nút auth */
    --unofficial-border-0: #f2f2f2;   /* kẻ trên khối "Tài khoản" + hàng "Ngôn ngữ" */
    --general-secondary: #f2f2f2;     /* mặt xám skin-mt (mặt, không phải viền) */

  /* ── MAIKA: CỤM ACCORDION PDP VỀ MỘT CỠ 14 (25/08/2026, lệnh user: *"ở skin maika, cho
     toàn bộ các Accordion (mô tả sản phẩm,...) up lên font 14 hết, không cần uppercase"*) ──

  /* Danh sách hàng: mỗi món ngăn nhau bằng một hairline. Dùng `:not(:first-child)`

  /* .ck-sum là thanh sticky — nội dung cuộn qua BÊN DƯỚI nó nên bắt buộc phải đục,

     THỤT VÀO 16 (yêu cầu user 20/08/2026): mép tấm nay thẳng cột với chữ của mọi
     khối bên dưới, đúng cách họ dựng card "Order Summary" — lề ngoài 16, chữ bên
     trong card ở 32. Thành card rồi thì lấy viền 4 cạnh thay cho mỗi kẻ dưới.
     Sticky mà có lề vẫn an toàn: các thẻ cuộn qua bên dưới (`.opt`, ô nhập) cũng
     nằm trong `px-4` nên CÙNG biên 16..359 — không có mảng nào lòi ra hai bên tấm
     khi cuộn.
     20/08 (đổi hướng sang MR PORTER): GIỮ cả lề lẫn viền — user yêu cầu đích danh
     "thụt vô 16px" và không rút lại; trên nền trắng thì viền 1px là thứ duy nhất
     còn giữ cho nó đọc ra là một khối riêng. */
  html.skin-mp [data-screen="checkout"] .ck-sum {
    margin: 12px 16px 0;
    border: 1px solid var(--unofficial-border-1);
  }
  /* Kẻ ngăn bước / ngăn hộp thông báo đang là --general-secondary (#f4f4f4): trên
     canvas #f7f7f7 chỉ còn 3/255, coi như mất vạch. Về #ebebeb. Bước chưa tới
     không cần đụng gì thêm — nền xám + chữ mờ 0.4 (paintCheckout lo) đã là đúng
     cách họ thể hiện "chưa tới". */
  html.skin-mp [data-screen="checkout"] .ck-sec { border-top-color: var(--unofficial-border-1); }
  html.skin-mp [data-screen="checkout"] .ck-notice { border-bottom-color: var(--unofficial-border-1); }
  /* (Đã gỡ 20/08: rule bỏ nền hộp trạng thái tài khoản và rule đổi gradient của
     nút Đặt hàng nổi sang màu canvas xám — cả hai chỉ cần khi nền trang là xám.
     Trên nền trắng, hộp `bg-accent-0` #f7f7f7 tự đọc được và gradient trắng gốc
     lại đúng.) */

  /* ── 7b. CHỮ & NHỊP CỦA CHECKOUT THEO DIOR MOBILE (20/08/2026, yêu cầu user) ──
     *"thử chỉnh sửa lại độ đậm nhạt của màu text cũng như spacing theo đúng của
     dior vào skin mp"* + 4 ảnh chụp 4 bước checkout mobile của họ.
     Số đo đọc TRONG IFRAME 414px trên chính phiên đã đăng nhập: cửa sổ Chrome
     phiên này không thu nhỏ được (resize không ăn, innerWidth kẹt 1920), nên
     nhúng /en_us/couture/checkout vào iframe cùng origin là cách duy nhất lấy
     đúng bản mobile mà vẫn còn session. Lấy được:
       · khối một bước        padding 32px 20px
       · tiêu đề bước         16px/23 serif w400 — MÀU là thứ phân cấp:
                              #33383c khi bước đang mở · #7b8487 khi đã xong
                              HOẶC chưa tới (hai trạng thái này CÙNG một xám)
       · tiêu đề -> nội dung  20px
       · tóm tắt bước đã xong 12px/17 w400 #7b8487
       · "Edit" đi theo màu của bước: đen khi mở, xám khi không
     2 chỗ cố ý lệch số đo:
       · Lề ngang giữ 16 (px-4) chứ không 20 như họ — mọi thứ trong 2 màn này,
         kể cả tiêu đề màn, đang thẳng cột 16; đổi riêng phần bước là gãy cột.
       · Line-height 17 quy về 16 (cặp 12/16 của thang chữ dự án), không chế số
         mới — đúng quy ước "thang chữ theo text style". */
  html.skin-mp [data-screen="checkout"] .ck-sec { padding: 32px 0 24px; }
  html.skin-mp [data-screen="checkout"] .ck-sec.is-pending { padding: 32px 0; }
  /* Hàng tiêu đề bỏ chiều cao cố định (56 / 72 khi chưa tới): nhịp nay do padding
     của khối bước lo, giữ h-[56px] nữa là cộng dồn thành hai lớp khoảng trắng.
     12px + py-2 sẵn có của thân = đúng 20px tiêu đề -> nội dung như họ. */
  html.skin-mp [data-screen="checkout"] .ck-head { height: auto; padding-bottom: 12px; }
  html.skin-mp [data-screen="checkout"] .ck-sec.is-pending .ck-head { padding-bottom: 0; }
  /* (Đã gỡ 20/08: rule ép `.ck-title` về w400 theo Dior — nay tiêu đề bước là
     NHÃN HOA w500 khai ở khối trên, hai rule đá nhau.) */
  /* Bước KHÔNG mở -> xám, cả tiêu đề lẫn nút "Thay đổi".
     `opacity` đang bị paintCheckout ghi INLINE (0.4 cho bước chưa tới) nên phải
     !important mới gỡ được: họ phân cấp bằng MÀU, chồng thêm mờ là ra hai nấc
     nhạt khác nhau cho hai trạng thái mà bên họ dùng chung một xám. */
  html.skin-mp [data-screen="checkout"] .ck-title { opacity: 1 !important; }
  html.skin-mp [data-screen="checkout"] .ck-sec:not(:has(> .ck-open.is-open)) .ck-title,
  html.skin-mp [data-screen="checkout"] .ck-sec:not(:has(> .ck-open.is-open)) .ck-change {
    color: var(--general-muted-foreground);
  }
  /* Tóm tắt của bước đã xong: 12/16 xám, bỏ luôn nhấn đậm ở dòng tên người nhận
     — bên họ cả cụm tóm tắt là MỘT cấp chữ phụ, không có dòng nào nổi lên. */
  html.skin-mp [data-screen="checkout"] .ck-done .acc-inner p {
    font-size: 12px; line-height: 16px; font-weight: 400;
    color: var(--general-muted-foreground);
  }
  /* Nút "Thay đổi" gạch chân như "Edit" của họ. Số đo của họ: gạch **1px** ngay
     đáy hộp, chữ chừa `padding-bottom: 2px` — vẽ bằng linear-gradient chứ không
     phải text-decoration. Ta dùng `text-decoration` (đúng linh kiện dự án đã
     dùng cho mọi link chữ) với `thickness 1px` + `offset 2px` -> ra đúng bấy
     nhiêu, và gạch tự đổi màu theo chữ khi bước chuyển đen <-> xám vì
     text-decoration ăn `currentColor`. */
  html.skin-mp [data-screen="checkout"] .ck-change {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }
  /* Header: yêu cầu 20/08 là "về tone màu của nền" — nền nay đã trắng nên chỉ còn
     phải GỠ phần tô xám, `glass-95` trắng gốc chính là tone của nền. Giữ lại đúng
     một kẻ dưới: header của MR PORTER (và của Dior) đều tách khỏi nội dung bằng
     một hairline chứ không bằng bóng. */
  html.skin-mp [data-screen="cart"] .navbar,
  html.skin-mp [data-screen="checkout"] .navbar {
    border-bottom: 1px solid var(--unofficial-border-1);
  }

  /* ── PDP: CỤM ACCORDION KHÔNG CÓ KẺ MỞ ĐẦU (24/08/2026, lệnh user: *"ở pdp, cục mô tả
     sản phẩm sẽ không có border top nhé, hãy bỏ ra ở toàn bộ ver pdp cả mobile và
     desktop"*) ────────────────────────────────────────────────────────────────────────
     Bộ da này đổi `border-b` của mỗi hàng accordion thành KẺ TRÊN (rule `.acc.border-b`
     ở trên), nên hàng đầu — "Mô tả sản phẩm" — tự mang một kẻ nằm ngay dưới khối xám
     CTKM: ngăn hai lần ở cùng một mép. Bỏ kẻ đó, các hàng sau giữ nguyên nên vẫn ngăn
     nhau bình thường.
     `:first-child` trúng ĐÚNG hàng đầu của cụm tab PDP — đã đo: accordion ở footer
     không phải con đầu của cha nó nên không bị ảnh hưởng. Phủ cả 6 bản qua `^="pdp"`.
     KHAI GIỐNG HỆT ở file kia. */
  html.skin-mt [data-screen^="pdp"] .acc.border-b:first-child { border-top-width: 0; }

  /* ── ĐỢT THI HÀNH AUDIT 24/08/2026 — DỌN NỐT CÁC ĐIỂM LỆCH ────────────────────
     Lệnh user: *"hãy sửa tất cả các điểm còn lệch vào luôn"*. Nguồn: bản dò
     `AUDIT-TYPO-SHADCN-2026-08-24.md`; 4 điểm còn treo lấy đúng khuyến nghị mục E.
     Khối đặt CUỐI phần bộ da (chỉ trước khối `.font-pair`) để thắng rule cũ cùng
     specificity. KHAI GIỐNG HỆT ở desktop.html. */

  /* §3.1 — GỘP #cfcfcf VÀO V2. `--unofficial-border-3` là tầng viền dùng nhiều nhất
     (ô tick `.chk`, vòng radio) mà không có trong luật 3 tầng. Remap ở TOKEN nên phủ
     cả 40 chỗ, không phải sửa từng selector. */
  html.skin-mt { --unofficial-border-3: var(--general-border); }

  /* §3.1 — `.opt.on` là DẤU ĐANG CHỌN nên lấy V1 đen, không phải #333 (mực nội dung
     đem đi làm viền). Chốt E-1. */
  html.skin-mt .opt.on { border-color: var(--general-primary); }

  /* §3.1 — vách checkout đang lấy `--general-secondary` (#f2f2f2) làm viền -> V3
     (#ececec). skin-mp đã đúng từ trước; đây là port sang bộ da mặc định. */
  html.skin-mt [data-screen="checkout"] .ck-sec { border-top-color: var(--unofficial-border-1); }
  html.skin-mt [data-screen="checkout"] .ck-notice { border-bottom-color: var(--unofficial-border-1); }

  /* §3.2 — bo góc về 0: nhãn VISA/MASTER/TIKINOW (`rounded-[3px]`) và pill chỉ báo
     trang ở PDP (`h-1 rounded-full` 24×4 — pill DÀI, không phải hình tròn thật nên
     không thuộc ngoại lệ w==h). */
  html.skin-mt :where(.rounded-\[3px\]) { border-radius: 0; }
  html.skin-mt .h-1.rounded-full { border-radius: 0; }
  /* pill chọn trang chính sách (154×28) — cũng là pill dài, không phải chấm tròn.
     Bắt bằng `.px-3` để không đụng chấm/vòng thật (w==h thì không có padding ngang). */
  html.skin-mt .h-7.px-3.rounded-full { border-radius: 0; }

  /* §3.2 + §3.3 — 2 nút nổi tròn: `#topFab` vuông + BỎ BÓNG (bóng duy nhất còn lại
     của mặt tiền, §3.3 đã ghi tên nó), `.quick-add` vuông (chốt E-4: giữ chức năng
     thêm nhanh, thôi làm vật thể tròn duy nhất trên bộ da vuông — desktop vốn đã ẩn). */
  html.skin-mt #topFab { border-radius: 0; box-shadow: none; }
  html.skin-mt .quick-add { border-radius: 0; }

  /* §2.2 — badge -% bỏ nền hồng `#fef2f2`, GIỮ chữ đỏ (việc 5 chốt 20/08, trước chỉ
     áp trong màn giỏ -> nay toàn app). */
  html.skin-mt .bg-destructive-subtle { background: transparent; padding: 0; }

  /* §2.1 — "hết hàng" thôi hạ mực dưới sàn `#666` (chốt E-3): chuyển sang GẠCH NGANG
     + mực phụ, cùng khuôn `.pc-size.is-oos` của desktop. Bỏ luôn mảng nền
     `rgba(0,0,0,.04)` — mặt thứ ba không có trong §2.2, mà gạch ngang đã đủ nói
     "không mua được". */
  html.skin-mt .chip.off {
    background: transparent;
    color: var(--general-muted-foreground);
    text-decoration: line-through;
  }

  /* ── PDP2 + PDP3: THANG CHỮ RIÊNG CHO CỤM ACCORDION (25/08/2026, lệnh user: *"ở trang
     PDP ver số 2, hãy cho toàn bộ các Accordion (mô tả sản phẩm,...) được uppercase hết
     trên font 12; ở trang pdp sản phẩm số 3 thì tăng font size lên 14 cho toàn bộ các
     Accordion"*) ──────────────────────────────────────────────────────────────────────
     VÌ SAO PHẢI KHAI Ở ĐÂY, không chỉ sửa utility trong markup: khối remap §4.2 ngay
     trên kéo `text-[14px]` về 12/18 và blanket weight kéo mọi `font-medium` về 400 —
     utility một mình KHÔNG tới đích. Đo trước khi sửa (25/08, cả 2 màn): nhãn 12/18 ·
     400 · thường, nội dung 12/16.
     VÌ SAO BÁM `[data-pdp-acc]` (thuộc tính mới, gắn ở CỤM TAB của cả 6 bản PDP):
     accordion FOOTER cũng là `.acc.border-b` và nằm chung màn — bám `.acc` trơn hay
     `[data-screen^="pdp"]` là trúng luôn footer, vốn đã đúng khuôn nhãn của nó. Gắn đủ
     6 bản (không chỉ 2 bản đang sửa) để bộ da Maika bên dưới bắt được bằng MỘT rule.
       · pdp2 = ĐỔI VAI: nhãn về HỌ NHÃN T6 12/16 · 500 · HOA, đúng khuôn nhãn nhóm
         footer đang chạy (đo: 12/16 · 500 · uppercase). §1.1 buộc hoa đi CẶP với 500 nên
         không tách rời được. Nội dung + bảng thông số giữ chữ thường 12 — §1.5 cấm hoa
         đoạn văn.
       · pdp3 = GIỮ VAI (họ nội dung, chữ thường), chỉ LÊN BẬC CỠ: nhãn và nội dung cùng
         14/20 — cặp 14 duy nhất của thang §1.2, không tự chế 14/21.
     ⚠ Đây là 2 BIẾN THỂ để khách so, KHÔNG phải luật mới của bộ da: 4 bản PDP còn lại
     giữ 12/18 · 400 · thường. Đã ghi vai mới vào STYLE-RULES.md §1.5.
     Nhánh nội dung của pdp3 phải là `.acc-inner :is(div, p, span)` chứ không phải
     `.acc-inner > div`: 2 file dựng ruột accordion KHÁC NHAU — mobile để chữ thẳng trong
     div, desktop bọc thêm `<p>` và hàng thông số `<span>`. Một selector phủ cả hai thì
     rule mới KHAI GIỐNG HỆT được ở 2 file.
     KHAI GIỐNG HỆT ở desktop.html (port 25/08). */
  html.skin-mt [data-screen="pdp2"] [data-pdp-acc] .acc-trigger > span:first-child {
    font-size: 12px; line-height: 16px; font-weight: 500; text-transform: uppercase;
  }
  html.skin-mt [data-screen="pdp3"] [data-pdp-acc] .acc-trigger > span:first-child,
  html.skin-mt [data-screen="pdp3"] [data-pdp-acc] .acc-inner :is(div, p, span) {
    font-size: 14px; line-height: 20px;
  }

  /* ── THỬ CẶP FONT = TẮT NHÃN HOA CỦA BỘ DA (24/08/2026, yêu cầu user: *"ở các
     option font không nhất thiết phải theo rule uppercase toàn bộ theo skin mt"*) ──
     Chữ hoa là chữ ký của `skin-mt` (nav ngành hàng · nhãn nhóm menu · tiêu đề mục
     bộ lọc · nhãn footer · nhãn mở mục trong giỏ). Nhưng khi ĐANG THỬ một cặp font
     khác — nhất là cặp serif editorial — uppercase làm mất mặt chữ cần xem: chữ hoa
     che hết phần chữ thường (x-height, đuôi g/y, bụng a/e) vốn là chỗ nhận ra một
     serif. Nên chế độ `.font-pair` tự trả mọi nhãn về chữ thường.
     CHỈ áp khi đang thử cặp — bỏ chọn cặp là bộ da hoa lại như cũ, KHÔNG đụng
     skin-mt mặc định (§5 luật: công cụ thử không được sửa mặt tiền).
     Đặt CUỐI <style> để thắng các rule hoa của bộ da ở trên (cùng specificity
     (0,2,1), ai viết sau thắng — bẫy đã dính 3 lần, xem README). */
  /* ⚠ ĐỘ MẠNH CỦA KHỐI NÀY LÀ CÓ CHỦ Ý — ĐỪNG "dọn" nó (ghi 24/08/2026 sau khi thử
     và phải hoàn tác): `:is()` lấy specificity của nhánh ĐẬM NHẤT, và trong danh sách
     có nhánh mang id (`#filterSheet`, `:has(#discountLines)`) nên cả khối đứng ở
     (1,4,2). Đó chính là cái làm nó đè được MỌI rule nhãn hoa của bộ da — nhiều rule
     trong số đó cũng bám id (`#menuSheet`, `#filterSheet`). Thử bọc `:where()` cho các
     nhánh id để "gọn specificity" thì khối tụt về (0,4,2) và lập tức mất tác dụng với
     nhãn menu/bộ lọc của skin-mt. Muốn một chỗ nào đó GIỮ chữ hoa khi thử font thì
     dùng rule riêng có `!important` (xem khối skin-mp ngay dưới), đừng hạ khối này. */
  html.font-pair :is(
    .dk-dept, .dk-nav-link, .ms-tab, .search-tab, .pc-brand,
    #filterSheet .facc-trigger > span, #filterSheet .facc > span,
    .bg-secondary.mt-4 p, .bg-secondary.mt-4 .acc-trigger > span,
    [data-screen="cart"] div:has(> #cartTotal) > span,
    [data-screen="cart"] .bg-secondary:has(#discountLines) :is(p, label).font-medium,
    [data-screen="cart"] .cart-row p, [data-screen="cart"] .acc-trigger > span,
    .ms-view > p, .dk-mega-grid > div > p,
    /* vai hoa thêm 25/08: nhãn accordion của PDP2 — cùng lý do, thử cặp font mà ép
       hoa là mất mặt chữ thường cần xem */
    [data-screen="pdp2"] [data-pdp-acc] .acc-trigger > span
  ) { text-transform: none; }

  /* ── skin-mp: MENU GIỮ CHỮ HOA KỂ CẢ KHI ĐANG THỬ CẶP FONT (24/08/2026) ────────
     User: *"sao khi tôi chuyển font mix thì lại mất uppercase nhỉ, ở skin-mp cho
     uppercase cả menu kể cả khi switch font"*.
     Vì sao mất: khối `.font-pair` ngay trên trả `text-transform: none` cho danh sách
     nhãn và nó KHÔNG phân biệt bộ da. `:is()` lấy specificity của đối số ĐẬM NHẤT
     (`[data-screen="cart"] … .font-medium`) nên cả khối lên (0,4,2), cao hơn rule menu
     của skin-mp (0,3,1) -> đè mất. Rule dưới bám `#menuSheet` (id) nên thắng chắc.
     Đo trên trang: ở khổ này font-pair chỉ giết chữ hoa của `.ms-tab` — hàng danh mục
     cấp 1 và tiêu đề màn con KHÔNG nằm trong danh sách của khối trên nên vẫn hoa. Vì
     vậy chỉ trả lại đúng `.ms-tab`; thêm selector khác vào đây sẽ vô tình lật cả rule
     "hàng cấp 2 giữ chữ thường" (specificity gần bằng nhau).
     VÌ SAO PHẢI `!important` (đã thử 2 đường trước khi chọn): khối font-pair đứng ở
     (1,4,2) do có nhánh mang id, cao hơn mọi tổ hợp selector hợp lý ở đây — bám thêm
     `#menuSheet` cũng chỉ tới (1,3,1). Hai đường kia đều tệ hơn: hạ specificity khối
     font-pair thì skin-mt mất hành vi "thử font = bỏ hoa" (đã thử, phải hoàn tác), còn
     nhồi selector cho đủ điểm thì thắng bằng THỨ TỰ, vỡ ngay khi ai đó chèn rule mới.
     Phạm vi `!important` này rất hẹp: đúng một thuộc tính, đúng một trạng thái
     (`skin-mp` + đang thử font), đúng một phần tử.
     skin-mt CỐ Ý KHÔNG có rule này — chốt 24/08: bộ da mặc định trả nhãn về chữ thường
     khi thử font để xem được mặt chữ thường. Đây là chỗ 2 bộ da khác nhau có chủ ý. */

  return `
  <div class="bg-card flex flex-col cursor-pointer group ${w}" data-product="${i}">

           ngược EN->VN biến badge thành "Đặt trước" (trùng chuỗi với nút) -->
      ${badge ? `<span ${badge === 'Pre-order' ? 'data-i18n-skip ' : ''}class="badge-label absolute top-2 left-0 px-2 py-1 text-[12px] font-medium leading-4 text-foreground tracking-wide">${badge}</span>` : ''}
      ${pillBadges && pillBadges.length ? `
      <div class="absolute top-2 left-0 flex flex-col items-start gap-1">
        ${pillBadges.map(b => `<span class="badge-label px-2 py-1 text-[10px] font-medium leading-3 text-foreground">${b}</span>`).join('')}
      </div>` : ''}

let plpMode = { type: 'brand' };

function goPlp(mode) {
  plpMode = (mode && mode.type) ? mode : { type: 'brand' };
  pruneFilters();   // ngành mới có thể không còn facet của nhãn đang áp
  /* Đổi danh sách = nội dung khác hẳn -> vị trí cuộn cũ vô nghĩa, xoá đi kẻo
     lượt back sau đó trả về một toạ độ của danh sách khác (xem SCROLL_MEM) */
  delete SCROLL_MEM.plp;

  if (current === 'plp') { history.push('plp'); current = null; } // ép render lại khi đang ở PLP
  go('plp');
}

/* PLP đang ở ngành làm đẹp? Nhận qua breadcrumb chứ không cần cờ riêng: mọi
   lối vào (menu tab Làm đẹp, submenu, hàng "Trang chủ làm đẹp") đều đẩy
   crumbs[0] = 'Làm đẹp'. Dùng chung cho danh sách sản phẩm và bộ lọc. */
const isBeautyPlp = () => plpMode.type === 'category' && (plpMode.crumbs || [])[0] === 'Làm đẹp';

/* Danh sách sản phẩm theo chế độ PLP (giữ index gốc cho router PDP/quick-add) */
function plpProducts() {
  const all = PRODUCTS.map((p, i) => ({ p, i }));
  if (plpMode.type === 'search') {   // tìm kiếm quét cả 2 ngành hàng
    const q = (plpMode.query || '').trim().toLowerCase();
    return q ? all.filter(({ p }) => `${p.brand} ${p.name}`.toLowerCase().includes(q)) : all;
  }
  const beauty = isBeautyPlp();
  return all.filter(({ p }) => (p.dept === 'beauty') === beauty);
}

/* ════════════════════════════════════════════════════════════════
   SCREEN: SEARCH — theo 4 trạng thái Figma "03 — Search / Mobile" (2084:160)
   01 empty/trending · 02 typing/suggestions · 03 recent + featured
   04 no-result ("Không tìm thấy kết quả" + Sản phẩm nổi bật)
════════════════════════════════════════════════════════════════ */
let searchQuery = '';
let searchTab = 0;
let searchHistory = ['Áo sơ mi', 'Túi xách da', 'Versace loafer', 'Đầm dạ hội', 'Giày thể thao'];

function highlightMatch(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + `<span class="font-medium">${text.slice(idx, idx + q.length)}</span>` + text.slice(idx + q.length);
}

function searchSuggestions(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return [];
  const pool = [];
  PRODUCTS.forEach(p => { pool.push(p.brand); pool.push(p.name); });
  return [...new Set(pool)].filter(s => s.toLowerCase().includes(needle)).slice(0, 6);
}

/* Pane "đang gõ" — chỉ chứa list gợi ý dạng chữ, tách khỏi pane trending
   để mỗi phím gõ không re-mount lại product card (ảnh nhấp nháy). */
function searchSuggestHTML() {
  const q = searchQuery.trim();
  const sug = searchSuggestions(q);
  return `
  <section class="flex flex-col py-4">
    <h2 class="px-4 text-[12px] leading-4 text-muted-foreground">Gợi ý</h2>
    ${sug.length ? `
    <ul>
      ${sug.map(s => `
      <li><button class="search-suggest w-full text-left px-4 py-3 text-[14px] leading-5 text-foreground press" data-suggest="${s}">${highlightMatch(s, q)}</button></li>`).join('')}
    </ul>` : `<p class="px-4 py-3 text-[14px] leading-5 font-medium text-foreground">Không tìm thấy kết quả</p>`}
  </section>`;
}

function searchHistoryHTML() {
  if (!searchHistory.length) return '';
  return `
  <section class="flex flex-col py-4">
    <h2 class="px-4 py-2 text-[12px] leading-4 text-muted-foreground">Vừa tìm kiếm</h2>
    <ul>
      ${searchHistory.map(h => `
      <li class="search-row flex items-center">
        <button class="search-suggest flex-1 min-w-0 text-left px-4 py-3 text-[14px] leading-5 text-foreground press truncate" data-suggest="${h}">${h}</button>
        <button class="search-remove w-8 h-8 mr-1.5 flex items-center justify-center shrink-0 press [&_svg]:w-3 [&_svg]:h-3" data-remove="${h}" aria-label="Xoá &quot;${h}&quot; khỏi lịch sử">${I.close}</button>
      </li>`).join('')}
    </ul>
  </section>`;
}

/* Khối sản phẩm ngang — "Trending item" khi chưa có lịch sử, "Sản phẩm nổi bật"
   khi đã có; fixedTitle dùng cho pane no-result (không gắn id động). */
function searchTrendingHTML(fixedTitle = '') {
  const title = fixedTitle || (searchHistory.length ? 'Sản phẩm nổi bật' : 'Trending item');
  return `
  <section class="flex flex-col gap-2 py-4">
    <h2 ${fixedTitle ? '' : 'id="trendTitle" '}class="px-4 text-[12px] leading-4 text-muted-foreground">${title}</h2>
    <div class="drag-x flex gap-0.5 overflow-x-auto no-scrollbar px-4">
      ${PRODUCTS.slice(0, 4).map((p, i) => productCard(p, i, { w: 'w-[176px] shrink-0', noColors: true })).join('')}
    </div>
  </section>`;
}

function screenSearch() {
  const q = searchQuery.trim();
  const noResult = q && !searchSuggestions(q).length;
  return `
  <div class="w-full" data-scroller>
    <!-- Nav — logo giữa + đóng bên phải, không viền dưới (Figma 3376:44047) -->
    <div class="glass-95 sticky top-0 z-50 h-[48px] backdrop-blur-[7.5px] flex items-center justify-between px-4">
      <div class="w-6 h-6 shrink-0"></div>
      <img src="${A}logo.png" alt="DAFC" class="h-[20px] w-[93px] object-contain cursor-pointer press" data-nav="plp">
      <button data-nav="plp" aria-label="Đóng tìm kiếm" class="w-6 h-6 flex items-center justify-center shrink-0 press [&_svg]:w-3.5 [&_svg]:h-3.5">${I.close}</button>
    </div>

    <div class="flex items-center px-4 py-2">
      <label class="flex-1 min-w-0 search-field flex items-center gap-3 min-h-10 bg-secondary rounded-xs p-2">
        <span class="w-5 h-5 flex items-center justify-center shrink-0 [&_svg]:w-4 [&_svg]:h-4">${I.search}</span>
        <span style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Tìm kiếm</span>
        <input id="searchInput" type="search" value="${searchQuery}" placeholder="Bạn đang tìm kiếm gì" autocomplete="off" enterkeyhint="search"
               class="flex-1 min-w-0 outline-none text-[14px] leading-6 font-light text-foreground placeholder:text-muted-foreground" style="background:transparent;border:0;padding:0;-webkit-appearance:none;appearance:none">
        <button id="searchClear" type="button" class="shrink-0 text-[14px] leading-5 text-muted-foreground press"${searchQuery ? '' : ' style="display:none"'}>Xóa</button>
      </label>
    </div>

    <!-- Tab: active = foreground + medium + gạch primary; inactive = muted + light;
         track viền dưới dùng general-border thay border-0 (nâng affordance so với Figma gốc) -->
    <div class="flex gap-2 px-4" style="border-bottom:1px solid var(--general-border)">
      ${['Nam','Nữ','Làm đẹp'].map((t, i) => `
        <button class="search-tab h-10 px-2 text-[16px] leading-6 press ${i === searchTab ? 'font-medium text-foreground' : 'font-light text-muted-foreground'}" style="min-width:32px;white-space:nowrap;border-bottom:2px solid ${i === searchTab ? 'var(--general-primary)' : 'transparent'}" data-tab="${i}">${t}</button>`).join('')}
    </div>

    <div id="searchResults">
      <div id="searchSug" class="search-pane"${q ? '' : ' style="display:none"'}>${q ? searchSuggestHTML() : ''}</div>
      <div id="searchNores"${noResult ? '' : ' style="display:none"'}>${searchTrendingHTML('Sản phẩm nổi bật')}</div>
      <div id="searchEmpty" class="search-pane"${q ? ' style="display:none"' : ''}>
        <div id="searchHistoryBox" class="rise">${searchHistoryHTML()}</div>
        <div class="rise">${searchTrendingHTML()}</div>
      </div>
    </div>
  </div>`;
}

/* ── TRẢ GÓP — "Trả trước từ … /tháng · Xem chi tiết" ──────────────
   Vị trí: NGAY DƯỚI nút Thêm vào giỏ hàng và CĂN GIỮA (chốt 18/08/2026, yêu cầu
   user), áp dụng cho MỌI loại PDP — nên khai một lần ở đây thay vì copy markup
   vào 5 màn, kẻo sớm muộn cũng lệch nhau.
   Chỉ sản phẩm KHÔNG pre-order mới hiện: đặt trước không áp dụng trả góp, và
   dùng thẳng PRODUCTS[idx].preorder làm điều kiện chặn để khỏi phải nhớ bỏ tay
   ở từng màn khi đổi sản phẩm nào là pre-order.
   Số tiền là data demo — giữ ĐÚNG bộ số của bản desktop (PDP_DATA.installment)
   để 2 bản không lệch nhau; sản phẩm không có key thì không hiện khối này.
   `cls` dành cho màn có letter-spacing riêng (PDP6). */
const INSTALLMENT = { 1: '1.301.000 ₫', 2: '742.000 ₫', 3: '742.000 ₫', 4: '742.000 ₫', 5: '742.000 ₫' };
const payOfferRow = (idx, cls = '') => {
  const amount = INSTALLMENT[idx];
  if (!amount || PRODUCTS[idx].preorder) return '';
  return `
      <div class="flex items-center justify-center gap-1 text-[12px] leading-4 ${cls}">
        <span class="text-foreground-alt">Trả trước từ <b class="font-medium">${amount}</b>/tháng</span>
        <button data-toast="Xem chính sách trả góp" class="text-foreground underline press">Xem chi tiết</button>
      </div>`;
};

/* ════════════════════════════════════════════════════════════════
   SCREEN: PDP2 — "05 - PDP-Mobile-02-LowStock" (3087:52415)

/* ── KHUYẾN MÃI — catalogue dùng chung cho các PDP ──
   Style card lấy từ Figma "Product Info" 2275:505057: card #fafafa r=4 pad 8
   gap 8, tiêu đề "Khuyến mãi" 14 Medium, mỗi chương trình 1 dòng bullet "·"
   14 Regular, cuối dòng là link mở chi tiết. Dòng ngoài chỉ giữ 1 câu tóm
   tắt — điều kiện / thời gian / loại trừ dồn hết vào bottom sheet.

   Chi tiết khai MỘT LẦN ở đây rồi mỗi PDP chọn key muốn hiện (PDP_PROMOS):
   pdp và pdp2 dùng chung 2 chương trình (insider, freeship) nên nếu copy nội

                <span class="text-[12px] leading-4 text-secondary-foreground">${v}</span>

}

const GIFT_CATALOG = {

/* Quà luôn thuộc về MỘT CHƯƠNG TRÌNH, không đứng lẻ: thẻ quà nào cũng có nhãn
   tên chương trình phía trên. Ngoài việc nói rõ "quà này từ đâu ra", đây còn là
   chỗ để đổi quà — chương trình có nhiều hơn 1 lựa chọn thì hiện nút "Đổi quà"

   `gifts[0]` là quà mặc định; lựa chọn của user lưu ở giftPick. */
const GIFT_PROGRAMS = {

};
let giftPick = {};        // {chương trình: key quà đang chọn} — rỗng = lấy gifts[0]

const ORDER_GIFT_TIERS = [
  { min: 150000000, program: 'tier150' },

];
const giftOf = pk => GIFT_CATALOG[giftPick[pk] || (GIFT_PROGRAMS[pk] || {}).gifts?.[0]];

/* Tạm tính SỐNG: chỉ cộng item đang tick, nhân số lượng. Thay cho hằng số
   CART_SUBTOTAL cũ (in cứng 113.500.000) — nếu còn in cứng thì tăng số lượng
   hay bỏ tick sẽ không đổi tổng, và điều kiện nhận quà theo đơn vô nghĩa. */
/* `removed` = đã bấm thùng rác. Không splice khỏi CART vì dòng DOM còn tham
   chiếu chỉ số qua data-row (splice là mọi chỉ số sau đó lệch 1). */
const cartItems = () => CART.filter(c => !c.removed);
/* NHỮNG MÓN THỰC SỰ ĐANG MUA = chưa xoá VÀ đang tick. cartItems() (chỉ lọc
   `removed`) chỉ dùng để DỰNG MÀN GIỎ — nơi món bỏ tick vẫn phải hiện ra để
   tick lại. Mọi chỗ coi giỏ là "đơn hàng" (thanh toán, tóm tắt, chốt đơn) phải
   dùng cartSelected(), không thì màn thanh toán liệt kê 4 món mà chỉ tính tiền
   3 món. */
const cartSelected = () => CART.filter(c => !c.removed && c.sel !== false);
/* Điểm thưởng của đơn: demo dùng đúng tỉ lệ 1 điểm / 100.000 ₫ (giỏ mặc định
   186.057.000 ₫ khi tick đủ 5 món -> 1.860 điểm; con số tự tính nên thêm/bớt
   món là các màn tự khớp theo). */
const rewardPointsEarned = () => Math.floor(cartSubtotal() / 100000);
function cartSubtotal() {
  return cartItems().reduce((s, c) => s + (c.sel === false ? 0 : vndNum(c.now) * (c.qty || 1)), 0);
}
/* Mốc đã đạt (theo thứ tự mốc) và mốc kế tiếp chưa đạt — dùng cho khối quà
   theo đơn và dòng gợi ý "mua thêm ... để nhận ...". */
function orderGiftState() {
  const sub = cartSubtotal();
  const tiers = [...ORDER_GIFT_TIERS].sort((a, b) => a.min - b.min);
  return {
    sub,
    earned: tiers.filter(t => sub >= t.min),
    next:   tiers.find(t => sub < t.min) || null,
  };
}

/* Ưu đãi chương trình DAFC Rewards — chọn 1 trong 2 (radio, không phải checkbox):

const REWARD_POINTS = 1240;      // = "Điểm thưởng hiện có" ở tab Điểm thưởng (accPoints) — 2 nơi phải cùng 1 số
const REWARD_POINT_VALUE = 1000;

let cartPbh = [];                // [{code, amount}] — phiếu mua hàng đang áp, có thể nhiều mã cùng lúc

/* ── Kho ưu đãi (yêu cầu user 17/08/2026) ──
   Bản trước: 1 ô "Mã giảm giá" gõ tay, mỗi đơn ĐÚNG 1 mã — người mua phải tự

   sheet liệt kê ưu đãi đang có -> chọn NHIỀU mã cùng lúc.
   Luật gom nhóm: mỗi nhóm chọn TỐI ĐA 1 mã. Các mã trong cùng 1 nhóm ở đây đều
   là các MỨC của cùng một chương trình (JUL500/1000/1500 = WARDROBE REFRESH;
   BMSM5/BMSM10 = BUY MORE SAVE MORE) nên cộng chồng nhau là vô nghĩa; cộng
   chồng chỉ hợp lệ GIỮA các nhóm khác loại (vận chuyển + giảm giá + mua nhiều).
   Mã `hidden` KHÔNG hiện trong danh sách, chỉ áp được bằng cách gõ tay — giữ
   nguyên bộ JUNE* của bản cũ cho ai đã quen tay.

   nên nó hiện thành dòng "Phí vận chuyển — Miễn phí" trong tóm tắt). */
const VOUCHER_GROUPS = [
  { key: 'ship',  title: 'Ưu đãi vận chuyển' },
  { key: 'promo', title: 'Mã giảm giá' },

const VOUCHERS = [

let cartVouchers = [];           // [code] đang áp — tối đa 1 mã / nhóm

/* Tên + điều kiện SINH TỪ SỐ, không in cứng trong catalog: số tiền chỉ có một
   nguồn (amount/cap/minSub) nên sửa mức giảm là mọi chỗ hiển thị đi theo, và
   định dạng số khớp với khối tóm tắt (toLocaleString 'en-US', dấu phẩy). */
function voucherTitle(v) {
  if (v.type === 'amount')  return `Giảm ${v.amount.toLocaleString('en-US')}đ`;
  if (v.type === 'percent') return `Giảm thêm ${v.pct}%`;
  return v.title;
}

const voucherByCode = code => VOUCHERS.find(v => v.code === code);
/* Số sản phẩm ĐANG TICK (nhân số lượng) — điều kiện của nhóm "mua nhiều" */
const cartSelectedQty = () => cartSelected().reduce((s, c) => s + (c.qty || 1), 0);
/* Điều kiện áp mã tính trên GIỎ HIỆN TẠI: bỏ tick / giảm số lượng là mã có thể
   rớt điều kiện — xem pruneVouchers(). */
function voucherEligible(v) {
  if (!v) return false;
  if (v.minSub && cartSubtotal() < v.minSub) return false;
  if (v.minQty && cartSelectedQty() < v.minQty) return false;
  return true;
}
/* Lý do chưa dùng được — hiện ngay trên thẻ ưu đãi (thay vì chỉ làm mờ nó) */
function voucherBlockReason(v) {
  if (v.minSub && cartSubtotal() < v.minSub) return `Mua thêm ${(v.minSub - cartSubtotal()).toLocaleString('en-US')}đ để dùng mã`;
  if (v.minQty && cartSelectedQty() < v.minQty) return `Cần mua từ ${v.minQty} sản phẩm`;
  return '';
}
function voucherValue(v) {
  if (!v) return 0;
  if (v.type === 'amount')  return v.amount;
  if (v.type === 'percent') return Math.min(Math.round(cartSubtotal() * v.pct / 100), v.cap || Infinity);
  return 0;                               // 'ship' không trừ vào tiền hàng
}
const activeVouchers    = () => cartVouchers.map(voucherByCode).filter(v => v && voucherEligible(v));
const cartVoucherTotal  = () => activeVouchers().reduce((s, v) => s + voucherValue(v), 0);
/* Giỏ teo lại (bỏ tick / bớt số lượng) thì mã hết điều kiện phải TỰ RỚT, không
   thì tóm tắt in ra một khoản giảm mà đơn không được hưởng. Trả về danh sách mã
   vừa rớt để chỗ gọi báo cho người dùng biết. */
function pruneVouchers() {
  const dropped = cartVouchers.filter(c => !voucherEligible(voucherByCode(c)));
  if (dropped.length) cartVouchers = cartVouchers.filter(c => !dropped.includes(c));
  return dropped;
}

function rewardAmount(kind) {
  const sub = cartSubtotal();
  if (kind === 'member') return Math.round(sub * 0.04);
  if (kind === 'points') return Math.min(REWARD_POINTS * REWARD_POINT_VALUE, Math.round(sub * 0.10));

}

      <img src="${A}${g.img}" class="w-full h-full object-cover lazy" alt="Quà tặng ${g.brand} ${g.name}">

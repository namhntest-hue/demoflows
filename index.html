    </span>
    <span class="flex-1 min-w-0 flex flex-col justify-between">
      <span class="block">
        <span class="block pb-2">
          <span class="block text-[14px] font-medium leading-5 text-foreground truncate">${g.brand}</span>
          <span class="block text-[14px] leading-5 text-secondary-foreground truncate">${g.name}</span>
        </span>
        <span class="block text-[12px] leading-4 text-muted-foreground">${g.variant}</span>
      </span>
      <span class="flex items-end justify-between gap-0.5">
        <span class="pt-1 flex flex-col justify-end min-w-0">
          <span class="block text-[14px] font-medium leading-5 text-foreground">0 ₫</span>
          <span class="block text-[12px] leading-4 text-muted-foreground line-through">${g.was}</span>
        </span>
        <!-- Số lượng in tĩnh, KHÔNG có nút +/− nên cho NẮM SÁT MÉP PHẢI (chỉ đạo
             user 13/08/2026): thẳng cột với mép ngoài của stepper thẻ sản phẩm và với
             nút "Đổi quà" ở hàng nhãn. Trước đó có margin-right 28px để góng theo CON
             SỐ của stepper — nhưng chừa chỗ cho nút "+" không tồn tại chỉ làm thẻ quà
             trông như bị thiếu mất một nút. -->
        <span class="w-7 min-h-6 flex items-center justify-center shrink-0 text-[12px] font-medium leading-4" style="color:var(--unofficial-ghost-foreground)">01</span>
      </span>
    </span>
  </div>`;
}

/* Danh sách đổi quà — chỉ dựng khi chương trình có nhiều hơn 1 lựa chọn.
   Dùng lại đúng khuôn .opt/.radio của project (vòng radio 1px, card đang chọn
   đổi viền, không tô nền — quy ước 12/08/2026). */
function giftOptionsHTML(pk) {
  const p = GIFT_PROGRAMS[pk];
  const cur = giftPick[pk] || p.gifts[0];
  return `
  <div class="px-4 pb-4 flex flex-col gap-2">
    ${p.gifts.map(k => {
      const g = GIFT_CATALOG[k], on = k === cur;
      return `
      <button data-gift-opt="${k}" data-gift-prog="${pk}" class="opt ${on ? 'on' : ''} w-full flex gap-3 items-center border ${on ? 'border-border-5' : 'border-border'} rounded-xs p-2 bg-background text-left press">
        <span class="radio ${on ? 'on' : ''} w-4 h-4 rounded-full border border-border-3 flex items-center justify-center shrink-0">
          <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
        </span>
        <!-- 52×60: kích thước thumb CÓ SẮN trong tailwind.css (mini cart dùng chung).
               w-[40px]/h-[46px] KHÔNG được build — dùng là ảnh bụng ra kích thước gốc 1200×1484. -->
          <span class="w-[52px] h-[60px] shrink-0 bg-secondary overflow-hidden">
          <img src="${A}${g.img}" class="w-full h-full object-cover lazy" alt="${g.brand} ${g.name}">
        </span>
        <span class="flex-1 min-w-0">
          <span class="block text-[14px] leading-5 text-foreground truncate">${g.name}</span>
          <span class="block text-[12px] leading-4 text-muted-foreground">${g.variant}</span>
        </span>
        <span class="text-right shrink-0">
          <span class="block text-[12px] leading-4 text-muted-foreground line-through">${g.was}</span>
          <span class="block text-[14px] font-medium leading-5 text-foreground">0 ₫</span>
        </span>
      </button>`;
    }).join('')}
  </div>`;
}

/* Nhóm quà = [tên chương trình + nút Đổi quà] + [thẻ quà] + [danh sách đổi].
   Luôn có nhãn chương trình, kể cả chương trình chỉ tặng 1 món: quà phải nói
   được nó từ đâu ra, và đây là chỗ móc sẵn cho việc đổi quà. */
function giftGroupHTML(pk, attrs = '', tone = 'tint') {
  const p = GIFT_PROGRAMS[pk], g = giftOf(pk);
  if (!p || !g) return '';
  const many = p.gifts.length > 1;
  /* tone='tint' : tự mang nền (quà kèm sản phẩm — dải riêng dính ngay dưới dòng hàng)
     tone='bare' : không nền (quà theo đơn — nằm trong dải chung cùng nhãn section,
                   xem orderGiftInner; nếu tự tô nền nữa thì xám đè xám) */
  return `
  <div class="gift-group ${tone === 'tint' ? 'bg-accent-0' : ''}" data-gift-prog="${pk}" data-sig="${pk}|${giftPick[pk] || p.gifts[0]}" ${attrs}>
    <!-- Chừa đúng cột 16px + gap 8 như thẻ quà bên dưới để nhãn chương trình
         THẲNG HÀNG VỚI ẢNH, không thò ra sát mép (yêu cầu user 13/08/2026).
         Nút "Đổi quà" vẫn ở mép phải, thẳng cột giá của thẻ. -->
    <div class="flex items-center gap-2 px-4 pt-3 pb-2">
      <span class="w-4 shrink-0" aria-hidden="true"></span>
      <p class="min-w-0 flex-1 text-[12px] font-medium leading-4 text-foreground-alt truncate">${p.name}</p>
      ${many ? `<button data-gift-swap="${pk}" class="shrink-0 text-[12px] font-medium leading-4 text-secondary-foreground underline press">Đổi quà</button>` : ''}
    </div>
    ${giftCard(g)}
  </div>`;
}

/* Nhóm quà theo sản phẩm — chỉ dựng khi item đang tick. `data-gift-of` trỏ về
   chỉ số dòng sản phẩm để refreshCartGifts() biết chèn/gỡ ở đâu. */
function productGiftHTML(c, i) {
  if (!c.gift || !GIFT_PROGRAMS[c.gift] || c.sel === false) return '';
  return giftGroupHTML(c.gift, `data-gift-of="${i}"`);
}

/* Ruột khối quà theo đơn — tách khỏi vỏ để cập nhật tại chỗ mỗi lần đổi số
   lượng / tick mà không dựng lại cả màn.

   MỖI MỐC LÀ MỘT Ô RIÊNG mang đúng tên chương trình (yêu cầu user 13/08/2026):
   KHÔNG còn title lớn "Quà tặng theo đơn hàng" và số đếm "N quà" — tên promo chi
   tiết ("Ưu đãi đơn từ 150 triệu") nói đủ việc rồi, thêm 1 tầng tiêu đề nữa chỉ
   làm loãng. Thoả thêm 1 mốc => thêm 1 ô y hệt, xếp dưới, cách nhau 8px.

   Mốc KẾ TIẾP chưa đạt cũng là 1 ô cùng khuôn (cùng nhãn tên chương trình), chỉ
   thay thẻ quà bằng dòng "mua thêm ..." + thanh tiến độ — nhìn ra ngay phải mua
   thêm bao nhiêu thì ô đó "sáng" lên thành quà thật. */
function orderGiftInner() {
  const { sub, earned, next } = orderGiftState();
  if (!cartItems().length) return '';
  /* Câu gợi ý tách làm 2 text node để applyLang dịch được: vế trái khớp luật
     regex (có số tiền), tên quà là key riêng trong I18N. Nhét cả câu vào 1 node
     thì tên quà không bao giờ được dịch. */
  const teaser = next ? `
    <div class="gift-group bg-accent-0" data-gift-next="${next.min}">
      <div class="flex items-center gap-2 px-4 pt-3 pb-2">
        <span class="w-4 shrink-0" aria-hidden="true"></span>
        <p class="min-w-0 flex-1 text-[12px] font-medium leading-4 text-foreground-alt truncate">${GIFT_PROGRAMS[next.program].name}</p>
      </div>
      <div class="flex gap-2 px-4 pb-4">
        <span class="w-4 shrink-0" aria-hidden="true"></span>
        <span class="flex-1 min-w-0 flex flex-col gap-1.5">
          <span class="block text-[12px] leading-4 text-muted-foreground">
            <span>Mua thêm ${vndDot(next.min - sub)} để nhận</span>
            <span class="font-medium text-foreground">${giftOf(next.program).name}</span>
          </span>
          <span class="block h-0.5 w-full bg-border overflow-hidden">
            <span class="block h-0.5 bg-primary" style="width:${Math.min(100, Math.round(sub / next.min * 100))}%"></span>
          </span>
        </span>
      </div>
    </div>` : '';
  return `
    <div class="flex flex-col gap-2 pt-2">
      ${earned.map(t => giftGroupHTML(t.program, `data-gift-tier="${t.min}"`)).join('')}
      ${teaser}
    </div>`;
}

/* Mọi quà đang được nhận, đúng thứ tự người dùng thấy ở giỏ: quà kèm từng sản
   phẩm đang tick trước, rồi đến quà theo mốc đơn đã đạt. Dùng cho màn Thanh toán
   và (qua ckOrderGifts) màn Hoàn tất. */
function activeGifts() {
  const list = [];
  cartSelected().forEach(c => { if (c.gift && GIFT_PROGRAMS[c.gift]) list.push(c.gift); });
  orderGiftState().earned.forEach(t => list.push(t.program));
  return list;
}

/* 1 dòng quà trong TÓM TẮT ĐƠN (thanh toán / hoàn tất) — cùng khuôn dòng sản phẩm
   của tóm tắt, khác 3 chỗ: badge "Quà tặng" trên ảnh, dòng thứ 3 là TÊN CHƯƠNG
   TRÌNH thay cho "phân loại · SL", và giá 0 ₫. `g` truyền vào khi đọc từ bản
   chốt lúc đặt hàng (giỏ đã dọn rỗng).
   `big` = thumb 100×133 như thẻ giỏ hàng — dùng ở tóm tắt checkout (yêu cầu user
   14/08/2026: phóng to ảnh cho nội dung rõ hơn; quà nằm xen kẽ sản phẩm trong
   cùng danh sách nên phải cùng cỡ, không thì lệch khuôn). Màn Hoàn tất giữ thumb
   52×60 gọn như cũ. */
function giftSummaryRow(pk, g, big) {
  const p = GIFT_PROGRAMS[pk];
  g = g || giftOf(pk);
  if (!p || !g) return '';
  /* Bản big: giá 0 ₫ ghim đáy cột thông tin (justify-between) — cùng khuôn với
     dòng sản phẩm của tóm tắt checkout sau chỉnh 14/08/2026, không thì trong
     cùng danh sách giá món thường nằm đáy mà giá quà lại nằm giữa cạnh phải. */
  const info = `
                  <p class="text-[13px] font-medium text-foreground truncate">${g.brand}</p>
                  <p class="text-[12px] text-secondary-foreground ${big ? 'line-clamp-2' : 'truncate'}">${g.name}</p>
                  <p class="text-[12px] text-muted-foreground ${big ? 'mt-0.5' : ''} truncate">${p.name}</p>`;
  return `
              <div class="flex gap-3 ${big ? '' : 'items-center'}">
                <span class="relative ${big ? 'w-[100px] h-[133px]' : 'w-[52px] h-[60px]'} shrink-0 bg-secondary overflow-hidden">
                  <img src="${A}${g.img}" class="w-full h-full object-cover lazy" alt="">
                  <span class="absolute top-0 left-0 bg-primary text-[10px] font-semibold leading-3 text-primary-foreground ${big ? 'px-1 py-0.5' : 'px-1'} whitespace-nowrap">Quà tặng</span>
                </span>
                ${big ? `
                <div class="flex-1 min-w-0 flex flex-col justify-between">
                  <div>${info}</div>
                  <p class="text-[13px] font-medium text-foreground self-end">0 ₫</p>
                </div>` : `
                <div class="flex-1 min-w-0">${info}</div>
                <p class="text-[13px] font-medium text-foreground shrink-0">0 ₫</p>`}
              </div>`;
}

function orderGiftBox() {
  return `<div id="orderGift" class="rise">${orderGiftInner()}</div>`;
}

function dafcRewards() {
  /* Rich Radio Group (2843:45234/45235): card viền + radio tròn, chọn 1 trong 2.
     Card đang chọn -> viền border-5 (#737373) đậm hơn card thường (border #e5e5e5).
     Không còn wrapper riêng — nằm trong card "Ưu đãi thành viên" của discountPanel(),
     padding/heading do khối cha cấp (theo Figma 3428:55499).
     *(24/08/2026: ở skin-mt khung bao của card đó bị gỡ — `.opt` nằm trực tiếp trên
     dải xám nên khối 6c cấp cho nó mặt trắng; markup vẫn để nguyên khung cho bộ da
     mặc định. Title đổi chữ từ "Ưu đãi chương trình DAFC Rewards" để nhãn nhóm viết
     hoa không đụng luật cấm hoa tên chương trình.)* */
  const opt = (id, title, sub) => {
    const on = cartReward === id;
    return `
    <button class="opt ${on ? 'on' : ''} w-full flex gap-2 items-start border ${on ? 'border-border-5' : 'border-border'} rounded-xs px-3 py-2 press text-left" data-reward="${id}">
      <span class="radio ${on ? 'on' : ''} w-4 h-4 mt-0.5 rounded-full border-2 ${on ? 'border-primary' : 'border-border'} flex items-center justify-center shrink-0">
        <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
      </span>
      <span class="flex-1 min-w-0 flex flex-col gap-1">
        <span class="block text-[14px] font-medium leading-5 text-foreground-alt">${title}</span>
        <span class="block text-[12px] leading-4 text-muted-foreground">${sub}</span>
      </span>
    </button>`;
  };
  const pointsSub = `Đã áp dụng <b class="font-medium text-foreground">${REWARD_POINTS.toLocaleString('vi-VN')} điểm</b> ( 1 điểm = ${REWARD_POINT_VALUE.toLocaleString('en-US')}đ ).`;
  return `
  <div id="rewardOpts" class="flex flex-col gap-2">
    ${opt('member', 'Giảm giá thành viên', 'Ưu đãi 4% trên sản phẩm nguyên giá')}
    ${opt('points', 'Sử dụng điểm thưởng ( tối đa 10% )', pointsSub)}
  </div>`;
}

/* Dòng thu gọn (chốt user 17/08/2026): TRÁI luôn là tên mục tĩnh, PHẢI là con số —
   2 trạng thái: chưa chọn "( N )" với N = số mã ĐANG ĐỦ ĐIỀU KIỆN (mã ẩn và mã chưa
   đạt mức không tính: đếm cả thứ bấm vào không dùng được thì số nói dối) · đã chọn
   "( Đã áp dụng N )". Không in số tiền giảm ở đây — khối tóm tắt ngay dưới đã có
   từng dòng "Giảm giá(<CODE>)" rồi.

   24/08/2026 — DỰNG LẠI THEO COMPONENT `pickField` (lệnh user: *"cái chọn mã ưu đãi
   hãy improve ux ui lại cho gọn và chuẩn chỉnh theo component"*). Ô chọn của dự án
   chỉ có MỘT slot chữ (`.pick-label`), nên 2 phần của chốt 17/08 gộp vào 1 chuỗi và
   trạng thái chuyển sang đúng cơ chế của component: đổi MỰC (placeholder mực phụ ->
   giá trị mực chính) do `setPickLabel()` lo, không còn cột số riêng bên phải.
     · chưa áp: "Chọn mã ưu đãi ( 6 )" — hết mã đủ điều kiện thì BỎ phần số, không
       in "( 0 )" vô nghĩa (trước đây có in);
     · đã áp:  "Đã áp dụng 2 mã" — mã nào thì khối tóm tắt ngay dưới liệt kê rồi. */
const voucherAvailCount = () => VOUCHERS.filter(v => !v.hidden && voucherEligible(v)).length;
const voucherPlaceholder = () => {
  const n = voucherAvailCount();
  return n ? `Chọn mã ưu đãi ( ${n} )` : 'Chọn mã ưu đãi';
};
const voucherPickValue = () => {
  const n = activeVouchers().length;
  return n ? `Đã áp dụng ${n} mã` : '';
};

/* Phiếu mua hàng: demo không có backend tra cứu mã thật, nên sinh số tiền giảm
   ổn định theo chuỗi mã (cùng 1 mã luôn ra cùng 1 số tiền) — 50,000 .. 1,000,000đ,
   bước 50,000. Nhiều mã cộng dồn vào tổng nhưng chỉ hiện 1 dòng "Phiếu mua hàng"
   trong summary (xem discountLinesHTML) — từng mã cụ thể xem ở badge dưới input. */
function pbhAmount(code) {
  let h = 0;
  for (let i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) >>> 0;
  return 50000 + (h % 20) * 50000;
}
function cartPbhTotal() { return cartPbh.reduce((s, p) => s + p.amount, 0); }

/* Các dòng Tạm tính / giảm giá trong summary — sinh động theo state (đăng nhập,
   reward đang chọn, voucher, N mã phiếu mua hàng), dùng chung cho cả lần render
   đầu (screenCART) và mỗi lần cập nhật sau tương tác (refreshCartSummary).
   Theo đúng Figma 3437:55820: MỖI mã (voucher hoặc phiếu mua hàng) có 1 dòng
   riêng dạng "Giảm giá(<CODE>)" — cả 2 loại dùng CHUNG format nhãn này, không
   gộp/rút gọn thành 1 dòng tổng như bản trước. */
function discountLinesHTML() {
  /* py-2 (không h-9 cố định) + items-start: mã dài (VOUCHERPBH...) sẽ XUỐNG
     DÒNG thay vì bị cắt "..." — đúng theo Figma (dòng đó cao 56px = 2 dòng
     label, không phải 36px 1 dòng như các dòng còn lại). */
  const line = (label, amount, isDiscount) => `
    <div class="flex justify-between items-start gap-2 py-2">
      <span class="text-[14px] leading-5 text-foreground">${label}</span>
      <span class="text-[14px] leading-5 ${isDiscount ? 'text-destructive' : 'text-foreground'} shrink-0">${isDiscount ? '-' : ''}${amount.toLocaleString('en-US')}đ</span>
    </div>`;
  /* Ưu đãi vận chuyển không phải một khoản tiền trừ vào hàng (demo miễn phí
     giao sẵn) — nó là một DÒNG CHỮ, nên cần biến thể không format tiền. */
  const lineText = (label, text) => `
    <div class="flex justify-between items-start gap-2 py-2">
      <span class="text-[14px] leading-5 text-foreground">${label}</span>
      <span class="text-[14px] leading-5 text-foreground shrink-0">${text}</span>
    </div>`;
  const sub = cartSubtotal();
  const rows = [line('Tạm tính', sub, false)];
  /* Không còn món nào được chọn thì KHÔNG in dòng giảm giá nào: "Tạm tính 0đ"
     kèm "Giảm giá(JUNE2000) -2.000.000đ" rồi "Tổng cộng 0đ" là 3 dòng không
     cộng lại thành nhau — mã vẫn giữ nguyên, tick lại món là hiện lại. */
  if (sub > 0) {
    if (ckAuth) {
      const amt = rewardAmount(cartReward);
      if (amt > 0) rows.push(line(cartReward === 'points' ? `Dùng ${REWARD_POINTS} điểm` : 'Giảm giá thành viên', amt, true));
    }
    /* MỖI mã 1 dòng riêng (Figma 3437:55820) — giờ có thể nhiều mã cùng lúc,
       nên đây là vòng lặp chứ không còn 1 dòng cứng như bản 1-mã. */
    activeVouchers().forEach(v => {
      if (v.type === 'ship') rows.push(lineText('Phí vận chuyển', 'Miễn phí'));
      else rows.push(line(`Giảm giá(${v.code})`, voucherValue(v), true));
    });
    cartPbh.forEach(p => rows.push(line(`Giảm giá(${p.code})`, p.amount, true)));
  }
  return rows.join('');
}

/* Tổng ưu đãi đang áp, CHẶN TRẦN theo tạm tính (giỏ teo lại vì bỏ tick / xoá
   món thì ưu đãi không được lớn hơn tiền hàng) + tổng phải trả. Tách riêng để
   lúc dựng màn và lúc cập nhật tại chỗ dùng chung đúng 1 công thức. */
function cartDiscountTotal() {
  const reward = ckAuth ? rewardAmount(cartReward) : 0;
  return Math.min(reward + cartVoucherTotal() + cartPbhTotal(), cartSubtotal());
}
function cartTotalNow() { return Math.max(0, cartSubtotal() - cartDiscountTotal()); }

/* Khối hợp nhất theo Figma 3458:56933 (đọc lại lần 4 — user xác nhận "chưa
   đúng thiết kế", bỏ hẳn kiểu "card nổi bo góc" của 2 vòng trước): panel giờ
   lại là full-bleed sát viền màn hình (KHÔNG margin trắng quanh, KHÔNG bo
   góc — chỉ 1 lớp pad[24,16,24,16] trực tiếp trên chính panel, không còn
   wrapper ngoài + card trong lồng nhau). Nền secondary (#f5f5f5) giữ nguyên.
   Summary KHÔNG còn thụt vào thêm 8px như trước — giờ rộng bằng 2 card phía
   trên (358px, không phải 342px). "Chương trình khuyến mãi" vẫn để ngoài
   khối này. "Bạn có phiếu mua hàng?" ở #cartCta (screenCART()), gap với nút
   "Đặt hàng" tăng 8px→16px theo số liệu mới. */

      <div class="flex flex-col gap-2">

/* Rule text 1 mục khuyến mãi — 3 tầng chữ: Headline 14px medium (tên chương
   trình + thời gian), Scheme 14px regular (cơ chế giảm giá), T&Cs 12px regular
   (điều kiện/loại trừ). scheme/tnc để trống khi mục không có (ví dụ dòng
   freeship đơn lẻ, không kèm mã/điều kiện riêng) — chỉ hiện dòng headline. */
function promoRule(headline, scheme, tnc) {
  return `
  <div class="flex flex-col gap-1">
    <p class="text-[14px] font-medium leading-5 text-foreground">${headline}</p>
    ${scheme ? `<p class="text-[14px] leading-5 text-foreground">${scheme}</p>` : ''}
    ${tnc ? `<p class="text-[12px] leading-4 text-foreground">${tnc}</p>` : ''}
  </div>`;
}

          </div>

  return `
  <div class="w-full" data-scroller>

        <!-- 1 text node duy nhất (không bọc span quanh con số) để applyLang dịch

    <!-- Bỏ qua món đã xoá NHƯNG GIỮ NGUYÊN chỉ số i: data-row là chỉ số trong

    ${orderGiftBox()}

/* Nav của luồng auth. Trước đây hàng này là [back] + tiêu đề, nhưng MỌI view

const ETA = 'Thời gian nhận hàng dự kiến từ ngày 14/07 đến ngày 18/07';

/* Rich radio: label + mô tả phụ */
/* Figma "Rich Radio Group": thẻ p12 r2 viền 1px — #e5e5e5 thường, #262626 khi
   chọn (đổi trong .opt.on); vòng radio 16 viền 1px #d4d4d4 KHÔNG đổi màu, chấm
   giữa 8px. Trước đây viền vòng dày 2px và cả thẻ lẫn vòng đều chuyển đen. */
/* icon (tuỳ chọn) = [file, width] — logo đối tác thanh toán đặt cuối hàng, cao
   24 và giữ tỉ lệ bằng object-contain. Bề rộng lấy đúng Figma 3028:47246:
   76 cho cặp Visa+Mastercard, 38 cho các logo đơn. Không có class w-[76px]
   trong bản tailwind build sẵn nên đặt bằng style. */
function richRadio(id, label, sub, on, icon) {
  /* Có dòng phụ (phương thức vận chuyển) -> canh MÉP TRÊN để nút radio thẳng
     hàng với dòng tiêu đề. Chỉ một dòng (phương thức thanh toán) -> canh GIỮA,
     vì thẻ cao 64 mà chữ dính mép trên nhìn lệch hẳn so với logo vốn đã căn
     giữa. mt-0.5 của nút radio cũng chỉ cần khi canh mép trên. */
  const single = !sub;
  return `
  <button class="opt ${on ? 'on' : ''} w-full flex ${single ? 'items-center' : 'items-start'} gap-2 border border-border bg-background rounded-xs p-3 text-left btn-o press" data-opt="${id}">
    <span class="radio ${on ? 'on' : ''} w-4 h-4 ${single ? '' : 'mt-0.5 '}rounded-full border border-border-3 flex items-center justify-center shrink-0">
      <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
    </span>
    <span class="flex-1 min-w-0">
      <span class="block text-[14px] font-medium leading-5 text-foreground">${label}</span>
      ${sub ? `<span class="block text-[14px] leading-5 text-foreground">${sub}</span>` : ''}
    </span>
    ${icon ? `<img src="${A}${icon[0]}" alt="${icon[2] || ''}" class="shrink-0 self-center h-6 object-contain" style="width:${icon[1]}px">` : ''}
  </button>`;
}

/* Một section: head + phần mở (editable) + phần thu gọn (tóm tắt) */

   một bộ field khác nhau (Công ty cần thêm Mã số thuế, Cá nhân thì không).
   Hoist lên module scope vì cả screenCHECKOUT() (render lần đầu) và wire()

const vatFieldSets = {

/* ── Cặp nút phân đoạn (segmented toggle) ──
   Quy ước: mục ĐANG CHỌN **nổi lên** — nền trắng + đổ bóng nhẹ trên rãnh xám,
   giống cặp đổi ngôn ngữ ở bảng Cài đặt. Kiểu cũ (tô xám đúng mục đang chọn,
   trên nền trắng) đọc ngược: mục được chọn nhìn như bị lún xuống.
   segBtnClass dùng chung cho cả lúc dựng markup lẫn lúc JS đổi trạng thái, để
   2 chỗ không lệch nhau. */
const SEG_ON  = 'bg-background text-foreground font-medium shadow-sm';
const SEG_OFF = 'text-muted-foreground';
const segBtnClass = (on, h = 'h-9') =>

  return `
  <div class="flex p-0.5 rounded-xs bg-secondary" role="group">
    ${items.map(([id, label]) => `
    <button ${attr}="${id}" class="${segBtnClass(id === active, h)}">${label}</button>`).join('')}
  </div>`;
}

};
/* ckMode: 'ship' = giao tận nơi (mặc định) · 'pickup' = nhận tại cửa hàng
   ckHome = tỉnh/thành người nhận đang sinh sống (chỉ hỏi ở luồng nhận tại cửa
   hàng, tách khỏi ckProvince của địa chỉ giao hàng).
   ckName/ckPhone/ckEmail: 3 ô người nhận PHẢI có state vì phần này bị dựng lại
   mỗi khi đổi thành phố/cửa hàng — không giữ thì gõ xong đổi cửa hàng là mất
   trắng. Cũng là nguồn để phần tóm tắt nhắc lại người nhận sau khi Xác nhận. */
let ckMode = 'ship', ckCity = '', ckStore = '', ckHome = '';
let ckName = '', ckPhone = '', ckEmail = '';
/* Bước giao hàng: ckAddr = chỉ số địa chỉ đã lưu đang chọn, hoặc 'new' khi
   khách nhập địa chỉ khác. 3 biến ckShip* giữ chữ của form địa chỉ mới để
   phần tóm tắt in đúng tên khách vừa gõ thay cho chuỗi chết cũ. */
let ckAddr = 0, ckShipName = '', ckShipPhone = '', ckShipLine = '';
/* Đã đặt hàng xong: khoá không cho đặt lại đơn thứ hai khi bấm back, và giữ
   mã đơn vừa sinh để màn Hoàn tất / Chi tiết đơn cùng đọc một nguồn. */
let ckPlaced = false, ckOrderId = '', ckOrderTotal = '', ckOrderPoints = '';   // tổng + điểm chốt lúc đặt hàng (giỏ bị dọn ngay sau đó)
let ckOrderGifts = [];   // [{pk, g}] quà của đơn vừa đặt — chốt luôn cả MÓN đang chọn, không chỉ key chương trình
let ckOrderPre = '';     // ngày nhận pre-order của đơn vừa đặt — chốt lúc placeOrder vì sau đó giỏ bị dọn rỗng

/* gap-2.5 = 10 và px-2 = 8 trong ô nhập: đúng số đo Figma (nhóm field gap 10,
   Input padding 8/8, cao 40, r2, viền #e5e5e5).
   field/pickField để Ở NGOÀI screenCHECKOUT vì bước "Nhận tại cửa hàng" dựng
   lại phần thân của nó nhiều lần (ckPickupOpen), không chỉ lúc render màn.

   opts (đều tuỳ chọn, mọi call site cũ giữ nguyên chữ ký 3 tham số):
     val  — giá trị đang giữ trong state, để dựng lại không mất chữ đã gõ
     key  — khoá state (data-ckf), input handler ghi ngược lại vào biến
     auto — autocomplete để trình duyệt/điện thoại gợi ý điền sẵn
   id sinh bằng BỘ ĐẾM chứ không slug hoá nhãn: cùng một nhãn ("Họ và tên")
   xuất hiện ở cả bước nhận hàng lẫn khối VAT nên slug sẽ đụng id. */
let _fldId = 0;
const field = (label, ph, type, opts = {}) => {
  const id = 'fld' + (++_fldId);
  const { val = '', key = '', auto = '' } = opts;
  return `
    <div class="px-4 py-2 flex flex-col gap-2.5">
      <label for="${id}" class="text-[14px] font-medium leading-5 text-foreground">${label}</label>
      <input id="${id}"${type ? ` type="${type}" inputmode="${type}"` : ''}${auto ? ` autocomplete="${auto}"` : ''}${key ? ` data-ckf="${key}"` : ''} value="${val}" placeholder="${ph}"
             class="h-10 bg-background border border-border rounded-xs px-2 text-[14px] text-foreground placeholder:text-muted-foreground outline-none focus:border-primary transition-colors">
    </div>`;
};

/* Ô chọn địa giới: nhìn y như input ở trên (h-10, viền, r2) nhưng là button
   mở bottom sheet — cùng cách PDP thay <select> bằng sheet chọn size.
   label[for] + id trên button: bấm vào nhãn cũng mở được sheet, và trình đọc
   màn hình đọc được tên của nút (trước đây nút chỉ có mỗi chữ giá trị bên
   trong). aria-haspopup="dialog" báo trước là bấm sẽ mở hộp thoại. */
const pickField = (label, ph, key, val) => `
    <div class="px-4 py-2 flex flex-col gap-2.5">
      <label for="pk-${key}" class="text-[14px] font-medium leading-5 text-foreground">${label}</label>
      <div class="relative">
        <button type="button" id="pk-${key}" data-pick="${key}" aria-haspopup="dialog" class="w-full h-10 bg-background border border-border rounded-xs pl-2 pr-9 text-[14px] text-left flex items-center btn-o press transition-colors focus:border-primary">
          <span class="pick-label truncate ${val ? 'text-foreground' : 'text-muted-foreground'}">${val || ph}</span>
        </button>
        <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">${I.chevD('var(--general-primary)')}</span>
      </div>
    </div>`;

/* Thẻ chọn cửa hàng — KHÔNG dùng chung richRadio vì richRadio gộp phần phụ
   thành MỘT dòng: địa chỉ và giờ mở cửa sẽ dính nhau ở cùng cỡ chữ với tên
   cửa hàng, và cả chuỗi gộp trở thành một text node nên i18n không dịch nổi.
   Ở đây tách 3 dòng theo đúng thứ bậc: tên (14 Medium) · địa chỉ (13
   #262626) · giờ (13 #737373, tách "Mở cửa" thành span riêng để dịch được).
   Vỏ ngoài giữ nguyên .opt/.radio + data-opt để handler và CSS trạng thái
   đang có chạy y nguyên. */
function storeOpt(name, addr, hours, on) {
  return `
  <button type="button" role="radio" aria-checked="${on}" class="opt ${on ? 'on' : ''} w-full flex items-start gap-2 border border-border bg-background rounded-xs p-3 text-left btn-o press" data-opt="store:${name}">
    <span class="radio ${on ? 'on' : ''} w-4 h-4 mt-0.5 rounded-full border border-border-3 flex items-center justify-center shrink-0">
      <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
    </span>
    <span class="flex-1 min-w-0">
      <span class="block text-[14px] font-medium leading-5 text-foreground">${name}</span>
      <span class="block pt-0.5 text-[13px] leading-5 text-secondary-foreground">${addr}</span>
      <span class="block text-[13px] leading-5 text-muted-foreground"><span>Mở cửa</span> <span>${hours}</span></span>
    </span>
  </button>`;
}

/* ── Bước "Nhận tại cửa hàng" — HIỆN DẦN theo tiến độ chọn ──
   1) dropdown Thành phố → 2) DANH SÁCH cửa hàng của thành phố đó (thẻ chọn
   như phương thức vận chuyển, không phải dropdown) → 3) các ô nhập của người
   nhận. Mỗi phần chỉ hiện khi phần trước đã chọn xong, nên không đập vào mặt
   một form dài ngay từ đầu; dòng "Bước n/3" nói trước còn mấy chặng.
   Đổi thành phố = xoá cửa hàng đang chọn, nên phần 2 và 3 tự thu lại — nhưng
   chữ đã gõ vẫn còn vì 3 ô nhập đọc/ghi vào state (ckName/ckPhone/ckEmail). */
function ckPickupOpen() {
  const step = !ckCity ? 'Bước 1/3 · Chọn thành phố'
             : !ckStore ? 'Bước 2/3 · Chọn cửa hàng'
             : 'Bước 3/3 · Thông tin người nhận';
  const stores = ckCity ? storesOf(ckCity) : [];
  return `
    <div class="px-4 pt-3">
      <p class="text-[12px] leading-4 text-muted-foreground">${step}</p>
    </div>
    ${pickField('Thành phố','Chọn thành phố','city', ckCity)}
    ${!ckCity ? `
    <div class="px-4 pb-2">
      <p class="text-[13px] leading-5 text-muted-foreground">Chọn thành phố để xem các cửa hàng DAFC có thể nhận hàng.</p>
    </div>` : `
    <div id="ckStoreGroup" class="px-4 py-2 flex flex-col gap-2.5">
      <div class="flex items-baseline justify-between">
        <span id="storeOptsLbl" class="text-[14px] font-medium leading-5 text-foreground">Cửa hàng</span>
        <span class="text-[13px] leading-5 text-muted-foreground">${stores.length} cửa hàng</span>
      </div>
      <div id="storeOpts" role="radiogroup" aria-labelledby="storeOptsLbl" class="flex flex-col gap-3">
        ${stores.map(([name, addr, hours]) => storeOpt(name, addr, hours, name === ckStore)).join('')}
      </div>
    </div>`}
    ${ckStore ? `
    <div id="ckRecipient">
      <div class="px-4 pt-4 pb-1">
        <p class="text-[12px] leading-4 tracking-wide text-muted-foreground">Thông tin người nhận</p>
      </div>
      ${field('Họ và tên','Nhập họ và tên','', { val: ckName, key: 'name', auto: 'name' })}
      ${field('Số điện thoại','0 1234 5678','tel', { val: ckPhone, key: 'phone', auto: 'tel' })}
      ${field('Email','Nhập email','email', { val: ckEmail, key: 'email', auto: 'email' })}
      ${pickField('Tỉnh thành sinh sống','Chọn tỉnh / thành phố','home', ckHome)}
      <div class="px-4 pt-2">
        <p class="text-[13px] leading-5 text-secondary-foreground">Đơn hàng được giữ tại cửa hàng trong 3 ngày kể từ khi có thông báo sẵn sàng nhận.</p>
      </div>
      <div class="px-4 py-4">
        <button class="ck-next w-full h-12 rounded-xs bg-primary text-primary-foreground text-[16px] btn-p press flex items-center justify-center" data-next="1" data-require="store">Xác nhận</button>
      </div>
    </div>` : ''}`;
}

/* Dựng lại nguyên màn checkout tại chỗ — dùng khi CẤU TRÚC đổi (đổi hình thức
   nhận hàng, chọn xong thành phố, chọn cửa hàng lần đầu). Lặp lại đúng các
   bước dọn dẹp của go() trừ phần history. */
function rerenderCheckout(root) {
  scrollCleanups.forEach(fn => fn());
  scrollCleanups = [];
  root.innerHTML = RENDER.checkout();
  wire(root);
  localizeNew(root);
}

function screenCHECKOUT() {
  /* Đã đặt hàng rồi mà quay lại (back vật lý) thì KHÔNG vẽ form nữa — trước
     đây bấm "Đặt hàng" lần nữa là ra đơn thứ hai, không cảnh báo gì. */
  if (ckPlaced) return `
  <div class="w-full" data-scroller>
    ${navBar({ logoOnly: true })}
    <div class="px-4 py-10 flex flex-col items-center text-center gap-3">
      <div class="w-12 h-12 rounded-full border border-primary text-primary flex items-center justify-center">${I.tick}</div>
      <p class="text-[18px] font-medium leading-7 text-foreground">Đơn ${ckOrderId} đã được đặt</p>
      <p class="text-[14px] leading-5 text-muted-foreground">Đơn hàng đang được xử lý. Bạn không cần đặt lại.</p>
      <div class="w-full flex flex-col gap-2 pt-2">
        <button data-order="0" class="w-full h-12 rounded-xs bg-primary text-primary-foreground text-[16px] btn-p press">Xem chi tiết đơn hàng</button>
        <button data-nav="plp" data-reset class="w-full h-12 rounded-xs border border-border bg-background text-foreground text-[14px] font-medium btn-o press">Tiếp tục mua sắm</button>
      </div>
    </div>
  </div>`;

  /* ── VÀO CHECKOUT LÀ LUÔN MỞ BƯỚC "VẬN CHUYỂN" (chốt 19/08/2026, yêu cầu user:
     "từ checkout vào cart, dù đăng nhập rồi hay chưa đều phải trả về trang chọn
     vận chuyển hay chọn mua tại cửa hàng").
     Trước đây mọi lối đăng nhập đều đặt `ckStep = 1`. Đó là DI SẢN từ hồi section
     0 là ĐỊA CHỈ — người đã đăng nhập có sẵn địa chỉ nên nhảy qua là hợp lý.
     Nhưng section 0 nay là "Vận chuyển", CHỨA CẶP TAB giao hàng / nhận tại cửa
     hàng — không đăng nhập nào trả lời thay được. Hệ quả cũ: bấm Đặt hàng ở giỏ
     là rơi thẳng vào "Phương thức vận chuyển", mất luôn chỗ chọn nhận tại cửa hàng.
     Nay: mọi lối đăng nhập/đăng ký để `ckStep = 0`, và chính nút Đặt hàng ở giỏ
     cũng ép `ckStep = 0` trước khi go('checkout') — kể cả lượt quay lại giỏ rồi
     vào lại.
     GIỮ `ckMaxStep`: các bước đã hoàn tất vẫn hiện dạng tóm tắt + "Thay đổi",
     nên quay lại giỏ rồi vào lại KHÔNG mất dữ liệu đã nhập.
     Guard dưới đây vẫn cần cho chế độ nhận tại cửa hàng: chưa chọn cửa hàng thì
     không được coi bước nào là xong. */
  if (ckMode === 'pickup' && !ckStore) { ckStep = 0; ckMaxStep = 0; }

  const notice = ckAuth
    ? `<p class="text-[14px] leading-5 text-foreground">Đăng nhập tài khoản <b class="font-medium">UserOne</b></p>`
    : `<p class="text-[14px] font-medium leading-5 text-foreground">Bạn đang thanh toán không đăng nhập</p>
       <p class="text-[14px] leading-5 text-foreground">Đăng nhập và hoàn tất đơn hàng để nhận ngay <b class="font-medium">${rewardPointsEarned().toLocaleString('vi-VN')} điểm thưởng</b></p>
       <button data-nav="login" class="self-start text-[14px] font-medium leading-5 text-foreground underline press">Đăng nhập</button>`;

  /* Cặp nút Giao hàng / Nhận tại cửa hàng — nằm ĐẦU thân section "Vận chuyển"
     (đồng bộ desktop, yêu cầu user 14/08/2026; trước đó toggle đứng lẻ trên
     nhóm section). px-4 thẳng hàng nội dung section; id giữ nguyên để
     paintCheckout ẩn khi đã tới bước Thanh toán. */
  const modeTabs = `
    <div id="ckModeTabs" class="px-4 pt-1 pb-4">
      ${segToggle('data-ck-mode', [['ship','Giao hàng'], ['pickup','Nhận tại cửa hàng']], ckMode, 'h-10')}
    </div>`;

  /* ── Section 0: Thông tin giao hàng ──
     Khách ĐÃ ĐĂNG NHẬP thì mở ra là sổ địa chỉ đã lưu (chọn 1 chạm là xong
     bước này), cuối danh sách mới là "Thêm địa chỉ mới" xổ form 6 ô. Khách
     vãng lai vẫn thấy form ngay như cũ. */
  const addrForm = `
    ${field('Tên','Nhập tên','', { val: ckShipName, key: 'sname', auto: 'given-name' })}
    ${field('Họ','Nhập họ')}
    ${field('Số điện thoại','0 1234 5678','tel', { val: ckShipPhone, key: 'sphone', auto: 'tel' })}
    ${pickField('Tỉnh , thành phố','Chọn tỉnh / thành phố','province', ckProvince)}
    ${pickField('Phường xã','Chọn phường / xã','ward', ckWard)}
    ${field('Địa chỉ','Số nhà, tên đường','', { val: ckShipLine, key: 'saddr', auto: 'street-address' })}
    <div class="px-4 pt-1">
      <label class="flex items-center gap-2 press">
        <span class="chk on w-4 h-4 rounded-xs border border-border-3 flex items-center justify-center" data-check>${I.tick}</span>
        <span class="text-[14px] leading-5 text-foreground">Lưu vào sổ địa chỉ</span>
      </label>
    </div>`;
  const s0open = ckAuth ? `
    <div class="px-4 py-2 flex flex-col gap-3" id="addrOpts">
      ${ADDRESSES.map((a, i) => `
      <button class="opt ${ckAddr === i ? 'on' : ''} w-full flex items-start gap-2 border border-border bg-background rounded-xs p-3 text-left btn-o press" data-addr="${i}">
        <span class="radio ${ckAddr === i ? 'on' : ''} w-4 h-4 mt-0.5 rounded-full border border-border-3 flex items-center justify-center shrink-0">
          <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
        </span>
        <span class="flex-1 min-w-0">
          <span class="block text-[14px] font-medium leading-5 text-foreground">${a.name} · ${a.phone}${a.def ? ' <span class="text-[11px] font-normal text-muted-foreground">(Mặc định)</span>' : ''}</span>
          <span class="block text-[13px] leading-5 text-secondary-foreground">${a.line}</span>
        </span>
      </button>`).join('')}
      <button class="opt ${ckAddr === 'new' ? 'on' : ''} w-full flex items-center gap-2 border border-border bg-background rounded-xs p-3 text-left btn-o press" data-addr="new">
        <span class="radio ${ckAddr === 'new' ? 'on' : ''} w-4 h-4 rounded-full border border-border-3 flex items-center justify-center shrink-0">
          <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
        </span>
        <span class="text-[14px] font-medium leading-5 text-foreground">+ Thêm địa chỉ mới</span>
      </button>
    </div>
    ${ckAddr === 'new' ? addrForm : ''}
    <div class="px-4 py-4">
      <button class="ck-next w-full h-12 rounded-xs bg-primary text-primary-foreground text-[16px] btn-p press flex items-center justify-center" data-next="1">Xác nhận</button>
    </div>` : `
    ${addrForm}
    <div class="px-4 py-4">
      <button class="ck-next w-full h-12 rounded-xs bg-primary text-primary-foreground text-[16px] btn-p press flex items-center justify-center" data-next="1">Xác nhận</button>
    </div>`;
  const s0done = `<div id="ckShipDone" class="px-4 py-2 flex flex-col gap-1">${ckShipDoneHTML()}</div>`;

  /* ── Section 0 bản NHẬN TẠI CỬA HÀNG ──
     Thứ tự thao tác: thành phố -> cửa hàng trong thành phố đó -> người nhận.
     Ô cửa hàng chỉ mở được sau khi có thành phố (chặn trong wireAddressPickers),
     giống ràng buộc tỉnh -> phường của luồng giao hàng.
     Khối #ckStoreInfo và #ckStoreDone cập nhật TẠI CHỖ khi chọn xong cửa hàng
     (paintStore) — không dựng lại cả màn để khỏi mất trạng thái đang gõ. */
  const st = storeInfo(ckStore);
  const storeLines = s => s ? `
    <p class="text-[13px] leading-5 text-secondary-foreground">${s.addr}</p>
    <p class="text-[13px] leading-5 text-muted-foreground"><span>Mở cửa</span> <span>${s.hours}</span></p>` : '';
  const p0open = `<div id="ckPickupBody">${ckPickupOpen()}</div>`;
  const p0done = `<div id="ckStoreDone" class="px-4 py-2 flex flex-col gap-1">${ckStoreDoneHTML()}</div>`;

  /* ── Section 1: Phương thức vận chuyển ── */
  /* Đơn có hàng pre-order: ETA chung của phương thức vận chuyển KHÔNG đúng cho
     món đặt trước — không nhắc là checkout đang hứa "14–18/07" cho món 30/09.
     Nhắc đúng tại chỗ khách đọc thời gian giao (cả lúc chọn lẫn tóm tắt đã
     xác nhận). Demo chỉ có 1 SP pre-order nên lấy ngày món đầu tiên tìm thấy. */
  const preDate = (cartSelected().find(c => c.preorder) || {}).preorder;
  const preNote = preDate ? `<p class="text-[12px] leading-4 text-foreground-alt">Riêng hàng pre-order: nhận hàng dự kiến ${preDate}, giao riêng khi hàng về.</p>` : '';
  const s1open = `
    <!-- Figma: mỗi thẻ nằm trong khung padding 8/16 -> cách nhau 16; nhóm thanh
         toán thì các thẻ chung một khung gap 12 (xem #payOpts). -->
    <div id="shipOpts" class="px-4 py-2 flex flex-col gap-4">
      ${richRadio('std','Giao hàng thông thường - Miễn Phí', ETA, true)}
      ${richRadio('fast','Giao hàng nhanh - 25,000đ', ETA, false)}
      ${preNote}
    </div>
    <div class="px-4 py-4">
      <button class="ck-next w-full h-12 rounded-xs bg-primary text-primary-foreground text-[16px] btn-p press flex items-center justify-center" data-next="2">Xác nhận</button>
    </div>`;
  const s1done = `
    <div class="px-4 py-2 flex flex-col gap-1">
      <p id="shipDoneLabel" class="text-[14px] font-medium leading-5 text-foreground">Giao hàng thông thường</p>
      <p class="text-[14px] leading-5 text-foreground">${ETA}</p>

/* Vẽ lại trạng thái mở / thu gọn / chờ của 3 section */
function paintCheckout(root) {
  root.querySelectorAll('.ck-sec').forEach(sec => {
    const i = +sec.dataset.sec;
    // đang mở > đã từng xong (kể cả section nằm SAU section đang sửa) > chưa tới
    const state = i === ckStep ? 'open' : (i <= ckMaxStep ? 'done' : 'pending');
    sec.querySelector('.ck-open').classList.toggle('is-open', state === 'open');
    sec.querySelector('.ck-done').classList.toggle('is-open', state === 'done');
    // bước chưa tới: hàng tiêu đề cao 72 thay vì 56 (xem .ck-sec.is-pending)
    sec.classList.toggle('is-pending', state === 'pending');
    sec.querySelector('.ck-title').style.opacity = state === 'pending' ? '0.4' : '1';
    const chg = sec.querySelector('.ck-change');
    chg.style.display = state === 'done' ? '' : 'none';
  });
  /* Tới bước Thanh toán thì ẩn cặp Giao hàng / Nhận tại cửa hàng: lúc này hình
     thức nhận hàng đã chốt, để đó chỉ tổ bấm nhầm — mà đổi tab là ckStep về 0,
     tức mất sạch bước vừa làm. Muốn đổi thì bấm "Thay đổi" ở section trên, lúc
     đó cặp nút hiện lại. Bước Thanh toán là section 1 ở luồng nhận tại cửa
     hàng (chỉ 2 section) và section 2 ở luồng giao hàng. */
  const tabs = root.querySelector('#ckModeTabs');
  if (tabs) tabs.classList.toggle('hidden', ckMaxStep >= (ckMode === 'pickup' ? 1 : 2));

  /* Section đang mở mà TRƯỚC ĐÓ đã xong rồi thì đây là lần sửa lại: nút đổi
     nhãn "Lưu thay đổi" và bấm xong nhảy thẳng về bước xa nhất, không bắt đi
     lại từng bước. Đặt ở paintCheckout vì nhãn phụ thuộc trạng thái. */
  const openSec = root.querySelector(`.ck-sec[data-sec="${ckStep}"] .ck-next`);
  if (openSec) {
    openSec.textContent = ckMaxStep > ckStep ? 'Lưu thay đổi' : 'Xác nhận';
    localizeNew(openSec);
  }
}

    const score = c.s < NEUTRAL_S ? Math.abs(f.l - c.l) : hueGap(f) + 60 * Math.abs(f.l - c.l);

function matchProducts(list, labels) {
  const brands = labels.filter(l => FILTER_BRANDS.includes(l));
  const colors = labels.filter(l => FILTER_COLORS.some(([n]) => n === l));
  const flags  = labels.filter(l => FILTER_FLAGS.includes(l));
  const sizes  = labels.filter(l => FILTER_VOLUMES.includes(l));
  const promos = labels.filter(l => FILTER_PROMOS.includes(l));
  return list.filter(({ p }) => {
    if (brands.length && !brands.includes(p.brand)) return false;
    if (colors.length) {
      const buckets = (p.colors || []).map(c => colorBucketOf(c.hex));
      if (!colors.some(c => buckets.includes(c))) return false;
    }
    if (flags.includes('Đang giảm giá') && !p.off) return false;
    if (flags.includes('Hàng mới về') && !/new/i.test(p.tag || '')) return false;
    /* Dung tích LỌC THẬT: 8 sản phẩm beauty trong PRODUCTS có field `sizes` trùng
       khít FILTER_VOLUMES. (Size quần áo/giày thì vẫn không lọc được — PRODUCTS
       không mang size thời trang, chỉ PDP_DATA có.) */
    if (sizes.length) {
      const has = p.sizes || [];
      if (!sizes.some(v => has.includes(v))) return false;
    }
    /* Ưu đãi LỌC THẬT theo mức giảm — xem PROMO_RANGES. Tick nhiều ô là HỢP
       (OR) như mọi facet khác, và các khoảng không chồng nhau nên không đếm
       trùng. Data hiện có: 6 SP giảm 10-30%, 2 SP nguyên giá; 3 khoảng sâu hơn
       chưa có SP nào -> tick vào ra lưới rỗng kèm empty state, đúng như mọi
       facet không khớp khác. */
    if (promos.length) {
      const pct = discountPct(p);
      const hit = promos.some(l => {
        const r = PROMO_RANGES[l];
        return r ? (pct >= r[0] && pct < r[1]) : pct === 0;
      });
      if (!hit) return false;
    }
    return true;
  });
}

const fsubRow = (label, depth, toggle = '') => `
          <div class="flex gap-1 h-9">
            ${frail(depth)}
            <button class="flex items-center gap-2 flex-1 min-w-0 press text-left" data-sub="${label}">
              ${fchk(false)}
              <span class="text-[14px] leading-5 text-foreground-alt truncate">${label}</span>
            </button>
            ${toggle}
          </div>`;

/* Accordion cấp 1 (Danh mục / Thương hiệu / …) */
/* `open` mặc định FALSE = MỌI mục đóng sẵn khi mở bộ lọc (chốt 19/08/2026,
   yêu cầu user: "filter mặc định closed hết"). Trước đây 6/7 mục mở sẵn nên
   panel dài lê thê, phải cuộn mới thấy hết tên các mục.
   Cấp con của Danh mục (.fcat) và cấp 3 (.fsub) VỐN ĐÃ đóng sẵn, không đụng. */
function fSection(title, body, open = false, h = 72) {
  return `
  <div class="facc ${open ? 'open' : ''}" data-facc="${title}">
    <button class="facc-trigger w-full px-4 flex items-center justify-between press" style="height:${h}px">
      <span class="text-[16px] font-light leading-6 text-foreground">${title}</span>
      <span class="facc-ico">${IcoMinus}</span>
      <span class="facc-ico-plus hidden">${IcoPlus}</span>
    </button>
    <div class="facc-body"><div class="acc-inner">${body}</div></div>
  </div>`;
}

/* ── Thân bộ lọc — dựng lại mỗi khi đổi ngành hàng ──────────────────────
   PLP Làm đẹp và PLP thời trang không dùng chung facet: trang nước hoa mà
   vẫn hiện "Giày dép", size 39–55 hay bảng màu da/nâu là vô nghĩa. Nên:
   · Danh mục: beauty đưa THẲNG 8 nhóm beauty lên cấp 1 (không lồng thêm 1
     cấp "Làm đẹp" thừa), thời trang giữ 6 nhóm còn lại;
   · Kích thước ⇄ Dung tích (50/75/100 ml);
   · beauty bỏ Màu sắc, thêm Ưu đãi (nguyên sheet "Promo" của file Excel).
   Vỏ sheet (backdrop / header / footer) dựng 1 lần, chỉ #filterBody thay. */
function filterBody(beauty) {
  /* ── Danh mục: cha + con (con mặc định ĐÓNG) ── */
  const catSrc = beauty
    ? (FILTER_CATS.find(([c]) => c === 'Làm đẹp') || ['', []])[1]
    : FILTER_CATS.filter(([c]) => c !== 'Làm đẹp');
  const cats = catSrc.map(([cat, subs], i) => `
    <div class="fcat" data-cat="${i}">
      <div class="h-11 flex items-center gap-2 pt-2">
        <button class="fcat-check flex items-center gap-2 flex-1 min-w-0 press text-left" data-flabel="${cat}">
          ${fchk(false)}
          <span class="text-[14px] leading-5 text-foreground-alt truncate">${cat}</span>
        </button>
        <button class="fcat-toggle w-4 h-4 flex items-center justify-center press shrink-0">
          <span class="fcat-ico-plus">${IcoPlus}</span>
          <span class="fcat-ico-minus hidden">${IcoMinus}</span>
        </button>
      </div>
      <div class="fcat-body"><div class="acc-inner">
        ${subs.map((sub, si) => {
          const hasKids = Array.isArray(sub);
          const label = hasKids ? sub[0] : sub;
          const kids = hasKids ? sub[1] : null;
          if (!hasKids) return fsubRow(label, 1);
          return `
          <div class="fsub" data-sub-parent="${i}-${si}">
            ${fsubRow(label, 1, `
              <button class="fsub-toggle w-4 h-4 flex items-center justify-center press shrink-0 self-center">
                <span class="fsub-ico-plus">${IcoPlus}</span>
                <span class="fsub-ico-minus hidden">${IcoMinus}</span>
              </button>`)}
            <div class="fsub-body"><div class="acc-inner">
              ${kids.map(k => fsubRow(k, 2)).join('')}
            </div></div>
          </div>`;
        }).join('')}
      </div></div>
    </div>`).join('');

  /* KHÔNG pre-tick thương hiệu nào — từ khi bộ lọc lọc thật, 2 ô tick sẵn cho
     đẹp ảnh làm số kết quả mở ra đã là 0. */
  const brands = FILTER_BRANDS.map(b => `
    <button class="h-9 w-full flex items-center gap-2 pr-4 press text-left" data-brand="${b}">
      ${fchk(false)}
      <span class="text-[14px] leading-5 text-foreground-alt truncate">${b}</span>
    </button>`).join('');

  /* Màu: CHỌN NHIỀU (12/08/2026), mở ra không ô nào được chọn (trước đây chọn-1
     và ô đầu bị tô sẵn). Viền dùng token thay hex cứng. */
  const colors = FILTER_COLORS.map(([name, hex]) => `
    <button class="fcolor w-16 flex flex-col items-center gap-2 press shrink-0" data-color="${name}">
      <span class="fcolor-ring w-10 h-10 rounded-full flex items-center justify-center border border-border">
        <span class="w-8 h-8 rounded-full ${hex === '#ffffff' ? 'border border-border-3' : ''}" style="background:${hex}"></span>
      </span>
      <span class="fcolor-label text-[12px] leading-4 text-muted-foreground">${name}</span>
    </button>`).join('');

  /* chip dung tích dùng đúng class .fsize để tái dụng luôn handler chọn nhiều.
     w-full vì container là grid 5 cột (sizeGrid), không còn flex-wrap.
     data-size = NHÃN LỌC ĐẦY ĐỦ (không lấy textContent — tránh dịch EN làm trượt,
     và tránh trùng số giữa nhóm: '11' nhẫn ≠ 'Size US 11' ≠ 'Size UK 11'). */
  const chips = (arr, prefix = '') => arr.map(s => `
    <button class="fsize chip w-full h-9 px-1 rounded-xs border border-border bg-background text-[14px] font-medium text-foreground btn-o press" data-size="${prefix}${s}">${s}</button>`).join('');
  /* Tối đa 5 ô/dòng — giống lưới size ở PDP (repeat(5,1fr)) */
  const sizeGrid = inner => `<div class="px-4 pb-6 grid gap-2" style="grid-template-columns:repeat(5,1fr)">${inner}</div>`;
  const volumes = chips(FILTER_VOLUMES);
  /* Nhóm size theo sheet "Size" — MỖI NHÓM LÀ MỘT MỤC ĐÓNG/MỞ, tái dùng nguyên
     khuôn .fcat của cây Danh mục (CSS 0fr/1fr + ico ± + wiring .fcat-toggle đều
     ăn sẵn, không thêm cơ chế mới). "Giày dép" mang class open = mở sẵn khi bấm
     vào Kích thước; nhãn nhóm .fsg-label = nhãn cấp 2 của panel (skin-mt hoa+500).
     Giày dép render qua shoeUnitInner() — 3 tab đơn vị (dấu đang chọn = gạch chân
     2px §3.1) + lưới theo đơn vị. */
  /* Nhãn nhóm (chốt cuối 20/08 tối, sau 2 vòng chỉnh của user): NGANG HÀNG
     tiêu đề mục ở 16 (không thụt — vòng thụt 32 đã bỏ), chữ thường 12 mực nội
     dung theo khuôn hàng cate — KHÔNG hoa (theo §1.1 bỏ hoa thì bỏ cả 500).
     Lưới trong nhóm pb-2; khoảng thở đáy mục do wrapper pb-4 ở fSection lo —
     nhóm cuối đóng hay mở đều ra đáy đều nhau. */
  const sizeGroups = FILTER_SIZE_GROUPS.map(([g, arr]) => `
    <div class="fcat fsize-group ${g === 'Giày dép' ? 'open' : ''}">
      <button class="fcat-toggle w-full h-11 px-4 pt-2 flex items-center justify-between press text-left">
        <span class="fsg-label text-[14px] leading-5 text-foreground-alt">${g}</span>
        <span class="w-4 h-4 flex items-center justify-center shrink-0">
          <span class="fcat-ico-plus">${IcoPlus}</span>
          <span class="fcat-ico-minus hidden">${IcoMinus}</span>
        </span>
      </button>
      <div class="fcat-body"><div class="acc-inner">
        ${arr
          ? `<div class="px-4 pt-2 pb-2 grid gap-2" style="grid-template-columns:repeat(5,1fr)">${chips(arr, 'Size ')}</div>`
          : `<div id="shoeUnitWrap">${shoeUnitInner()}</div>`}
      </div></div>
    </div>`).join('');
  const promos  = FILTER_PROMOS.map(t => `
    <button class="h-9 w-full flex items-center gap-2 press text-left" data-other="${t}">${fchk(false)}<span class="text-[14px] leading-5 text-foreground-alt">${t}</span></button>`).join('');

  const price = `
    <div class="px-4 pb-6 flex flex-col gap-6">
      <div class="flex items-end gap-3">
        <label class="flex-1 flex flex-col gap-1">
          <span class="text-[12px] leading-4 text-muted-foreground">Từ</span>
          <input inputmode="numeric" value="0" class="h-9 bg-background border border-border rounded-xs px-2 text-[14px] outline-none focus:border-primary transition-colors">
        </label>
        <span class="w-2.5 h-px bg-[#e0e0e0] mb-4"></span>
        <label class="flex-1 flex flex-col gap-1">
          <span class="text-[12px] leading-4 text-muted-foreground">Đến</span>
          <input inputmode="numeric" value="50,000,000" class="h-9 bg-background border border-border rounded-xs px-2 text-[14px] outline-none focus:border-primary transition-colors">
        </label>
      </div>
      <div class="flex flex-col gap-3">
        <div class="relative h-4 flex items-center">
          <span class="absolute inset-x-0 h-1.5 rounded-full bg-border-3"></span>
          <span class="absolute left-0 h-1.5 rounded-full bg-primary" style="width:28%"></span>
          <span class="absolute left-0 w-3.5 h-3.5 rounded-full bg-background border-2 border-primary"></span>
          <span class="absolute w-3.5 h-3.5 rounded-full bg-background border-2 border-primary" style="left:28%"></span>
        </div>
        <div class="flex justify-between text-[14px] leading-5 text-muted-foreground"><span>0đ</span><span>50,000,000đ</span></div>
      </div>
    </div>`;

  return `
    ${fSection('Danh mục', `<div class="px-4 pb-4">${cats}</div>`)}
    ${fSection('Thương hiệu', `<div class="px-4 pb-6">${brands}</div>`)}
    ${beauty ? '' : fSection('Màu sắc', `<div class="pt-2 px-4 pb-4 flex flex-wrap gap-2">${colors}</div>`, false, 56)}
    ${beauty
      ? fSection('Dung tích', sizeGrid(volumes))
      : fSection('Kích thước', `<div class="pb-4">${sizeGroups}</div>`)}
    ${fSection('Khoảng giá', price)}
    ${fSection('Ưu đãi', `<div class="px-4 pb-6 flex flex-col gap-1">${promos}</div>`)}
    ${fSection('Khác', `<div class="px-4 pb-6 flex flex-col gap-1">
      ${['Chỉ hàng có sẵn','Đang giảm giá','Hàng mới về'].map(t => `
        <button class="h-9 w-full flex items-center gap-2 press text-left" data-other="${t}">${fchk(false)}<span class="text-[14px] leading-5 text-foreground-alt">${t}</span></button>`).join('')}
    </div>`, false)}`;
}

/* Khối "Giày dép" trong panel Kích thước: 3 tab đơn vị + lưới size của đơn vị
   đang chọn. Tách hàm vì đổi đơn vị chỉ re-render #shoeUnitWrap, không dựng lại
   cả thân bộ lọc; chip đang tick của đơn vị cũ tự reset theo DOM mới (chưa Áp
   dụng nên không đụng plpFilters). Nhãn IT/EU · US · UK là mã — data-i18n-skip. */
function shoeUnitInner() {
  const tabs = FILTER_SHOE_UNITS.map(([u]) => `
    <button class="shoe-unit press ${u === shoeUnit
        ? 'text-foreground border-b-2 border-primary'
        : 'text-muted-foreground'}" data-unit="${u}" data-i18n-skip>
      <span class="text-[14px] leading-5">${u}</span>
    </button>`).join('');
  const arr = (FILTER_SHOE_UNITS.find(([u]) => u === shoeUnit) || ['', []])[1];
  const chip = s => `
    <button class="fsize chip w-full h-9 px-1 rounded-xs border border-border bg-background text-[14px] font-medium text-foreground btn-o press" data-size="Size ${shoeUnit} ${s}">${s}</button>`;
  /* Nhịp trong nhóm: nhãn nhóm → nội dung = 8px (pt-2, lưới 4px của panel) —
     khớp khe pt-2 của lưới nhóm "Khác"; tab → lưới = 12px (pb-3). */
  /* Ngang hàng 16 như nhãn nhóm (chốt cuối 20/08 tối — vòng thụt 32 đã bỏ). */
  return `
    <div class="px-4 pt-2 pb-3 flex gap-6">${tabs}</div>
    <div class="px-4 pb-2 grid gap-2" style="grid-template-columns:repeat(5,1fr)">${arr.map(chip).join('')}</div>`;
}

/* Vỏ sheet — dựng 1 lần lúc khởi động, #filterBody để trống chờ render. */
function filterSheet() {
  return `
  <div id="filterSheet">
    <div class="fs-backdrop"></div>
    <div class="fs-panel">
      <!-- grabber -->
      <div class="h-6 flex items-center justify-center shrink-0"><span class="w-10 h-1 rounded-full bg-border"></span></div>
      <!-- header -->
      <div class="px-4 py-4 flex items-center justify-between shrink-0">
        <p class="text-[18px] font-medium leading-7 text-foreground">Bộ lọc</p>
        <button id="filterClose" class="w-8 h-8 -mr-2 flex items-center justify-center press">${IcoCross}</button>
      </div>
      <!-- body -->
      <div id="filterBody" class="flex-1 overflow-y-auto overscroll-contain"></div>
      <!-- footer -->
      <!-- Đặt lại: CHỈ hiện khi đã áp dụng bộ lọc trước đó (plpFilters không rỗng).
           Áp dụng: kèm SỐ KẾT QUẢ, cập nhật mỗi lần tick — số lấy từ matchProducts()
           nên khớp đúng lưới. (KHÔNG dùng backtick trong comment: template literal.) -->
      <div class="shrink-0 bg-background px-4 pt-4 safe-b flex gap-3">
        <button id="filterReset" class="hidden h-12 px-6 rounded-xs bg-background border border-border text-[16px] text-foreground btn-o press shrink-0">Đặt lại</button>
        <button id="filterApply" class="h-12 flex-1 rounded-xs bg-primary text-primary-foreground text-[16px] btn-p press">Áp dụng<span id="filterApplyCount"></span></button>
      </div>
    </div>
  </div>`;
}

/* Chỉ dựng lại thân khi ĐỔI ngành hàng — mở lại bộ lọc trong cùng ngành thì
   giữ nguyên các ô đang tick. */
let filterMode = null;
function renderFilterBody() {
  const sh = document.getElementById('filterSheet');
  if (!sh) return;
  const mode = isBeautyPlp() ? 'beauty' : 'fashion';
  if (filterMode === mode) return;
  sh.querySelector('#filterBody').innerHTML = filterBody(mode === 'beauty');
  filterMode = mode;
  wireFilterBody(sh);
  localizeNew(sh);
  pruneFiltersToBody();
}

/* Đổi ngành hàng là facet đổi theo: thời trang có Màu sắc / Kích thước, beauty có
   Dung tích / Ưu đãi. Nhãn đã áp mà ngành mới KHÔNG có ô tương ứng phải bị bỏ —
   nếu giữ, nó vẫn lọc lưới trong khi người dùng không thấy đâu mà tắt (thực tế:
   áp màu Đen ở thời trang rồi sang beauty -> lưới 0 sản phẩm, nút Áp dụng vẫn
   báo tổng, không có manh mối nào về nguyên nhân). */
/* Nhãn hợp lệ cho MỘT ngành hàng — thuần dữ liệu, không cần DOM của sheet. Phải
   không-cần-DOM vì prune bắt buộc chạy lúc ĐIỀU HƯỚNG; bản trước đọc DOM nên chỉ
   chạy được khi mở drawer, tức nhãn mồ côi vẫn lọc lưới suốt từ lúc vào trang tới
   lúc user tình cờ mở bộ lọc (áp màu Đen ở thời trang rồi sang beauty -> lưới 0
   sản phẩm, không manh mối). */
function facetLabelsFor(beauty) {
  const out = new Set(FILTER_BRANDS);
  ['Chỉ hàng có sẵn', 'Đang giảm giá', 'Hàng mới về'].forEach(t => out.add(t));
  FILTER_PROMOS.forEach(t => out.add(t));   // mục Ưu đãi nay có ở MỌI ngành hàng
  if (beauty) {
    FILTER_VOLUMES.forEach(v => out.add(v));
  } else {
    FILTER_COLORS.forEach(([n]) => out.add(n));
    FILTER_SIZES.forEach(v => out.add('Size ' + v));
  }
  return out;
}
/* Bỏ nhãn không còn facet ở ngành hiện tại. Gọi cả lúc điều hướng (goPlp) lẫn lúc
   dựng lại thân sheet. Trả về true nếu có thay đổi. */
function pruneFilters() {
  if (!plpFilters.length) return false;
  const ok = facetLabelsFor(isBeautyPlp());
  const kept = plpFilters.filter(l => ok.has(l));
  if (kept.length === plpFilters.length) return false;
  plpFilters = kept;
  return true;
}
function pruneFiltersToBody() {
  if (!pruneFilters()) return;
  if (window.syncFilterToDom) syncFilterToDom();
  renderPlpGrid(document);
}

function sizeChartHTML() {
  const table = t => {
    const head = t.type === 'table'
      ? `<thead><tr><th colspan="${t.span || 1}">${t.head[0]}</th>${t.head.slice(1).map(h => `<th>${h}</th>`).join('')}</tr></thead>`

    const body = (t.head && t.type === 'matrix' ? t.rows.slice(1) : t.rows).map(row => t.type === 'matrix'
      ? `<tr><th scope="row">${row[0]}</th>${row.slice(1).map(c => `<td>${c}</td>`).join('')}</tr>`
      : `<tr>${row.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    return `
      <div class="flex flex-col gap-2">
        <p class="text-[13px] font-medium leading-5 text-foreground">${t.name}</p>
        <div class="szc-wrap"><table class="szc">${head}<tbody>${body}</tbody></table></div>
      </div>`;
  };
  return `
    <div class="flex flex-col gap-6">
      <p class="text-[12px] leading-4 text-secondary-foreground"><b class="font-medium text-foreground">Lưu ý:</b> ${SIZE_CHART_NOTE}</p>
      ${SIZE_CHART.map(([group, tables]) => `
        <div class="flex flex-col gap-4">
          <p class="text-[14px] font-medium leading-5 tracking-wide text-foreground">${group}</p>
          ${tables.map(table).join('')}
        </div>`).join('')}
    </div>`;
}

/* ── mở / đóng ── */
function openFilter() {
  const sh = document.getElementById('filterSheet');
  renderFilterBody();          // PLP nào thì facet nấy
  sh.classList.add('open');
  /* Mở ra luôn phản ánh trạng thái ĐÃ ÁP: tick nào không nằm trong plpFilters bị
     bỏ. Trước đây chỉ gọi syncFilterFooter nên tick "mồ côi" (tick rồi đóng bằng
     ✕/backdrop, không Áp dụng) sống mãi — mở lại thấy tick, số kết quả tính theo
     tick nên lệch hẳn với lưới, mà nút Đặt lại lại ẩn vì plpFilters vẫn rỗng. */
  if (window.syncFilterToDom) syncFilterToDom();
  else if (window.syncFilterFooter) syncFilterFooter();
  lockBodyScroll();
}
function closeFilter() {
  const sh = document.getElementById('filterSheet');
  sh.classList.remove('open');
  unlockBodyScroll();
}

/* ── gắn sự kiện (chạy 1 lần) ── */
function wireFilter() {
  const sh = document.getElementById('filterSheet');
  if (!sh) return;

  /* Nhãn đang tick — nguồn cho plpFilters và cho số kết quả trên nút Áp dụng */
  const pickedLabels = () => {
    const out = [];
    const add = t => { t = (t || '').trim(); if (t && !out.includes(t)) out.push(t); };
    /* Lấy nhãn từ ATTRIBUTE, không lấy textContent: khi LANG='en' text đã bị dịch
       ("Đang giảm giá" -> "On sale") nên matchProducts so với FILTER_FLAGS/FILTER_BRANDS
       tiếng Việt sẽ trượt và bộ lọc câm lặng. applyLang không đụng tới attribute. */
    sh.querySelectorAll('[data-sub] .chk.on, [data-brand] .chk.on, [data-other] .chk.on, .fcat-check .chk.on')
      .forEach(chk => {
        const btn = chk.parentElement;
        add(btn.dataset.sub || btn.dataset.brand || btn.dataset.other || btn.dataset.flabel
            || btn.querySelector('span:not(.chk)')?.textContent);
      });
    sh.querySelectorAll('.fcolor.on').forEach(b => add(b.dataset.color));
    /* Chip dung tích (beauty) DÙNG CHUNG class .fsize với chip size thời trang.
       Nhãn lấy từ data-size (nhãn lọc đầy đủ, 20/08: 'Size S' · 'Size US 11' ·
       '100 ml') — không lấy textContent vì text trùng số giữa các nhóm và bị
       dịch khi LANG='en'. */
    sh.querySelectorAll('.fsize.on').forEach(b => {
      const v = (b.dataset.size || '').trim() || b.textContent.trim();
      add(v);
    });
    return out;
  };
  /* Chân sheet: số kết quả (theo nhãn ĐANG TICK, chưa áp) + hiện/ẩn Đặt lại
     (theo plpFilters, tức đã áp trước đó). */
  window.syncFilterFooter = () => {
    const cnt = sh.querySelector('#filterApplyCount');
    if (cnt) cnt.textContent = ` (${matchProducts(plpProducts(), pickedLabels()).length})`;
    sh.querySelector('#filterReset').classList.toggle('hidden', plpFilters.length === 0);
  };
  /* Đẩy plpFilters NGƯỢC vào DOM. Cần vì nút "Xóa tất cả bộ lọc" ở empty state nằm
     NGOÀI sheet: nó xoá plpFilters nhưng các ô trong sheet vẫn còn tick, mở lại là
     thấy tick không còn hiệu lực và số kết quả lệch hẳn với lưới. */
  window.syncFilterToDom = () => {
    const has = t => plpFilters.includes((t || '').trim());
    sh.querySelectorAll('[data-sub], [data-brand], [data-other], .fcat-check').forEach(btn => {
      const lbl = btn.dataset.sub || btn.dataset.brand || btn.dataset.other || btn.dataset.flabel
                  || btn.querySelector('span:not(.chk)')?.textContent;
      btn.querySelector('.chk')?.classList.toggle('on', has(lbl));
    });
    sh.querySelectorAll('.fcolor').forEach(b => setColorChip(b, has(b.dataset.color)));
    sh.querySelectorAll('.fsize').forEach(b => {
      const on = has((b.dataset.size || '').trim() || b.textContent.trim());
      b.classList.toggle('on', on);
      b.classList.toggle('border-primary', on);
      b.classList.toggle('border-border', !on);
    });
    syncFilterFooter();
  };

  sh.querySelector('.fs-backdrop').addEventListener('click', closeFilter);
  sh.querySelector('#filterClose').addEventListener('click', closeFilter);
  sh.querySelector('#filterApply').addEventListener('click', () => {
    plpFilters = pickedLabels();
    closeFilter();
    renderPlpGrid(document);
    toast(plpFilters.length ? `Áp dụng ${plpFilters.length} bộ lọc` : 'Đã bỏ hết bộ lọc');
  });
  sh.querySelector('#filterReset').addEventListener('click', () => {
    sh.querySelectorAll('.chk.on').forEach(c => c.classList.remove('on'));
    sh.querySelectorAll('.fsize.on').forEach(c => { c.classList.remove('on'); c.classList.replace('border-primary', 'border-border'); });
    sh.querySelectorAll('.fcolor.on').forEach(b => setColorChip(b, false));
    plpFilters = [];
    renderPlpGrid(document);
    syncFilterFooter();
    toast('Đã đặt lại bộ lọc');
  });
  sh.addEventListener('click', () => setTimeout(() => { if (window.syncFilterFooter) syncFilterFooter(); }, 0));

  renderFilterBody();
}

/* Handler thuộc THÂN — gọi lại sau mỗi lần render lại #filterBody. */
function wireFilterBody(sh) {
  // accordion cấp 1
  sh.querySelectorAll('.facc-trigger').forEach(t =>
    t.addEventListener('click', () => t.closest('.facc').classList.toggle('open')));

  // cấp cha: mở/đóng cấp con
  sh.querySelectorAll('.fcat-toggle').forEach(t =>
    t.addEventListener('click', () => t.closest('.fcat').classList.toggle('open')));

  // cấp con: mở/đóng cấp 3 (vd: "Áo sơ mi & áo kiểu" -> Sơ mi kiểu, Áo kiểu...)
  sh.querySelectorAll('.fsub-toggle').forEach(t =>
    t.addEventListener('click', () => t.closest('.fsub').classList.toggle('open')));

  // checkbox cha: tick cả cấp con
  sh.querySelectorAll('.fcat-check').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.closest('.fcat');
      const on = !btn.querySelector('.chk').classList.contains('on');
      cat.querySelectorAll('.chk').forEach(c => c.classList.toggle('on', on));
    });
  });

  // checkbox lẻ
  sh.querySelectorAll('[data-sub], [data-brand], [data-other]').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.querySelector('.chk').classList.toggle('on');
      const cat = btn.closest('.fcat');
      if (cat) {   // đồng bộ trạng thái cha
        const subs = [...cat.querySelectorAll('[data-sub] .chk')];
        const parent = cat.querySelector('.fcat-check .chk');
        parent.classList.toggle('on', subs.length > 0 && subs.every(c => c.classList.contains('on')));
      }
    });
  });

  // màu
  // màu — CHỌN NHIỀU: mỗi ô tự bật/tắt, không xoá lựa chọn của ô khác
  sh.querySelectorAll('.fcolor').forEach(b => {
    b.addEventListener('click', () => setColorChip(b, !b.classList.contains('on')));
  });

  // size (chọn nhiều) — tách hàm để re-wire được riêng #shoeUnitWrap khi đổi đơn vị
  const wireSizeChips = scope => scope.querySelectorAll('.fsize').forEach(b => {
    b.addEventListener('click', () => {
      const on = b.classList.toggle('on');
      b.classList.toggle('border-primary', on);
      b.classList.toggle('border-border', !on);
    });
  });
  wireSizeChips(sh);

  // bộ chọn đơn vị size giày (IT/EU · US · UK): đổi đơn vị = render lại đúng
  // khối #shoeUnitWrap rồi wire lại tab + chip bên trong nó
  const wireShoeUnits = scope => scope.querySelectorAll('.shoe-unit').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.unit === shoeUnit) return;
      shoeUnit = b.dataset.unit;
      const wrap = sh.querySelector('#shoeUnitWrap');
      if (!wrap) return;
      wrap.innerHTML = shoeUnitInner();
      wireShoeUnits(wrap);
      wireSizeChips(wrap);
      if (window.syncFilterFooter) syncFilterFooter();
    });
  });
  wireShoeUnits(sh);
}

function screenPOLICY(key) {

  const body = txt => txt.split('\n').map(line => {

  }).join('');

  <div class="w-full" data-scroller>

           fi-tr-angle-down 3479:46946 cạnh nhóm 3 frame). Cần dropdown vì 3
           pill cộng lại 447px > 358px vùng nội dung, tab cuối luôn bị cắt.

           này — cả khối nằm trong template literal, backtick sẽ đứt string):
           class .rise kết thúc bằng

function sortedProducts() {
  /* lọc trước, sắp sau — số trên nút Áp dụng dùng cùng matchProducts() nên khớp */
  const list = matchProducts(plpProducts(), plpFilters);
  const priceNum = p => Number(String(p.price).replace(/[^\d]/g, ''));
  if (plpSort === 'newest') list.reverse();
  else if (plpSort === 'bestseller') list.sort((a, b) => (a.p.tag === 'Best seller' ? -1 : 0) - (b.p.tag === 'Best seller' ? -1 : 0));
  else if (plpSort === 'price-asc') list.sort((a, b) => priceNum(a.p) - priceNum(b.p));
  else if (plpSort === 'price-desc') list.sort((a, b) => priceNum(b.p) - priceNum(a.p));
  return list;
}

function refreshSearchHistory(root) {
  const box = root.querySelector('#searchHistoryBox');
  if (!box) return;
  box.innerHTML = searchHistoryHTML();
  wireSearchPane(root, box);
  localizeNew(box);
  // tiêu đề khối trending đổi theo còn/hết lịch sử tìm kiếm
  const t = root.querySelector('#trendTitle');
  if (t) {
    t.textContent = searchHistory.length ? 'Sản phẩm nổi bật' : 'Trending item';
    localizeNew(t.parentElement);

}

function wireSearchPane(root, pane) {
  wireProductCards(pane);
  pane.querySelectorAll('img.lazy').forEach(img => {
    if (img.complete) img.classList.add('loaded');
    else img.addEventListener('load', () => img.classList.add('loaded'));
  });
  pane.querySelectorAll('[data-suggest]').forEach(btn => {
    btn.addEventListener('click', () => {
      const term = btn.dataset.suggest;
      if (!searchHistory.includes(term)) searchHistory = [term, ...searchHistory].slice(0, 8);
      searchQuery = term;
      // Results = PLP grid (Figma 02—PLP): mở màn kết quả tìm kiếm
      goPlp({ type: 'search', query: term, title: `Kết quả tìm kiếm của “${term}”` });
    });
  });
  pane.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      // thu gọn dòng mượt rồi mới cập nhật danh sách
      const row = btn.closest('.search-row');
      if (!row) return;
      row.style.height = row.offsetHeight + 'px';
      void row.offsetWidth;
      row.classList.add('removing');
      row.style.height = '0px';
      // fallback timeout: transitionend không bắn khi tab ẩn / reduced-motion
      let removed = false;
      const finish = () => {
        if (removed) return;
        removed = true;
        searchHistory = searchHistory.filter(h => h !== btn.dataset.remove);
        refreshSearchHistory(root);
      };
      row.addEventListener('transitionend', ev => { if (ev.propertyName === 'height') finish(); });
      setTimeout(finish, 350);
    });
  });
}

function wireProductCards(root) {
  root.querySelectorAll('[data-product]').forEach(el => {
    el.addEventListener('click', e => {
      const qa = e.target.closest('.quick-add');
      if (qa) {
        const idx = +qa.dataset.quick, ci = +(el.dataset.color || 0);
        const kind = SIZE_SHEET_BY_PRODUCT[idx];
        if (kind && window.__openSizeSheet) {
          // ctx cho size sheet biết đang thêm SP nào / màu nào / bay từ ảnh nào
          window.__openSizeSheet(kind, '', null, { idx, ci, img: el.querySelector('img') });
        } else if (window.__openQuickAdd) {
          window.__openQuickAdd(idx, ci, el.querySelector('img'));
        }
        return;
      }
      go(el.dataset.product === '1' ? 'pdp2' : el.dataset.product === '2' ? 'pdp3' : el.dataset.product === '3' ? 'pdp4' : el.dataset.product === '4' ? 'pdp5' : el.dataset.product === '5' ? 'pdp6' : 'pdp');  // SP#2..6 -> bản riêng
    });
  });

  /* Đổi màu ngay trên card PLP — không phải vào PDP mới xem được màu khác.
     Ảnh lấy từ PRODUCT_GALLERY: phần tử thứ ci ứng với colors[ci] (xem chú
     thích ở PRODUCT_GALLERY). Sản phẩm chưa có bộ ảnh riêng thì chỉ dời vòng
     chọn, giữ nguyên ảnh — thà không đổi còn hơn đổi sang ảnh sai màu.
     Màu đang chọn ghim vào data-color của card để quick add mở đúng màu đó.
     Nằm trong wireProductCards (không phải wire) vì lưới PLP còn được dựng
     lại khi đổi sắp xếp / bấm "Show more" — chỗ đó chỉ gọi hàm này. */
  root.querySelectorAll('[data-swatches]').forEach(rw => {
    const card = rw.closest('[data-product]');
    if (!card) return;
    const idx = +card.dataset.product;
    rw.addEventListener('click', ev => {
      const btn = ev.target.closest('.cw');
      if (!btn) return;
      ev.stopPropagation();          // chạm ô màu thì đừng mở PDP
      rw.querySelectorAll('.cw').forEach(c => {
        const on = c === btn;
        c.classList.toggle('ring-1', on);
        c.classList.toggle('ring-primary', on);
        c.classList.toggle('ring-offset-2', on);
        c.classList.toggle('ring-0', !on);
        c.classList.toggle('ring-offset-0', !on);
      });
      const ci = +btn.dataset.cw;
      card.dataset.color = ci;
      const src = (PRODUCT_GALLERY[idx] || [])[ci];
      const img = card.querySelector('img');
      if (!src || !img || img.getAttribute('src') === A + src) return;
      img.style.transition = 'opacity .18s ease';
      img.style.opacity = '0';
      setTimeout(() => {
        const show = () => { img.style.opacity = '1'; };
        img.src = A + src;
        if (img.complete) show(); else img.addEventListener('load', show, { once: true });
      }, 180);
    });
  });
}

function renderPlpGrid(root) {
  const grid = root.querySelector('#plpGrid');
  if (!grid) return;
  /* Badge thẻ đầu: đọc từ DATA (`p.preorder`) chứ không phải "thẻ số 0 thì New"
     — SP#1 là hàng pre-order, để "New" ở PLP thì bấm vào PDP lại thấy
     "Pre-order", 2 nơi nói 2 chuyện (yêu cầu user 17/08/2026). */
  const card = (p, i) => productCard(p, i, { badge: p.preorder ? 'Pre-order' : '', pillBadges: i === 3 ? ['New Season', 'La Vacanza'] : null });
  const list = sortedProducts();
  grid.innerHTML = plpGridInner(list, card);
  if (list.length) wireProductCards(grid);
  localizeNew(grid);
  updatePlpCount(root, list.length);
}

const I18N_REV = Object.fromEntries(Object.entries(I18N).map(([k, v]) => [v, k]));

function tr(t, to) {
  const dict  = to === 'en' ? I18N : I18N_REV;
  const rules = to === 'en' ? I18N_RE : I18N_REV_RE;
  if (dict[t]) return dict[t];
  for (const [re, rep] of rules) if (re.test(t)) return t.replace(re, rep);
  return null;
}

function applyLang(root, to) {
  if (!root) return;
  /* [data-i18n-skip] = wordmark giữ nguyên ở MỌI ngôn ngữ (badge "Pre-order"…).
     Phải chặn ở đây vì dịch ngược EN→VN tra I18N_REV theo text node: badge
     "Pre-order" trùng chuỗi với nút "Đặt trước" đã dịch nên bị kéo theo. */
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement && n.parentElement.closest('[data-i18n-skip]')
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const raw = n.nodeValue, t = raw.trim();
    if (!t) return;
    const out = tr(t, to);
    if (out) n.nodeValue = raw.replace(t, out);
  });
  root.querySelectorAll && root.querySelectorAll('[placeholder]').forEach(e => {
    const out = tr(e.placeholder, to); if (out) e.placeholder = out;
  });
  root.querySelectorAll && root.querySelectorAll('[data-toast]').forEach(e => {
    const out = tr(e.dataset.toast, to); if (out) e.dataset.toast = out;
  });
  root.querySelectorAll && root.querySelectorAll('[aria-label]').forEach(e => {
    const out = tr(e.getAttribute('aria-label'), to); if (out) e.setAttribute('aria-label', out);
  });
}

// gọi sau mỗi lần render màn mới
function localizeNew(el) { if (LANG === 'en') applyLang(el, 'en'); }

function rerenderLogin() {

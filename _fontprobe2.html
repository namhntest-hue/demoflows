<meta charset="utf-8">
<title>probe2</title>
<pre id="out" style="font:11px monospace;white-space:pre-wrap">…</pre>
<script>
const FAM=["Montserrat","Faustina","Source Serif 4","Spectral","Literata","Crimson Pro","Newsreader",
"EB Garamond","Bitter","Vollkorn","Familjen Grotesk","Archivo","Work Sans","Chivo","Hanken Grotesk",
"Inter","Public Sans","Mona Sans","Geist","Playfair Display","Cormorant Garamond","Lora","Be Vietnam Pro","Petrona"];
FAM.forEach(f=>{const l=document.createElement("link");l.rel="stylesheet";
 l.href="https://fonts.googleapis.com/css2?family="+f.replace(/ /g,"+")+":wght@400;500&display=block";
 document.head.appendChild(l);});
const cv=document.createElement("canvas");cv.width=900;cv.height=600;
const cx=cv.getContext("2d",{willReadFrequently:true});
const SZ=400; // big size => 1 px = 0.25% em
function colProfile(fam,ch,colFrac){
  cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle="#000";cx.textBaseline="alphabetic";
  cx.font="400 "+SZ+"px '"+fam+"'";cx.fillText(ch,20,500);
  const mm=cx.measureText(ch);const x=Math.round(20+mm.width*colFrac);
  const d=cx.getImageData(x,0,1,cv.height).data;
  const segs=[];let cur=null;
  for(let y=0;y<cv.height;y++){const on=d[y*4+3]>110;
    if(on&&!cur){cur={y0:y};}else if(!on&&cur){cur.y1=y;segs.push(cur);cur=null;}}
  if(cur){cur.y1=cv.height;segs.push(cur);}
  return segs;
}
function pct(v){return Math.round(v/SZ*1000)/10;}      // % of em
function at12(v){return Math.round(v/SZ*12*100)/100;}  // px at 12px
// ₫ present? compare ink bitmap of the glyph against fallback rendering
function inkHash(font,ch){
  cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle="#000";cx.textBaseline="alphabetic";
  cx.font=font;cx.fillText(ch,20,300);
  const d=cx.getImageData(0,0,400,400).data;let s=0,n=0;
  for(let i=3;i<d.length;i+=4){if(d[i]>110){s+=i;n++;}}
  return n+":"+s;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{
 const res={};
 for(const fam of FAM){
  let ok=false;
  for(let k=0;k<10;k++){
   try{await document.fonts.load("400 "+SZ+"px '"+fam+"'","ếằữộ₫ấẤđ");
       await document.fonts.load("500 "+SZ+"px '"+fam+"'","ếằữộ₫ấẤđ");}catch(e){}
   cx.font="400 100px '"+fam+"'"; const w1=cx.measureText("ếằữ").width;
   cx.font="400 100px '__nope__'"; const w2=cx.measureText("ếằữ").width;
   if(document.fonts.check("400 100px '"+fam+"'","ếằữ") && Math.abs(w1-w2)>0.5){ok=true;break;}
   await sleep(400);
  }
  const o={vn_ok:ok};
  for(const [nm,ch] of [["e_hat_acute","ế"],["a_breve_grave","ằ"],["u_horn_tilde","ữ"],["A_hat_acute","Ấ"]]){
    const segs=colProfile(fam,ch,ch==="ữ"?0.35:0.5);
    o[nm+"_segs"]=segs.map(s=>pct(s.y1-s.y0)).join("/");
    const gaps=[];for(let i=1;i<segs.length;i++)gaps.push(segs[i].y0-segs[i-1].y1);
    o[nm+"_gaps_pct"]=gaps.map(pct).join("/");
    o[nm+"_gaps_at12"]=gaps.map(at12).join("/");
    if(segs.length>=2){
      o[nm+"_mark_gap_at12"]=at12(segs[1].y0-segs[0].y1);
      o[nm+"_mark1_at12"]=at12(segs[0].y1-segs[0].y0);
      o[nm+"_mark2_at12"]=at12(segs[1].y1-segs[1].y0);
      o[nm+"_cluster_pct"]=pct(segs[1].y1-segs[0].y0);
    }
  }
  const a=inkHash("400 "+SZ+"px '"+fam+"'","₫"), b=inkHash("400 "+SZ+"px '__nope__'","₫");
  o.dong_real = a!==b;
  const a2=inkHash("400 "+SZ+"px '"+fam+"'","đ");
  o.dbar_real = a2!==inkHash("400 "+SZ+"px '__nope__'","đ");
  res[fam]=o;
 }
 window.__R=res;document.title="done";
 document.getElementById("out").textContent=JSON.stringify(res);
})();
</script>

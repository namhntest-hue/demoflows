/* 26/08/2026 thêm 2 tham số theo feedback khách: `gender` ('Nam' | 'Nữ' | null)
   quyết định cây danh mục (điểm 4), `heel` = có DỰNG mục Độ cao giày hay không
   (điểm 3 — chỉ ngữ cảnh NỮ, xem heelSection()). Cả 2 do renderFilterBody tính từ
   breadcrumb PLP, và cùng nằm trong khoá `filterMode`: dựng là hiện luôn, không còn
   trạng thái ẩn nào. */
function filterBody(beauty, gender, heel) {
  /* ── Danh mục: cha + con (con mặc định ĐÓNG) ── */
  const catSrc = beauty ? beautyCatTree() : catTreeFor(gender);
  const cats = catSrc.map(([cat, subs], i) => `
    <div class="fcat" data-cat="${i}">
      <div class="flex items-center gap-2 pt-4 pb-2">
        <button class="fcat-check flex items-center gap-2 flex-1 min-w-0 press text-left" data-flabel="${cat}">
          ${fchk(false)}
          <span class="text-[14px] leading-5 text-foreground-alt truncate">${cat}</span>
        </button>
        <button class="fcat-toggle w-4 h-4 flex items-center justify-center press shrink-0">
          <span class="fcat-ico-plus">${IcoPlus}</span>
          <span class="fcat-ico-minus hidden">${IcoMinus}</span>
        </button>
      </div>
      <div class="fcat-body"><div class="acc-inner">
        ${subs.map((sub, si) => {
          /* ĐÚNG 1 product type TRÙNG TÊN sub-cate thì KHÔNG dựng cấp 3 — feedback
             khách 26/08 điểm 5 (khách chốt: "ẩn mục con nếu trùng tên và chỉ có 1
             loại"): sheet có ~15 dòng kiểu "Túi xách tay > Túi xách tay", mở "+" ra
             chỉ thấy lại đúng cái tên vừa bấm, nhãn lọc trùng y nguyên. Nhánh NHIỀU
             con mà có 1 con trùng tên cha ("Túi tote > Túi tote · Túi shopper") thì
             GIỮ "+": bỏ con đi là mất lối chọn riêng tote. */
          const same = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
          const hasKids = Array.isArray(sub) && !(sub[1].length === 1 && same(sub[1][0], sub[0]));
          const label = Array.isArray(sub) ? sub[0] : sub;
          const kids = hasKids ? sub[1] : null;
          if (!hasKids) return fsubRow(label, 1);
          return `
          <div class="fsub" data-sub-parent="${i}-${si}">
            ${fsubRow(label, 1, `
              <button class="fsub-toggle w-4 h-4 flex items-center justify-center press shrink-0 self-center">
                <span class="fsub-ico-plus">${IcoPlus}</span>
                <span class="fsub-ico-minus hidden">${IcoMinus}</span>
              </button>`)}
            <div class="fsub-body"><div class="acc-inner">
              ${kids.map(k => fsubRow(k, 2)).join('')}
            </div></div>
          </div>`;
        }).join('')}
      </div></div>
    </div>`).join('');

  /* KHÔNG pre-tick thương hiệu nào (trước đây tick sẵn 2 ô cho đẹp ảnh). Từ khi
     bộ lọc lọc thật + nút Áp dụng đếm kết quả, 2 ô tick sẵn đó làm số kết quả mở
     ra đã là 0 và nút Đặt lại mất ý nghĩa. */
  /* Ô TÌM THƯƠNG HIỆU (27/08/2026, lệnh user). Danh sách 24 nhà mốt và còn dài
     ra — cuộn tay tìm một cái tên là việc phải làm mỗi lần mở mục này.
     Lọc NGAY TRÊN DOM (ẩn/hiện hàng) chứ không dựng lại danh sách: hàng nào đang
     tick vẫn giữ nguyên trạng thái, khỏi phải đồng bộ lại với plpFilters.
     So sánh sau khi BỎ DẤU + thường hoá nên gõ "montblanc" hay "MONT" đều ra. */
  const brandSearch = `
    <div class="pb-2">
      <input id="fBrandSearch" type="search" autocomplete="off" placeholder="Tìm thương hiệu" aria-label="Tìm thương hiệu"
        class="w-full h-9 bg-background border border-border rounded-xs px-2 text-[14px] outline-none focus:border-primary transition-colors">
    </div>`;
  const brands = FILTER_BRANDS.map(b => `
    <button class="w-full flex items-center gap-2 py-2 pr-4 press text-left" data-brand="${b}">
      ${fchk(false)}
      <span class="text-[14px] leading-5 text-foreground-alt truncate">${b}</span>
    </button>`).join('');

  /* Màu: CHỌN NHIỀU (12/08/2026). Trước đây là chọn-1 và ô đầu bị tô sẵn, phải
     dùng cờ `dataset.colorPicked` để phân biệt "tô sẵn" với "người dùng đã chọn"
     — bỏ luôn cờ đó vì giờ mở ra không ô nào được chọn. */
  /* 26/08: bảng lên 15 ô nên đổi flex-wrap (ô cứng w-16) sang LƯỚI 4 CỘT — 15 ô
     rơi đúng 4 hàng đều cột, và ô rộng ~80px mới đủ cho nhãn dài nhất
     ("Xanh dương") ở 12px; lưới 5 cột như panel size thì nhãn đó bị cắt. */
  const colors = FILTER_COLORS.map(([name, hex]) => `
    <button class="fcolor w-full flex flex-col items-center gap-2 press" data-color="${name}">
      <span class="fcolor-ring w-10 h-10 rounded-full flex items-center justify-center border border-border">
        <span class="w-8 h-8 rounded-full ${hex === '#ffffff' ? 'border border-border-3' : ''}" style="background:${hex}"></span>
      </span>
      <span class="fcolor-label text-[12px] leading-4 text-muted-foreground truncate max-w-full">${name}</span>
    </button>`).join('');

  /* chip dung tích dùng đúng class .fsize để tái dụng luôn handler chọn nhiều.
     w-full vì container là grid 5 cột (xem `sizeGrid`), không còn flex-wrap.
     data-size = NHÃN LỌC ĐẦY ĐỦ ('Size S' · 'Size US 11' · '100 ml') — không lấy
     textContent: tránh trùng số giữa nhóm và tránh vỡ khi LANG='en'. */
  const chips = (arr, prefix = '') => arr.map(s => `
    <button class="fsize chip w-full h-9 px-1 rounded-xs border border-border bg-background text-[14px] font-medium text-foreground btn-o press" data-size="${prefix}${s}">${s}</button>`).join('');
  /* Tối đa 5 ô/dòng — giống lưới size ở PDP (index.html: repeat(5,1fr)) */
  const sizeGrid = inner => `<div class="px-4 pb-6 grid gap-2" style="grid-template-columns:repeat(5,1fr)">${inner}</div>`;
  const volumes = chips(FILTER_VOLUMES);
  /* Nhóm size đóng/mở — đồng bộ index.html: khuôn .fcat, MỌI nhóm ĐÓNG sẵn và
     Quần áo đứng trước Giày dép (user 26/08 chiều).
     Nhãn nhóm (chốt cuối 20/08 tối): NGANG HÀNG 16, chữ thường 12 mực nội dung —
     không hoa/không 500 (§1.1); vòng thụt 32 đã bỏ theo lời user.
     Lưới pb-2; đáy mục do wrapper pb-4 ở fSection lo. */
  const sizeGroups = sizeGroupsFor(gender).map(([g, arr]) => `
    <div class="fcat fsize-group">
      <button class="fcat-toggle w-full px-4 pt-4 pb-2 flex items-center justify-between press text-left">
        <span class="fsg-label text-[14px] leading-5 text-foreground-alt">${g}</span>
        <span class="w-4 h-4 flex items-center justify-center shrink-0">
          <span class="fcat-ico-plus">${IcoPlus}</span>
          <span class="fcat-ico-minus hidden">${IcoMinus}</span>
        </span>
      </button>
      <div class="fcat-body"><div class="acc-inner">
        ${arr
          ? `<div class="px-4 pt-2 pb-2 grid gap-2" style="grid-template-columns:repeat(5,1fr)">${chips(arr, 'Size ')}</div>`
          : `<div id="shoeUnitWrap">${shoeUnitInner()}</div>`}
      </div></div>
    </div>`).join('');
  const promos  = FILTER_PROMOS.map(t => `
    <button class="w-full flex items-center gap-2 py-2 pr-4 press text-left" data-other="${t}">${fchk(false)}<span class="text-[14px] leading-5 text-foreground-alt">${t}</span></button>`).join('');
  /* Độ cao giày — hàng checkbox dùng `data-other` để ăn sẵn handler tick +
     pickedLabels + syncFilterToDom, không thêm cơ chế mới. matchProducts nhận nhãn
     này rồi so với FILTER_HEELS nên nó LỌC THẬT. */
  const heels = FILTER_HEELS.map(([t]) => `
    <button class="w-full flex items-center gap-2 py-2 pr-4 press text-left" data-other="${t}">${fchk(false)}<span class="text-[14px] leading-5 text-foreground-alt">${t}</span></button>`).join('');
  /* MỤC LỚN, CÙNG CẤP với Danh mục / Thương hiệu / Màu sắc / Kích thước (chốt lại
     26/08 chiều: "nó cùng level của Kích thước luôn, nhưng nằm vị trí dưới Kích
     thước và trên Khoảng giá"). Nên nó đi qua fSection() như mọi mục khác — cùng
     hàng tiêu đề 12/16 hoa của bộ da, cùng đóng/mở bằng ±, cùng nhịp kẻ.
     Vị trí trong return: ngay sau Kích thước, ngay trước Khoảng giá.
     (Bản dựng khối-trần `.fheel` giữa lượt đã bỏ — mình hiểu sai "ngoài mục lớn".) */

  const price = `
    <div class="px-4 pb-6 flex flex-col gap-6">
      <!-- w-full + min-w-0 BẮT BUỘC: input không khai bề rộng thì flex giữ
           min-width nội tại (~178px), 2 ô cộng lại rộng hơn panel — mục Khoảng
           giá tràn ngang (lỗi (c) đã ghi trong FIGMA-FILTER.md, index dính rõ
           nhất ở sheet 375). -->
      <div class="flex items-end gap-3">
        <label class="flex-1 min-w-0 flex flex-col gap-1">
          <span class="text-[12px] leading-4 text-muted-foreground">Từ</span>
          <input inputmode="numeric" value="0" class="w-full min-w-0 h-9 bg-input border border-border rounded-xs px-2 text-[14px] outline-none focus:border-primary transition-colors">
        </label>
        <span class="w-2.5 h-px bg-border mb-4 shrink-0"></span>
        <label class="flex-1 min-w-0 flex flex-col gap-1">
          <span class="text-[12px] leading-4 text-muted-foreground">Đến</span>
          <input inputmode="numeric" value="50,000,000" class="w-full min-w-0 h-9 bg-input border border-border rounded-xs px-2 text-[14px] outline-none focus:border-primary transition-colors">
        </label>
      </div>
      <div class="flex flex-col gap-3">
        <div class="relative h-4 flex items-center">
          <span class="absolute inset-x-0 h-1.5 rounded-full bg-border-3"></span>
          <span class="absolute left-0 h-1.5 rounded-full bg-primary" style="width:28%"></span>
          <span class="absolute left-0 w-3.5 h-3.5 rounded-full bg-background border-2 border-primary"></span>
          <span class="absolute w-3.5 h-3.5 rounded-full bg-background border-2 border-primary" style="left:28%"></span>
        </div>
        <div class="flex justify-between text-[14px] leading-5 text-muted-foreground"><span>0đ</span><span>50,000,000đ</span></div>
      </div>
    </div>`;

  return `
    ${fSection('Danh mục', `<div class="px-4 pb-4">${cats}</div>`, false, 24, 'cat')}
    ${fSection('Thương hiệu', `<div class="px-4 pb-6">${brandSearch}<div id="fBrandList">${brands}</div><p id="fBrandEmpty" class="hidden pt-2 text-[14px] leading-5 text-muted-foreground">Không tìm thấy thương hiệu</p></div>`, false, 24, 'brand')}
    ${beauty ? '' : fSection('Màu sắc', `<div class="pt-2 px-4 pb-4 grid gap-2" style="grid-template-columns:repeat(4,1fr)">${colors}</div>`)}
    ${beauty
      ? fSection('Dung tích', sizeGrid(volumes))
      : fSection('Kích thước', `<div class="pb-4">${sizeGroups}</div>`)}
    ${heel ? fSection('Độ cao giày', `<div class="px-4 pb-6 flex flex-col gap-1">${heels}</div>`) : ''}
    ${fSection('Khoảng giá', price)}
    ${fSection('Ưu đãi', `<div class="px-4 pb-6 flex flex-col gap-1">${promos}</div>`)}
    ${fSection('Khác', `<div class="px-4 pb-6 flex flex-col gap-1">
      ${['Chỉ hàng có sẵn','Đang giảm giá','Hàng mới về'].map(t => `
        <button class="w-full flex items-center gap-2 py-2 pr-4 press text-left" data-other="${t}">${fchk(false)}<span class="text-[14px] leading-5 text-foreground-alt">${t}</span></button>`).join('')}
    </div>`, false)}`;
}

/* Vỏ drawer — dựng 1 lần lúc khởi động, #filterBody để trống chờ render. */
function filterSheet() {
  return `
  <div id="filterSheet">
    <div class="fs-backdrop"></div>
    <div class="fs-panel">
      <!-- header (Figma _Component-FilterSheet-Full: tiêu đề + ✕, gạch ngăn bên dưới;
           bản desktop là drawer nên bỏ thanh grabber của bottom-sheet mobile) -->
      <div class="px-4 py-4 flex items-center justify-between shrink-0 border-b border-border">
        <p class="text-[18px] font-medium leading-7 text-foreground">Bộ lọc</p>
        <button id="filterClose" class="w-8 h-8 -mr-2 flex items-center justify-center press">${IcoCross}</button>
      </div>
      <div id="filterBody" class="flex-1 overflow-y-auto overscroll-contain"></div>
      <!-- Đặt lại: CHỈ hiện khi đã áp dụng bộ lọc trước đó (plpFilters không rỗng)
           — mở drawer lần đầu thì không có gì để đặt lại nên ẩn hẳn (class hidden,
           syncFilterFooter() bật/tắt). Áp dụng: kèm SỐ KẾT QUẢ, cập nhật ngay
           mỗi lần tick — số này lấy từ matchProducts() nên khớp đúng lưới.
           (KHÔNG dùng backtick trong comment này — cả khối là template literal.) -->
      <div class="shrink-0 bg-background border-t border-border px-4 pt-4 safe-b flex gap-3">
        <button id="filterReset" class="hidden h-12 px-6 rounded-xs bg-background border border-border text-[16px] text-foreground btn-o press shrink-0">Đặt lại</button>
        <button id="filterApply" class="h-12 flex-1 rounded-xs bg-primary text-primary-foreground text-[16px] btn-p press">Áp dụng<span id="filterApplyCount"></span></button>
      </div>
    </div>
  </div>`;
}

/* Chỉ dựng lại thân khi ĐỔI ngành hàng — mở lại bộ lọc trong cùng ngành thì
   giữ nguyên các ô đang tick. */
/* 26/08: KHOÁ mode nay gồm cả GIỚI TÍNH — cây danh mục Nam và Nữ khác nhau
   (feedback #4) nên đi từ PLP nam sang PLP nữ PHẢI dựng lại thân, không thì panel
   còn nguyên cây của giới tính trước. Mục Độ cao giày KHÔNG vào khoá: nó dựng
   theo giới tính (đã có trong khoá) rồi ẩn/hiện tại chỗ. */
let filterMode = null;
function renderFilterBody() {
  const sh = document.getElementById('filterSheet');
  if (!sh) return;
  const beauty = isBeautyPlp(), gender = plpGender();
  const mode = `${beauty ? 'beauty' : 'fashion'}:${gender || 'all'}`;
  if (filterMode === mode) return;
  sh.querySelector('#filterBody').innerHTML = filterBody(beauty, gender, heelSection());
  filterMode = mode;
  wireFilterBody(sh);
  localizeNew(sh);
  pruneFiltersToBody();
}

/* Đổi ngành hàng là facet đổi theo: thời trang có Màu sắc / Kích thước, beauty có
   Dung tích / Ưu đãi. Nhãn đã áp mà ngành mới KHÔNG có ô tương ứng phải bị bỏ —
   nếu giữ, nó vẫn lọc lưới trong khi người dùng không thấy đâu mà tắt (thực tế:
   áp màu Đen ở thời trang rồi sang beauty -> lưới 0 sản phẩm, nút Áp dụng vẫn
   báo tổng, không có manh mối nào về nguyên nhân). */
/* Nhãn hợp lệ cho MỘT ngành hàng — thuần dữ liệu, không cần DOM của sheet. Phải
   không-cần-DOM vì prune bắt buộc chạy lúc ĐIỀU HƯỚNG; bản trước đọc DOM nên chỉ
   chạy được khi mở drawer, tức nhãn mồ côi vẫn lọc lưới suốt từ lúc vào trang tới
   lúc user tình cờ mở bộ lọc (áp màu Đen ở thời trang rồi sang beauty -> lưới 0
   sản phẩm, không manh mối). */
/* 26/08 bổ sung 2 việc cùng lượt feedback:
   · NHÃN DANH MỤC nay cũng vào set — cây Nam và Nữ khác nhau (điểm 4) nên tick
     "Đầm dài" ở PLP nữ phải rụng khi sang PLP nam, mà tick cùng giới tính thì
     phải SỐNG (trước đây set không có nhãn cate nào nên mọi tick danh mục đều bị
     prune sạch lúc điều hướng, kể cả trong cùng một PLP).
   · Nhãn size lấy từ FILTER_SIZE_LABELS — biến `FILTER_SIZES` cũ không tồn tại
     (chi tiết ở chỗ khai FILTER_SIZE_LABELS). */
function facetLabelsFor(beauty, gender, heel) {
  const out = new Set(FILTER_BRANDS);
  ['Chỉ hàng có sẵn', 'Đang giảm giá', 'Hàng mới về'].forEach(t => out.add(t));
  FILTER_PROMOS.forEach(t => out.add(t));   // mục Ưu đãi nay có ở MỌI ngành hàng
  (beauty ? beautyCatTree() : catTreeFor(gender)).forEach(([cat, subs]) => {
    out.add(cat);
    subs.forEach(s => {
      if (!Array.isArray(s)) { out.add(s); return; }
      out.add(s[0]); s[1].forEach(k => out.add(k));
    });
  });
  if (beauty) {
    FILTER_VOLUMES.forEach(v => out.add(v));
  } else {
    FILTER_COLORS.forEach(([n]) => out.add(n));
    FILTER_SIZE_LABELS.forEach(v => out.add(v));
    if (heel) FILTER_HEELS.forEach(([n]) => out.add(n));
  }
  return out;
}
/* Bỏ nhãn không còn facet ở ngành hiện tại. Gọi cả lúc điều hướng (goPlp) lẫn lúc
   dựng lại thân sheet. Trả về true nếu có thay đổi. */
function pruneFilters() {
  if (!plpFilters.length) return false;
  /* Nhãn Độ cao giày hợp lệ ở đúng chỗ mục đó được dựng: mọi PLP ngữ cảnh NỮ. */
  const ok = facetLabelsFor(isBeautyPlp(), plpGender(), heelSection());
  const kept = plpFilters.filter(l => ok.has(l));
  if (kept.length === plpFilters.length) return false;
  plpFilters = kept;
  return true;
}
function pruneFiltersToBody() {
  if (!pruneFilters()) return;
  refreshActiveFilters(document);
  if (window.syncFilterToDom) syncFilterToDom();
  renderPlpGrid(document);
}
/* ── mở / đóng ── */
function openFilter() {
  const sh = document.getElementById('filterSheet');
  renderFilterBody();          // PLP nào thì facet nấy
  sh.classList.add('open');
  /* Mở ra luôn phản ánh trạng thái ĐÃ ÁP: tick nào không nằm trong plpFilters bị
     bỏ. Trước đây chỉ gọi syncFilterFooter nên tick "mồ côi" (tick rồi đóng bằng
     ✕/backdrop, không Áp dụng) sống mãi — mở lại thấy tick, số kết quả tính theo
     tick nên lệch hẳn với lưới, mà nút Đặt lại lại ẩn vì plpFilters vẫn rỗng. */
  if (window.syncFilterToDom) syncFilterToDom();
  else if (window.syncFilterFooter) syncFilterFooter();
  lockBodyScroll();
}
function closeFilter() {
  const sh = document.getElementById('filterSheet');
  sh.classList.remove('open');
  unlockBodyScroll();
}
/* ── gắn sự kiện (chạy 1 lần) ── */
function wireFilter() {
  const sh = document.getElementById('filterSheet');
  if (!sh) return;

  /* Số đang chọn hiện ngay trên tiêu đề section (Figma "Danh mục (1)" / "Thương hiệu (2)") */
  const countFilters = () => ({
    cat:   sh.querySelectorAll('[data-sub] .chk.on').length,
    brand: sh.querySelectorAll('[data-brand] .chk.on').length,
  });
  const syncSectionCounts = () => {
    const c = countFilters();
    sh.querySelectorAll('[data-fscount]').forEach(el => {
      const n = c[el.dataset.fscount] || 0;
      el.textContent = n ? ` (${n})` : '';
    });
  };

  /* Nhãn của các bộ lọc đang tick — nguồn cho hàng chip trên PLP */
  const pickedLabels = () => {
    const out = [];
    const add = t => { t = (t || '').trim(); if (t && !out.includes(t)) out.push(t); };
    /* Lấy nhãn từ ATTRIBUTE, không lấy textContent: khi LANG='en' text đã bị dịch
       ("Đang giảm giá" -> "On sale") nên matchProducts so với FILTER_FLAGS/FILTER_BRANDS
       tiếng Việt sẽ trượt và bộ lọc câm lặng. applyLang không đụng tới attribute. */
    sh.querySelectorAll('[data-sub] .chk.on, [data-brand] .chk.on, [data-other] .chk.on, .fcat-check .chk.on')
      .forEach(chk => {
        const btn = chk.parentElement;
        add(btn.dataset.sub || btn.dataset.brand || btn.dataset.other || btn.dataset.flabel
            || btn.querySelector('span:not(.chk)')?.textContent);
      });
    sh.querySelectorAll('.fcolor.on').forEach(b => add(b.dataset.color));
    /* Chip dung tích (beauty) DÙNG CHUNG class .fsize với chip size thời trang.
       Nhãn lấy từ data-size (nhãn lọc đầy đủ: 'Size S' · 'Size US 11' · '100 ml')
       — không lấy textContent vì trùng số giữa nhóm và bị dịch khi LANG='en'. */
    sh.querySelectorAll('.fsize.on').forEach(b => {
      const v = (b.dataset.size || '').trim() || b.textContent.trim();
      add(v);
    });
    return out;
  };
  /* Chân drawer: số kết quả trên nút Áp dụng + hiện/ẩn nút Đặt lại.
     Số đếm trên nhãn ĐANG TICK (chưa áp) nên người dùng thấy trước khi bấm;
     nút Đặt lại theo plpFilters (đã áp trước đó), không theo tick hiện tại. */
  /* ── ẨN THUỘC TÍNH KHÔNG CÒN SẢN PHẨM PHÙ HỢP (28/08/2026, lệnh user) ──
     Một lựa chọn biến mất khi tick nó vào bộ lọc HIỆN TẠI sẽ ra 0 sản phẩm.
     Đây là lối chuẩn của e-commerce (facet count = 0 thì không bày) — và khác
     hẳn "disable": bày một ô bấm không được vẫn là bày một ngõ cụt.

     HAI ĐIỀU PHẢI ĐÚNG, sai một cái là bộ lọc tự bóp cổ mình:
       1. Đếm cho một ô thì BỎ QUA chính nhóm của nó. Không thì tick "Versace"
          xong mọi thương hiệu khác đếm ra 0 (một SP không mang 2 brand) và cả
          danh sách bay sạch, còn trơ đúng ô vừa tick.
       2. Ô ĐANG TICK không bao giờ ẩn — ẩn rồi thì hết đường bỏ tick.

     Facet mà `matchProducts` KHÔNG đọc (cây danh mục, size thời trang, khoảng
     giá) luôn đếm ra nguyên danh sách nên không bao giờ chạm ngưỡng 0 -> hàm
     này không đụng tới chúng. Muốn cây danh mục cũng co theo thì phải thêm
     trường phân loại cho PRODUCTS trước, đó là việc DATA. */
  const facetOf = lbl => {
    if (FILTER_BRANDS.includes(lbl)) return 'brand';
    if (lbl === 'Nhiều màu' || FILTER_COLORS.some(([n]) => n === lbl)) return 'color';
    if (FILTER_FLAGS.includes(lbl)) return 'flag';
    if (FILTER_PROMOS.includes(lbl)) return 'promo';
    if (typeof FILTER_HEELS !== 'undefined' && FILTER_HEELS.some(([n]) => n === lbl)) return 'heel';
    if (FILTER_VOLUMES.includes(lbl)) return 'size';
    return null;
  };
  const OPT_SEL = '[data-brand], .fcolor, [data-other], .fsize';
  /* f-gone vừa đổi thì dòng "Không tìm thấy thương hiệu" phải tính lại: hai cơ
     chế ẩn (tìm kiếm .hidden / 0-kết-quả .f-gone) cùng quyết định "còn gì để
     thấy". Bắn lại event input là dùng đúng phép đếm của chính ô tìm, không
     nhân đôi logic; chỉ bắn khi ô đang có chữ. */
  const syncBrandEmptyLine = () => {
    const bb = sh.querySelector('#fBrandSearch');
    if (bb && bb.value.trim()) bb.dispatchEvent(new Event('input'));
  };
  window.pruneEmptyFacets = () => {
    const picked = pickedLabels();
    const pool = plpProducts();
    /* CHƯA TICK GÌ THÌ BÀY ĐỦ (28/08/2026, user chốt lại): *"vì demo nên mặc định
       cứ show đầy đủ các cate đang hiện hữu, chỉ khi nào dùng bộ lọc thì mới ẩn"*.
       Lý do đứng về phía demo: mở panel ra mà thương hiệu chỉ còn 1 dòng thì khách
       không thấy được bộ facet mình dựng, tưởng bộ lọc sơ sài. Việc co danh sách
       chỉ có nghĩa khi nó TRẢ LỜI một lựa chọn — nên nó chờ tới lúc có lựa chọn.
       Bỏ tick hết thì cũng qua nhánh này, tức danh sách tự bày lại đủ. */
    if (!picked.length) {
      sh.querySelectorAll('.f-gone').forEach(e => e.classList.remove('f-gone'));
      syncBrandEmptyLine();
      return;
    }
    sh.querySelectorAll(OPT_SEL).forEach(el => {
      const lbl = (el.dataset.brand || el.dataset.color || el.dataset.other || el.dataset.size || '').trim();
      const g = facetOf(lbl);
      if (!g || picked.includes(lbl)) { el.classList.remove('f-gone'); return; }
      const others = picked.filter(l => facetOf(l) !== g);
      el.classList.toggle('f-gone', matchProducts(pool, others.concat(lbl)).length === 0);
    });
    /* Mục nào sạch lựa chọn thì ẩn cả mục — để trơ hàng tiêu đề với một ngăn
       rỗng bên dưới còn khó hiểu hơn là không có mục đó. Mục KHÔNG chứa lựa
       chọn nào thuộc diện xét (Danh mục, Khoảng giá) thì bỏ qua. */
    sh.querySelectorAll('.facc').forEach(acc => {
      const opts = acc.querySelectorAll(OPT_SEL);
      if (!opts.length) return;
      acc.classList.toggle('f-gone', ![...opts].some(e => !e.classList.contains('f-gone')));
    });
    syncBrandEmptyLine();
  };

  window.syncFilterFooter = () => {
    const cnt = sh.querySelector('#filterApplyCount');
    if (cnt) {
      const n = matchProducts(plpProducts(), pickedLabels()).length;
      cnt.textContent = ` (${n})`;
    }
    sh.querySelector('#filterReset').classList.toggle('hidden', plpFilters.length === 0);
  };
  /* Đẩy plpFilters NGƯỢC vào DOM của drawer. Cần vì người dùng có thể bỏ bộ lọc
     từ hàng chip ngoài PLP — mở drawer lại phải thấy đúng ô còn tick. */
  window.syncFilterToDom = () => {
    const has = t => plpFilters.includes((t || '').trim());
    sh.querySelectorAll('[data-sub], [data-brand], [data-other], .fcat-check').forEach(btn => {
      const lbl = btn.dataset.sub || btn.dataset.brand || btn.dataset.other || btn.dataset.flabel
                  || btn.querySelector('span:not(.chk)')?.textContent;
      btn.querySelector('.chk')?.classList.toggle('on', has(lbl));
    });
    sh.querySelectorAll('.fcolor').forEach(b => setColorChip(b, has(b.dataset.color)));
    sh.querySelectorAll('.fsize').forEach(b => {
      const on = has((b.dataset.size || '').trim() || b.textContent.trim());
      b.classList.toggle('on', on);
      b.classList.toggle('border-primary', on);
      b.classList.toggle('border-border', !on);
    });
    syncSectionCounts();
    syncFilterFooter();
    pruneEmptyFacets();          /* mở drawer ra là đã đúng: mục rỗng không bày */
  };

  sh.querySelector('.fs-backdrop').addEventListener('click', closeFilter);
  sh.querySelector('#filterClose').addEventListener('click', closeFilter);
  sh.querySelector('#filterApply').addEventListener('click', () => {
    plpFilters = pickedLabels();
    closeFilter();
    refreshActiveFilters(document);
    renderPlpGrid(document, { skeleton: true });
    toast(plpFilters.length ? `Áp dụng ${plpFilters.length} bộ lọc` : 'Đã bỏ hết bộ lọc');
  });
  sh.querySelector('#filterReset').addEventListener('click', () => {
    sh.querySelectorAll('.chk.on').forEach(c => c.classList.remove('on'));
    sh.querySelectorAll('.fsize.on').forEach(c => { c.classList.remove('on'); c.classList.replace('border-primary', 'border-border'); });
    sh.querySelectorAll('.fcolor.on').forEach(b => setColorChip(b, false));
    /* Đặt lại phải dọn cả Ô TÌM thương hiệu: không thì panel "đã đặt lại" mà
       danh sách brand vẫn bị lọc bởi query cũ (kèm dòng "Không tìm thấy…" nếu
       query không khớp gì). Bắn event input để đi đúng handler sẵn có. */
    const bb = sh.querySelector('#fBrandSearch');
    if (bb && bb.value) { bb.value = ''; bb.dispatchEvent(new Event('input')); }
    plpFilters = [];
    refreshActiveFilters(document);
    renderPlpGrid(document, { skeleton: true });
    syncSectionCounts();
    syncFilterFooter();
    toast('Đã đặt lại bộ lọc');
  });
  sh.addEventListener('click', () => setTimeout(() => { syncSectionCounts(); syncFilterFooter(); pruneEmptyFacets(); }, 0));

  renderFilterBody();   // dựng thân theo ngành hàng của PLP đang xem
}

/* Bật/tắt 1 ô màu — tách hàm vì cả handler chọn màu và nút Đặt lại đều dùng. */
function setColorChip(btn, on) {
  btn.classList.toggle('on', on);
  btn.querySelector('.fcolor-ring').className =
    'fcolor-ring w-10 h-10 rounded-full flex items-center justify-center border ' + (on ? 'border-primary' : 'border-border');
  btn.querySelector('.fcolor-label').className =
    'fcolor-label text-[12px] leading-4 ' + (on ? 'text-foreground' : 'text-muted-foreground');
}

/* Handler thuộc THÂN — gọi lại sau mỗi lần render lại #filterBody. */
function wireFilterBody(sh) {
  // accordion cấp 1
  sh.querySelectorAll('.facc-trigger').forEach(t =>
    t.addEventListener('click', () => t.closest('.facc').classList.toggle('open')));

  // cấp cha: mở/đóng cấp con
  sh.querySelectorAll('.fcat-toggle').forEach(t =>
    t.addEventListener('click', () => t.closest('.fcat').classList.toggle('open')));

  // cấp con: mở/đóng cấp 3 (vd: "Áo sơ mi & áo kiểu" -> Sơ mi kiểu, Áo kiểu...)
  sh.querySelectorAll('.fsub-toggle').forEach(t =>
    t.addEventListener('click', () => t.closest('.fsub').classList.toggle('open')));

  // checkbox cha: tick cả cấp con
  sh.querySelectorAll('.fcat-check').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.closest('.fcat');
      const on = !btn.querySelector('.chk').classList.contains('on');
      cat.querySelectorAll('.chk').forEach(c => c.classList.toggle('on', on));
    });
  });

  // checkbox lẻ
  sh.querySelectorAll('[data-sub], [data-brand], [data-other]').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.querySelector('.chk').classList.toggle('on');
      const cat = btn.closest('.fcat');
      if (cat) {   // đồng bộ trạng thái cha
        const subs = [...cat.querySelectorAll('[data-sub] .chk')];
        const parent = cat.querySelector('.fcat-check .chk');
        parent.classList.toggle('on', subs.length > 0 && subs.every(c => c.classList.contains('on')));
      }
    });
  });

  /* Ô tìm thương hiệu — lọc tại chỗ trên DOM (27/08/2026).
     Bỏ dấu bằng NFD + xoá dải dấu kết hợp: "Dolce&Gabbana" không dấu nhưng người
     dùng VN vẫn có thể gõ tiếng Việt không dấu ở ô này, và cách này miễn phí. */
  const noAcc = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const brandBox = sh.querySelector('#fBrandSearch');
  if (brandBox) {
    const rows = [...sh.querySelectorAll('#fBrandList [data-brand]')];
    const empty = sh.querySelector('#fBrandEmpty');
    brandBox.addEventListener('input', () => {
      const q = noAcc(brandBox.value.trim());
      let hien = 0;
      rows.forEach(r => {
        const on = !q || noAcc(r.dataset.brand).includes(q);
        r.classList.toggle('hidden', !on);
        /* Hàng khớp query nhưng đang .f-gone (ẩn vì 0 kết quả với bộ lọc hiện
           tại) thì người dùng KHÔNG thấy — không được tính là "còn hàng", kẻo
           gõ trúng brand bị f-gone là danh sách trống trơn mà dòng "Không tìm
           thấy thương hiệu" vẫn im (đo được: tick Đen rồi gõ "bur"). */
        if (on && !r.classList.contains('f-gone')) hien++;
      });
      if (empty) empty.classList.toggle('hidden', hien > 0);
    });
  }

  // màu — CHỌN NHIỀU: mỗi ô tự bật/tắt, không xoá lựa chọn của ô khác
  sh.querySelectorAll('.fcolor').forEach(b => {
    b.addEventListener('click', () => setColorChip(b, !b.classList.contains('on')));
  });

  // size (chọn nhiều) — tách hàm để re-wire được riêng #shoeUnitWrap khi đổi đơn vị
  const wireSizeChips = scope => scope.querySelectorAll('.fsize').forEach(b => {
    b.addEventListener('click', () => {
      const on = b.classList.toggle('on');
      b.classList.toggle('border-primary', on);
      b.classList.toggle('border-border', !on);
    });
  });
  wireSizeChips(sh);

  // bộ chọn đơn vị size giày (IT/EU · US · UK) — đồng bộ index.html
  const wireShoeUnits = scope => scope.querySelectorAll('.shoe-unit').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.unit === shoeUnit) return;
      shoeUnit = b.dataset.unit;
      const wrap = sh.querySelector('#shoeUnitWrap');
      if (!wrap) return;
      wrap.innerHTML = shoeUnitInner();
      wireShoeUnits(wrap);
      wireSizeChips(wrap);
      /* Chip ĐÃ ÁP (nằm trong plpFilters) phải sáng lại trên DOM mới — không
         thì đảo tab một vòng là tick đã áp "trông như mất", và lượt Áp dụng kế
         (đọc pickedLabels từ DOM) âm thầm xoá nhãn khỏi bộ lọc. Tick CHƯA áp
         của đơn vị cũ vẫn reset như cũ, đúng chủ ý ghi ở comment shoeUnitInner. */
      wrap.querySelectorAll('.fsize').forEach(c => {
        const on = plpFilters.includes((c.dataset.size || '').trim() || c.textContent.trim());
        c.classList.toggle('on', on);
        c.classList.toggle('border-primary', on);
        c.classList.toggle('border-border', !on);
      });
      if (window.syncFilterFooter) syncFilterFooter();
    });
  });
  wireShoeUnits(sh);
}

            <p class="text-[12px] leading-4 text-muted-foreground">${POLICY_UPDATED}</p>
          </div>

          <!-- mục lục — viền trên/dưới giống bản mobile, bấm để nhảy tới section -->

            <p class="text-[12px] leading-4 tracking-[0.12em] text-muted-foreground">Mục lục</p>
            <!-- column-gap inline: tailwind.css build sẵn không có gap-x-8, và

            <div class="grid grid-cols-2" style="column-gap:32px">
              ${p.sections.map(([h], i) => `
                <button data-policy-toc="${i}" class="flex items-start gap-2 py-1.5 text-left press">

            </div>
          </div>

          ${p.sections.map(([h, txt], i) => `

              <h2 class="text-[16px] font-medium leading-6 text-foreground">${i + 1}. ${h}</h2>
              ${body(txt)}
            </div>`).join('')}
        </div>
      </div>
    </div>
    ${footer()}
  </div>`;
}

];

function sortedProducts() {
  /* lọc trước, sắp sau — số trên nút Áp dụng dùng cùng matchProducts() nên khớp */
  const list = matchProducts(plpProducts(), plpFilters);
  const priceNum = p => Number(String(p.price).replace(/[^\d]/g, ''));
  if (plpSort === 'newest') list.reverse();
  else if (plpSort === 'bestseller') list.sort((a, b) => (a.p.tag === 'Best seller' ? -1 : 0) - (b.p.tag === 'Best seller' ? -1 : 0));
  else if (plpSort === 'price-asc') list.sort((a, b) => priceNum(a.p) - priceNum(b.p));
  else if (plpSort === 'price-desc') list.sort((a, b) => priceNum(b.p) - priceNum(a.p));
  return list;
}

function renderSearchSug(root) {
  const sug = root.querySelector('#searchSug');
  if (!sug) return;
  sug.innerHTML = searchSuggestHTML();
  wireSearchPane(root, sug);
  localizeNew(sug);
}

function refreshSearchHistory(root) {
  const box = root.querySelector('#searchHistoryBox');
  if (!box) return;
  box.innerHTML = searchHistoryHTML();
  wireSearchPane(root, box);
  localizeNew(box);
  // tiêu đề khối trending đổi theo còn/hết lịch sử tìm kiếm
  const t = root.querySelector('#trendTitle');
  if (t) {
    t.textContent = searchHistory.length ? 'Sản phẩm nổi bật' : 'Sản phẩm thịnh hành';
    localizeNew(t.parentElement);
  }
}

function wireSearchPane(root, pane) {
  wireProductCards(pane);
  pane.querySelectorAll('img.lazy').forEach(img => {
    if (img.complete) img.classList.add('loaded');
    else img.addEventListener('load', () => img.classList.add('loaded'));
  });
  pane.querySelectorAll('[data-suggest]').forEach(btn => {
    btn.addEventListener('click', () => {
      const term = btn.dataset.suggest;
      if (!searchHistory.includes(term)) searchHistory = [term, ...searchHistory].slice(0, 8);
      searchQuery = term;
      // Results = PLP grid (Figma 02—PLP): mở màn kết quả tìm kiếm
      goPlp({ type: 'search', query: term, title: `Kết quả tìm kiếm của “${term}”` });
    });
  });
  pane.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      // thu gọn dòng mượt rồi mới cập nhật danh sách
      const row = btn.closest('.search-row');
      if (!row) return;
      row.style.height = row.offsetHeight + 'px';
      void row.offsetWidth;
      row.classList.add('removing');
      row.style.height = '0px';
      // fallback timeout: transitionend không bắn khi tab ẩn / reduced-motion
      let removed = false;
      const finish = () => {
        if (removed) return;
        removed = true;
        searchHistory = searchHistory.filter(h => h !== btn.dataset.remove);
        refreshSearchHistory(root);
      };
      row.addEventListener('transitionend', ev => { if (ev.propertyName === 'height') finish(); });
      setTimeout(finish, 350);
    });
  });
}

/* Bấm 1 size trên dải hover của card (bộ da Mytheresa).
   · size CÒN HÀNG -> thêm thẳng vào giỏ với đúng size đó, rồi mở tấm xác nhận.
     Không mở dialog quick add nữa: màu đã chọn sẵn trên card, size vừa bấm là
     mảnh cuối cùng còn thiếu.
   · size ĐÃ HẾT -> mở khung "nhận thông báo khi có hàng" (dùng lại __openNotify
     của PDP, không dựng form mới).
   Trả về true nếu đã xử lý, để handler card biết mà đừng điều hướng sang PDP. */
function pcSizeClick(el, btn) {
  const idx = +btn.closest('[data-pc-sizes]').dataset.pcSizes;
  const size = btn.dataset.pcSize;
  if (btn.dataset.oos) {
    if (window.__openNotify) window.__openNotify(() => toast('Đã đăng ký · sẽ báo bạn khi có hàng'));
    return true;
  }
  const p = PRODUCTS[idx];
  const img = el.querySelector('img');
  if (img) flyToCart(img);
  /* Màu đang chọn lấy từ chính card (ô swatch có viền primary), để dòng biến thể
     ghi vào giỏ khớp với thứ user đang nhìn. */
  const ci = [...el.querySelectorAll('[data-swatches] .cw')].findIndex(c => c.classList.contains('border-primary'));
  const colorName = (p.colors && p.colors[ci > -1 ? ci : 0]) ? p.colors[ci > -1 ? ci : 0].name : '';
  addToCart({
    img: `${A}${p.img}`, brand: p.brand, name: p.name,
    variant: [colorName, size].filter(Boolean).join(' , '),
    price: p.price, off: p.off, was: p.was, preorder: p.preorder,
  });
  setTimeout(() => window.__openCartConfirm && window.__openCartConfirm(), 120);
  return true;
}

function wireProductCards(root) {
  /* ẢNH THẺ PHẢI ĐƯỢC "THẮP" LẠI. `img.lazy` đứng ở opacity 0 cho tới khi có
     class `.loaded`, mà chỗ gắn class đó (`wireLazy`) chỉ chạy trong `wire()`
     lúc DỰNG MÀN. Mọi thẻ chèn lúc chạy — áp bộ lọc, đổi sắp xếp (renderPlpGrid
     vẽ lại bằng innerHTML), bấm Xem thêm (append) — đều đi qua đây, nên đây là
     chỗ duy nhất cần gọi. Không gọi thì lưới sau khi lọc chỉ còn CHỮ, ảnh trong
     suốt hoàn toàn (lỗi phát hiện 29/08/2026). `wireLazy` idempotent qua
     `data-lazy-wired` nên gọi lại trên lưới đang sống là vô hại. */
  wireLazy(root);
  /* IDEMPOTENT qua data-wired: hàm này nay còn được gọi trên lưới ĐANG SỐNG
     (Xem thêm append thẻ mới cạnh thẻ cũ) — không có cờ thì thẻ cũ bị gắn
     trùng listener, 1 click chạy 2 lần. Lưới dựng lại bằng innerHTML thì node
     mới tinh nên cờ không cản gì. */
  root.querySelectorAll('[data-product]').forEach(el => {
    if (el.dataset.wired) return;
    el.dataset.wired = '1';
    el.addEventListener('click', e => {
      const ps = e.target.closest('[data-pc-size]');
      if (ps) { e.stopPropagation(); pcSizeClick(el, ps); return; }
      const qa = e.target.closest('.quick-add');
      /* Truyền màu đang chọn trên card (openQA vốn nhận ci nhưng chưa ai truyền)
         — không thì dialog quick add luôn mở màu đầu dù card đang chọn màu khác. */
      if (qa) { if (window.__openQuickAdd) window.__openQuickAdd(+qa.dataset.quick, +(el.dataset.color || 0)); return; }
      goPdp(+el.dataset.product);   // SP#1-6 có màn riêng, còn lại dùng khuôn chung
    });
  });

  /* Swatch trên card — DỌN VỀ ĐÂY từ wire() (28/08): lưới PLP được dựng lại
     bằng renderPlpGrid (áp/xoá bộ lọc, đổi sắp xếp) mà chỗ đó chỉ gọi hàm này,
     nên để swatch bên wire() là card mới mất sạch handler chọn màu (đo được:
     sau khi áp bộ lọc, bấm swatch không nhúc nhích). Nhân thể port đủ hành vi
     bản mobile: ghim màu vào data-color (nuôi quick add + pcSizeClick) và đổi
     ảnh theo PRODUCT_GALLERY — trước đây desktop chỉ dời viền chọn, ảnh đứng im. */
  root.querySelectorAll('[data-swatches]').forEach(rw => {
    if (rw.dataset.wired) return;
    rw.dataset.wired = '1';
    const card = rw.closest('[data-product]');
    if (!card) return;
    const idx = +card.dataset.product;
    rw.addEventListener('click', ev => {
      const btn = ev.target.closest('.cw');
      if (!btn) return;
      ev.stopPropagation();
      rw.querySelectorAll('.cw').forEach(c => { c.classList.remove('border-primary'); c.classList.add('border-transparent'); });
      btn.classList.remove('border-transparent'); btn.classList.add('border-primary');
      const ci = +btn.dataset.cw;
      card.dataset.color = ci;
      const src = (PRODUCT_GALLERY[idx] || [])[ci];
      const img = card.querySelector('img');
      /* SP chưa có bộ ảnh riêng thì giữ nguyên ảnh — thà không đổi còn hơn đổi
         sang ảnh sai màu (cùng luật với bản mobile). */
      if (!src || !img || img.getAttribute('src') === A + src) return;
      img.style.transition = 'opacity .18s ease';
      img.style.opacity = '0';
      setTimeout(() => {
        const show = () => { img.style.opacity = '1'; };
        img.src = A + src;
        if (img.complete) show(); else img.addEventListener('load', show, { once: true });
      }, 180);
    });
  });
}

/* Khung xương lưới — PLP-Desktop-06 (2918:46100): ảnh + 2 dòng chữ + 1 dòng ngắn */
function plpSkeletonCards(n) {
  return Array(n).fill(`
    <div class="flex flex-col">
      <div class="skel w-full" style="aspect-ratio:189/252"></div>
      <div class="px-1 py-2 flex flex-col gap-1">
        <div class="skel h-3 w-2/3 rounded"></div>
        <div class="skel h-3 w-full rounded"></div>
        <div class="skel h-3 w-1/2 rounded"></div>
      </div>
    </div>`).join('');
}

/* Vẽ lại lưới. skeleton:true → hiện khung xương ~450ms rồi mới đổ sản phẩm
   (dùng khi đổi sắp xếp / áp bộ lọc, theo trạng thái loading của Figma). */
function renderPlpGrid(root, { skeleton = false } = {}) {
  const grid = root.querySelector('#plpGrid');
  if (!grid) return;
  /* Badge thẻ đầu: đọc từ DATA (`p.preorder`) chứ không phải "thẻ số 0 thì New"
     — SP#1 là hàng pre-order, để "New" ở PLP thì bấm vào PDP lại thấy
     "Pre-order", 2 nơi nói 2 chuyện (yêu cầu user 17/08/2026). */
  const card = (p, i) => productCard(p, i, { badge: p.preorder ? 'Pre-order' : '', pillBadges: i === 3 ? ['New Season', 'La Vacanza'] : null });
  const paint = () => {
    const list = sortedProducts();
    grid.innerHTML = plpGridInner(list, card);
    if (list.length) wireProductCards(grid);
    localizeNew(grid);
    updatePlpProgress(root);
    updatePlpCount(root, list.length);
    /* 0 kết quả -> ẩn thanh tiến độ + cụm nút "Xem thêm": cả hai nằm NGOÀI
       #plpGrid nên innerHTML ở trên không đụng tới được — không ẩn thì dưới
       khối "không khớp bộ lọc" trơ dòng "Bạn đã xem 0 trong …" + nút chết. */
    syncShowMore(root);   // gộp cả 2 việc: ẩn khi lọc sạch, và ẩn khi đã vẽ hết hàng
    const prog = root.querySelector('#plpProgress');
    if (prog) prog.classList.toggle('hidden', !list.length);
  };
  if (!skeleton) return paint();
  const n = grid.children.length || 8;
  grid.innerHTML = plpSkeletonCards(n);
  setTimeout(paint, 450);
}

/* Thanh tiến độ "Bạn đã xem X trong Y sản phẩm" (_Component-SortBar 2237:18725) */
function updatePlpProgress(root) {
  const seen = root.querySelector('[data-plp-seen]');
  const bar  = root.querySelector('[data-plp-bar]');
  const grid = root.querySelector('#plpGrid');
  if (!seen || !bar || !grid) return;
  /* Cùng phép tính với template dkProductGrid — xem chú thích plpProgressTotal:
     mẫu số theo trạng thái lọc, tử số kẹp về mẫu số (Xem thêm append thẻ trùng). */
  const total = plpProgressTotal(sortedProducts().length);
  const n = Math.min(grid.querySelectorAll('[data-product]').length, total);
  seen.textContent = `Bạn đã xem ${n} trong ${total} sản phẩm`;
  localizeNew(seen);
  bar.style.width = (total ? Math.min(100, Math.round(n / total * 100)) : 0) + '%';
}

/* Gắn sự kiện cho hàng chip bộ lọc — chỉ gắn 1 lần cho mỗi nút */
function bindActiveFilterChips(root) {
  root.querySelectorAll('#plpActiveFilters [data-af]').forEach(chip => {
    if (chip.dataset.bound) return;
    chip.dataset.bound = '1';
    chip.addEventListener('click', () => {
      plpFilters.splice(+chip.dataset.af, 1);
      refreshActiveFilters(root);
      renderPlpGrid(root, { skeleton: true });
      if (window.syncFilterToDom) syncFilterToDom();
    });
  });
  const afClear = root.querySelector('#afClear');
  if (afClear && !afClear.dataset.bound) {
    afClear.dataset.bound = '1';
    afClear.addEventListener('click', () => {
      plpFilters = [];
      refreshActiveFilters(root);
      renderPlpGrid(root, { skeleton: true });
      if (window.syncFilterToDom) syncFilterToDom();
    });
  }
}

/* Subheader: mega menu (hover-intent) + mũi tên trượt khi danh mục tràn.
   · Panel nằm NGOÀI .dk-nav-strip nên không bị overflow-x cắt -> phải nối
     nút <-> panel bằng data-mega và tự đóng/mở bằng JS thay cho CSS :hover.
   · 120ms trễ khi mở: lướt ngang qua thanh menu không làm panel nháy; đóng
     cũng trễ 120ms để còn kịp rê chuột từ nút xuống panel.
   · Mũi tên chỉ hiện khi scrollWidth > clientWidth (ngành Làm đẹp 11 mục). */
function wireSubheader(root) {
  const sub = root.querySelector('.dk-sub');
  if (!sub) return;
  const strip = sub.querySelector('.dk-nav-strip');
  const items = [...sub.querySelectorAll('.dk-nav-item')];
  const panels = [...sub.querySelectorAll('.dk-mega')];
  let timer = null, swapT = null;
  const isOpen = () => panels.some(p => p.classList.contains('open'));

  const setOpen = id => {
    /* Mở mega panel thì đóng lớp tìm kiếm: 2 lớp phủ cùng lúc vừa rối vừa để
       lại khoá cuộn của lớp tìm kiếm mà không còn nút đóng nào nhìn thấy. */
    if (id != null && window.__closeDkSearch) window.__closeDkSearch();
    const cur  = panels.find(p => p.classList.contains('open'));
    const next = id == null ? null : panels.find(p => p.dataset.mega === id);
    /* ĐANG MỞ mà đổi sang mục khác = "swap": đổi nội dung tức thì, chỉ cho chiều
       cao chạy từ cao cũ sang cao mới. Đo được panel cao lệch nhau 324→468px nên
       không làm việc này là mỗi lần đổi mục thấy khối giật một nhịp.
       `visibility: hidden` vẫn giữ layout nên đo offsetHeight của panel đang đóng
       ra số thật, không cần hiện nó lên để đo. */
    const swapping = !!(cur && next && cur !== next);
    let to = 0;
    if (swapping) {
      const from = cur.offsetHeight;
      to = next.offsetHeight;
      cur.classList.add('mega-swap'); next.classList.add('mega-swap');
      next.style.height = from + 'px';
      void next.offsetHeight;   // ép layout ở mốc `from` để transition có chỗ chạy
    }
    panels.forEach(p => p.classList.toggle('open', p === next));
    items.forEach(it => it.classList.toggle('on', it.dataset.mega === id));
    sub.classList.toggle('mega-open', id != null);
    if (swapping) {
      next.style.height = to + 'px';
      clearTimeout(swapT);
      swapT = setTimeout(() => {
        next.style.height = '';                                  // trả về cao tự nhiên
        panels.forEach(p => p.classList.remove('mega-swap'));    // mở/đóng lần sau lại có fade
      }, 300);
    }
  };
  /* Hover-intent 120ms CHỈ cho lần mở đầu (lướt ngang thanh menu không nháy
     panel). Khi panel ĐANG MỞ thì đổi mục là đổi ngay — chờ thêm 120ms mỗi lần
     rê chuột chính là cảm giác "dính, không mượt" mà user chỉ ra. */
  const openLater  = id => {
    clearTimeout(timer);
    if (isOpen()) { setOpen(id); return; }
    timer = setTimeout(() => setOpen(id), 120);
  };
  const closeLater = () => { clearTimeout(timer); timer = setTimeout(() => setOpen(null), 120); };

  items.forEach(it => {
    const id = it.dataset.mega;
    it.addEventListener('mouseenter', () => id ? openLater(id) : closeLater());
    it.addEventListener('mouseleave', closeLater);
    it.addEventListener('focusin',  () => id ? setOpen(id) : setOpen(null));
  });
  panels.forEach(p => {
    p.addEventListener('mouseenter', () => clearTimeout(timer));
    p.addEventListener('mouseleave', closeLater);
  });
  sub.addEventListener('focusout', e => { if (!sub.contains(e.relatedTarget)) setOpen(null); });

  /* ── mũi tên trượt ──
     Mỗi bên CHỈ hiện khi hướng đó còn nội dung: ở đầu danh sách không có nút
     trái, cuộn sang phải rồi nút trái mới xuất hiện (và nút phải biến mất khi
     đã tới cuối) — không bày nút bấm vào chẳng làm gì.
     Vì là overlay absolute nên ẩn/hiện không đổi bề rộng strip => đo `over`
     một lần là đủ, không lo kẹt trạng thái như bản cũ. */
  const prevWrap = sub.querySelector('[data-nav-prev-wrap]');
  const nextWrap = sub.querySelector('[data-nav-next-wrap]');
  // hidden <-> flex: wrapper mang sẵn items-center nên khi hiện phải là flex
  const show = (el, on) => { el.classList.toggle('hidden', !on); el.classList.toggle('flex', on); };
  const sync = () => {
    const over = strip.scrollWidth > strip.clientWidth + 1;
    if (!over) { strip.scrollLeft = 0; show(prevWrap, false); show(nextWrap, false); return; }
    show(prevWrap, strip.scrollLeft > 1);
    show(nextWrap, strip.scrollLeft < strip.scrollWidth - strip.clientWidth - 1);
  };
  const prev = prevWrap.querySelector('[data-nav-prev]');
  const next = nextWrap.querySelector('[data-nav-next]');
  const step = () => Math.max(160, Math.round(strip.clientWidth * 0.6));
  prev.addEventListener('click', () => { strip.scrollLeft -= step(); });
  next.addEventListener('click', () => { strip.scrollLeft += step(); });
  strip.addEventListener('scroll', sync, { passive: true });
  window.addEventListener('resize', sync, { passive: true });
  scrollCleanups.push(() => window.removeEventListener('resize', sync));
  sync();
  /* Montserrat tải từ Google Fonts: nếu font về SAU lần đo đầu thì bề rộng chữ
     đổi mà trạng thái mũi tên vẫn cũ -> đo lại khi font sẵn sàng. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sync);
}

/* ── Dải "Sản phẩm tương tự" ở PDP: mũi tên trượt + tự ẩn theo hướng còn nội dung
   (03/09/2026). Cùng thuật toán với mũi tên của subheader (xem wireDkNav): mỗi
   bên chỉ hiện khi hướng đó CÒN chỗ cuộn, không bày nút bấm vào chẳng làm gì.
   Mũi tên là overlay absolute nên ẩn/hiện KHÔNG đổi bề rộng track — đo một lần
   là đủ. Bước cuộn = trọn một lượt xem (clientWidth) để 4 thẻ sang 4 thẻ, không
   để thẻ đứng nửa vời giữa mép.
   Kéo-để-cuộn đã do dragScroll() lo qua class `.drag-x` (wire gọi ở trên). ── */
function wireRail(root) {
  root.querySelectorAll('.dk-rail').forEach(rail => {
    const track = rail.querySelector('.dk-rail-track');
    const prev = rail.querySelector('[data-rail-prev]');
    const next = rail.querySelector('[data-rail-next]');
    if (!track || !prev || !next) return;
    const sync = () => {
      const over = track.scrollWidth > track.clientWidth + 1;
      prev.hidden = !over || track.scrollLeft <= 1;
      next.hidden = !over || track.scrollLeft >= track.scrollWidth - track.clientWidth - 1;
    };
    /* Mũi tên canh giữa Ô ẢNH của thẻ, không phải giữa cả thẻ — xem chú thích ở
       rule .dk-rail-arrow. Ô ảnh là con ĐẦU của thẻ (productCard dựng thứ tự
       ảnh -> khối chữ). Đo lại khi resize vì chiều cao ảnh suy từ bề rộng thẻ. */
    const photo = track.querySelector('[data-product] > div');
    const place = () => {
      if (!photo) return;
      const h = photo.getBoundingClientRect().height;
      if (h > 0) rail.style.setProperty('--rail-arrow-y', Math.round(h / 2) + 'px');
    };
    prev.addEventListener('click', () => { track.scrollLeft -= track.clientWidth; });
    next.addEventListener('click', () => { track.scrollLeft += track.clientWidth; });
    track.addEventListener('scroll', sync, { passive: true });
    const onResize = () => { sync(); place(); };
    window.addEventListener('resize', onResize, { passive: true });
    scrollCleanups.push(() => window.removeEventListener('resize', onResize));
    sync(); place();
    /* Ảnh lazy: chiều cao ô ảnh do aspect-ratio quyết nên KHÔNG phụ thuộc ảnh đã
       tải hay chưa — nhưng font/khổ chữ về muộn có thể đổi bề rộng thẻ, đo lại
       một lượt cho chắc. */
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  });
}

/* Vẽ lại hàng chip bộ lọc + số trên nút "Bộ lọc (n)" */
function refreshActiveFilters(root) {
  const scope = root.querySelector('#plpFilterAnchor') ? root : document;
  const label = scope.querySelector('#filterBtnLabel');
  /* localizeNew: I18N_RE có luật /^Bộ lọc \((\d+)\)$/ -> 'Filter ($1)' nhưng

const I18N_REV = Object.fromEntries(Object.entries(I18N).map(([k, v]) => [v, k]));

function tr(t, to) {
  const dict  = to === 'en' ? I18N : I18N_REV;
  const rules = to === 'en' ? I18N_RE : I18N_REV_RE;
  if (dict[t]) return dict[t];
  for (const [re, rep] of rules) if (re.test(t)) return t.replace(re, rep);
  return null;
}

function applyLang(root, to) {
  if (!root) return;
  /* [data-i18n-skip] = wordmark giữ nguyên ở MỌI ngôn ngữ (badge "Pre-order"…).
     Phải chặn ở đây vì dịch ngược EN→VN tra I18N_REV theo text node: badge
     "Pre-order" trùng chuỗi với nút "Đặt trước" đã dịch nên bị kéo theo. */
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement && n.parentElement.closest('[data-i18n-skip]')
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const raw = n.nodeValue, t = raw.trim();
    if (!t) return;
    const out = tr(t, to);
    if (out) n.nodeValue = raw.replace(t, out);
  });
  root.querySelectorAll && root.querySelectorAll('[placeholder]').forEach(e => {
    const out = tr(e.placeholder, to); if (out) e.placeholder = out;
  });
  root.querySelectorAll && root.querySelectorAll('[data-toast]').forEach(e => {
    const out = tr(e.dataset.toast, to); if (out) e.dataset.toast = out;
  });
  root.querySelectorAll && root.querySelectorAll('[aria-label]').forEach(e => {
    const out = tr(e.getAttribute('aria-label'), to); if (out) e.setAttribute('aria-label', out);
  });
}

function localizeNew(el) { if (LANG === 'en') applyLang(el, 'en'); }

/* ── Nhớ vị trí cuộn của từng màn (17/08/2026, yêu cầu user — CẢ 2 BẢN) ──
   Bấm back từ PDP về PLP mà văng lên đầu danh sách thì người xem phải cuộn
   lại từ đầu để tìm chỗ cũ — lỗi cơ bản của mọi trang danh sách.
   CHỈ khôi phục khi đi LÙI (`opts.back`: nút back trình duyệt -> popstate);
   đi TỚI vẫn về đầu trang như cũ.
   Lúc modal/drawer đang khoá cuộn thì `window.scrollY` = 0, vị trí thật nằm ở
   `__scrollLockY` — đọc nhầm là nhớ số 0. */
const SCROLL_MEM = {};
const curScrollY = () => (__scrollLockCount > 0 ? __scrollLockY
  : (window.scrollY || document.documentElement.scrollTop || 0));

/* Cuộn tới `y` rồi BÁM LẠI vài khung hình. Lý do: ngay sau khi thay DOM, trang
   mới chưa cao đủ (đo thật lúc chạy bản mobile: 2072px, một lúc sau mới nở ra
   5046px) nên cú scrollTo đầu tiên bị trình duyệt KẸP về đáy hiện có — nhớ
   1400 mà về tới nơi chỉ còn 1260. Đặt lại mỗi khung cho tới khi toạ độ dính.
   Dừng ngay khi người dùng tự cuộn/chạm/gõ phím — không giành scroll với họ. */
function restoreScrollY(y) {
  window.scrollTo(0, y);
  if (!y) return;
  const EVS = ['wheel', 'touchstart', 'keydown'];
  let n = 0, stop = false;
  const bail = () => { stop = true; EVS.forEach(ev => window.removeEventListener(ev, bail)); };
  EVS.forEach(ev => window.addEventListener(ev, bail, { once: true, passive: true }));
  const put = () => { if (!stop && Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y); };
  const tick = () => {
    if (stop || n++ > 20 || Math.abs(window.scrollY - y) <= 1) { bail(); return; }
    put();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  /* 2 mốc thời gian dự phòng: tab nền / cửa sổ ẩn thì requestAnimationFrame bị
     đóng băng, vòng bám ở trên không chạy lấy một khung nào. */
  setTimeout(put, 80); setTimeout(put, 250);
}

function go(name, opts = {}) {
  /* Đóng lớp tìm kiếm TRƯỚC KHI đổi màn — và trước cả lệnh return bên dưới, để
     bấm đúng màn đang đứng cũng đóng. Không có dòng này thì mở ô tìm kiếm rồi
     bấm icon giỏ/tài khoản/danh mục là: header dựng lại (ô nhập biến mất) nhưng
     tấm gợi ý vẫn mở và __scrollLockCount còn 1 -> trang đứng cứng, không cuộn
     được, không còn nút nào để đóng. (Lỗi user báo 17/08/2026.) */
  if (window.__closeDkSearch) window.__closeDkSearch();
  if (name === current) return;
  if (current && !opts.back) history.push(current);
  if (current) SCROLL_MEM[current] = curScrollY();   // phải chốt TRƯỚC khi xoá DOM

  if (name === 'login' && current !== 'login') { loginFrom = current; if (!authViewIntent) authView = 'login'; authViewIntent = false; }

  scrollCleanups.forEach(fn => fn());
  scrollCleanups = [];

  viewport.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'screen';
  el.dataset.screen = name;
  el.innerHTML = RENDER[name]();
  viewport.appendChild(el);
  void el.offsetWidth;   // ép tính layout trước khi cuộn
  if (opts.back) restoreScrollY(SCROLL_MEM[name] || 0);
  else window.scrollTo(0, 0);
  el.classList.add('active');

  current = name;
  wire(el);
  localizeNew(el);
  if (name === 'done') confetti();

  // Đồng bộ với History API của trình duyệt: mỗi lần đi TỚI một màn mới
  // (không phải do popstate kích hoạt) sẽ tạo 1 entry mới trong lịch sử
  // trình duyệt, để nút back vật lý / vuốt back (mobile) hoạt động đúng.
  if (!opts.fromPopstate) {
    window.history.pushState({ screen: name }, '');
  }
}

/* Tắt khôi phục cuộn tự động của trình duyệt: router tự dựng lại DOM nên toạ độ
   trình duyệt nhớ theo entry là của một cây DOM đã biến mất — để 'auto' thì nó
   ghi đè lên vị trí SCROLL_MEM vừa khôi phục. */
if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual';

// Nút back của trình duyệt hoặc thao tác vuốt back (mobile) sẽ bắn sự kiện
// này — tra state đã lưu và render lại đúng màn trước đó trong router nội bộ.
window.addEventListener('popstate', (e) => {
  const target = (e.state && e.state.screen) || history.pop() || 'plp';
  if (e.state && e.state.screen) history.pop();
  go(target, { back: true, fromPopstate: true });
});
/* ── Khoá scroll nền khi có bottom sheet/drawer mở ──
   Dùng kỹ thuật position:fixed (thay vì chỉ overflow:hidden) để chặn
   triệt để scroll/rubber-band nền trên Safari iOS. Có đếm số sheet đang
   mở (lockCount) để xử lý đúng khi 2 sheet chồng nhau (vd: size sheet
   mở tiếp notify sheet) — chỉ mở khoá khi sheet cuối cùng đã đóng. */
let __scrollLockCount = 0, __scrollLockY = 0;
function lockBodyScroll() {
  if (__scrollLockCount === 0) {
    __scrollLockY = window.scrollY || document.documentElement.scrollTop || 0;
    /* BÙ CHỖ SCROLLBAR (17/08/2026): position:fixed làm trang hết tràn -> mất
       thanh cuộn -> vùng nội dung rộng thêm ~15px, mọi thứ neo phải NHẢY sang
       phải đúng 15px. Trước đây không thấy vì sheet phủ kín màn; từ khi ô tìm
       kiếm mở NGAY TRÊN header thì 3 icon cạnh nó nhảy rõ mồn một.
       box-sizing: border-box (preflight) nên padding-right ăn vào width:100%,
       trả lại đúng bề rộng vùng nội dung như lúc còn thanh cuộn. */
    const sbw = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
    Object.assign(document.body.style, {
      position: 'fixed', top: `-${__scrollLockY}px`, left: '0', right: '0', width: '100%',
      paddingRight: sbw ? `${sbw}px` : '',
    });
  }
  __scrollLockCount++;
}
function unlockBodyScroll() {
  __scrollLockCount = Math.max(0, __scrollLockCount - 1);
  if (__scrollLockCount === 0) {
    Object.assign(document.body.style, { position: '', top: '', left: '', right: '', width: '', paddingRight: '' });
    window.scrollTo(0, __scrollLockY);
  }
}
/* ── Chặn bấm 2 lần khi nút đang "loading" ──
   10 handler trước đây gán spinner vào innerHTML rồi setTimeout 700ms mà KHÔNG
   disabled, nên bấm 2 lần là chạy 2 lần (đặt 2 đơn, gửi 2 OTP...). Giờ state
   Disabled của component (opacity .5) mới có ý nghĩa thực: btnBusy() trả về true
   nếu nút đang bận -> handler return sớm; btnDone() trả nút về bình thường. */
function btnBusy(btn) {
  if (!btn || btn.dataset.busy) return true;
  btn.dataset.busy = '1';
  btn.disabled = true;
  return false;
}
function btnDone(btn) {
  if (!btn) return;
  delete btn.dataset.busy;
  btn.disabled = false;
}

/* ── Wire behaviour for a screen ── */
/* Nối nút mắt: đổi type input + đổi icon. Tách riêng vì ngoài các màn (wire)
   còn có popup đăng nhập nhanh nằm ngoài .screen, dựng 1 lần lúc khởi động. */
function wirePasswordToggles(root) {
  root.querySelectorAll('[data-pass-toggle]').forEach(btn => {
    if (btn.dataset.wired) return;
    btn.dataset.wired = '1';
    btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const input = btn.parentElement.querySelector('input');
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.querySelector('.eye-on').classList.toggle('hidden', show);
      btn.querySelector('.eye-off').classList.toggle('hidden', !show);
      btn.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    });
  });
}

/* Ô tỉnh/thành và phường/xã: mở sheet chọn. Phường phụ thuộc tỉnh nên đổi
   tỉnh là xoá phường đang chọn — giữ lại sẽ ra địa chỉ không tồn tại. */
/* ── Báo lỗi ngay dưới ô nhập ──
   App vốn không validate gì ở checkout (xem AUDIT). Ở bước nhận tại cửa hàng
   thì bắt buộc phải có: nhân viên cửa hàng cần đúng tên + số để giao hàng.
   Lỗi gắn vào input bằng aria-invalid + aria-describedby, viền đỏ bằng class
   .fld-err (tailwind build sẵn không có border-destructive), focus nhảy tới
   ô sai ĐẦU TIÊN. */
function clearFieldErr(inp) {
  inp.classList.remove('fld-err');
  inp.removeAttribute('aria-invalid');
  const id = inp.getAttribute('aria-describedby');
  if (id) { const p = document.getElementById(id); if (p) p.remove(); inp.removeAttribute('aria-describedby'); }
}
function setFieldErr(inp, msg) {
  clearFieldErr(inp);
  inp.classList.add('fld-err');
  inp.setAttribute('aria-invalid', 'true');
  const eid = 'err-' + inp.id;
  inp.setAttribute('aria-describedby', eid);
  inp.insertAdjacentHTML('afterend', `<p id="${eid}" class="mt-1 text-[12px] leading-4 text-destructive">${msg}</p>`);
  const p = document.getElementById(eid);
  if (p) localizeNew(p);
}
/* 6 ô OTP không có ô nào là "ô chính" để gắn lỗi: setFieldErr chèn <p> vào
   `afterend` của phần tử truyền vào, mà afterend của một ô thì rơi vào GIỮA hàng
   flex. Nên truyền CẢ HÀNG `#otpRow` — <p> rơi ngay dưới hàng, đúng chỗ; lớp
   `.fld-err` bám vào div không viền nên vô hình, không hại gì.
   Tô đỏ 6 ô phải làm riêng, và gỡ khi gõ lại. */
function otpErr(root, msg) {
  const row = root.querySelector('#otpRow');
  if (!row) return;
  const cells = [...row.querySelectorAll('.otp-cell')];
  if (!msg) { clearFieldErr(row); cells.forEach(c => c.classList.remove('fld-err')); return; }
  setFieldErr(row, msg);
  cells.forEach(c => {
    c.classList.add('fld-err');
    c.addEventListener('input', () => otpErr(root, ''), { once: true });
  });
}
function validatePickup(root) {
  const get = k => root.querySelector(`[data-ckf="${k}"]`);
  const rules = [
    [get('name'),  v => !!v.trim(),                       'Vui lòng nhập họ và tên'],
    [get('phone'), v => /^0\d{8,10}$/.test(v.replace(/\s/g, '')), 'Số điện thoại chưa đúng'],
    [get('email'), v => !v.trim() || /^\S+@\S+\.\S+$/.test(v.trim()), 'Email chưa đúng'],
  ];
  let first = null;
  rules.forEach(([inp, ok, msg]) => {
    if (!inp) return;
    if (ok(inp.value)) { clearFieldErr(inp); return; }
    setFieldErr(inp, msg);
    if (!first) first = inp;
  });
  if (first) { first.focus({ preventScroll: true }); first.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  return !first;
}

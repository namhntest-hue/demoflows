     ⚠ ĐỔI MẶC ĐỊNH = SỬA **4 CHỖ**, Ở **CẢ 2 FILE** (trước đây là 2 chỗ — bộ da
     mới dùng CẶP font nên phải đồng bộ thêm 2 biến):
       1. class trên thẻ <html> ngay dưới đây;
       2. `let currentSkin` (dưới bảng SKINS) — để dấu tích mục "Bộ da" trỏ đúng;
       3. `let currentFont` — skin-li KHÔNG tích phông đơn nào (ô thứ 5 của hàng
          SKINS để rỗng), nên phải khởi tạo `''`. Bỏ bước này là popover tích
          "Montserrat" trong khi trang đang chạy Inter;
       4. `let currentPair` — skin-li tích CẶP `couture` qua ô thứ 7 (chỉ tích,
          không áp — xem ghi chú ở bảng SKINS). Bỏ bước này là không có dấu tích
          nào ở mục "Cặp font" cho tới khi user tự đổi bộ da một lượt.
     Ba biến 2·3·4 chỉ lo DẤU TÍCH; mặt chữ đến từ 2 token CSS của bộ da, KHÔNG
     đi qua applyFontPair (F3 cấm font-size-adjust).

     ⚠ HỆ QUẢ: `skin-li` thôi là "bộ da thử". Từ nay mọi thứ trong nó là thứ khách
     mở ra thấy ngay — kể cả 3 chỗ lệch luật đã ghi danh (bậc trưng bày 24 không gác
     `@media` nên lệch F1; `500` chữ thường ở cây bộ lọc và ở cụm accordion PDP; cỡ
     16 của title lớp nổi ngoài thang §1.2). Thử nghiệm mới phải đưa vào bộ da khác. -->

<!-- ══ CẦU NỐI RESPONSIVE — mốc 768px ═══════════════════════════════════════
     Demo gồm 2 file rời: index.html (bản mobile, < 768px) và desktop.html
     (bản desktop, ≥ 768px, nội dung bó trong max-w 1440). Đoạn này đặt ngay
     sau <title> — TRƯỚC cả link font/CSS — để nếu đang mở nhầm bản thì
     chuyển ngay khi trang chưa kịp tải gì nặng.
     · Đo bằng matchMedia nên cả 2 file dùng CHUNG một phép đo, hai điều kiện
       bù trừ nhau tuyệt đối -> không thể lặp vô hạn qua lại.
     · location.replace (không phải assign) để lần chuyển KHÔNG thêm entry
       vào history — bấm back không bị kẹt giữa 2 file.
     · Trạng thái mang theo qua hash: màn đang xem + ngôn ngữ + phông chữ;
       phần đọc/ghi hash nằm ở cuối <script> chính (tìm "RESP.swapped").
     ═════════════════════════════════════════════════════════════════════ -->
<script>
window.RESP = (function () {
  var BP = 768, IS_DESKTOP = true, OTHER = 'index.html';
  var mq = window.matchMedia('(min-width:' + BP + 'px)');
  var R = {
    bp: BP, other: OTHER, isDesktop: IS_DESKTOP, swapped: false,

    /* bản đang mở có khớp bề ngang hiện tại không */
    fits: function () { return mq.matches === IS_DESKTOP; },

    /* gói trạng thái thành hash; giá trị mặc định thì bỏ qua cho URL gọn */
    hash: function (screen, lang, font, theme) {
      var p = [];
      if (screen && screen !== 'plp') p.push('screen=' + encodeURIComponent(screen));
      if (lang && lang !== 'vi')      p.push('lang=' + encodeURIComponent(lang));
      if (font && font !== 'montserrat') p.push('font=' + encodeURIComponent(font));
      if (theme && theme !== 'd')     p.push('theme=' + encodeURIComponent(theme));
      return p.length ? '#' + p.join('&') : '';
    },

    /* đọc hash file kia để lại */
    read: function () {
      var out = {};
      (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
        if (!kv) return;
        var i = kv.indexOf('=');
        out[i < 0 ? kv : kv.slice(0, i)] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1));
      });
      return out;
    },

    /* chuyển sang bản kia; ẩn trang trong lúc chuyển để không nháy bản sai,
       kèm hẹn giờ mở lại phòng khi điều hướng thất bại (thiếu file) */
    swap: function (screen, lang, font, theme) {
      if (R.swapped) return;
      R.swapped = true;
      document.documentElement.style.visibility = 'hidden';
      setTimeout(function () { document.documentElement.style.visibility = ''; }, 2000);
      location.replace(OTHER + R.hash(screen, lang, font, theme));
    },

    /* Theo dõi kéo giãn cửa sổ qua mốc; state() trả [screen, lang, font, theme].
       Nghe CẢ hai nguồn: matchMedia('change') là đường chính, còn 'resize'
       (gộp nhịp bằng timer) là lưới an toàn — vài môi trường đổi kích thước
       bằng emulation/devtools không bắn 'change'. Cờ swapped chặn gọi trùng. */
    watch: function (state) {
      var fire = function () { if (!R.fits()) { var s = state ? state() : []; R.swap(s[0], s[1], s[2], s[3]); } };
      if (mq.addEventListener) mq.addEventListener('change', fire); else mq.addListener(fire);
      var t = 0;
      window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(fire, 150); });
    }
  };
  /* Mở thẳng nhầm bản: chuyển ngay, giữ nguyên hash để bản kia đọc lại */
  if (!R.fits()) {
    R.swapped = true;
    document.documentElement.style.visibility = 'hidden';
    setTimeout(function () { document.documentElement.style.visibility = ''; }, 2000);
    location.replace(OTHER + (location.hash || ''));
  }
  return R;
})();
</script>

  /* 4 — TITLE DIALOG: ĐỒNG BỘ VỀ **INTER 16 CHỮ HOA** (lệnh user 25/08: *"title Dialog
     sẽ đồng bộ lại dùng inter font cỡ 16 uppercase nhé"*).
     Trước lượt này tiêu đề lớp nổi nói HAI giọng — đo được:
       · 11 sheet/modal dùng chung khuôn header (`Đăng nhập` · `Đã thêm vào giỏ hàng` ·
         `Chọn size` · `Đổi quà tặng` · `Chọn ưu đãi` · sheet chọn tỉnh/phường…):
         **18/24 · 400 · chữ thường**
       · panel BỘ LỌC bị skin-mt kéo riêng về **14/20 · 500 · HOA** (chốt 20/08)
     Nay cả hai về một số duy nhất.

     `font-weight: 500` KHÔNG phải thêm cho đẹp: §1.1 khai `500` và `chữ hoa` là cặp
     không tách rời — hoa mà 400 là nửa cặp, đúng thứ luật cấm.
     `font-family: var(--font-app)` khai tường minh dù các phần tử này vốn đã Inter:
     để nếu về sau bậc trưng bày có nới xuống thì title dialog cũng không bị Bodoni
     kéo đi — và Bodoni thì mục trên vừa khoá là không được hoa.

     ⚠ CỠ 16 LỆCH THANG CHỮ, ghi rõ để khỏi tưởng là sót: §1.2 đã **bỏ hẳn bậc 16**
     (thang chỉ còn 10·12·14·18·24) vì 16 ở desktop là do remap `18 → 16` tự sinh ra,
     không phải từ số đo. Đây là ngoại lệ do user chốt đích danh cho bộ da này, phạm vi
     khoá vào đúng vai title dialog. Muốn về thang thì 18 (giữ nguyên cỡ cũ, chỉ thêm
     hoa) hoặc 14 (bằng panel bộ lọc đang có) — cả hai đều 1 dòng.
     Nhịp `24` mượn hộp dòng của T2 (18/24) — nhờ vậy **chiều cao header sheet 52px và
     nhịp dọc của skin-mt không đổi**, chỉ thân chữ nhỏ đi 2px và thêm chữ hoa. Với
     Inter, 16 cần dòng ≥ 18,24 (dấu ằ 0,93 + chân chữ 0,21 = 1,14 × cỡ) nên 24 thoáng
     dư — không phải chọn bừa.

     HOOK 1 = khuôn header dùng chung của mọi sheet/drawer/modal. Bám tổ hợp utility
     đúng như dự án vẫn làm với `.h-1.rounded-full` / `.h-7.px-3.rounded-full`. PHẢI để
     `p` chứ không phải `*`: cùng tổ hợp class còn một `h1` là tiêu đề TRANG ở màn
     search/PLP (`index.html`) — không phải dialog, không được trúng.
     HOOK 2 = tiêu đề panel bộ lọc; nó là hàng duy nhất chứa nút đóng nên selector
     không vỡ khi thang chữ đổi. (1,4,2) nên thắng rule (1,3,2) của skin-mt.
     KHÔNG trúng, có chủ ý — thẻ Cookie (`.cg-panel`) KHÔNG có `<p>` tiêu đề, chỉ
     `aria-label="Cookie"`: nó là thẻ đồng thuận, không phải dialog có title, nên
     không có gì để khai. Muốn có title thật thì phải sửa markup — nói thì làm.
     HOOK 3 — THÊM 25/08 (lượt chuẩn hoá): sheet "Nhận thông báo khi có hàng"
     (`.ns-panel`). Nó dựng tiêu đề bằng markup riêng (`p.text-[16px].font-medium.
     leading-6`) nên lượt trước lọt — đo được nó đang vẽ ra **12/16 · 400 · chữ
     thường**, tức title lớp nổi DUY NHẤT còn mang cỡ THÂN BÀI. Đó chính là phần chốt
     *"title Dialog sẽ đồng bộ lại"* chưa xong; nay vào chung một số với 11 sheet kia.
     KHAI GIỐNG HỆT ở index.html và desktop.html. */
  html.skin-mt.skin-li p.flex-1.min-w-0.text-\[18px\],
  html.skin-mt.skin-li #filterSheet div:has(> #filterClose) > p,
  html.skin-mt.skin-li .ns-panel p.text-\[16px\] {
    font-size: 16px; line-height: 24px;
    font-family: var(--font-app); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* 5 — F5 THI HÀNH: 12/16 CHỈ CHO CHỮ MỘT DÒNG — chữ xuống dòng về 12/18.
     Đây là việc "CÒN MỞ" của Phần 12 `FONT-LIBRE-INTER.md`, nay làm.
     Vì sao với cặp font này nó là luật CỨNG chứ không phải chuyện nhịp: dấu `ằ` của
     Inter cao 93/100 — cao nhất bảng, hơn Montserrat (83) một bậc rõ. Mực thoáng còn
     lại giữa 2 dòng liền nhau ở 12/16 chỉ **2,32px** (Montserrat 3,64px). Chưa chạm,
     nhưng mọi sai số nhỏ — font dự phòng chớp lúc tải, zoom trình duyệt, dấu `ẳ`/`ẵ`
     — là dính. 12/18 cho 4,32px, thoáng đủ.
     Đo trên trang chạy, quét 17 màn, đếm dòng thật bằng `Range.getClientRects()`:
     **12 tổ hợp phần tử** đang ở 12/16 mà chữ THẬT SỰ xuống dòng. Gom thành 6 hook,
     mỗi hook nhắm đúng một container — KHÔNG dùng blanket:
       1. ghi chú pre-order trong accordion checkout (`#shipOpts` · `#ckSections`).
       2. khối cam kết PDP/giỏ (`p.text-[12px].text-secondary-foreground`, 28 lượt).
       3. 2 dòng pháp lý ở footer — `p` KHÔNG có class nào, nên khai ở CONTAINER
          (`.text-[12px].leading-4.text-mid-alt`) và để `p` thừa hưởng.
       4. ghi chú sheet thông báo hàng về (`.ns-panel p.text-[11px]`).
       5. thẻ Cookie: 3 đoạn `p` + 3 mục `li` (span con thừa hưởng từ `li`).
       6. ghi chú khuyến mãi ở giỏ (`#promoPeek`).
     ⚠ **THÂN ACCORDION PDP ĐÃ RA KHỎI DANH SÁCH NÀY 25/08** (hook cũ số 1,
     `[data-pdp-acc] .acc-inner :is(p, div).text-\[12px\]`): mục 7 dưới đây kéo cả cụm
     accordion PDP lên **14/20**, nên nó không còn là chuyện 12/16 nữa. Điều kiện không
     chạm dòng của Inter là `1,14 × cỡ` = 15,96 ≤ 20 → 14/20 thoáng dư, F5 tự đạt.
     PHẢI GỠ chứ không để chung: hook cũ là (0,5,2), rule mục 7 là (0,4,2) — để lại thì
     hook cũ THẮNG và riêng thân accordion tuột về 12/18 trong khi nhãn đã 14/20.
     Accordion CHECKOUT (`#shipOpts`/`#ckSections`) thì GIỮ ở hook 1 — nó không nằm
     trong `[data-pdp-acc]` nên mục 7 không với tới, và nó vẫn ở cỡ 12.
     Vì sao thắng skin-mt mà không cần `!important`: blanket của nó là
     `:where(.leading-4, .leading-6) { line-height: 16px }` — (0,1,1) và khai SAU
     blanket cỡ, nên `leading-4` mới là thứ kéo về 16. Mọi hook dưới đây từ (0,3,1)
     trở lên.
     PHẠM VI KHOÁ TRONG `skin-li`: skin-mt giữ nguyên 12/16 để còn so — với Montserrat
     đây chỉ là chuyện nhịp, không phải chuyện chạm dấu.
     KHAI GIỐNG HỆT ở index.html và desktop.html. */
  html.skin-mt.skin-li :is(#shipOpts, #ckSections) .acc-inner p.text-\[12px\],
  html.skin-mt.skin-li p.text-\[12px\].text-secondary-foreground,
  html.skin-mt.skin-li .text-\[12px\].leading-4.text-mid-alt,
  html.skin-mt.skin-li .ns-panel p.text-\[11px\],
  html.skin-mt.skin-li :is(#cookieGate, #cookieBar) p.text-\[12px\],
  html.skin-mt.skin-li :is(#cookieGate, #cookieBar) li.text-\[12px\],
  html.skin-mt.skin-li #promoPeek p.text-\[12px\] {
    font-size: 12px; line-height: 18px;
  }

  /* 7 — CỤM ACCORDION PDP: MỘT CỠ 14, KHÔNG CHỮ HOA, NHÃN NHÍCH MỘT NẤC ĐẬM.
     Lệnh user 25/08: *"Trong pdp ở skin-li, các accordions sẽ không uppercase toàn bộ,

       nội dung 14/20 · 400 · chữ thường      (kể cả bảng thông số)
     `500` là nấc duy nhất có thể nhích: §1.1 cấm hẳn 300 · 600 · 700, nên "nhẹ" ở đây

     accordion ở **footer** (14/21 · 500) và ở **giỏ hàng** (14/20 · 500) vốn đã là 500
     chữ thường từ trước — tức cụm PDP mới là chỗ lệch, không phải chỗ này.

     ĐO TRƯỚC KHI SỬA (skin-li): nhãn `12/16 · 500 · HOA` ở 5 bản, `14/20 · 500 · HOA` ở

     VÌ SAO PHẢI KHAI CẢ 2 NHÁNH `[data-screen="pdp3"]`: rule pdp3 của `skin-mt` là
     (0,4,2) — ĐÚNG BẰNG nhánh chung ở đây — và nó khai SAU trong file, nên cùng
     specificity thì nó thắng. Với `font-size`/`line-height` thì vô hại (cùng 14/20),
     nhưng thiếu nhánh này là để một rule của bộ da khác quyết số của bộ da mình; thêm
     nhánh cho lên (0,5,2) là hết phụ thuộc thứ tự khai. Maika làm y vậy.

     `:is(div, p, span)` cho phần nội dung, KHÔNG phải `> div`: 2 file dựng ruột
     accordion KHÁC NHAU — mobile để chữ thẳng trong `div`, desktop bọc thêm `<p>` và
     hàng thông số `<span>`. Một selector phủ cả hai thì rule khai giống hệt được ở 2
     file. Kèm theo: **bảng thông số lên 14 luôn** (mục 5 trước đây cố ý bỏ `span` để
     không đổi nhịp bảng — nay cả cụm cùng một cỡ nên không còn lý do chừa).

     và nằm chung màn, còn accordion GIỎ/CHECKOUT thì ở màn khác — cả ba đều không được
     trúng. Móc `[data-pdp-acc]` gắn ở cụm tab của cả 6 bản PDP nên một rule phủ hết.
     HỆ QUẢ: sau lượt này 6 bản PDP của `skin-li` không còn khác nhau ở cụm accordion —
     kể cả pdp3 (vốn là bản duy nhất ở cỡ 14) và pdp2 (bảng thông số). Muốn giữ pdp3
     khác thì phải nói, vì hiện lệnh là "toàn bộ".
     KHAI GIỐNG HỆT ở index.html và desktop.html. */
  html.skin-mt.skin-li [data-pdp-acc] .acc-trigger > span:first-child,
  html.skin-mt.skin-li [data-screen="pdp3"] [data-pdp-acc] .acc-trigger > span:first-child {

  html.skin-mt.skin-li [data-screen="pdp3"] [data-pdp-acc] .acc-inner :is(div, p, span) {

  }

     Ba chỗ cố ý lệch số của họ (FONT-LIBRE-INTER §9.3): giữ cặp 500⇔HOA của §1.1 ·

     sàn cỡ Libre Bodoni theo mật độ màn (F1). */

  /* 0 — MẶT CHỮ + TRACKING NỀN. Inter cấp qua --font-app của bộ da; Libre Bodoni
     chỉ vào ở bậc trưng bày (mục 1). */
  html.skin-mp body { font-family: var(--font-app); letter-spacing: 0.5px; }

  /* 1 — THANG CHỮ: gom về 12 làm ngựa thồ, đảo phân bố cho giống họ. */
  html.skin-mp :where(.text-\[9px\], .text-\[10px\]) { font-size: 10px; line-height: 14px; }
  html.skin-mp :where(.text-\[11px\], .text-\[13px\], .text-\[14px\], .text-\[15px\], .text-\[16px\]) { font-size: 12px; line-height: 18px; }
  html.skin-mp :where(.text-\[18px\]) { font-size: 18px; line-height: 24px; }
  /* Bậc trưng bày: giữ cỡ 24 của mytheresa (lệnh user 25/08). Libre Bodoni chỉ vào
     khi nét mảnh ≥1 pixel THIẾT BỊ — cỡ 48 luôn đủ, cỡ 24 cần màn ≥2×. */
  html.skin-mp :where(.text-\[22px\], .text-\[24px\], .text-\[32px\]) { font-size: 24px; line-height: 32px; }
  html.skin-mp :where(.text-\[48px\]) { font-size: 48px; line-height: 60px; font-family: var(--font-head); }
  html.skin-mp :where(.text-\[22px\], .text-\[24px\], .text-\[32px\], .text-\[48px\]) { letter-spacing: 0.5px; }
  @media (min-resolution: 2dppx) {
    html.skin-mp :where(.text-\[22px\], .text-\[24px\], .text-\[32px\]) { font-family: var(--font-head); }
  }

  /* 2 — NHỊP DÒNG: leading-4/6 = 16 (một dòng) · leading-5/relaxed = 18 (nhiều dòng). */
  html.skin-mp :where(.leading-3) { line-height: 14px; }
  html.skin-mp :where(.leading-4, .leading-6) { line-height: 16px; }
  html.skin-mp :where(.leading-5, .leading-relaxed) { line-height: 18px; }
  html.skin-mp :where(.leading-7, .leading-\[28px\], .leading-\[25px\]) { line-height: 24px; }
  html.skin-mp :where(.leading-8, .leading-10, .leading-none, .leading-snug) { line-height: 32px; }

  /* 3 — BẬC NHẤN 14/20 = chỗ mytheresa đặt 14/18.2: nút hành động rộng. Trigger bộ
     lọc KHÔNG thuộc bậc này — của họ là 12/16.8, tức ngựa thồ. */
  html.skin-mp .btn-p, html.skin-mp .btn-o,
  html.skin-mp #menuSheet .ms-tab { font-size: 14px; line-height: 20px; }
  html.skin-mp .btn-s { font-size: 12px; line-height: 16px; }
  html.skin-mp #filterSheet .facc-trigger,
  html.skin-mp #filterSheet .facc-trigger > span:first-child { font-size: 12px; line-height: 16px; }

  /* 4 — ĐỘ ĐẬM. §1.1: chỉ 400 và 500, và 500 ĐI CẶP chữ hoa. Đo trước khi sửa:
     skin-mp rò 300/600/700, và có 120 chỗ `font-medium` cho chữ THƯỜNG (nét 1,40 =
     nặng ngang mytheresa). Kéo hết về 400; các vai chữ HOA của menu khai lại 500
     bên dưới để không rơi vào nửa cặp còn lại ("hoa mà 400" cũng bị §1.1 cấm). */
  html.skin-mp .font-light, html.skin-mp .font-normal, html.skin-mp .font-medium,
  html.skin-mp .font-semibold, html.skin-mp .font-bold,
  html.skin-mp b, html.skin-mp strong { font-weight: 400; }

  /* 5 — TRACKING 0,5px tuyệt đối (mytheresa giữ 0,5px trên 100% phần tử, cả 2 khổ).
     Popover Cài đặt được miễn theo §5 — nó là công cụ dev. */
  html.skin-mp [class*="tracking-"] { letter-spacing: 0.5px; }
  html.skin-mp #settingsPanel [class*="tracking-"] { letter-spacing: 0.12em; }

  /* ══ BỘ DA "Mytheresa · chữ hoa" ═════════════════════════════════════════════
     (18/08/2026, yêu cầu user: "thêm một theme uppercase các title menu và màu
     sắc tương tự mytheresa.com".)
     Cùng cơ chế `html.skin-*` như bộ da trên: không có class thì khối nằm im.

     stylesheet + 4357 rule của main.css đã nạp, nên số dưới đây là số thật chứ

         12px · weight 400 · text-transform uppercase · letter-spacing 0.5px ·

       · viền: #dfdfdf áp đảo (162 chỗ), thêm #999999 rải rác
       · mặt xám: #f2f2f2 · xám chữ #666666

     KHÔNG có màu đỏ nào trên trang họ -> `--general-destructive` GIỮ đỏ gốc của

     chỗ duy nhất của bộ da này không lấy từ mytheresa.

     PHÔNG: dùng Montserrat (mặc định dự án) — cùng họ sans HÌNH HỌC với Avenir
     Next nên gần nhất, không phải nạp thêm face nào. */

    --unofficial-accent: #0a0a0a;

  /* `.cc-drop` phải đi kèm `.dk-modal`: tấm "Đã thêm vào giỏ" từ 19/08/2026 KHÔNG

  html.skin-mt .dk-modal, html.skin-mt .cc-drop { border-radius: 0 !important; }

  /* ── 2. NAV CHỮ HOA — yêu cầu chính của bộ da này ──
     Viết hoa bằng `text-transform`, KHÔNG gõ hoa vào chuỗi: chuỗi gốc là key i18n
     ("Nam"/"Nữ"/"Quần áo"…), gõ hoa vào là mất bản dịch.
     Đây là NGOẠI LỆ có chủ ý của quy ước "không dùng UPPERCASE" — và là ngoại lệ
     AN TOÀN vì nằm trong một bộ da phải tự bật, mặc định của file không đổi.
     line-height lấy 16px (cặp 12/16 của thang chữ) thay vì 16.8px đo được —
     lệch 0.8px không nhìn ra mà giữ được thang. */
  html.skin-mt .navbar .dk-dept,
  html.skin-mt .navbar .dk-nav-link {
    font-size: 12px; line-height: 16px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  /* Đè 2 rule font-weight 600 của state đang chọn ở khối gốc: mytheresa không
     phân biệt state bằng độ đậm, việc đánh dấu để gạch chân lo. Cùng 500 với lúc
     nghỉ nên nav MỘT độ đậm ở mọi state. */
  html.skin-mt .navbar .dk-dept[aria-current],
  html.skin-mt .navbar .dk-nav-link[aria-current] { font-weight: 500; }
  /* Hàng tab Nam/Nữ/Làm đẹp ở màn Search (dưới thanh tìm kiếm) — CÙNG VAI "chọn
     ngành hàng" với `.dk-dept` trên nav, nên lấy đúng bộ số của nó: 12/16 · 500 ·
     uppercase · ls .5. Trước 19/08/2026 hàng này KHÔNG có rule bộ da nào nên ra
     chữ thường, đứng cạnh nav chữ hoa là lệch hẳn (user báo).
     Bản mobile khai cặp `.ms-tab, .search-tab` chung một rule; ở file này drawer
     `#menuSheet` là code chết nên chỉ còn `.search-tab`.
     ⚠ Cỡ chữ 2 bản CỐ Ý LỆCH: mobile 14px (hàng dept của họ ở khổ 375 đo ra 14),
     desktop 12px (khổ 1280 đo ra 12) — mỗi khổ theo số đo của chính nó, giống
     đúng cách `.ms-tab` vs `.dk-dept` đang làm. Weight thì CÙNG 500.
     Chiều cao không đổi: nút vẫn `h-10`.

     ⚠ PHẢI viết `button.search-tab`, KHÔNG được để `.search-tab` trơn — BẪY
     SPECIFICITY đã dính nhiều lần trong dự án (xem `.pc-brand` ở mục 9):
       `html.skin-mt .search-tab`  = (0,2,1)
       `html.skin-mt .text-[16px]` = (0,2,1)  <- blanket cỡ chữ ở mục 5
       `html.skin-mt .font-light…` = (0,2,1)  <- blanket weight ở mục 5
     CÙNG HẠNG mà mục 5 viết SAU nên mục 5 thắng -> chỉ mỗi `text-transform` ăn
     (blanket không khai nó), còn cỡ chữ và weight bị đè. Thêm `button` nâng lên
     (0,2,2) là thắng cả hai. */
  html.skin-mt button.search-tab {
    font-size: 12px; line-height: 16px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  /* "Khuyến mãi" ở subheader: GIỮ MÀU ĐỎ, bộ da KHÔNG đè (chốt 19/08/2026, yêu
     cầu user). Trước đây khối này ép nó về #000 theo số đo — SALE trên trang họ
     không tô đỏ. Nay bỏ hẳn rule đó nên mục này ăn màu từ rule gốc
     `.navbar .dk-nav-link.text-destructive { color: var(--general-destructive) }`,
     tức ĐỎ ở cả 3 bộ da.
     Nhất quán với quyết định đã có của chính bộ da này: `--general-destructive`
     vốn đã GIỮ đỏ gốc dự án chứ không đơn sắc hoá, vì badge -% và viền lỗi form
     phải đọc ra là cảnh báo. Mục khuyến mãi cùng loại tín hiệu đó. */
  /* Gạch chân 2px đánh dấu mục đang chọn / đang mở panel — KHÔNG đo được state
     đang chọn của họ; giữ cách đánh dấu này vì nav 12px chữ hoa cần một mốc thị
     giác, và nó đã dùng ở bộ da MR PORTER nên 2 bộ da nhất quán. */
  html.skin-mt .navbar .dk-nav-item { position: relative; }
  html.skin-mt .navbar .dk-nav-item::after {
    content: ''; position: absolute; left: 16px; right: 16px; bottom: 0; height: 2px;
    background: var(--general-primary); opacity: 0; transition: opacity .15s ease;
  }
  html.skin-mt .navbar .dk-nav-item.on::after,
  html.skin-mt .navbar .dk-nav-item:has([aria-current])::after { opacity: 1; }

     Lệnh user: *"promo bar nằm trên thanh header sẽ màu đen nhé"*. Bản gốc vốn đã đen

  /* ── 4. Mega panel: trắng đặc, viền #dfdfdf, nhãn nhóm hoa ĐEN ──

  html.skin-mt .dk-mega { background: var(--general-background); border-bottom: 1px solid var(--general-border); }

  html.skin-mt .dk-mega-teaser { border-left: 1px solid var(--general-border); padding-left: 40px; }

     (size|weight|transform|tracking|family) đang thực sự vẽ chữ:
       592 phần tử  12px · 400 · none      · 0.5px · AvenirNextLTPro   <- THÂN BÀI
        73 phần tử  12px · 400 · uppercase · 0.5px                     <- nav
        60 phần tử  12px · 400 · lowercase · 0.5px  ("original price")
         8 phần tử  16px · 400 · none      · 0.5px  ("Jackets")        <- tiêu đề mục
         6 phần tử  20px · 400 · none      · 0.5px · OptimaLTPro       <- tiêu đề khối

     3 KẾT LUẬN quan trọng:

       ta 32              -> 24   | họ 28 -> 24 (28 không có trong thang)

  html.skin-mt .font-light, html.skin-mt .font-normal, html.skin-mt .font-medium,
  html.skin-mt .font-semibold, html.skin-mt .font-bold,
  html.skin-mt b, html.skin-mt strong { font-weight: 400; }
  /* (c) ── §4.2 THI HÀNH: REMAP THEO CẶP CỠ + DÒNG, TOÀN APP (24/08/2026) ─────────
     Thay 5 rule "chỉ đổi cỡ" cũ. Hai việc trong một:
       1. Hết lệch cặp (bản dò 24/08 đếm 489 chỗ ở khổ này): cỡ bị kéo về 12 nhưng
          `leading-5` (20) trong markup vẫn nguyên -> 1.67, không có trong thang.
       2. **HẾT LỆCH 2 BẢN** (§1.2 đòi CÙNG thang, §4.3-4 đòi khai giống hệt): bảng
          cũ của khổ này lệch mobile ở 4 cỡ — `16→14` (mobile 12), `18→16` (mobile

          đúng một bảng cho cả 2 file.
     Đã dò toàn file các cặp `text-[Npx]` × `leading-*` thật sự tồn tại: mỗi utility
     dòng chỉ gặp ĐÚNG MỘT họ cỡ, nên khai theo utility là đủ.
     `:where()` cho cả khối specificity (0,1,1): thắng utility Tailwind (0,1,0) nhưng
     NHƯỜNG mọi rule tường minh của bộ da (0,2,1)+ — nhờ vậy `.pc-brand` 14/20, nhãn
     nav `.dk-dept`/`.dk-nav-link` 12/16 hoa, tiêu đề panel bộ lọc 14/20 giữ nguyên số.
     Thang đích §1.2: T7 10/14 · T4 12/16 · T5 12/18 · T2 18/24 · T1 24/32.
     KHAI GIỐNG HỆT ở index.html. */
  html.skin-mt :where(.text-\[9px\], .text-\[10px\]) { font-size: 10px; line-height: 14px; }
  html.skin-mt :where(.text-\[11px\], .text-\[13px\], .text-\[14px\], .text-\[15px\], .text-\[16px\]) { font-size: 12px; line-height: 18px; }
  html.skin-mt :where(.text-\[18px\]) { font-size: 18px; line-height: 24px; }
  html.skin-mt :where(.text-\[22px\], .text-\[24px\], .text-\[32px\], .text-\[48px\]) { font-size: 24px; line-height: 32px; }
  /* Dòng theo utility — viết SAU khối cỡ để thắng nó (cùng specificity, sau thắng trước) */
  html.skin-mt :where(.leading-3) { line-height: 14px; }
  html.skin-mt :where(.leading-4, .leading-6) { line-height: 16px; }
  html.skin-mt :where(.leading-5, .leading-relaxed) { line-height: 18px; }
  html.skin-mt :where(.leading-7, .leading-\[28px\], .leading-\[25px\]) { line-height: 24px; }
  html.skin-mt :where(.leading-8, .leading-10, .leading-none, .leading-snug) { line-height: 32px; }
  /* Ô chọn của component `pickField`: chữ MỘT DÒNG (`truncate`) trong ô cao 40 -> 1.33
     (AUDIT 24/08 mục B-7; bảng bàn giao shadcn ghi hàng Select = `text-sm` 12/16).
     Sửa ở đây là sửa luôn ô chọn tỉnh / phường ở checkout — cùng một component. */
  html.skin-mt .pick-label { line-height: 16px; }

  /* ── 6. CHIỀU CAO 2 HÀNG HEADER = 64/64 — ĐÃ DỜI RA KHUÔN CHUNG (25/08/2026) ──
     6 rule cũ ở đây (`#dkNavRow` · `#dkSubRow` · 4 offset sticky) đã GỠ và gom vào

     nằm ngay sau khối offset sticky của base. Lý do: từ 25/08 Maika và bộ da mặc
     định cũng dùng 64/64, để 3 bản sao thì 4 số offset chắc chắn có cái bị bỏ sót.
     skin-mt KHÔNG đổi số nào — vẫn 64/64 + 128/144/144/152, chỉ đổi chỗ khai. */

  /* ── 7. Hàng dept (Nam · Nữ · Làm đẹp): GẠCH CHÂN khi đang chọn ──
     ⚠ CỐ Ý LỆCH mytheresa: đo thật cả 4 mục WOMEN/KIDS/MEN/LIFE trên trang men

     ::after/::before đều `content: none`. Tức họ KHÔNG đánh dấu hàng dept.
     User chốt 18/08/2026 vẫn muốn có gạch chân "tương tự subheader" — hợp lý cho
     demo, và khớp quyết định 13/08 của dự án là state đang chọn phải đọc ra được.
     left/right 16px = px-4 của nút nên vạch dài đúng bằng chữ; bottom 0 là đáy
     NÚT h-9, không phải đáy hàng 64px — đặt ở đáy hàng thì vạch rơi cách chữ 14px,
     đọc ra là đường kẻ của thanh chứ không phải gạch chân của mục. */
  html.skin-mt .navbar .dk-dept { position: relative; }
  html.skin-mt .navbar .dk-dept::after {
    content: ''; position: absolute; left: 16px; right: 16px; bottom: 0; height: 2px;
    background: var(--general-primary); opacity: 0; transition: opacity .15s ease;

  html.skin-mt .navbar .dk-dept[aria-current]::after { opacity: 1; }

  /* ── 8. HỆ VIỀN / GẠCH CHÂN theo SỐ ĐO THẬT (18/08/2026, yêu cầu user) ────────
     Đo `mytheresa.com/euro/en/men/clothing` + 1 PDP (`saman-amel-…-p01048872`),
     quét MỌI phần tử có viền thấy được, ghi cả cạnh · độ dày · màu · phần tử:

       155 chỗ  border-bottom 1px #dfdfdf  <- `headerdesktop__section` (CẢ 2 HÀNG
                                             NAV), hàng danh sách, ô nhập form
         6 chỗ  border 1px #000 (4 cạnh)   <- ô chọn size (`dropdown__select__content`,
                                             nền TRẮNG + viền đen) VÀ nút nền đen
                                             (`.button` — viền cùng màu nền nên vô
                                             hình; ĐỪNG đọc thành nút viền)
         6 chỗ  border-top 1px #000        <- `accordion__item` ("product details")
         4 chỗ  border 1px #dfdfdf (4 cạnh)<- ô nhập form, danh sách option dropdown
         1 chỗ  border 1px #999999 (4 cạnh)<- `.button--disabled` ("Subscribe"): nền
                                             #999 chữ trắng = TRẠNG THÁI DISABLED,
                                             không phải nút phụ (mình từng đọc sai)
       gạch chân: 8 link inline `underline auto rgb(0,0,0)` (đen, dày/offset auto)

     => LUẬT CỦA HỌ, rõ ràng 2 tầng:
          #000 1px    = phần tử TƯƠNG TÁC / chính: nút CTA, ô chọn size, vách
                        accordion, gạch dưới ô tìm kiếm
          #dfdfdf 1px = phần tử KẾT CẤU / phụ: vách 2 hàng nav, ô nhập form,
                        danh sách option
     NÚT CHÍNH của họ là NÚT NỀN ĐEN chữ trắng, KHÔNG phải nút viền — xem ghi chú
     dài ở rule `.btn-p` bên dưới về lần đọc sai và cách đo lại cho đúng. */
  /* Vách 2 hàng nav — thay vì chỉ 1 hairline ở đáy cả khối (.navbar::after).
     HẠ 1 NẤC #dfdfdf -> #ececec (yêu cầu user 18/08/2026: "giảm màu underline của
     cate trong menu xuống nhẹ nhàng hơn"). #ececec là bậc nhạt hơn liền kề trong
     chính bảng màu của bộ da này (đang dùng cho --unofficial-border-1). */
  html.skin-mt #dkNavRow { border-bottom: 1px solid var(--unofficial-border-1); }
  html.skin-mt .navbar .dk-sub { border-bottom: 1px solid var(--unofficial-border-1); }
  /* Vách hàng danh sách GIỮ #ececec (không kéo lên #dfdfdf như bản trước) — cùng
     lý do trên: hàng danh mục trong menu dùng đúng token này. */
  html.skin-mt { --unofficial-border-1: #ececec; }
  /* Accordion PDP: vách TRÊN màu ĐEN (họ dùng border-top #000). Utility `border-b`
     trong markup phải bị triệt, không thì có 2 vách.
     BẮT BUỘC bám `.acc.border-b`, KHÔNG bám `.acc` trơn: class .acc còn dùng cho
     THẺ KHUYẾN MÃI (`acc bg-accent-0 rounded-sm`) vốn không có vách nào — bám .acc
     trơn là mọc thêm vạch đen trên đầu mấy thẻ đó (đã dính đúng lỗi này lúc kiểm).
     `.border-b` cũng chính là dấu hiệu "accordion này CÓ vách" nên lọc bằng nó là
     đúng nghĩa, không phải mẹo. */
  /* Vách accordion: HẠ TỪ #000 XUỐNG #dfdfdf (yêu cầu user 18/08/2026 — "các nội
     dung trong pdp xuống màu nhẹ nhàng hơn"). Số đo của họ là #000, đây là lệch
     CÓ Ý THỨC: vạch đen đặc chạy ngang cả cột PDP đọc ra rất nặng. Giữ nguyên
     hướng vách TRÊN (đúng họ), chỉ đổi màu. */
  html.skin-mt .acc.border-b { border-top: 1px solid var(--general-border); border-bottom-width: 0; }

  /* ── 9. HẠ TÔNG NỘI DUNG + BRAND NAME + KHOẢNG CÁCH BADGE (18/08/2026) ────────
     a) Chữ NỘI DUNG nhẹ hơn: tách 2 tầng mực thay vì đen tuyền cả trang.
        `--general-foreground` / `--general-primary` GIỮ #000 (tiêu đề, nav, nút);
        2 token chữ chạy hạ về #333333 (12.6:1 trên trắng, còn dư chuẩn AA).
        Đây là lệch có ý thức so với số đo (họ để #000 cho cả chữ chạy). */
  html.skin-mt {
    --general-secondary-foreground: #333333;
    --unofficial-foreground-alt: #333333;
  }
  /* b) BRAND NAME +1 bậc weight: 400 -> 500. Bộ da đang ép mọi thứ về 400 (mục 5)
        nên phải khai lại, và rule này (0,2,1) đứng SAU khối blanket nên thắng.
        `.pc-brand` = hook mới thêm vào markup: tên thương hiệu trên card sản phẩm
        và ở sheet quick-add; `h1` = tên thương hiệu ở PDP. */
  /* BRAND = HỌ NỘI DUNG, CHỮ THƯỜNG (24/08/2026 — user: *"tên brand không cần
     uppercase toàn bộ"*, ĐẢO chốt C1 20/08 "brand = họ nhãn 500 + HOA").
     Gỡ hoa thì theo §1.1 phải gỡ luôn 500 (cặp không tách rời) -> brand về 400;
     phân cấp so với tên sản phẩm chuyển sang đòn bẩy hợp luật cho họ nội dung là
     BẬC CỠ: brand T3 14/20 · tên sp 12 · mực #333. (Đo trước khi sửa: brand chỉ
     hơn tên sp 34/255 về mực nên mực một mình không gánh được phân cấp.)
     KHAI GIỐNG HỆT ở index.html — sửa 1 file nhớ sửa cả 2. */
  html.skin-mt .pc-brand {
    font-weight: 400; text-transform: none;
    font-size: 14px; line-height: 20px; letter-spacing: 0.5px;
  }
  html.skin-mt h1 { font-weight: 500; }
  /* c) Badge trên card PLP: khoảng cách dọc 4px -> 8px (1 nấc trên lưới 4px).
        `.pc-badges` = hook mới thêm vào cụm badge; đè utility `gap-1`. */
  html.skin-mt .pc-badges { gap: 8px; }
  /* NÚT CHÍNH: GIỮ NỀN ĐEN chữ trắng — KHÔNG đổi thành nút viền.
     ⚠ Mình đã từng kết luận SAI ở đây (user bắt lỗi 18/08/2026). Nguyên nhân:
     `find()` bắt phải thẻ BỌC `.productbuttons` (nền trong suốt) thay vì nút thật
     `.button`. Đo lại đúng phần tử `.button`:
         background rgb(0,0,0) · color rgb(255,255,255) · border 0.8px rgb(0,0,0)
         · radius 0 · cao 44 · nhãn .button__text 14px/400
     Viền `#000` 4 cạnh của nó CÙNG MÀU NỀN nên vô hình — chính vì vậy bảng thống
     kê viền đếm nó thành "6 chỗ border 1px #000", dễ tưởng là nút viền.
     => bộ da KHÔNG khai gì cho .btn-p; nền đen + góc vuông (radius token đã = 0)
     là đã khớp họ. Chỉ còn khác: nhãn của họ 14px, nút của ta 16px -> đã được
     bảng quy đổi cỡ chữ ở mục 5 kéo về 12px, muốn đúng 14 thì phải khai riêng. */
  /* Ô chọn size: viền ĐEN (họ để #000 cho ô này, khác ô nhập form #dfdfdf) */
  html.skin-mt [data-size-trigger] { border-color: var(--general-primary); }
  /* ── Ô TÌM KIẾM: chỉ GẠCH DƯỚI đen, kiểu input underline của họ ───────────────
     ⚠ SỬA LẠI 19/08/2026 (user báo *"search chưa được đồng bộ ở các skin"*).
     Rule cũ bám `#dkSearchInput` — tức cái INPUT nằm BÊN TRONG hộp. Mà input đó
     vốn đã `background: transparent; border: 0`; thứ vẽ ra hộp là thẻ bọc
     `#dkNavSearchField` (`background: var(--general-secondary)` + `border-radius`).
     Hệ quả: bộ da vẽ vạch đen NẰM TRONG hộp xám -> ra một cái hộp xám có kẻ ngang
     ở giữa, không phải ô underline. Đo được lúc kiểm: hộp vẫn `rgb(242,242,242)`
     bo 0, input mang `border-bottom 0.8px rgb(0,0,0)`.
     Sửa: bỏ nền + đưa gạch dưới lên ĐÚNG thẻ bọc, và gỡ khai báo ở input.
     `:focus-within` vẫn đổi `border-color` sang `--general-primary` = #000 ở bộ da
     này nên vạch giữ nguyên màu khi focus, không cần khai thêm.
     Bỏ padding NGANG để chữ thẳng lề — hộp nền mất rồi thì 12px thụt vào đọc ra
     là lệch chứ không phải padding. */
  /* ── QUICK ADD KIỂU HOVER: rê chuột vào ảnh -> hiện dải SIZE ────────────────
     Chốt 19/08/2026, yêu cầu user — CHỈ bộ da này. 2 bộ da kia giữ nút giỏ tròn
     + dialog quick add 2 cột như cũ.
     Markup `.pc-sizes` luôn có trong card; toàn bộ việc bật/tắt nằm ở đây nên
     JS không phải biết đang ở bộ da nào.
     Dải nằm ĐÈ ĐÁY ẢNH, nền trắng đục để chữ đọc được trên ảnh bất kỳ; trượt
     lên 6px khi hiện cho ra cảm giác đẩy từ mép ảnh.
     ẨN NÚT GIỎ TRÒN ở bộ da này: nó và dải size cùng một vai "thêm nhanh", để cả
     hai vừa đá nhau vừa chồng chỗ (nút ở góc phải-dưới, đúng chỗ dải size).
     `display` của nút là INLINE STYLE trong markup nên buộc !important. */
  html.skin-mt .quick-add { display: none !important; }
  .pc-sizes { display: none; }
  /* ĐO THẬT hugoboss.com/us/men-clothing (19/08/2026, user gửi làm tham chiếu) —
     tấm `.product-tile-plp__quickshop` của họ:
       absolute, ghim ĐÁY tile, rộng hết bề ngang · nền rgba(249,249,249,.9)
       lưới size: `display: grid` · `repeat(auto-fill, minmax(54px, 1fr))` · gap 4
       nhãn size 14/17.5 · 400 · KHÔNG viền · size hết #999
     3 chỗ LỆCH CÓ CHỦ Ý, đều theo yêu cầu user:
       · THÊM background-blur — họ để `backdrop-filter: none`, chỉ có nền đục 90%.
         Dùng đúng 7.5px của dự án (cùng số với .navbar/.glass-95), nên hạ độ đục
         xuống .82 cho lớp mờ đọc ra được.
       · CĂN GIỮA nhãn — họ `text-align: left`.
       · Ô size dạng OUTLINE "như bên trong PDP" — họ không viền. Lấy đúng bộ số
         của `.chip` ở PDP: cao 36 (h-9), viền 1px --general-border, chữ 12/16
         (thang chữ mục 5 kéo 14 -> 12), weight 400, góc vuông.
     LƯỚI CỐ ĐỊNH 4 CỘT (chốt 19/08/2026, yêu cầu user "1 line sẽ có 4 ô size").
     Trước đó dùng auto-fit nên số cột đổi theo bề ngang card — 4 cột cố định thì
     ô size rộng bằng nhau ở mọi mật độ lưới, và bộ 6 size xuống đúng 2 hàng. */
  html.skin-mt .pc-sizes {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4px;
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px;
    /* NỀN LẤY ĐÚNG BỘ MÀU CỦA HEADER (chốt 19/08/2026, yêu cầu user).
       Dùng thẳng token `--general-background-blur` — token dành riêng cho MẶT
       PHẲNG CÓ BLUR trong hệ token của dự án (tailwind map thành `bg-blur`),
       thay vì tự pha lại bằng color-mix như `.glass-95`. Cùng ra trắng ~90-95%
       nhưng đây mới là chỗ hệ token định nghĩa sẵn, không phải công thức chép tay.
       Đổi bộ da là tấm đổi theo: bản gốc + skin-mt đều `#ffffffe5`, mode GM
       trong tokens.css là `#f5f5f5`.
       (Trước đây hardcode rgba(249,249,249,.82) chép của hugoboss — đứng yên ở
       mọi bộ da, không ăn nhập với header của chính mình.)
       Blur giữ 7.5px = đúng số của `.navbar`.
       21/08/2026 (yêu cầu user): hạ độ đục 90% -> 75% cho nhìn xuyên ảnh nhiều
       hơn — pha bằng đúng công thức họ `.glass-*` của dự án (color-mix trên
       token nền, mode GM đổi theo); dòng token cũ giữ làm fallback cho trình
       duyệt không có color-mix. */
    background: var(--general-background-blur);
    background: color-mix(in srgb, var(--general-background) 75%, transparent);
    -webkit-backdrop-filter: blur(7.5px);
            backdrop-filter: blur(7.5px);
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  /* ÍT SIZE (dưới 4 — Onesize, 1 dung tích, hay 2 khổ khăn lụa): bỏ lưới 4 cột,
     xếp thành MỘT HÀNG ô tự co theo nội dung rồi CĂN GIỮA.
     `grid-auto-flow: column` + `grid-auto-columns: minmax(96px, auto)`:
       · `auto` = ô nở ra vừa đủ chữ -> nhãn dài "90 × 90 cm" KHÔNG bị cắt
         (lưới 4 cột cứng bóp ô về 76px, thiếu chỗ — user báo 19/08/2026);
       · `96px` là sàn để 1 ô lẻ như "Onesize" không co lại thành mẩu bé tí.
     `grid-template-columns: none` bắt buộc: không huỷ thì 4 cột của rule trên
     vẫn còn, ô sẽ xếp vào đó thay vì theo auto-columns. */
  html.skin-mt .pc-sizes.is-few {
    grid-template-columns: none;
    grid-auto-flow: column;
    grid-auto-columns: minmax(96px, auto);
    justify-content: center;
  }
  /* `.group` = thẻ bọc card, đã có sẵn trong markup */
  html.skin-mt .group:hover .pc-sizes,
  html.skin-mt .pc-sizes:focus-within { opacity: 1; transform: none; pointer-events: auto; }
  /* KHÔNG VIỀN (chốt 19/08/2026, yêu cầu user "thử bỏ outline ra khỏi các buttons
     size") — trở lại đúng cách hugoboss làm.
     HOVER LẤY ĐÚNG CỦA CỤM NAM/NỮ/LÀM ĐẸP trên header (chốt 19/08/2026, yêu cầu
     user): cụm đó là `.dk-dept.ghost-hover`, và `.ghost-hover:hover` khai
     `background: var(--unofficial-ghost-hover); color: var(--general-primary)`.
     Chép ĐÚNG 2 khai báo đó thay vì gắn thêm class `.ghost-hover` vào markup:
     rule nghỉ ở đây là (0,2,1), `.ghost-hover:hover` chỉ (0,2,0) nên gắn class
     cũng vô dụng — nền trong suốt lúc nghỉ sẽ đè mất hover.
     Cùng lý do đó, KHÔNG dùng `--general-secondary` nữa (bản trước). */
  /* `white-space: nowrap` + pad ngang 8: bảo đảm HIỆN ĐỦ NHÃN (yêu cầu user
     19/08/2026). Không có nowrap thì nhãn 2 chữ như "90 ml" hay "90 × 90 cm" tự
     xuống dòng trong ô cao 36px và bị cắt mất dòng dưới. */
  html.skin-mt .pc-size {
    height: 36px; padding: 0 8px;
    display: flex; align-items: center; justify-content: center;
    border: 0; background: transparent; white-space: nowrap;
    font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: .5px;
    color: var(--general-foreground);
    transition: background-color .15s ease, color .15s ease;
  }
  html.skin-mt .pc-size:hover {
    background: var(--unofficial-ghost-hover);
    color: var(--general-primary);
  }
  /* Size ĐÃ HẾT: chữ #999 đúng số đo của họ, thêm gạch ngang cho đọc ra ngay.
     VẪN BẤM ĐƯỢC (bấm là mở khung nhận thông báo) nên KHÔNG dùng [disabled] —
     disabled thì mất luôn sự kiện click. Hover vẫn nổi nền để thấy bấm được. */
  html.skin-mt .pc-size.is-oos { text-decoration: line-through; }

  html.skin-mt #dkNavSearchField {
    background: transparent; border-radius: 0;

/* Card sản phẩm — Card-item của Figma (2541:175787)
   giá bán #d62845 Medium 14/20 + badge -%% nền #fef2f2 · giá gốc gạch ngang #737373
   Dùng chung cho: grid PLP, hàng gợi ý PDP, "Show more". */
function productCard(p, i, { w = '', badge = '', noColors = false, pillBadges = null } = {}) {
  return `
  <div class="bg-card flex flex-col cursor-pointer group ${w}" data-product="${i}">
    <div class="relative w-full overflow-hidden bg-secondary" style="aspect-ratio:189/252">
      <img src="${A}${p.img}" alt="${p.name}" class="absolute inset-0 w-full h-full object-cover lazy">
      ${(() => {
        // Frame 427319869: chồng dọc gap 4, cách mép trên 8 / sát trái;
        // mỗi nhãn px 4, chữ Medium 12/16 #0a0a0a, nền trắng 90%
        const tags = [...(badge ? [badge] : []), ...(pillBadges || [])];
        return tags.length ? `
      <div class="pc-badges absolute top-2 left-0 flex flex-col items-start gap-1">
        <!-- data-i18n-skip khi là wordmark "Pre-order": không có nó thì lượt dịch
             ngược EN->VN biến badge thành "Đặt trước" (trùng chuỗi với nút) -->
        ${tags.map(b => `<span ${b === 'Pre-order' ? 'data-i18n-skip ' : ''}class="badge-label px-1 text-[12px] font-medium leading-4 text-foreground">${b}</span>`).join('')}
      </div>` : '';
      })()}
      <!-- LỚP SIZE HIỆN KHI RÊ CHUỘT VÀO ẢNH — chỉ bật ở bộ da Mytheresa
           (chốt 19/08/2026, yêu cầu user). Markup dựng cho MỌI bộ da, việc
           hiện/ẩn do CSS gác: bộ da khác vẫn dùng nút giỏ + dialog quick add như
           cũ, không phải rẽ nhánh trong JS.
           Liệt kê ĐỦ size, kể cả size đã hết (đánh dấu data-oos) — user yêu cầu
           rõ; bấm size hết thì mở khung nhận thông báo khi có hàng.
           Hàng làm đẹp (p.sizes) không có size hết nên off luôn false. -->
      ${(() => {
        /* Size lấy ĐÚNG bộ của PDP sản phẩm này — xem pcSizesOf(). */
        const list = pcSizesOf(p, i);
        /* ÍT SIZE (dưới 4, tức không lấp đầy một hàng): thêm `is-few` để CSS
           đổi lưới thành hàng ô TỰ CO THEO NỘI DUNG và CĂN GIỮA.
           Gồm cả 1 size (Onesize của pdp3, 1 dung tích của hàng làm đẹp) lẫn 2
           size (khăn lụa pdp2). Lưới 4 cột cứng bóp ô về 76px, mà nhãn
           "90 × 90 cm" cần rộng hơn -> chữ bị cắt (user báo 19/08/2026). */
        return `
      <div class="pc-sizes${list.length < 4 ? ' is-few' : ''}" data-pc-sizes="${i}">
        ${list.map(s => `<button class="pc-size press${s.oos ? ' is-oos' : ''}" data-pc-size="${s.label}"${s.oos ? ' data-oos="1"' : ''}>${s.label}</button>`).join('')}
      </div>`;
      })()}
      <button class="quick-add press" data-quick="${i}" aria-label="Thêm nhanh vào giỏ"
        style="display:flex;min-width:36px;min-height:36px;padding:var(--spacing-2);justify-content:center;align-items:center;position:absolute;right:8px;bottom:8px;border-radius:var(--radius-infinite);border:1px solid var(--general-border);background:rgba(255,255,255,.9);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m21,6h-3c0-3.309-2.691-6-6-6s-6,2.691-6,6h-3c-1.654,0-3,1.346-3,3v10.5c0,2.481,2.019,4.5,4.5,4.5h12c.276,0,.5-.224.5-.5s-.224-.5-.5-.5H4.5c-1.93,0-3.5-1.57-3.5-3.5v-10.5c0-1.103.897-2,2-2h3v3.5c0,.276.224.5.5.5s.5-.224.5-.5v-3.5h10v3.5c0,.276.224.5.5.5s.5-.224.5-.5v-3.5h3c1.103,0,2,.897,2,2v7.5c0,.276.224.5.5.5s.5-.224.5-.5v-7.5c0-1.654-1.346-3-3-3Zm-14,0c0-2.757,2.243-5,5-5s5,2.243,5,5H7Zm17,13.5c0,.276-.224.5-.5.5h-3.5v3.5c0,.276-.224.5-.5.5s-.5-.224-.5-.5v-3.5h-3.5c-.276,0-.5-.224-.5-.5s.224-.5.5-.5h3.5v-3.5c0-.276.224-.5.5-.5s.5.224.5.5v3.5h3.5c.276,0,.5.224.5.5Z" fill="var(--general-primary)"/></svg>
      </button>
    </div>
    <div class="flex flex-col px-1 py-2">
      <div class="flex flex-col gap-0.5 pb-2">
        <p class="pc-brand text-[14px] font-medium leading-5 text-foreground truncate">${p.brand}</p>
        <p class="text-[14px] leading-5 text-secondary-foreground truncate">${p.name}</p>
      </div>
      <div class="flex flex-col pb-2">
        <div class="flex gap-1 items-center">
          <p class="text-[14px] font-medium leading-5 ${p.off ? 'text-destructive' : 'text-foreground'}">${p.price}</p>
          ${p.off ? `<span class="bg-destructive-subtle rounded-xs px-1 py-0.5 text-[12px] font-medium leading-4 text-destructive shrink-0">${p.off}</span>` : ''}
        </div>
        <p class="text-[12px] leading-4 text-muted-foreground line-through ${p.was ? '' : 'invisible'}">${p.was || '&nbsp;'}</p>
      </div>
      ${(!noColors && p.colors && p.colors.length) ? `
      <!-- Frame 427319709: gap 8, mỗi ô 20×20 (viền 1px khi chọn) bọc chấm màu 16×16 -->
      <div class="flex gap-2 items-center pt-0.5" data-swatches>
        ${p.colors.map((c, ci) => `
          <button class="cw w-5 h-5 rounded-full shrink-0 flex items-center justify-center border transition-colors duration-200 ${ci===0 ? 'border-primary' : 'border-transparent'} press" data-cw="${ci}" title="${c.name}">
            <span class="block w-4 h-4 rounded-full ${['#ffffff','#f1f1f1','#fafafa'].includes(c.hex.toLowerCase()) ? 'border border-border-3' : ''}" style="background:${c.hex}"></span>
          </button>`).join('')}
        ${p.moreColors ? `<span class="text-[12px] leading-4 text-muted-foreground">+${p.moreColors}</span>` : ''}
      </div>` : ''}
    </div>
  </div>`;
}

/* Cấu hình subheader: label hiển thị + nguồn dữ liệu mega menu */

const DK_DEPTS = ['Nam', 'Nữ', 'Làm đẹp'];

const DK_NAV_CATS = [
  /* "Sản phẩm mới" đứng đầu như menu thật shop.dafc.com.vn + bản mobile.

  { label:'Sản phẩm mới', newIn:true    },

  { label:'Phụ kiện',    cat:'Phụ kiện' },
  { label:'Pre-loved'                   },

/* Subheader ĐỔI THEO DEPT đang chọn — tương đương việc bấm tab Nam/Nữ/Làm đẹp
   ở menu mobile. Ngành thời trang (Nam/Nữ) dùng bộ danh mục cố định phía trên;
   ngành Làm đẹp sinh thẳng từ MENU_DATA['Làm đẹp'].cats nên 2 bản luôn khớp
   nhau — sửa cây beauty một chỗ là cả mobile lẫn desktop đổi theo. */
function dkNavCats() {
  if (dkDept !== 'Làm đẹp') return DK_NAV_CATS;
  return MENU_DATA['Làm đẹp'].cats.map(([label, sub]) => {
    if (label === 'Thương hiệu') return { label, brands: true };
    if (label === 'Khuyến mãi')  return { label, sale: true };
    // nhóm có cây con -> mega panel 1 cột; không có -> link phẳng (vd Sản phẩm mới)
    return sub ? { label, dept: 'Làm đẹp', sub } : { label };
  });
}

/* attrs điều hướng PLP chế độ danh mục (dùng chung với hàng menu mobile) */
const dkCatAttrs = (title, crumbs = []) =>
  `data-nav="plp" data-plp-title="${title}"${crumbs.length ? ` data-plp-crumbs="${crumbs.join('|')}"` : ''}`;

/* Một cột nội dung của mega panel. Bề rộng do lưới `.dk-mega-grid` cấp nên cột
   chỉ cần `min-w-0` (không min-width cứng, kẻo tràn ở dải desktop hẹp).

   DÒNG "Tất cả …" ĐÃ BỎ KHỎI MEGA PANEL (chốt 18/08/2026, yêu cầu user) — mọi
   cột giờ vào thẳng danh mục con, không còn dòng dẫn cấp trên nào.
   Vẫn NHẬN 2 tham số `allLabel`/`allAttrs` và data `MENU_DATA[].cats[][1].all`
   vẫn còn nguyên: bật lại chỉ tốn 1 dòng markup, và `all` còn được panel menu
   trượt (`.ms-view`, headRow) dùng nên KHÔNG được xoá khỏi data. Cùng lối xử lý
   với cột `desc` của COOKIE_CATS — giữ data, không render.
   Không mất đường đi nào: chính nút danh mục ở subheader đã trỏ tới PLP cấp đó,
   và ảnh teaser cột 4 cũng trỏ về `item.label`. */
function dkMegaCol(title, allLabel, allAttrs, items, itemAttrs) {
  /* CẢ PANEL MỘT CỠ 14 (chốt 18/08/2026, yêu cầu user) — đè quyết định 17/08
     từng cho đường dẫn lên 16: tiêu đề nhóm và đường dẫn nay cùng 14, phân cấp
     lo bằng WEIGHT + MÀU chứ không bằng cỡ chữ. Nhãn teaser cột 4 vốn đã 14.
     Đường dẫn: 14 regular, hover gạch chân — gạch chân do rule
     `.dk-mega-grid > div button:hover` lo, không khai ở đây. */
  const link = 'text-left text-[14px] font-normal leading-5 text-foreground-alt hover:text-foreground transition-colors press';
  return `
  <div class="flex flex-col gap-3 min-w-0">
    ${title
      /* Tiêu đề nhóm: 14 MEDIUM uppercase, màu secondary-foreground #262626
         (chốt 18/08/2026, yêu cầu user — trước là regular + muted #737373).
         UPPERCASE bằng CLASS `uppercase`, KHÔNG viết hoa trong chuỗi: chuỗi gốc
         là key i18n ("Nam"/"Nữ"/"Thương hiệu"…), gõ hoa vào là mất bản dịch.
         Đây là NGOẠI LỆ có chủ ý của quy ước "không dùng uppercase" (yêu cầu
         user 17/08/2026) — chỉ áp cho nhãn nhóm trong mega panel.
         Giữ tracking .08em cho chữ hoa đỡ bí. */
      ? `<p class="text-[14px] font-semibold leading-5 tracking-[0.08em] uppercase text-secondary-foreground pb-4">${title}</p>`
      /* Cột không có tiêu đề (2 cột thương hiệu sau) vẫn phải chừa ĐÚNG khối
         tiêu đề để dòng chữ đầu thẳng hàng với các cột khác — dùng lại chính
         class ở trên nên sửa nhịp 1 chỗ là cả 2 nhánh đi theo. */
      : `<p class="text-[14px] leading-5 pb-4" aria-hidden="true">&nbsp;</p>`}
    ${items.map(it => `<button ${itemAttrs(it)} class="${link}">${it}</button>`).join('')}
  </div>`;
}

/* Tách mảng items có phần tử {header} thành các nhóm [{title, items}] —
   MENU_DATA khai chung với mobile (submenu 1 cột, header xen giữa), desktop
   dựng lại thành nhiều CỘT nên phải cắt theo header. */
function splitByHeader(items) {
  const out = [];
  let cur = { title: '', items: [] };
  for (const it of items) {
    if (it && it.header) { if (cur.items.length) out.push(cur); cur = { title: it.header, items: [] }; }
    else cur.items.push(it);
  }
  if (cur.items.length) out.push(cur);
  return out;
}

/* Panel mega menu cho 1 mục subheader — cột nội dung + teaser ảnh phải.
   `id` khớp với data-mega của nút tương ứng: panel render tách khỏi thanh cuộn
   nên không còn quan hệ cha-con để CSS :hover bắt được, phải nối bằng id. */
function dkMegaPanel(item, id) {
  let cols = '';
  if (item.newIn) {
    /* Sản phẩm mới — theo menu thật shop.dafc.com.vn: [Bộ sưu tập mới] + cột
       NAM + cột NỮ. Mobile bỏ tầng giới tính vì tab đã là giới tính; desktop
       GIỮ vì subheader không gắn giới tính và mọi mục khác cũng dựng 2 cột
       Nam/Nữ. Nguồn data vẫn là MENU_DATA dùng chung với mobile. */
    const subOf = dept => MENU_DATA[dept].cats.find(([lb]) => lb === 'Sản phẩm mới')[1];
    const colls = splitByHeader(subOf('Nam').items).find(g => g.title === 'Bộ sưu tập mới');
    cols = dkMegaCol('Bộ sưu tập mới', '', '', colls ? colls.items : [], it => dkCatAttrs(it, ['Sản phẩm mới']))
      + ['Nam', 'Nữ'].map(dept => {
          const sub = subOf(dept);
          const cats = splitByHeader(sub.items).find(g => g.title === 'Danh mục');
          return dkMegaCol(dept, sub.all, dkCatAttrs(sub.all, [dept, 'Sản phẩm mới']),
            cats ? cats.items : [], it => dkCatAttrs(it, [dept, 'Sản phẩm mới']));
        }).join('');
  } else if (item.brands) {
    /* 25 thương hiệu chia ĐỀU 3 cột (9/8/8) — trước đây là 1 cột tiêu đề +
       3 cột chữ = 4 cột, cộng ảnh thành 5, không vừa lưới 4 cột. Cột 1 mang
       luôn tiêu đề + "Tất cả thương hiệu" nên 2 cột sau phải `pt-6` cho thẳng
       hàng với dòng chữ đầu của cột 1. */
    const n = 3, split = [[], [], []];
    MENU_BRANDS.forEach((b, i) => split[i % n].push(b));
    cols = `
      ${dkMegaCol('Thương hiệu', 'Tất cả thương hiệu', 'data-nav="plp"', split[0], () => 'data-nav="plp"')}
      ${split.slice(1).map(col => dkMegaCol('', '', '', col, () => 'data-nav="plp"')).join('')}`;
  } else if (item.beauty) {
    /* Nhánh này hiện KHÔNG mục nào trong DK_NAV_CATS dùng — "Làm đẹp" đã lên
       hàng dept dạng link phẳng. Giữ lại để bật lại panel beauty ở subheader
       chỉ bằng cách thêm { label:'Làm đẹp', beauty:true } vào DK_NAV_CATS. */
    const cats = MENU_DATA['Làm đẹp'].cats.filter(([, sub]) => sub);
    cols = cats.map(([, sub]) =>
      dkMegaCol(sub.title, sub.all, dkCatAttrs(sub.all, ['Làm đẹp', sub.title]),
        sub.items, it => dkCatAttrs(it, ['Làm đẹp', sub.title]))
    ).join('');
  } else if (item.sub) {
    /* 1 nhóm của ngành Làm đẹp — chỉ 1 cột vì ngành này không tách giới tính */
    const sub = item.sub;
    cols = dkMegaCol(sub.title, sub.all, dkCatAttrs(sub.all, [item.dept, sub.title]),
      sub.items, it => dkCatAttrs(it, [item.dept, sub.title]));
  } else if (item.cat) {
    cols = ['Nam', 'Nữ'].map(dept => {
      const hit = MENU_DATA[dept].cats.find(([lb]) => lb === item.cat);
      if (!hit || !hit[1]) return '';
      const sub = hit[1];
      return dkMegaCol(dept, sub.all, dkCatAttrs(sub.all, [dept, sub.title]),
        sub.items, it => dkCatAttrs(it, [dept, sub.title]));
    }).join('');
  } else {
    return '';
  }
  return `
  <!-- glass-95 + backdrop-blur ĐÚNG BẰNG thanh nav (.navbar, .dk-sub) để panel
       đọc ra là phần nối dài của thanh chứ không phải một tấm trắng đè lên
       (yêu cầu user 17/08/2026). Trước đó panel dùng bg-background đặc, tụt
       xuống dưới thanh kính là thấy rõ mối nối.
       LƯU Ý: khối này nằm trong template literal — comment TUYỆT ĐỐI không
       được chứa dấu backtick, dính vào là đứt chuỗi, cả file không chạy. -->
  <div class="dk-mega absolute left-0 right-0 top-full glass-95 backdrop-blur-[7.5px] z-50" data-mega="${id}">
    <!-- 4 cột đều nhau: tối đa 3 cột nội dung + ảnh ghim ở cột 4 (.dk-mega-grid).
         Mục nào ít nhóm hơn (vd Túi xách chỉ Nam/Nữ) thì bỏ trống cột 3, KHÔNG
         kéo giãn cột — mọi panel phải cùng một lưới. -->
    <div class="max-w-[1440px] mx-auto px-6 pt-8 pb-10 dk-mega-grid">
      ${cols}
      <button ${dkCatAttrs(item.label)} class="dk-mega-teaser flex flex-col gap-2 text-left press group">
        <span class="block w-full overflow-hidden bg-secondary" style="aspect-ratio:1/1">
          <img src="${A}brand-hero.png" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-[1.03]" alt="${item.label}">
        </span>
        <span class="text-[14px] font-medium leading-5 text-foreground underline underline-offset-2">Bộ sưu tập mới</span>
      </button>
    </div>
  </div>`;
}

function navBar({ logoOnly = false, plp = false } = {}) {
  // Checkout: header rút gọn — logo + cam kết bảo mật
  if (logoOnly) {

      <div class="max-w-[1440px] mx-auto h-[64px] px-6 flex items-center justify-between">

        <div class="flex items-center gap-1.5 text-muted-foreground">${I.shield}<span class="text-[12px] leading-4">Thanh toán an toàn &amp; bảo mật</span></div>
      </div>

  }

  /* dept trái — pad 8/16, 14px medium (component Button/Ghost). MÀU do CSS cấp
     hết (thang 3 bậc #737373 / #404040 / #0a0a0a, xem khối <style>), markup chỉ
     mang `aria-current` để state nằm đúng 1 nơi. Nền giữ ghost hover 5%. */
  /* Dựng panel 1 lần rồi dùng lại cho cả nút (data-mega) lẫn khối panel bên dưới */
  const dkCats = dkNavCats().map((item, i) => ({ item, i, panel: dkMegaPanel(item, i) }));

     data-nav="plp" trơn nên goPlp ra type:'brand', không mang title/crumbs. */

    : curCrumbs.length === 1

/* ════════════════════════════════════════════════════════════════
   PLP có 3 chế độ — theo section Figma "02 — PLP / Mobile" (2084:158):
   · brand    → PLP-Mobile-01-ByBrand (hero + brand block, mặc định)
   · category → PLP-Mobile-04-Default: breadcrumb + tiêu đề 20/28, không hero
                (vào từ menu / thẻ danh mục)
   · search   → tiêu đề "Kết quả tìm kiếm của “q”"; không khớp sản phẩm nào
                thì hiện khối hướng dẫn PLP-Mobile-07-Search-Empty (2918:45172)
════════════════════════════════════════════════════════════════ */
let plpMode = { type: 'brand' };

/* Bộ lọc đang áp dụng — nguồn cho "Bộ lọc (n)" + hàng chip active filters
   (Figma Frame 427319845 trong PLP-Desktop-04-ByCategory-Grid3) */
let plpFilters = [];
let plpCols    = '4';   // mật độ lưới: '4' (02/03/05) | '3' (04-Grid3)

function goPlp(mode) {
  plpMode = (mode && mode.type) ? mode : { type: 'brand' };
  pruneFilters();   // ngành mới có thể không còn facet của nhãn đang áp
  /* Đổi danh sách = nội dung khác hẳn -> vị trí cuộn cũ vô nghĩa, xoá đi kẻo
     lượt back sau đó trả về một toạ độ của danh sách khác (xem SCROLL_MEM) */
  delete SCROLL_MEM.plp;

  if (current === 'plp') { history.push('plp'); current = null; } // ép render lại khi đang ở PLP
  go('plp');
}

/* PLP đang ở ngành hàng Làm đẹp? — quyết định lọc sản phẩm và bộ lọc nào hiện */
const isBeautyPlp = () => plpMode.type === 'category' && (plpMode.crumbs || [])[0] === 'Làm đẹp';

/* Danh sách sản phẩm theo chế độ PLP (giữ index gốc cho router PDP/quick-add) */
function plpProducts() {
  const all = PRODUCTS.map((p, i) => ({ p, i }));
  if (plpMode.type === 'search') {   // tìm kiếm quét cả 2 ngành hàng
    const q = (plpMode.query || '').trim().toLowerCase();
    return q ? all.filter(({ p }) => `${p.brand} ${p.name}`.toLowerCase().includes(q)) : all;
  }
  const beauty = isBeautyPlp();
  return all.filter(({ p }) => (p.dept === 'beauty') === beauty);
}

/* ════════════════════════════════════════════════════════════════
   SCREEN: SEARCH — theo 4 trạng thái Figma "03 — Search / Mobile" (2084:160)
   01 empty/trending · 02 typing/suggestions · 03 recent + featured
   04 no-result ("Không tìm thấy kết quả" + Sản phẩm nổi bật)
════════════════════════════════════════════════════════════════ */
let searchQuery = '';
let searchTab = 0;
let searchHistory = ['Áo sơ mi', 'Túi xách da', 'Versace loafer', 'Đầm dạ hội', 'Giày thể thao'];

function highlightMatch(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + `<span class="font-medium">${text.slice(idx, idx + q.length)}</span>` + text.slice(idx + q.length);
}

function searchSuggestions(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return [];
  const pool = [];
  PRODUCTS.forEach(p => { pool.push(p.brand); pool.push(p.name); });
  return [...new Set(pool)].filter(s => s.toLowerCase().includes(needle)).slice(0, 6);
}

/* Pane "đang gõ" — chỉ chứa list gợi ý dạng chữ, tách khỏi pane trending
   để mỗi phím gõ không re-mount lại product card (ảnh nhấp nháy). */
function searchSuggestHTML() {
  const q = searchQuery.trim();
  const sug = searchSuggestions(q);
  return `
  <section class="flex flex-col py-4">
    <h2 class="px-4 text-[12px] leading-4 text-muted-foreground">Gợi ý</h2>
    ${sug.length ? `
    <ul>
      ${sug.map(s => `
      <li><button class="search-suggest w-full text-left px-4 py-3 text-[14px] leading-5 text-foreground press" data-suggest="${s}">${highlightMatch(s, q)}</button></li>`).join('')}
    </ul>` : `<p class="px-4 py-3 text-[14px] leading-5 font-medium text-foreground">Không tìm thấy kết quả</p>`}
  </section>`;
}

function searchHistoryHTML() {
  if (!searchHistory.length) return '';
  return `
  <section class="flex flex-col py-4">
    <h2 class="px-4 py-2 text-[12px] leading-4 text-muted-foreground">Vừa tìm kiếm</h2>
    <ul>
      ${searchHistory.map(h => `
      <li class="search-row flex items-center">
        <button class="search-suggest flex-1 min-w-0 text-left px-4 py-3 text-[14px] leading-5 text-foreground press truncate" data-suggest="${h}">${h}</button>
        <button class="search-remove w-8 h-8 mr-1.5 flex items-center justify-center shrink-0 press [&_svg]:w-3 [&_svg]:h-3" data-remove="${h}" aria-label="Xoá &quot;${h}&quot; khỏi lịch sử">${I.close}</button>
      </li>`).join('')}
    </ul>
  </section>`;
}

  const q = searchQuery.trim();

                 class="flex-1 min-w-0 outline-none text-[14px] leading-6 font-light text-foreground placeholder:text-muted-foreground" style="background:transparent;border:0;padding:0;-webkit-appearance:none;appearance:none">

      <div id="searchResults">
        <div id="searchSug" class="search-pane"${q ? '' : ' style="display:none"'}>${q ? searchSuggestHTML() : ''}</div>
        <div id="searchNores"${noResult ? '' : ' style="display:none"'}>${searchTrendingHTML('Sản phẩm nổi bật')}</div>
        <div id="searchEmpty" class="search-pane"${q ? ' style="display:none"' : ''}>
          <div id="searchHistoryBox" class="rise">${searchHistoryHTML()}</div>
          <div class="rise">${searchTrendingHTML()}</div>
        </div>
      </div>
    </div>
    ${footer()}
  </div>`;
}

/* ════════════════════════════════════════════════════════════════

/* Hai layout khối KHUYẾN MÃI trong panel info của PDP desktop — cùng nội dung
   với bản mobile, chỉ bỏ wrapper px-4 vì panel 427px đã có padding riêng.

/* ── KHUÔN CHỐT cho cục "Ưu đãi khuyến mãi" của MỌI bản PDP (24/08/2026) ──────────
   User chốt lấy **KHỐI XÁM** đang có ở PDP3 của CHÍNH khổ này (*"ý tôi là dùng block
   màu xám này nè, sửa lại bản mobile và áp dụng cho cả bản desktop"*): thẻ `bg-accent-0`
   bo `rounded-sm` pad 16 gap 4, tiêu đề 14/20 Medium mực chính, mỗi chương trình MỘT
   DÒNG 14/20 mực nội dung với phần đầu dòng Medium.
   Trước đây khổ này chia 3 nhánh (pdp = card tách · pdp2 = card gộp · 4 bản còn lại =
   khối xám); nay CẢ 6 kind dùng khối xám. `promoPairs` quy đổi danh sách key của
   catalogue PROMOS về dạng cặp để pdp/pdp2 giữ đúng nội dung của mình.
   Tham số `wrap` để mobile chèn gutter `px-4 pb-2`; ở khổ này cột đã có padding riêng
   nên gọi với chuỗi rỗng. KHAI GIỐNG HỆT ở index.html. */
const PROMO_TAB = 'Ưu đãi khuyến mãi';
const promoBox = (items, wrap = 'px-4 pb-2') => `
    <div class="${wrap} rise">
      <div class="flex flex-col gap-1 rounded-sm bg-accent-0 p-4">
        <p class="text-[14px] font-medium leading-5 text-foreground">${PROMO_TAB}</p>
        ${items.map(it => Array.isArray(it)
          ? `<p class="text-[14px] leading-5 text-secondary-foreground"><span class="font-medium">${it[0]}</span>${it[1] || ''}</p>`
          : `<p class="text-[14px] leading-5 text-secondary-foreground">${it}</p>`).join('')}
      </div>
    </div>`;
const promoPairs = keys => keys.map(k => {
  const p = PROMOS[k];
  return [p.title, p.line === p.title ? '' : ` — ${p.line}`];
});

/* ⚠ 2 hàm layout A/B dưới KHÔNG còn được gọi sau chốt 24/08 (mọi PDP dùng khối xám).
   Giữ vì chúng ghi số đo Figma của 2 layout đã từng chốt. */
function promoCardGrouped(keys) {
  return `
    <div class="pb-2 rise">
      <div class="bg-accent-0 rounded-sm p-2 flex flex-col gap-2">
        <p class="h-5 text-[14px] font-medium leading-5 text-foreground">Khuyến mãi</p>
        ${keys.map(k => `
          <button data-promo="${k}" class="flex items-start gap-2 text-left press">
            <span class="w-2 shrink-0 text-[12px] font-medium leading-4 text-secondary-foreground">·</span>
            <span class="flex-1 min-w-0 text-[12px] font-medium leading-4 text-secondary-foreground underline">${PROMOS[k].line}</span>
          </button>`).join('')}
      </div>
    </div>`;
}

function promoCardsSplit(keys) {
  const detail = (p) => p.body
    ? p.body.map((l, i) => `<p class="text-[12px] leading-4 ${i ? 'text-secondary-foreground' : 'font-medium text-foreground'}">${l}</p>`).join('')
    : p.rows.map(([k2, v]) => `
              <div class="flex flex-col gap-0.5">
                <span class="text-[12px] leading-4 text-muted-foreground">${k2}</span>
                <span class="text-[12px] leading-4 text-secondary-foreground">${v}</span>
              </div>`).join('');
  return `
    <div class="pb-2 flex flex-col gap-2 rise">
      <p class="text-[14px] font-medium leading-5 text-foreground">Khuyến mãi</p>
      ${keys.map(k => `
        <div class="acc bg-accent-0 rounded-sm">
          <button class="acc-trigger w-full p-2 flex items-start gap-2 text-left press">
            <span class="w-2 shrink-0 text-[12px] font-medium leading-4 text-secondary-foreground">·</span>
            <span class="flex-1 min-w-0 text-[12px] font-medium leading-4 text-secondary-foreground">${PROMOS[k].line}</span>
            <span class="shrink-0 flex items-center h-4 [&_svg]:w-3 [&_svg]:h-3">
              <span class="acc-ico-plus">${IcoPlus}</span>
              <span class="acc-ico-minus">${IcoMinus}</span>
            </span>
          </button>
          <div class="acc-body"><div class="acc-inner">
            <div class="pl-6 pr-2 pb-2 flex flex-col gap-1">${detail(PROMOS[k])}</div>
          </div></div>
        </div>`).join('')}
    </div>`;
}

function pdpTabs(idx, { specs = false, returnTab = PDP_RETURN_TAB } = {}) {

/* Size của từng SẢN PHẨM, lấy ĐÚNG BỘ CỦA PDP tương ứng (chốt 19/08/2026, yêu
   cầu user: "demo thực tế size theo bên trong pdp luôn").
   Trước đây dải size hover trên card dùng chung `SIZES` (39-44) cho mọi SP —
   sai với 3 SP: pdp2 là khăn (90 × 90 cm / 84 × 5 cm), pdp3 là Onesize.
   `PDP_DATA[*].idx` chính là index trong PRODUCTS nên map thẳng được, KHÔNG đẻ
   thêm bảng size thứ hai — một nguồn duy nhất, sửa PDP là card đổi theo.
   SP#7-10 và hàng làm đẹp không có PDP riêng: xem `pcSizesOf` bên dưới. */
const SIZES_BY_PRODUCT = Object.fromEntries(Object.values(PDP_DATA).map(d => [d.idx, d.sizes]));
/* Trả về [{label, oos}] cho card index `i`:
     · hàng làm đẹp -> dung tích trong PRODUCTS[i].sizes, không có hàng nào hết;
     · SP có PDP    -> đúng bộ của PDP đó;
     · còn lại      -> bộ size mặc định, y như PDP thường. */
function pcSizesOf(p, i) {
  if (p.sizes && p.sizes.length) return p.sizes.map(label => ({ label, oos: '' }));
  return SIZES_BY_PRODUCT[i] || pdpSizes();
}

/* TRẢ GÓP — "Trả trước từ … /tháng · Xem chi tiết" nằm NGAY DƯỚI nút Thêm vào
   giỏ hàng và CĂN GIỮA (chốt 18/08/2026, yêu cầu user; trước đó khối này nằm
   sát dưới giá trong header). Áp dụng cho MỌI loại PDP.
   Chỉ sản phẩm KHÔNG pre-order mới hiện — đặt trước không áp dụng trả góp, nên
   nhánh preorder của `cta` không gọi hàm này (PDP_DATA.pdp cũng để installment
   rỗng, 2 lớp chặn cùng chiều).
   Khối BẮT BUỘC là con trực tiếp của #pdpCta: setCta() tìm nó bằng cách quét
   [...cta.children] theo chữ "Trả trước" để ẩn khi size chọn đang hết hàng. */
const payOfferRow = amount => amount ? `
      <div class="flex items-center justify-center gap-1 pt-2 text-[12px] leading-4">
        <span class="text-foreground-alt">Trả trước từ <b class="font-medium">${amount}</b>/tháng</span>
        <button data-toast="Xem chính sách trả góp" class="text-foreground underline press">Xem chi tiết</button>
      </div>` : '';

function dkScreenPDP(kind) {
  const D = PDP_DATA[kind];
  const P = PRODUCTS[D.idx];
  // slide = TOÀN BỘ ảnh thật của sản phẩm (tối đa 6 ô cho lưới 2 cột của Figma),
  // swatch = các ảnh bản màu đứng đầu mảng, cắt theo số màu đang bán
  const all = PRODUCT_GALLERY[D.idx] || [P.img];
  const sw = all.slice(0, (P.colors || []).length);
  const gallery = all.slice(0, 6);

  /* Hàng pre-order (đọc từ PRODUCTS.preorder — nguồn ngày duy nhất, thay cờ
     preorder:true cũ của PDP_DATA): dòng ngày dự kiến nằm TRÊN nút và căn trái,
     ngày in đậm hơn 1 nấc; nút về khuôn 1 dòng — đồng bộ bản mobile 14/08/2026. */
  const cta = P.preorder ? `
      <p class="text-[12px] leading-4 text-secondary-foreground pb-2">Dự kiến giao hàng vào ngày <span class="font-medium">${P.preorder}</span></p>
      <button data-add="pdp" class="w-full h-12 rounded-xs bg-primary text-primary-foreground text-[16px] font-medium leading-6 btn-p press flex items-center justify-center">Đặt trước</button>` : `
      <button data-add="pdp" class="w-full h-12 rounded-xs bg-primary text-primary-foreground text-[16px] font-medium leading-6 btn-p press flex items-center justify-center">Thêm vào giỏ hàng</button>
      ${payOfferRow(D.installment)}`;

  return `
  <div class="w-full" data-scroller>
    ${navBar()}
    <div class="max-w-[1440px] mx-auto w-full">
      ${dkCrumbs(['Trang chủ', P.brand, P.name])}

      <!-- split: gallery trái + info sticky phải -->
      <div class="flex items-start px-6 pt-4">
        <div id="pdpGallery" class="flex-1 min-w-0 grid grid-cols-2 gap-1">
          <!-- Badge "Pre-order" đè góc trên trái Ô ẢNH ĐẦU — desktop không có chồng
               pill New Season như mobile nên badge gắn thẳng vào tile; style pill
               giữ đúng khuôn New Season (bg-secondary, 12 medium). data-i18n-skip:
               wordmark giữ nguyên ở mọi ngôn ngữ. -->
          ${gallery.map((s, gi) => `
          <button class="zoomable shimmer relative block w-full overflow-hidden bg-secondary" style="aspect-ratio:469/579" data-zoom="${A}${s}">
            <img src="${A}${s}" class="absolute inset-0 w-full h-full object-cover lazy" alt="${P.name}" onload="this.parentElement.classList.add('loaded')">
            ${gi === 0 && P.preorder ? '<span data-i18n-skip class="absolute top-3 left-0 badge-label px-2 py-1 text-[12px] font-medium leading-4 text-foreground">Pre-order</span>' : ''}
          </button>`).join('')}
        </div>

        <div class="dk-sticky-info w-[451px] shrink-0 pl-6">
          <!-- header -->
          <div class="flex flex-col pb-4 rise">
            <div class="flex flex-col gap-2 pb-4">
              <!-- Tên thương hiệu: MEDIUM ở mọi chỗ (chốt 17/08/2026, yêu cầu user).
             Chỗ này trước là 24 Light theo quy ước "tiêu đề trang dùng Light" —
             nhưng brand name xuất hiện ở 7 chỗ khác đều Medium, để Light riêng ở
             PDP thành ra lệch nhất giữa các màn. -->
        <h1 class="pc-brand text-[24px] font-medium leading-8 text-foreground">${P.brand}</h1>
              <p class="text-[14px] leading-5 text-foreground-alt">${P.name}</p>
            </div>
            <!-- Khối giá SẠCH: chỉ con số + badge -% + giá gạch. Dòng trả góp đã
                 dời xuống ngay dưới nút Thêm vào giỏ hàng (xem payOfferRow). -->

              <p class="text-[16px] font-medium leading-6 ${P.off ? 'text-destructive' : 'text-foreground'}">${P.price}</p>
              ${P.off ? `<span class="bg-destructive-subtle rounded-xs px-1 py-0.5 text-[14px] leading-5 text-destructive">${P.off}</span>` : ''}
              ${P.was ? `<p class="text-[14px] leading-5 text-muted-foreground line-through">${P.was}</p>` : ''}
            </div>
          </div>

          <!-- variants —
               BẮT BUỘC có relative z-30 (KHÔNG dùng dấu backtick trong comment này:
               cả khối nằm trong template literal, backtick sẽ đứt string).
               Class .rise dùng animation-fill-mode:both nên transform:translateY(0)
               còn dính lại => mỗi block .rise là 1 stacking context riêng với
               z-index:auto. Cùng z-index thì thứ tự DOM quyết định, nên #pdpCta
               (block .rise NẰM SAU) vẽ đè lên dropdown chọn size, dù dropdown đã
               z-40 — z-40 chỉ có tác dụng BÊN TRONG stacking context của chính
               block này. Cùng lý do #sortMenu ở PLP sống được nhờ #plpFilterAnchor
               có z-40, và hàng tab trang chính sách phải có z-30. -->
          <div class="relative z-30 flex flex-col gap-4 py-2 rise">
            ${D.noColors ? '' : `
            <div class="flex flex-col gap-2">
              <div class="flex gap-2">
                <p class="text-[12px] font-medium leading-4 text-foreground">Màu sắc</p>
                <p id="colorName" class="text-[12px] leading-4 text-muted-foreground">${P.colors[0].name}</p>

/* Quà luôn thuộc về MỘT CHƯƠNG TRÌNH, không đứng lẻ: thẻ quà nào cũng có nhãn

const cartItems = () => CART.filter(c => !c.removed);

   3 món. */
const cartSelected = () => CART.filter(c => !c.removed && c.sel !== false);

const rewardPointsEarned = () => Math.floor(cartSubtotal() / 100000);
function cartSubtotal() {
  return cartItems().reduce((s, c) => s + (c.sel === false ? 0 : vndNum(c.now) * (c.qty || 1)), 0);
}
/* Mốc đã đạt (theo thứ tự mốc) và mốc kế tiếp chưa đạt — dùng cho khối quà
   theo đơn và dòng gợi ý "mua thêm ... để nhận ...". */
function orderGiftState() {
  const sub = cartSubtotal();
  const tiers = [...ORDER_GIFT_TIERS].sort((a, b) => a.min - b.min);
  return {
    sub,
    earned: tiers.filter(t => sub >= t.min),
    next:   tiers.find(t => sub < t.min) || null,

}

function voucherTitle(v) {

function voucherEligible(v) {
  if (!v) return false;
  if (v.minSub && cartSubtotal() < v.minSub) return false;
  if (v.minQty && cartSelectedQty() < v.minQty) return false;

}
const activeVouchers    = () => cartVouchers.map(voucherByCode).filter(v => v && voucherEligible(v));

/* Giỏ teo lại (bỏ tick / bớt số lượng) thì mã hết điều kiện phải TỰ RỚT, không

   vừa rớt để chỗ gọi báo cho người dùng biết. */
function pruneVouchers() {

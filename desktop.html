          // đổi thành phố -> danh sách cửa hàng đổi theo, khối thông tin thu lại
          // (chữ đã gõ vẫn còn vì 3 ô người nhận đọc/ghi vào state)
          rerenderCheckout(root);
          const cityBtn = root.querySelector('[data-pick="city"]');
          if (cityBtn) cityBtn.focus({ preventScroll: true });
        });
        return;
      }
      /* Tỉnh/thành người nhận đang sinh sống — chỉ có ở luồng nhận tại cửa
         hàng, dùng lại đúng danh sách tỉnh của địa chỉ giao hàng. */
      if (btn.dataset.pick === 'home') {
        window.__openPickDD(btn, VN_LOCATIONS.map(([pv]) => pv), ckHome, picked => {
          ckHome = picked;
          setPickLabel(btn, picked, 'Chọn tỉnh / thành phố');
        });
        return;
      }
      if (btn.dataset.pick === 'province') {
        window.__openPickDD(btn, VN_LOCATIONS.map(([pv]) => pv), ckProvince, picked => {
          ckProvince = picked; ckWard = '';
          setPickLabel(btn, picked, 'Chọn tỉnh / thành phố');
          const w = root.querySelector('[data-pick="ward"]');
          if (w) setPickLabel(w, '', 'Chọn phường / xã');
        });
        return;
      }
      if (!ckProvince) { toast('Chọn tỉnh / thành phố trước'); return; }
      const wards = (VN_LOCATIONS.find(([pv]) => pv === ckProvince) || ['', []])[1];
      window.__openPickDD(btn, wards, ckWard, picked => {
        ckWard = picked;
        setPickLabel(btn, picked, 'Chọn phường / xã');
      });
    });
  });
}

function wire(root) {
  wirePasswordToggles(root);
  wireAddressPickers(root);
  // "Bảng kích thước →" ở PDP / quick add -> mở bảng size thật trong info dialog
  root.querySelectorAll('[data-size-chart]').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); openSizeChart(); }));

  // images fade-in
  wireLazy(root);

  // ── Search screen ──
  const searchInput = root.querySelector('#searchInput');
  if (searchInput) {
    const sugEl = root.querySelector('#searchSug');
    const noresEl = root.querySelector('#searchNores');
    const emptyEl = root.querySelector('#searchEmpty');
    const clearBtn = root.querySelector('#searchClear');
    // hiện/ẩn pane có fade-rise nhẹ; gõ tiếp trong pane đang mở thì không chạy lại animation
    const setShown = (el, show) => {
      if (!el) return;
      if (!show) { el.style.display = 'none'; return; }
      if (el.style.display === 'none') {
        el.style.display = '';
        el.classList.remove('search-pane');
        void el.offsetWidth;
        el.classList.add('search-pane');
      }
    };
    // 3 khối theo Figma: gõ có kết quả → Gợi ý; gõ không kết quả → Gợi ý
    // ("Không tìm thấy kết quả") + Sản phẩm nổi bật; rỗng → lịch sử + trending
    const updatePanes = () => {
      const q = searchQuery.trim();
      if (clearBtn) clearBtn.style.display = searchInput.value ? '' : 'none';
      if (q) renderSearchSug(root);
      setShown(sugEl, !!q);
      setShown(noresEl, !!q && !searchSuggestions(q).length);
      setShown(emptyEl, !q);
    };
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value;
      updatePanes();
    });
    // Enter -> màn kết quả tìm kiếm (PLP search; rỗng -> PLP-Mobile-07-Search-Empty)
    searchInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const q = searchInput.value.trim();
      if (!q) return;
      if (!searchHistory.includes(q)) searchHistory = [q, ...searchHistory].slice(0, 8);
      searchQuery = q;
      goPlp({ type: 'search', query: q, title: `Kết quả tìm kiếm của “${q}”` });
    });
    if (clearBtn) clearBtn.addEventListener('click', () => {
      searchQuery = '';
      searchInput.value = '';
      updatePanes();
      searchInput.focus({ preventScroll: true });
    });
    searchInput.focus({ preventScroll: true });
    root.querySelectorAll('.search-tab').forEach(t => {
      t.addEventListener('click', () => {
        searchTab = +t.dataset.tab;
        root.querySelectorAll('.search-tab').forEach(x => {
          const on = x === t;
          x.style.borderBottom = `2px solid ${on ? 'var(--general-primary)' : 'transparent'}`;
          x.classList.toggle('font-medium', on);
          x.classList.toggle('text-foreground', on);
          x.classList.toggle('font-light', !on);
          x.classList.toggle('text-muted-foreground', !on);
        });
      });
    });
    wireSearchPane(root, sugEl);
    wireSearchPane(root, noresEl);
    wireSearchPane(root, emptyEl);
  }

  // promo banner slider (PLP) — tự trượt từng dòng mỗi 4s
  clearInterval(window.__promoTimer);
  const slider = root.querySelector('#promoSlider');
  if (slider) {
    let pIdx = 0;
    const n = PROMO_MESSAGES.length;
    window.__promoTimer = setInterval(() => {
      pIdx = (pIdx + 1) % n;
      slider.style.transform = `translateX(-${pIdx * 100}%)`;
    }, 4000);
  }

  // cart badges
  root.querySelectorAll('.cart-badge').forEach(b => b.textContent = cartQty);

  // navigation
  root.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const t = el.dataset.nav;
      // Đổi dept phải ghi TRƯỚC khi điều hướng: navBar() dựng lại ngay trong go()
      // và subheader đọc dkDept để chọn bộ danh mục (thời trang vs làm đẹp).
      if (el.dataset.dkdept) dkDept = el.dataset.dkdept;
      /* Link trong mega panel / breadcrumb không có data-dkdept, nhưng crumbs[0]
         LÀ ngành hàng -> đồng bộ dept đang sáng. Trước đây bấm 'Quần áo' dưới cột
         'Nứ' mà hàng dept vẫn sáng 'Nam'; state đang chọn càng nổi thì cái lệch này
         càng lộ. Phải ở TRƯỚC goPlp()/go() vì navBar() dựng lại trong go() và đọc dkDept. */
      else {
        const c0 = (el.dataset.plpCrumbs || '').split('|')[0];
        if (DK_DEPTS.includes(c0)) dkDept = c0;
      }
      /* Reset để lặp lại demo: KHÔNG đụng ckAuth nữa — trước đây nút "Tiếp tục
         mua sắm" ở màn Hoàn tất âm thầm đăng xuất người đang đăng nhập. */
      if (el.hasAttribute('data-reset')) {
        cartQty = CART_BASE.length; CART.length = 0; CART.push(...CART_BASE.map(c => ({ ...c })));
        history = []; ckStep = 0; ckMaxStep = 0; ckMode = 'ship';
        ckCity = ''; ckStore = ''; ckHome = ''; ckName = ''; ckPhone = ''; ckEmail = '';
        ckAddr = 0; ckShipName = ''; ckShipPhone = ''; ckShipLine = '';
        ckPlaced = false; ckOrderId = ''; ckOrderTotal = ''; ckOrderPoints = ''; ckOrderGifts = []; ckOrderPre = '';
        giftPick = {};   // demo chạy lại từ đầu thì quà cũng về mặc định
      }
      /* Bấm "Đặt hàng": chốt đơn lại. Sinh mã theo hệ DAFC1029xx của màn Đơn
         hàng, đẩy đơn vào ORDERS để tab Đơn hàng thấy ngay, rồi DỌN GIỎ —
         trước đây đặt xong quay lại giỏ vẫn thấy đủ 4 món "vừa mua". */
      if (t === 'done' && !ckPlaced) placeOrder();
      if (el.dataset.auth !== undefined) { ckAuth = el.dataset.auth === '1'; ckStep = 0; ckMaxStep = 0; }
      if (t === 'back') { window.history.back(); return; }
      if (el.hasAttribute('data-loading')) {
        if (btnBusy(el)) return;
        const txt = el.innerHTML;
        el.innerHTML = `<svg class="spin" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><path d="M14.5 8A6.5 6.5 0 0 0 8 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
        setTimeout(() => { el.innerHTML = txt; btnDone(el); go(t); }, 700);
        return;
      }
      if (t === 'plp') {
        // link header/mega menu có data-plp-title -> PLP chế độ danh mục (breadcrumb đầy đủ);
        // logo/link chung -> PLP brand mặc định
        goPlp(el.dataset.plpTitle
          ? { type: 'category', title: el.dataset.plpTitle, crumbs: (el.dataset.plpCrumbs || '').split('|').filter(Boolean) }
          : { type: 'brand' });
        return;
      }
      go(t);
    });
  });

  // ── Desktop header: nút mở layer tìm kiếm ──
  // Layer + toàn bộ logic gợi ý dựng MỘT LẦN ở cuối file (window.__openDkSearch)
  // vì nó nằm ngoài #viewport; ở đây chỉ nối nút của header đang render.
  /* Nút search giờ là TOGGLE: đang mở thì chính nó (đã đổi thành ✕) đóng lại */
  const dkSearchBtn = root.querySelector('#dkSearchBtn');
  if (dkSearchBtn) dkSearchBtn.addEventListener('click', () => {
    if (window.__dkSearchOpen && window.__dkSearchOpen()) window.__closeDkSearch();
    else if (window.__openDkSearch) window.__openDkSearch();
  });
  // ô nhập nằm trong header vừa render -> nối listener cho đúng phần tử mới
  if (window.__wireDkSearch) window.__wireDkSearch(root);

  // ── Desktop header: nút đổi ngôn ngữ (toggle VI ↔ EN, tái dùng flow settings panel) ──
  root.querySelectorAll('[data-dklang]').forEach(b => b.addEventListener('click', () => {
    const to = LANG === 'vi' ? 'en' : 'vi';
    const opt = document.querySelector(`#settingsPanel [data-lang="${to}"]`);
    if (opt) opt.click();
    /* Nút hiện NGÔN NGỮ ĐANG DÙNG nên phải vẽ lại cả cờ, không chỉ chữ.
       LANG đã đổi sau khi click option ở trên -> dkLangChip() ra đúng cặp mới. */
    b.innerHTML = dkLangChip();
  }));

  // Đăng nhập: mở từ PLP/PDP -> quay lại đó (giỏ sẽ thành bản thành viên);
  // mở từ giỏ (nút Đặt hàng) -> đi tiếp checkout như Figma
  // Mở chi tiết đơn hàng
  root.querySelectorAll('[data-order]').forEach(btn => {
    btn.addEventListener('click', () => { currentOrder = btn.dataset.order; go('order'); });
  });

  // ACCOUNT: tabs trên đầu
  root.querySelectorAll('[data-atab]').forEach(btn => {
    btn.addEventListener('click', () => {
      accountTab = btn.dataset.atab;
      root.querySelectorAll('[data-atab]').forEach(x => {
        const on = x.dataset.atab === accountTab;
        x.className = 'acc-tab relative h-11 px-4 flex items-center text-left text-[14px] press ' + (on ? 'text-foreground font-medium bg-secondary' : 'text-muted-foreground');
        x.querySelector('.acc-tab-underline').className = 'acc-tab-underline absolute left-0 top-0 bottom-0 w-0.5 bg-primary transition-opacity duration-200 ' + (on ? 'opacity-100' : 'opacity-0');
      });
      const ttl = root.querySelector('#accTitle');
      if (ttl) {
        const hit = ACCOUNT_TABS.find(([id]) => id === accountTab);
        ttl.textContent = hit ? hit[1] : 'Tài khoản';
        localizeNew(ttl.parentElement);
      }
      const body = root.querySelector('#accBody');
      if (body) { body.innerHTML = accountBody(); wire(root); localizeNew(body); }
    });
  });
  // Đăng xuất từ trang account
  root.querySelectorAll('[data-logout]').forEach(btn => btn.addEventListener('click', () => { ckAuth = false; go('plp'); toast('Đã đăng xuất'); }));

  // Mở menu drawer
  root.querySelectorAll('[data-menu-open]').forEach(btn => btn.addEventListener('click', () => window.__openMenu && window.__openMenu()));

  /* Handler `[data-auth-back]` ĐÃ XOÁ cùng authNav (19/08/2026) — nút back chỉ
     tồn tại trong hàm đó nên handler thành code chết.
     ⚠ ĐƯỜNG QUAY LẠI còn thiếu ở 2 view, đã báo user:
       · `reginfo`  (Hoàn tất đăng ký) — trước back về `register`
       · `setpass`  (Đặt mật khẩu mới) — trước back về `otp`
     4 view kia vẫn có lối ra bằng CHỮ nên không mất gì:
       login (là màn gốc) · register + otp ("Đã có tài khoản? Đăng nhập")
       · forgot ("← Quay lại đăng nhập")
     Muốn trả lại lối cho 2 view kia thì thêm 1 nút chữ ở cuối form, ĐỪNG dựng
     lại thanh header — đó chính là thứ vừa bỏ. */

  // ── AUTH: chuyển view ──
  root.querySelectorAll('[data-auth-go]').forEach(btn => {
    btn.addEventListener('click', () => { authView = btn.dataset.authGo; rerenderLogin(); });
  });

  // Nhận OTP: lấy SĐT (bắt buộc) -> ghi nhớ luồng -> sang view OTP
  root.querySelectorAll('[data-auth-otp]').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = root.querySelector('#regPhone');
      authPhone = inp && inp.value.trim() ? inp.value.trim() : '';
      if (!authPhone) { if (inp) { setFieldErr(inp, 'Vui lòng nhập số điện thoại'); inp.focus(); } return; }
      if (inp) clearFieldErr(inp);
      authFlow = authView === 'forgot' ? 'forgot' : 'register';
      btn.innerHTML = spinnerSVG();
      setTimeout(() => { authView = 'otp'; rerenderLogin(); toast('Đã gửi mã OTP'); }, 700);
    });
  });

  /* Gõ lại vào ô SĐT thì xoá lỗi ngay — không thì lỗi nằm lì tới lần bấm sau.
     Cùng lối với ô checkout ([data-ckf]) đã làm. */
  root.querySelectorAll('#regPhone, #loginId').forEach(inp =>
    inp.addEventListener('input', () => clearFieldErr(inp)));

  // Đổi SĐT từ màn OTP -> quay lại màn nhập SĐT của luồng
  root.querySelectorAll('[data-otp-change]').forEach(btn => {
    btn.addEventListener('click', () => { authView = authFlow; rerenderLogin(); });
  });

  // Ô OTP: tự nhảy ô kế + nút "Nhận lại mã (60s)" đếm ngược
  const otpCells = [...root.querySelectorAll('[data-otp]')];
  if (otpCells.length) {
    otpCells[0].focus();
    otpCells.forEach((c, i) => {
      c.addEventListener('input', () => {
        c.value = c.value.replace(/[^0-9]/g, '').slice(0, 1);
        if (c.value && i < otpCells.length - 1) otpCells[i + 1].focus();
      });
      c.addEventListener('keydown', e => { if (e.key === 'Backspace' && !c.value && i > 0) otpCells[i - 1].focus(); });
    });
    const rBtn = root.querySelector('#otpResend');
    if (rBtn) {
      const startCountdown = () => {
        rBtn.disabled = true;
        rBtn.innerHTML = 'Nhận lại mã (<span id="otpTimer">60</span>s)';
        localizeNew(rBtn);
        let t = 60; const tEl = rBtn.querySelector('#otpTimer');
        const iv = setInterval(() => {
          t--; if (tEl) tEl.textContent = t;
          if (t <= 0) { clearInterval(iv); rBtn.disabled = false; rBtn.textContent = 'Nhận lại mã'; localizeNew(rBtn); }
        }, 1000);
      };
      startCountdown();
      rBtn.addEventListener('click', () => { if (!rBtn.disabled) { toast('Đã gửi lại mã OTP'); startCountdown(); } });
    }
  }

  // Độ mạnh mật khẩu (view reset)
  const npass = root.querySelector('#npass'), pwBar = root.querySelector('#pwBar'), pwHint = root.querySelector('#pwHint');
  if (npass && pwBar) {
    npass.addEventListener('input', () => {
      const v = npass.value; let sc = 0;
      if (v.length >= 8) sc++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) sc++; if (/[0-9]/.test(v)) sc++; if (/[^A-Za-z0-9]/.test(v)) sc++;
      const pct = ['w-1/5','w-2/5','w-3/5','w-4/5','w-full'][sc];
      const col = sc <= 1 ? 'bg-destructive' : sc <= 2 ? 'bg-warning' : sc <= 3 ? 'bg-warning' : 'bg-success';
      pwBar.className = 'h-full ' + pct + ' ' + col + ' rounded-full transition-all duration-300';
      pwHint.textContent = sc <= 1 ? 'Yếu - Cần ít nhất 8 ký tự' : sc <= 2 ? 'Trung bình - Thêm ký tự đặc biệt để tăng độ bảo mật' : sc <= 3 ? 'Khá - Thêm ký tự đặc biệt để mạnh hơn' : 'Mạnh - Mật khẩu tốt';
    });
  }

  // Xác nhận OTP -> đăng ký: sang điền thông tin; quên mật khẩu: sang đặt mật khẩu mới
  root.querySelectorAll('[data-auth-verify]').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = otpCells.map(c => c.value).join('');
      if (code.length < 6) { otpErr(root, 'Vui lòng nhập đủ 6 số'); return; }
      otpErr(root, '');
      btn.innerHTML = spinnerSVG();
      setTimeout(() => { authView = authFlow === 'register' ? 'reginfo' : 'setpass'; rerenderLogin(); }, 700);
    });
  });

  // Hoàn tất đăng ký (sau OTP): tạo tài khoản -> đăng nhập luôn, quay về màn gọi
  root.querySelectorAll('[data-reg-done]').forEach(btn => {
    btn.addEventListener('click', () => {
      ckAuth = true; ckStep = 0;   // vào checkout luôn mở bước Vận chuyển — xem ghi chú ở screenCHECKOUT
      btn.innerHTML = spinnerSVG();
      const back = loginFrom || 'checkout';
      setTimeout(() => { authView = 'login'; go(back); toast('Đăng ký thành công'); }, 700);
    });
  });

    root.querySelectorAll('[data-login-submit]').forEach(btn => {
    btn.addEventListener('click', () => {
      ckAuth = true; ckStep = 0;   // vào checkout luôn mở bước Vận chuyển — xem ghi chú ở screenCHECKOUT
      if (btnBusy(btn)) return;
      const html = btn.innerHTML;
      btn.innerHTML = `<svg class="spin" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><path d="M14.5 8A6.5 6.5 0 0 0 8 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
      const back = loginFrom || 'checkout'; // luôn trả về đúng màn đã mở đăng nhập, không ép về checkout
      setTimeout(() => { btn.innerHTML = html; btnDone(btn); authView = 'login'; go(back); toast(back === 'checkout' ? 'Đăng nhập thành công' : 'Đã đăng nhập · UserOne'); }, 700);
    });
  });

  // product → PDP
  wireProductCards(root);

  // add to cart -> bay ảnh vào giỏ rồi mở sheet xác nhận (thay toast + tự chuyển giỏ)
  root.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.oosState) return;   // đang ở trạng thái hết hàng -> không thêm giỏ
      const img = root.querySelector('#pdpGallery img');
      if (img) flyToCart(img);
      cartQty++;
      document.querySelectorAll('.cart-badge').forEach(b => { b.textContent = cartQty; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); });
      const p = PRODUCTS[SCREEN_PRODUCT[current] || 0];
      const colorEl = root.querySelector('#colorName');
      const sizeChip = root.querySelector('.chip.on');
      const sizeLbl = root.querySelector('.size-trigger-label');
      const size = sizeChip ? sizeChip.dataset.size
        : (sizeLbl && !sizeLbl.classList.contains('text-muted-foreground') ? sizeLbl.textContent.trim() : '');
      const variant = [colorEl ? colorEl.textContent.trim() : '', size].filter(Boolean).join(' , ');
      setTimeout(() => window.__openCartConfirm && window.__openCartConfirm({
        img: `${A}${p.img}`, brand: p.brand, name: p.name, variant,
        price: p.price, off: p.off, was: p.was, preorder: p.preorder,
      }), 450);
    });
  });

  // toast buttons
  root.querySelectorAll('[data-toast]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); toast(b.dataset.toast); }));

  // checkout: chuyển section (không chuyển trang)
  if (root.querySelector('#ckSections')) {
    paintCheckout(root);
    /* Danh sách sản phẩm của panel (#ckSumAcc) đóng/mở qua hàng trigger
       "Giỏ hàng của bạn" — đi qua wiring .acc-trigger chung, không cần handler riêng. */
    const scrollTo = (i) => {
      const sec = root.querySelector(`.ck-sec[data-sec="${i}"]`);
      if (sec) window.scrollTo({ top: sec.getBoundingClientRect().top + window.scrollY - 56, behavior: 'smooth' });
    };
    /* 3 ô người nhận ghi thẳng vào state mỗi lần gõ — nhờ vậy đổi thành phố /
       cửa hàng (dựng lại phần thân) không làm mất chữ, và phần tóm tắt sau khi
       Xác nhận có dữ liệu để nhắc lại. */
    const CKF = { name: v => ckName = v, phone: v => ckPhone = v, email: v => ckEmail = v,
                  sname: v => ckShipName = v, sphone: v => ckShipPhone = v, saddr: v => ckShipLine = v };
    root.querySelectorAll('[data-ckf]').forEach(inp => {
      inp.addEventListener('input', () => {
        CKF[inp.dataset.ckf] && CKF[inp.dataset.ckf](inp.value);
        clearFieldErr(inp);
      });
    });

    root.querySelectorAll('.ck-next').forEach(btn => {
      btn.addEventListener('click', () => {
        // Bước nhận tại cửa hàng: chưa chọn cửa hàng thì không cho đi tiếp
        if (btn.dataset.require === 'store') {
          if (!ckStore) { toast('Chọn cửa hàng nhận hàng'); return; }
          if (!validatePickup(root)) return;
          paintStore(root);   // đồng bộ tóm tắt với chữ vừa gõ trước khi thu gọn
        }
        // bước giao hàng: đồng bộ tóm tắt với địa chỉ/chữ vừa nhập
        const shipDone = root.querySelector('#ckShipDone');
        if (shipDone) { shipDone.innerHTML = ckShipDoneHTML(); localizeNew(shipDone); }
        // đang sửa lại một bước đã xong -> nhảy thẳng về bước xa nhất
        const editing = ckMaxStep > ckStep;
        ckStep = editing ? ckMaxStep : +btn.dataset.next;
        ckMaxStep = Math.max(ckMaxStep, ckStep);
        paintCheckout(root);
        setTimeout(() => scrollTo(ckStep), 120);
      });
    });
    /* Đổi hình thức nhận hàng: dựng lại đúng màn checkout tại chỗ (số section
       khác nhau giữa 2 chế độ nên không thể chỉ ẩn/hiện). */
    root.querySelectorAll('[data-ck-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (ckMode === btn.dataset.ckMode) return;
        ckMode = btn.dataset.ckMode;
        ckStep = 0; ckMaxStep = 0;
        rerenderCheckout(root);
        window.scrollTo(0, 0);
      });
    });
    /* Sổ địa chỉ: chọn địa chỉ đã lưu chỉ cần đổi thẻ đang chọn; chuyển sang
       (hoặc rời khỏi) "Thêm địa chỉ mới" thì phải dựng lại vì form 6 ô xổ ra /
       thu vào. Tóm tắt cập nhật ngay để nút Xác nhận thu gọn là thấy đúng. */
    root.querySelectorAll('#addrOpts [data-addr]').forEach(o => {
      o.addEventListener('click', () => {
        const v = o.dataset.addr === 'new' ? 'new' : +o.dataset.addr;
        if (v === ckAddr) return;
        const formToggles = (v === 'new') !== (ckAddr === 'new');
        ckAddr = v;
        if (formToggles) { rerenderCheckout(root); return; }
        root.querySelectorAll('#addrOpts [data-addr]').forEach(x => {
          x.classList.remove('on'); x.querySelector('.radio').classList.remove('on');
        });
        o.classList.add('on'); o.querySelector('.radio').classList.add('on');
        const done = root.querySelector('#ckShipDone');
        if (done) { done.innerHTML = ckShipDoneHTML(); localizeNew(done); }
      });
    });

    /* Danh sách cửa hàng: lần chọn ĐẦU TIÊN phải dựng lại để lộ khối thông tin
       người nhận; các lần đổi sau chỉ chuyển thẻ đang chọn — giữ nguyên chữ
       người dùng đã gõ ở ô SĐT/email. */
    root.querySelectorAll('#storeOpts [data-opt]').forEach(o => {
      o.addEventListener('click', () => {
        const name = o.dataset.opt.slice(6);      // bỏ tiền tố "store:"
        if (name === ckStore) return;
        const first = !ckStore;
        ckStore = name;
        if (first) {
          // lần đầu: khối người nhận mới mọc ra -> đưa con trỏ vào ô đầu tiên
          rerenderCheckout(root);
          const inp = root.querySelector('#ckRecipient input');
          if (inp) inp.focus({ preventScroll: true });
          const box = root.querySelector('#ckRecipient');
          if (box) setTimeout(() => window.scrollTo({ top: box.getBoundingClientRect().top + window.scrollY - 56, behavior: 'smooth' }), 60);
          return;
        }
        root.querySelectorAll('#storeOpts [data-opt]').forEach(x => {
          x.classList.remove('on'); x.setAttribute('aria-checked', 'false');
          x.querySelector('.radio').classList.remove('on');
        });
        o.classList.add('on'); o.setAttribute('aria-checked', 'true');
        o.querySelector('.radio').classList.add('on');
        paintStore(root);
      });
    });
    root.querySelectorAll('.ck-change').forEach(btn => {
      btn.addEventListener('click', () => {
        ckStep = +btn.dataset.goto;
        paintCheckout(root);
        setTimeout(() => scrollTo(ckStep), 120);
      });
    });
    // Xuất hóa đơn VAT -> hiện/ẩn field
    const vatToggle = root.querySelector('#vatToggle');
    if (vatToggle) {
      const chk = vatToggle.querySelector('.chk');
      const fields = root.querySelector('#vatFields');
      vatToggle.addEventListener('click', () => {
        const on = !chk.classList.contains('on');
        chk.classList.toggle('on', on);
        fields.classList.toggle('is-open', on);
        if (on) setTimeout(() => fields.querySelector('input')?.focus({ preventScroll: true }), 380);
      });
    }
    // Xuất hóa đơn VAT: đổi tab Cá nhân / Công ty -> đổi luôn bộ field bên dưới
    root.querySelectorAll('[data-vat-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.vatType;
        if (type === vatType) return;
        vatType = type;
        root.querySelectorAll('[data-vat-type]').forEach(b => {
          b.className = segBtnClass(b.dataset.vatType === vatType, 'h-10');
        });
        const rows = root.querySelector('#vatFieldRows');
        if (rows) { rows.innerHTML = vatFieldRows(vatType); localizeNew(rows); }
      });
    });

    // đổi tóm tắt vận chuyển theo lựa chọn
    root.querySelectorAll('#shipOpts [data-opt]').forEach(o => {
      o.addEventListener('click', () => {
        const lbl = root.querySelector('#shipDoneLabel');
        if (lbl) lbl.textContent = o.dataset.opt === 'fast' ? 'Giao hàng nhanh' : 'Giao hàng thông thường';
      });
    });
  }

  // accordions
  root.querySelectorAll('.acc-trigger').forEach(t => {
    t.addEventListener('click', e => {
      e.stopPropagation();
      const me = t.closest('.acc');
      const wasOpen = me.classList.contains('open');
      // đóng mọi mục cùng nhóm (cùng phần tử cha) trước
      [...me.parentElement.children].forEach(sib => {
        if (sib !== me && sib.classList && sib.classList.contains('acc')) sib.classList.remove('open');
      });
      me.classList.toggle('open', !wasOpen);
    });
  });

  // (ô chọn size của PDP dropdown giờ xổ dropdown inline — xem khối [data-size-dd]
  //  bên dưới; không còn gọi __openSizeSheet / popup giữa màn như bản mobile)

  // checkbox
  root.querySelectorAll('[data-check]').forEach(c => {
    c.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      c.classList.toggle('on');
      /* Riêng ô tick trong giỏ: tick = "sản phẩm này nằm trong đơn". Bỏ tick là
         rời tạm tính -> quà kèm sản phẩm rút theo và quà theo đơn tính lại
         (có thể rớt mốc). Các màn khác không có .cart-row nên không dính. */
      const row = c.closest('.cart-row');
      if (!row) return;
      const item = CART[+row.dataset.row];
      if (!item) return;
      item.sel = c.classList.contains('on');
      refreshCartAll(root);
    });
  });

  // radio option groups
  /* Chỉ bật/tắt class .on — màu viền thẻ do .opt.on cấp, vòng radio giữ nguyên
     viền 1px ở cả 2 trạng thái. Trước đây còn tráo border-primary/border-border
     bằng tay, vừa trùng việc với CSS vừa vẽ vòng radio dày 2px đổi đen. */
  root.querySelectorAll('#shipOpts, #payOpts, #giftOpts').forEach(group => {
    group.querySelectorAll('[data-opt]').forEach(o => {
      o.addEventListener('click', () => {
        group.querySelectorAll('[data-opt]').forEach(x => {
          x.classList.remove('on');
          x.querySelector('.radio').classList.remove('on');
          const d = x.parentElement.querySelector('.pay-detail');
          if (d) { d.classList.remove('max-h-40', 'mt-2'); d.classList.add('max-h-0'); }
        });
        o.classList.add('on');
        o.querySelector('.radio').classList.add('on');
        const d = o.parentElement.querySelector('.pay-detail');
        if (d) { d.classList.remove('max-h-0'); d.classList.add('max-h-40', 'mt-2'); }
      });
    });
  });

  // PDP: sizes / swatches / gallery
  // Chạy cho CẢ 2 kiểu chọn size — chip grid (pdp/pdp4) lẫn dropdown
  // (pdp2/3/5/6) — để cả hai cùng dùng setCta cập nhật nút CTA chính.
  const sizeBtns = [...root.querySelectorAll('[data-size]')];
  const sizeDD   = root.querySelector('[data-size-dd]');
  if (sizeBtns.length || sizeDD) {
    // dòng cảnh báo dưới chips / dưới ô dropdown (Figma: Regular 12 #d62845)
    const chipRow = sizeBtns.length ? sizeBtns[0].parentElement : sizeDD;
    let note = root.querySelector('#sizeNote');
    if (!note) {
      note = document.createElement('p');
      note.id = 'sizeNote';
      note.className = 'text-[12px] leading-4 text-destructive hidden pt-2';
      note.textContent = '*Tạm hết hàng';
      chipRow.insertAdjacentElement('afterend', note);
    }
    const cta      = root.querySelector('#pdpCta');
    const mainBtn  = cta ? cta.querySelector('button[data-add]') : null;
    const payOffer = cta ? [...cta.children].find(c => c.textContent.includes('Trả trước')) : null;
    const stickyBtn = document.querySelector('#pdpStickyCta button[data-add]');
    const NORMAL = mainBtn ? mainBtn.innerHTML : '';
    const stickyNormal = stickyBtn ? stickyBtn.innerHTML : '';

    // state: '' bình thường | 'oos' Tạm hết hàng | 'notify' Nhận thông báo | 'done' đã đăng ký
    const lowStock = root.querySelector('#lowStock');
    function setCta(state, size) {
      if (!mainBtn) return;
      const LABEL = { oos: 'Tạm hết hàng', notify: 'Nhận thông báo khi có hàng', done: 'Đã đăng ký nhận thông báo' };
      if (state) {
        mainBtn.dataset.oosState = state;
        mainBtn.innerHTML = LABEL[state];
        if (stickyBtn) { stickyBtn.dataset.oosState = state; stickyBtn.innerHTML = LABEL[state]; }
        if (payOffer) payOffer.classList.add('hidden');   // Figma: Payment Offer ẩn khi hết hàng
        if (lowStock) lowStock.classList.add('hidden');   // hết hàng / đã đăng ký thì không hiện "Chỉ còn 01 sản phẩm"
        if (state === 'oos') {
          // Tạm hết hàng: không còn hành động nào khả dụng -> disable hẳn nút, bỏ dòng cảnh báo đỏ (dư thừa)
          note.classList.add('hidden');
          mainBtn.disabled = true; mainBtn.style.opacity = '.4'; mainBtn.style.pointerEvents = 'none';
          if (stickyBtn) { stickyBtn.disabled = true; stickyBtn.style.opacity = '.4'; stickyBtn.style.pointerEvents = 'none'; }
        } else {
          note.classList.remove('hidden');
          mainBtn.disabled = false; mainBtn.style.opacity = ''; mainBtn.style.pointerEvents = '';
          if (stickyBtn) { stickyBtn.disabled = false; stickyBtn.style.opacity = ''; stickyBtn.style.pointerEvents = ''; }
        }
      } else {
        delete mainBtn.dataset.oosState;
        mainBtn.innerHTML = NORMAL;
        mainBtn.disabled = false; mainBtn.style.opacity = ''; mainBtn.style.pointerEvents = '';
        if (stickyBtn) { delete stickyBtn.dataset.oosState; stickyBtn.innerHTML = stickyNormal; stickyBtn.disabled = false; stickyBtn.style.opacity = ''; stickyBtn.style.pointerEvents = ''; }
        note.classList.add('hidden');
        if (payOffer) payOffer.classList.remove('hidden');
        // "Chỉ còn 01 sản phẩm" chỉ hiện khi size vừa chọn nằm trong SIZE_LOW_STOCK
        // (size mang tiền tố hệ đo "IT 42" -> bóc về số thô trước khi tra)
        if (lowStock) lowStock.classList.toggle('hidden', !SIZE_LOW_STOCK[sizeRaw(size)]);
      }
    }

    sizeBtns.forEach(b => {
      b.addEventListener('click', () => {
        sizeBtns.forEach(x => { x.classList.remove('on'); x.classList.replace('border-primary', 'border-border'); });
        b.classList.add('on'); b.classList.replace('border-border', 'border-primary');
        setCta(b.dataset.oos || '', b.dataset.size);   // '' | 'oos' | 'notify' — lấy thẳng từ size
      });
    });

    /* ── Dropdown chọn size (pdp2/3/5/6) ──
       Xổ ngay dưới ô chọn thay vì mở popup giữa màn như mobile. Hàng nào hết
       hàng thì gạch ngang + "Nhận thông báo"; chọn xong đóng dropdown và để
       CTA chính của PDP đổi trạng thái qua setCta — y như nhánh chip. */
    if (sizeDD) {
      const trigger = sizeDD.querySelector('[data-size-trigger]');
      const caret   = sizeDD.querySelector('[data-size-caret]');
      const listBox = sizeDD.querySelector('[data-size-list]');
      const label   = trigger.querySelector('.size-trigger-label');
      const opts    = SIZE_SHEET_OPTIONS[trigger.dataset.sizeTrigger] || [];
      let picked = null;

      const paint = () => {
        listBox.innerHTML = opts.map(o => {
          const status = o.oos ? 'Nhận thông báo' : (o.left ? `Còn ${o.left} sản phẩm` : '');
          return `
          <button type="button" role="option" aria-selected="${o.label === picked}" data-size-opt="${o.label}"
                  class="w-full min-h-11 flex items-center gap-1 px-3 py-2 text-left transition-colors press ${o.label === picked ? 'bg-secondary' : 'ghost-hover'}">
            <span class="flex-1 min-w-0 text-[14px] leading-5 ${o.oos ? 'text-muted-foreground line-through' : 'text-foreground'}">${o.label}</span>
            ${status ? `<span class="text-[12px] leading-4 text-muted-foreground shrink-0">${status}</span>` : ''}
          </button>`;
        }).join('');
        listBox.querySelectorAll('[data-size-opt]').forEach(b => b.addEventListener('click', () => {
          picked = b.dataset.sizeOpt;
          const o = opts.find(x => x.label === picked);
          label.textContent = picked;
          label.classList.remove('text-muted-foreground');
          label.classList.add('text-foreground');
          close();
          // oos là boolean trong SIZE_SHEET_OPTIONS -> map về 'oos' | 'notify' như chip
          // (picked là nhãn có tiền tố hệ đo -> bóc về số thô để tra OOS_MODE)
          setCta(o && o.oos ? (OOS_MODE[sizeRaw(picked)] || 'oos') : '', picked);
        }));
        localizeNew(listBox);
      };
      const open  = () => { paint(); listBox.classList.remove('hidden'); trigger.setAttribute('aria-expanded', 'true'); caret.style.transform = 'translateY(-50%) rotate(180deg)'; };
      const close = () => { listBox.classList.add('hidden'); trigger.setAttribute('aria-expanded', 'false'); caret.style.transform = ''; };

      trigger.addEventListener('click', e => {
        e.stopPropagation();
        listBox.classList.contains('hidden') ? open() : close();
      });
      listBox.addEventListener('click', e => e.stopPropagation());
      document.addEventListener('click', close);
      scrollCleanups.push(() => document.removeEventListener('click', close));
      trigger.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    }

    // 'notify' -> mở form điền email + SĐT
    [mainBtn, stickyBtn].forEach(btn => {
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (btn.dataset.oosState === 'notify' && window.__openNotify) window.__openNotify(() => setCta('done'));
      });
    });
  }
  root.querySelectorAll('[data-sw]').forEach(b => {
    b.addEventListener('click', () => {
      root.querySelectorAll('[data-sw]').forEach(x => { x.classList.remove('on'); x.classList.add('border-transparent'); });
      b.classList.add('on'); b.classList.remove('border-transparent');
      const cn = root.querySelector('#colorName'); if (cn) cn.textContent = b.dataset.color;
      const g = root.querySelector('#pdpGallery');
      if (g) g.scrollTo({ left: g.clientWidth * (+b.dataset.sw), behavior: 'smooth' });
    });
  });
  const gal = root.querySelector('#pdpGallery');
  if (gal) {
    gal.addEventListener('scroll', () => {
      const i = Math.round(gal.scrollLeft / gal.clientWidth);
      root.querySelectorAll('#pdpDots span').forEach((d, j) => {
        d.className = `h-1 rounded-full transition-all duration-300 ${j === i ? 'w-6 bg-primary' : 'w-4 bg-border-3'}`;
      });
    }, { passive: true });
  }

  // Info tabs -> đẩy bottom sheet (versace b-drawer)
  root.querySelectorAll('.sheet-trigger').forEach(btn => {
    btn.addEventListener('click', () => {
      const tabs = window.__pdp4Tabs || [];
      const t = tabs[+btn.dataset.sheetIdx];
      if (t && window.__openInfoSheet) window.__openInfoSheet(t[0], t[1]);
    });
  });

  // Zoom khi chạm ảnh gallery (versace) — dragScroll đã chặn nếu vừa kéo
  root.querySelectorAll('.zoomable').forEach(btn => {
    btn.addEventListener('click', e => { if (window.__openZoom) window.__openZoom(btn.dataset.zoom); });
  });

  // WEAR IT WITH: counter "i / n" chạy theo cuộn
  const wiw = root.querySelector('#wiwRow'), wc = root.querySelector('#wiwCounter');
  if (wiw && wc) {
    const cards = wiw.querySelectorAll('[data-product]');
    wiw.addEventListener('scroll', () => {
      const i = Math.min(cards.length, Math.round(wiw.scrollLeft / (cards[0].offsetWidth + 4)) + 1);
      wc.textContent = i + ' / ' + cards.length;
    }, { passive: true });
  }

  // Cart (thành viên): Ưu đãi DAFC Rewards — radio đúng nghĩa, chọn 1 trong 2
  const rewardGroup = root.querySelector('#rewardOpts');
  if (rewardGroup) {
    rewardGroup.querySelectorAll('[data-reward]').forEach(b => {
      b.addEventListener('click', () => {
        if (b.dataset.reward === cartReward) return;
        cartReward = b.dataset.reward;
        rewardGroup.querySelectorAll('[data-reward]').forEach(x => {
          const on = x === b;
          x.classList.toggle('on', on);          // viền thẻ do .opt.on cấp
          x.querySelector('.radio').classList.toggle('on', on);
        });
        refreshCartSummary(root);
        toast('Đã áp dụng: ' + (cartReward === 'member' ? 'Giảm giá thành viên' : 'Điểm thưởng'));
      });
    });
  }

  // Cart: "Chương trình khuyến mãi" — mặc định hiện mấp mé, bấm mới hiện hết
  const promoToggle = root.querySelector('#promoToggle');
  if (promoToggle) {
    const peek = root.querySelector('#promoPeek');
    promoToggle.addEventListener('click', () => {
      const open = peek.classList.toggle('open');
      promoToggle.textContent = open ? 'Thu gọn' : 'Xem tất cả 3 chương trình';
    });
  }

  // Cart: qty steppers — số lượng là STATE (CART[i].qty), không chỉ chữ trong DOM
  root.querySelectorAll('.qty-btn').forEach(b => {
    b.addEventListener('click', () => {
      const row = b.closest('.cart-row'), el = row.querySelector('.qty');
      let v = parseInt(el.textContent, 10) + parseInt(b.dataset.step, 10);
      v = Math.max(1, Math.min(99, v));
      el.textContent = String(v).padStart(2, '0');
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      const item = CART[+row.dataset.row];
      if (!item) return;
      item.qty = v;
      refreshCartAll(root);      // tăng đủ mốc là quà theo đơn hiện ngay ở đây
    });
  });

  // Cart: delete row
  root.querySelectorAll('.del').forEach(b => {
    b.addEventListener('click', () => {
      const row = b.closest('.cart-row');
      /* Đánh dấu removed NGAY (không chờ animation xong) để tạm tính + điều kiện
         quà phản ánh đúng lúc người dùng thấy dòng bắt đầu trượt đi. Không splice
         khỏi CART vì các dòng sau còn tham chiếu chỉ số qua data-row. */
      const item = CART[+row.dataset.row];
      if (item) { item.removed = true; item.sel = false; }
      const giftEl = row.nextElementSibling;   // dòng quà kèm của chính item này
      if (giftEl && giftEl.dataset.giftOf === row.dataset.row) giftEl.remove();
      row.style.transition = 'opacity .28s ease, transform .28s ease, max-height .32s ease, padding .32s ease';
      row.style.maxHeight = row.offsetHeight + 'px';
      requestAnimationFrame(() => {
        row.style.opacity = '0'; row.style.transform = 'translateX(-24px)';
        row.style.maxHeight = '0'; row.style.paddingTop = '0'; row.style.paddingBottom = '0';
      });
      setTimeout(() => { row.remove(); refreshCartCount(root); }, 330);
      refreshCartAll(root);
      toast('Đã xóa sản phẩm');
    });
  });

  /* Cart: đổi quà — UỶ QUYỀN ở gốc màn vì nhóm quà bị chèn/dựng lại lúc chạy,
     bind trực tiếp thì nút của nhóm dựng sau không có handler. Cờ trên root để
     không gắn chồng nếu wire() chạy lại. */
  if (root.querySelector('#cartList') && !root.dataset.giftWired) {
    root.dataset.giftWired = '1';
    root.addEventListener('click', e => {
      const sw = e.target.closest('[data-gift-swap]');
      if (!sw || !window.__openGiftSheet) return;
      const pk = sw.dataset.giftSwap;
      window.__openGiftSheet(pk, key => {
        if (key === (giftPick[pk] || GIFT_PROGRAMS[pk].gifts[0])) return;   // chọn lại chính món đang có -> không báo gì
        giftPick[pk] = key;
        refreshCartGifts(root);
        toast('Đã đổi quà tặng');
      });
    });
  }

  /* Cart: chọn tất cả — trước đây KHÔNG tự đổi trạng thái ô tick của chính nó
     nên bấm mấy lần cũng chỉ tick lại tất cả, không bỏ tick được. Giờ đảo trạng
     thái rồi mới áp xuống các dòng (bỏ qua dòng đã xoá). */
  const selAll = root.querySelector('#selectAll');
  if (selAll) selAll.addEventListener('click', () => {
    /* Trạng thái đích suy từ STATE (không đọc class của chính ô tổng): đang
       chọn hết -> bỏ hết, còn lại -> chọn hết. Đọc class thì sau khi bỏ tick 1
       dòng, cú bấm đầu tiên lại đi bỏ tick nốt phần còn lại. */
    const items = cartItems();
    const on = !(items.length && items.every(c => c.sel !== false));
    root.querySelectorAll('.cart-row .chk').forEach(c => c.classList.toggle('on', on));
    items.forEach(c => { c.sel = on; });
    refreshCartAll(root);
  });
  const delSel = root.querySelector('#delSelected');
  if (delSel) delSel.addEventListener('click', () => {
    root.querySelectorAll('.cart-row').forEach(r => { if (r.querySelector('.chk').classList.contains('on')) r.querySelector('.del').click(); });
  });

  // Cart: Đặt hàng — khách -> popup đăng nhập nhanh (2858:42899); đã đăng nhập -> checkout
  // (dùng data-checkout riêng, KHÔNG dùng chung data-order với nút "Chi tiết" đơn
  // hàng ở Account — trước đây trùng attribute nên bấm "Đặt hàng" cũng bị dính
  // luôn handler go('order') ở dưới, đẩy sang sai trang chi tiết đơn hàng.)
  root.querySelectorAll('[data-checkout]').forEach(b => b.addEventListener('click', () => {
    /* Không còn món nào được tick thì không cho sang thanh toán: trước khi giỏ
       có state thật, tạm tính là hằng số nên chuyện này không xảy ra được; giờ
       bỏ tick hết là đơn 0 đ với đủ 4 món in ra. */
    if (root.querySelector('#cartList') && !cartSelected().length) {
      toast('Hãy chọn ít nhất 1 sản phẩm');
      return;
    }
    /* Ép mở lại bước "Vận chuyển" mỗi lần vào checkout — kể cả lượt quay lại
       giỏ rồi vào lại. Không có dòng này thì ckStep còn giữ giá trị của lượt
       trước và rơi thẳng vào bước giữa. ckMaxStep GIỮ NGUYÊN nên các bước đã
       xong vẫn ở dạng tóm tắt, không mất dữ liệu. Xem ghi chú ở screenCHECKOUT. */
    ckStep = 0;
    if (ckAuth) go('checkout');
    else if (window.__openLoginPop) window.__openLoginPop();
  }));

  // Nút "Áp dụng" chỉ active khi input có nội dung (giống pattern szAdd ở size sheet)
  const bindApplyGate = (inputEl, btnEl) => {
    if (!inputEl || !btnEl) return;
    const update = () => {
      const has = (inputEl.value || '').trim().length > 0;
      btnEl.disabled = !has;
      btnEl.style.opacity = has ? '1' : '.4';
    };
    inputEl.addEventListener('input', update);
    update();
  };
  bindApplyGate(root.querySelector('#pbh'), root.querySelector('#applyPbh'));

  // Phiếu mua hàng: mỗi mã cộng dồn vào tổng (pbhAmount demo) + có dòng riêng
  // trong summary (theo Figma 3428:55499) — hỗ trợ nhiều mã cùng lúc, xoá qua ×.
  const renderPbhList = () => {
    const list = root.querySelector('#pbhList');
    if (!list) return;
    // Ẩn hẳn khi rỗng, tránh flex gap tạo khoảng trống thừa dưới ô input
    list.className = cartPbh.length ? 'flex gap-2 flex-wrap' : 'hidden';
    list.innerHTML = cartPbh.map((p, i) => `
      <span class="pbh-badge bg-secondary rounded flex items-center gap-1.5 px-2 py-0.5 h-6" data-pbh-idx="${i}">
        <span class="text-[12px] font-medium leading-4 text-secondary-foreground truncate max-w-[140px]">${p.code}</span>
        <button class="pbh-del w-3 h-3 flex items-center justify-center shrink-0 press [&_svg]:w-3 [&_svg]:h-3">${IcoCross}</button>
      </span>`).join('');
    list.querySelectorAll('.pbh-del').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const idx = Number(b.closest('.pbh-badge').dataset.pbhIdx);
      const removed = cartPbh.splice(idx, 1)[0];
      renderPbhList();
      refreshCartSummary(root);
      toast('Đã gỡ ' + (removed ? removed.code : 'phiếu mua hàng'));
    }));
  };
  const pbhBtn = root.querySelector('#applyPbh');
  if (pbhBtn) pbhBtn.addEventListener('click', () => {
    const inp = root.querySelector('#pbh');
    const v = inp.value.trim();
    if (!v) return;
    cartPbh.push({ code: v, amount: pbhAmount(v) });
    inp.value = '';
    pbhBtn.disabled = true; pbhBtn.style.opacity = '.4';
    renderPbhList();
    refreshCartSummary(root);
    toast('Đã thêm ' + v);
  });
  renderPbhList();

  // Cart: ưu đãi — dòng "Áp dụng ưu đãi" thu gọn, bấm mở panel trượt từ mép
  // phải (xem #vcSheet). Ô nhập mã gõ tay đã dọn vào trong panel.
  const vTrigger = root.querySelector('#voucherTrigger');
  if (vTrigger) vTrigger.addEventListener('click', () => window.__openVoucherSheet && window.__openVoucherSheet(() => {
    renderVoucherUI(root);
    refreshCartSummary(root);
  }));
  renderVoucherUI(root);

  // Show more → skeleton then append
  const sm = root.querySelector('#showMore');
  if (sm) sm.addEventListener('click', () => {
    const grid = root.querySelector('#plpGrid') || sm.closest('[data-scroller]').querySelector('.grid');
    sm.innerHTML = `<svg class="spin" width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="var(--general-primary)" stroke-opacity=".2" stroke-width="2"/><path d="M14.5 8A6.5 6.5 0 0 0 8 1.5" stroke="var(--general-primary)" stroke-width="2" stroke-linecap="round"/></svg> Đang tải`;
    const skels = Array(4).fill(`<div class="flex flex-col"><div class="skel w-full" style="aspect-ratio:189/252"></div><div class="px-1 py-2 flex flex-col gap-1"><div class="skel h-3 w-2/3 rounded"></div><div class="skel h-3 w-full rounded"></div><div class="skel h-3 w-1/2 rounded"></div></div></div>`).join('');
    grid.insertAdjacentHTML('beforeend', skels);
    setTimeout(() => {
      grid.querySelectorAll('.skel').forEach(s => s.closest('.flex-col').remove());
      /* Phải lấy từ sortedProducts() (đã lọc + đúng ngành), KHÔNG phải PRODUCTS thô:
         bản trước nhồi 4 sản phẩm Versace thời trang vào mọi lưới, kể cả khi bộ
         lọc đang ra 0 kết quả -> 4 thẻ nằm ngay dưới câu "không khớp bộ lọc". */
      const more = sortedProducts().slice(0, 4);
      more.forEach(({ p, i }) => {
        grid.insertAdjacentHTML('beforeend', productCard(p, i, { w: 'reveal' }));
      });
      sm.innerHTML = 'Xem thêm';
      localizeNew(sm);
      wire(root);
      observeReveal(root);
      updatePlpProgress(root);
    }, 900);
  });

  // brand description expand / collapse
  const bToggle = root.querySelector('#brandToggle');
  if (bToggle) {
    const para = root.querySelector('#brandDesc p');
    let open = false;
    const apply = () => {
      para.style.display = '-webkit-box';
      para.style.webkitBoxOrient = 'vertical';
      para.style.overflow = 'hidden';
      para.style.webkitLineClamp = open ? 'unset' : '3';
      bToggle.textContent = open ? 'Thu gọn' : 'Xem thêm';
    };
    apply();
    bToggle.addEventListener('click', () => { open = !open; apply(); });
  }

  // category cards -> PLP chế độ danh mục
  root.querySelectorAll('[data-cate]').forEach(b =>
    b.addEventListener('click', () => goPlp({ type: 'category', title: b.dataset.cate, crumbs: [] })));

  // (Đã xoá 12/08/2026: handler .brand-chip — không có element nào mang class
  //  này trong markup desktop, handler mồ côi từ fork mobile.)

  // Bộ lọc -> bottom sheet ; Sắp xếp -> dropdown thật
  root.querySelectorAll('[data-sheet]').forEach(b =>
    b.addEventListener('click', () => { if (b.dataset.sheet === 'filter') openFilter(); }));

  const sortBtn = root.querySelector('#sortBtn');
  const sortMenu = root.querySelector('#sortMenu');
  if (sortBtn && sortMenu) {
    sortBtn.addEventListener('click', e => {
      e.stopPropagation();
      sortMenu.classList.toggle('hidden');
    });
    sortMenu.querySelectorAll('[data-sort]').forEach(opt => {
      opt.addEventListener('click', () => {
        plpSort = opt.dataset.sort;
        sortMenu.classList.add('hidden');
        sortMenu.querySelectorAll('[data-sort]').forEach(o => {
          const isOn = o.dataset.sort === plpSort;
          o.classList.toggle('font-medium', isOn);
          o.classList.toggle('text-foreground', isOn);
          o.classList.toggle('text-foreground-alt', !isOn);
          const tick = o.querySelector('svg');
          if (isOn && !tick) o.insertAdjacentHTML('beforeend', '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m3 8.5 3 3 7-7" stroke="var(--general-primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>');
          if (!isOn && tick) tick.remove();
        });
        // nhãn nút = giá trị đang chọn (Figma: "Giá : Tăng dần"), mặc định vẫn là "Sắp xếp"
        const sLabel = root.querySelector('#sortBtnLabel');
        if (sLabel) {
          sLabel.textContent = plpSort === 'relevance' ? 'Sắp xếp' : (SORT_OPTIONS.find(([id]) => id === plpSort) || [, 'Sắp xếp'])[1];
          localizeNew(sLabel);
        }
        renderPlpGrid(root, { skeleton: true });
      });
    });
    const closeSortMenu = () => sortMenu.classList.add('hidden');
    document.addEventListener('click', closeSortMenu);
    scrollCleanups.push(() => document.removeEventListener('click', closeSortMenu));
  }

  // (đã bỏ khối toggle class .merged — navbar không còn viền dưới nên không còn
  //  điểm tách cần giấu khi thanh Bộ lọc dính sát đáy nav)

  // scroll-driven behaviour (cuộn theo body — như website thật)
  {
    const pdpSticky = root.querySelector('#pdpStickyCta');
    const pdpCta    = root.querySelector('#pdpCta');
    const cartSticky= root.querySelector('#cartStickyCta');
    const cartCta   = root.querySelector('#cartCta');

    if (pdpSticky || cartSticky) {
      const onScroll = () => {
        const vh = window.innerHeight;
        if (pdpSticky && pdpCta) {
          const r = pdpCta.getBoundingClientRect();
          const show = r.bottom < 0 || r.top > vh;      // nút gốc ra khỏi màn hình
          pdpSticky.style.opacity = show ? '1' : '0';
          pdpSticky.style.transform = `translateY(${show ? 0 : 10}px)`;
          pdpSticky.style.pointerEvents = show ? 'auto' : 'none';
        }
        if (cartSticky && cartCta) {
          const r2 = cartCta.getBoundingClientRect();
          const show = r2.bottom < 0 || r2.top > vh;   // nút gốc ra khỏi màn hình
          cartSticky.style.opacity = show ? '1' : '0';
          cartSticky.style.transform = `translateY(${show ? 0 : 10}px)`;
          cartSticky.style.pointerEvents = show ? 'auto' : 'none';
        }
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      scrollCleanups.push(() => {
        window.removeEventListener('scroll', onScroll);
        window.removeEventListener('resize', onScroll);
      });
      setTimeout(onScroll, 60);
    }
  }

  root.querySelectorAll('.drag-x').forEach(dragScroll);

  // Chuyển grid 4 cột (02/03/05) / 3 cột (04-Grid3) — density toggle trên filter bar
  // Figma: nút không được chọn dùng State=Disabled → opacity .5, không đổi màu icon
  const plpGrid = root.querySelector('#plpGrid');
  root.querySelectorAll('[data-grid]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cols = btn.dataset.grid;
      plpCols = cols;
      if (plpGrid) {
        plpGrid.classList.toggle('grid-cols-4', cols === '4');
        plpGrid.classList.toggle('grid-cols-3', cols === '3');
      }
      root.querySelectorAll('[data-grid]').forEach(x => x.classList.toggle('opacity-50', x.dataset.grid !== cols));
    });
  });

  // Chip "bộ lọc đang áp dụng": bỏ từng chip / xóa tất cả
  // (wire() được gọi lại sau "Xem thêm" nên phải khoá chống gắn handler 2 lần —
  //  splice chạy 2 lượt sẽ xoá nhầm chip kế bên)
  bindActiveFilterChips(root);

  // (dkDept được ghi trong chính handler [data-nav] ở trên — phải trước go())
  wireSubheader(root);

  // Dòng khuyến mãi ở PDP2 — mở info sheet với bảng chi tiết (nội dung HTML)
  root.querySelectorAll('[data-promo]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const p = PROMOS[btn.dataset.promo];
      if (!p || !window.__openInfoSheet) return;
      const body = `
        <div class="flex flex-col gap-4">
          <p class="text-[14px] font-medium leading-5 text-foreground">${p.line}</p>
          <div class="flex flex-col gap-3">
            ${p.rows.map(([k, v]) => `
              <div class="flex flex-col gap-1">
                <span class="text-[12px] leading-4 text-muted-foreground">${k}</span>
                <span class="text-[14px] leading-5 text-secondary-foreground">${v}</span>
              </div>`).join('')}
          </div>
        </div>`;
      window.__openInfoSheet(p.title, body, true);
    });
  });

  // Mục lục trang chính sách — bấm để nhảy tới section
  root.querySelectorAll('[data-policy-toc]').forEach(btn => {
    btn.addEventListener('click', () => {
      root.querySelector(`[data-policy-sec="${btn.dataset.policyToc}"]`)
        ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // Nút mũi tên cuộn category strip (PLP brand hero)
  root.querySelectorAll('[data-strip-next]').forEach(b => b.addEventListener('click', () => {
    const strip = b.parentElement.querySelector('.drag-x');
    if (strip) strip.scrollBy({ left: 316, behavior: 'smooth' });
  }));

  root.querySelectorAll('[data-swatches]').forEach(rw => {
    rw.addEventListener('click', ev => {
      const btn = ev.target.closest('.cw');
      if (!btn) return;
      ev.stopPropagation();
      rw.querySelectorAll('.cw').forEach(c => { c.classList.remove('border-primary'); c.classList.add('border-transparent'); });
      btn.classList.remove('border-transparent'); btn.classList.add('border-primary');
    });
  });

  observeReveal(root);
}

function spinnerSVG() {
  return '<svg class="spin" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><path d="M14.5 8A6.5 6.5 0 0 0 8 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
}

/* ── 1 điểm vào duy nhất sau MỌI thay đổi giỏ (tick / số lượng / xoá) ──
   Thứ tự bắt buộc: tính lại tiền TRƯỚC rồi mới dựng quà, vì quà theo đơn đọc
   cartSubtotal(). Gọi hàm này thay vì rải rác từng chỗ để không bao giờ có
   trạng thái "tổng đã đổi mà quà chưa đổi". */
function refreshCartAll(root) {
  if (!root || !root.querySelector('#cartList')) return;   // không phải màn giỏ
  refreshCartSummary(root);
  refreshCartGifts(root);
  const items = cartItems();
  const cnt = root.querySelector('#cartCount');
  if (cnt) cnt.textContent = `(${items.length})`;
  // ô tick tổng luôn nói đúng: chỉ "on" khi còn món và MỌI món đang được chọn
  const master = root.querySelector('#selectAll .chk');
  if (master) master.classList.toggle('on', items.length > 0 && items.every(c => c.sel !== false));
  const lbl = root.querySelector('#selAllLabel');
  if (lbl && ckAuth) {
    lbl.textContent = `Chọn tất cả ( ${items.length} sản phẩm )`;
    if (LANG === 'en') applyLang(lbl, 'en');
  }
}

/* Dựng lại phần quà cho khớp state hiện tại.
   · quà theo sản phẩm: chèn/gỡ ngay sau đúng dòng item (không đụng dòng khác)
   · quà theo đơn: vẽ lại ruột khối #orderGift
   Chỉ chạy animation .gift-in cho quà VỪA XUẤT HIỆN — quà đang có sẵn mà nháy
   lại mỗi lần bấm +/- thì rối mắt. */
function refreshCartGifts(root) {
  const list = root.querySelector('#cartList');
  if (list) {
    CART.forEach((c, i) => {
      const rowEl = list.querySelector(`.cart-row[data-row="${i}"]`);
      const cur   = list.querySelector(`.gift-group[data-gift-of="${i}"]`);
      const want  = !!(c.gift && GIFT_PROGRAMS[c.gift] && !c.removed && c.sel !== false && rowEl);
      if (want && !cur) {
        rowEl.insertAdjacentHTML('afterend', productGiftHTML(c, i));
        giftAppear(rowEl.nextElementSibling);
      } else if (!want && cur) {
        cur.remove();
      } else if (want && cur) {
        /* Đã có nhóm rồi nhưng nội dung có thể đổi (đổi quà, mở/đóng danh sách)
           -> dựng lại tại chỗ, KHÔNG chạy animation vì quà không mới xuất hiện.
           So bằng CHỮ KÝ (data-sig) chứ KHÔNG so outerHTML: wireLazy() đóng thêm
           class .loaded + data-lazy-wired vào thẻ <img> ngay sau khi chèn, nên
           outerHTML không bao giờ còn bằng chuỗi vừa sinh -> nhóm bị đập đi dựng
           lại mỗi lần bấm bất kỳ đâu trong giỏ (mất animation đang chạy, mất focus). */
        const sig = `${c.gift}|${giftPick[c.gift] || GIFT_PROGRAMS[c.gift].gifts[0]}`;
        if (cur.dataset.sig !== sig) {
          cur.outerHTML = productGiftHTML(c, i).trim();
          const el = list.querySelector(`.gift-group[data-gift-of="${i}"]`);
          wireLazy(el);
          if (LANG === 'en') applyLang(el, 'en');
        }
      }
    });
  }
  const box = root.querySelector('#orderGift');
  if (box) {
    const had = [...box.querySelectorAll('[data-gift-tier]')].map(el => el.dataset.giftTier);
    box.innerHTML = orderGiftInner();
    wireLazy(box);                       // ảnh vừa dựng lại cũng cần .loaded
    if (LANG === 'en') applyLang(box, 'en');
    box.querySelectorAll('[data-gift-tier]').forEach(el => {
      if (!had.includes(el.dataset.giftTier)) giftAppear(el, true);
    });
  }
}

/* img.lazy đứng ở opacity 0 cho tới khi có class .loaded. Chỗ gắn class đó nằm
   trong wire() — chỉ chạy lúc dựng màn — nên MỌI ảnh chèn lúc chạy (dòng quà)
   phải gọi lại hàm này, không thì ảnh quà trong suốt vĩnh viễn. */
function wireLazy(root) {
  root.querySelectorAll('img.lazy').forEach(img => {
    if (img.dataset.lazyWired) return;
    img.dataset.lazyWired = '1';
    if (img.complete) img.classList.add('loaded');
    else img.addEventListener('load', () => img.classList.add('loaded'));
    img.addEventListener('error', () => { img.style.background = 'var(--general-secondary)'; img.classList.add('loaded'); });
  });
}

/* Cho dòng quà chạy animation xuất hiện (và dịch sang EN nếu đang ở EN).
   skipLang khi phần tử vừa được localize cả cụm ở trên. */
function giftAppear(el, skipLang) {
  if (!el) return;
  wireLazy(el);
  if (!skipLang && LANG === 'en') applyLang(el, 'en');
  el.classList.remove('gift-in'); void el.offsetWidth; el.classList.add('gift-in');
}

/* Cập nhật dòng thu gọn: nhãn (đếm ưu đãi khả dụng / đang áp) + chữ phụ bên
   phải. Để ngoài wire() vì refreshCartSummary cũng phải gọi được — số khả dụng
   đổi theo giỏ, và mã có thể TỰ RỚT khi giỏ teo lại. */
function renderVoucherUI(root) {
  if (!root) return;
  /* 24/08/2026 — ô chọn mã nay là component `pickField`, nên cập nhật bằng CHÍNH
     helper của component (`setPickLabel`): nó lo cả chữ lẫn mực. */
  const btn = root.querySelector('#voucherTrigger');
  if (btn) { setPickLabel(btn, voucherPickValue(), voucherPlaceholder()); localizeNew(btn); }
}

/* Cộng ưu đãi hội viên (đã đăng nhập) + mã giảm giá + N phiếu mua hàng -> render
   lại toàn bộ #discountLines (số dòng thay đổi động theo số phiếu đang áp) +
   cập nhật Tổng cộng / Tiết kiệm, không reload lại cả màn cart. */
function refreshCartSummary(root) {
  /* Mã rớt điều kiện (bỏ tick / bớt số lượng làm đơn tụt xuống dưới mức tối
     thiểu) phải tự gỡ TRƯỚC khi tính lại — không thì tóm tắt in ra một khoản
     giảm mà đơn không còn được hưởng. Báo cho người mua biết vì đây là thay đổi
     họ không chủ động làm. */
  const dropped = pruneVouchers();
  /* Luôn vẽ lại dòng ưu đãi, không chỉ khi có mã rớt: SỐ ƯU ĐÃI KHẢ DỤNG trên
     nhãn cũng đổi theo giỏ (tick lại món là mã đủ điều kiện trở lại). */
  renderVoucherUI(root);
  if (dropped.length) toast(`Đã gỡ ${dropped.length} ưu đãi do đơn không còn đủ điều kiện`);
  const dl = root.querySelector('#discountLines');
  /* discountLinesHTML() sinh chữ TIẾNG VIỆT nên phải dịch lại ngay sau khi dựng:
     hàm này giờ chạy sau mọi thao tác giỏ (trước đây chỉ chạy khi đổi mã/ưu đãi),

/* ── Kéo ngang carousel bằng chuột (mobile đã có vuốt native) ── */
function dragScroll(el) {
  let down = false, sx = 0, sl = 0, moved = false;
  const onDown = e => {
    if (e.pointerType === 'touch') return;      // để touch dùng cuộn native
    down = true; moved = false;
    sx = e.clientX; sl = el.scrollLeft;
    el.classList.add('dragging');
  };
  const onMove = e => {
    if (!down) return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 3) moved = true;
    el.scrollLeft = sl - dx;
    e.preventDefault();
  };
  const onUp = () => {
    if (!down) return;
    down = false;
    el.classList.remove('dragging');
  };
  // chặn click nếu vừa kéo (tránh lỡ mở sản phẩm)
  const onClick = e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } };
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('click', onClick, true);
  el.addEventListener('dragstart', e => e.preventDefault());
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  scrollCleanups.push(() => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
  });
}
/* ── Reveal observer ── */
let io;
function observeReveal(root) {
  if (!io) io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.08 });
  root.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));
}
/* ── Toast ── */
let toastT;
function toast(msg) {
  if (LANG === 'en') { const _t = tr(String(msg), 'en'); if (_t) msg = _t; }
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.remove('hidden'); t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.add('hidden'), 1800);
}
/* ── Fly to cart ── */
function flyToCart(srcImg) {
  const target = document.querySelector('.cart-badge');
  if (!target || !srcImg) return;
  const s = srcImg.getBoundingClientRect(), t = target.getBoundingClientRect();
  const clone = srcImg.cloneNode();
  clone.className = 'fly';
  Object.assign(clone.style, { left: s.left + 'px', top: s.top + 'px', width: s.width + 'px', height: s.height + 'px' });
  clone.style.setProperty('--dx', (t.left - s.left + t.width / 2 - s.width / 2) + 'px');
  clone.style.setProperty('--dy', (t.top - s.top + t.height / 2 - s.height / 2) + 'px');
  document.body.appendChild(clone);
  setTimeout(() => clone.remove(), 760);
}
/* ── Confetti ── */
function confetti() {
  const host = document.getElementById('confettiHost');
  if (!host) return;
  const colors = ['var(--general-primary)','var(--general-destructive)','var(--general-warning)','var(--unofficial-border-4)','var(--general-border)'];
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * .5) + 's';
    c.style.animationDuration = (1.6 + Math.random()) + 's';
    host.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

/* Áp một CẶP font (heading + body). Tách khỏi handler của nút để `applySkin` gọi lại
   được — bộ da Maika khai cặp mặc định là 'couture' (Libre Bodoni + Inter), lệnh user
   24/08/2026: *"mặc định ở skin maika sẽ là font mix libre và inter"*.
   Trả về bản ghi cặp để chỗ gọi tự lo toast/đóng popover; null nếu id lạ. */
function applyFontPair(id) {
  const p = FONT_PAIRS.find(x => x[0] === id);
  if (!p) return null;
  currentPair = p[0];
  currentFont = '';   // cặp đang bật — không font đơn nào được tick
  const html = document.documentElement;
  html.style.setProperty('--font-app', p[5]);   // body
  html.style.setProperty('--font-head', p[3]);  // heading
  /* MOCKUP best practice của cặp (chưa chốt): cân x-height + tracking/dòng heading.
     Thiếu `tune` thì rơi về default trong CSS. */
  const t = p[7] || {};
  html.style.setProperty('--pair-adj', t.adj ?? 0.53);
  html.style.setProperty('--pair-head-ls', t.headLs ?? '0.5px');
  html.style.setProperty('--pair-head-lh', t.headLh ?? 1.33);
  html.classList.add('font-override', 'font-pair');
  document.querySelectorAll('#settingsPanel [data-font] .fo-tick').forEach(x => x.classList.add('opacity-0'));
  document.querySelectorAll('#settingsPanel [data-font-pair]').forEach(x =>
    x.querySelector('.fp-tick').classList.toggle('opacity-0', x.dataset.fontPair !== p[0]));
  return p;
}

let currentSkin = 'libre-inter';   // khớp class `skin-mt skin-li` đặt sẵn trên thẻ <html>
/* Cùng khuôn applyTheme: gỡ mọi class skin rồi gắn class của skin đích. */
function applySkin(id) {
  const s = SKINS.find(x => x[0] === id);
  if (!s) return null;
  currentSkin = s[0];
  const html = document.documentElement;
  /* `.split(' ')` vì Maika mang 2 class (skin-mp + skin-mk) — classList.add/remove
     KHÔNG nhận chuỗi có khoảng trắng, sẽ ném InvalidCharacterError. */
  SKINS.forEach(x => { if (x[2]) html.classList.remove(...x[2].split(' ')); });
  if (s[2]) html.classList.add(...s[2].split(' '));
  /* Trả phông về mặc định của bộ da: xoá cả class .font-override lẫn biến inline
     --font-app (2 thứ mà nút chọn phông đặt lên <html>) để --font-app lại do CSS
     của bộ da cấp. */
  html.classList.remove('font-override');
  html.style.removeProperty('--font-app');
  /* đổi bộ da cũng rời chế độ CẶP font (cùng lý do reset font đơn) */
  html.classList.remove('font-pair');
  ['--font-head', '--pair-adj', '--pair-head-ls', '--pair-head-lh']
    .forEach(v => html.style.removeProperty(v));
  currentPair = '';
  document.querySelectorAll('#settingsPanel [data-font-pair] .fp-tick').forEach(t => t.classList.add('opacity-0'));
  currentFont = s[4];
  document.querySelectorAll('#settingsPanel [data-font]').forEach(x =>
    x.querySelector('.fo-tick').classList.toggle('opacity-0', x.dataset.font !== currentFont));
  document.querySelectorAll('#settingsPanel [data-skin]').forEach(x =>
    x.querySelector('.sk-tick').classList.toggle('opacity-0', x.dataset.skin !== s[0]));
  /* Bộ da có CẶP FONT MẶC ĐỊNH (ô thứ 6) thì áp luôn sau khi đã reset ở trên — phải
     đứng CUỐI vì `applyFontPair` ghi đè currentFont/tick mà khối reset vừa đặt. */
  if (s[5]) applyFontPair(s[5]);
  /* Ô thứ 7 — CẶP FONT CHỈ ĐỂ TÍCH, KHÔNG ÁP (`skin-li`, chốt user 25/08).
     Bộ da khai mặt chữ bằng token CSS nên không được đi qua `applyFontPair` (F3 cấm
     `font-size-adjust`, và `.font-pair` đẩy Bodoni xuống dưới sàn F1 — xem ghi chú ở
     bảng `SKINS`). Khối này vì vậy KHÔNG chạm `<html>`: chỉ đặt `currentPair` và dời
     dấu tích từ phông ĐƠN sang hàng CẶP, để popover nói đúng thứ đang chạy.
     Phải đứng SAU `if (s[5])` để không bị `applyFontPair` ghi đè dấu tích. */
  if (s[6]) {
    currentPair = s[6];
    currentFont = '';
    document.querySelectorAll('#settingsPanel [data-font] .fo-tick').forEach(t => t.classList.add('opacity-0'));
    document.querySelectorAll('#settingsPanel [data-font-pair]').forEach(x =>
      x.querySelector('.fp-tick').classList.toggle('opacity-0', x.dataset.fontPair !== s[6]));
  }
  return s;
}

(() => {
  const fab = document.getElementById('settingsFab');
  const panel = document.getElementById('settingsPanel');
  /* html.sp-open: nhường chỗ cho popover — thẻ #topFab nằm đúng vị trí popover
     sổ ra (bottom 144), xem CSS */
  const openP  = () => { panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); document.documentElement.classList.add('sp-open'); };
  const closeP = () => { panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); document.documentElement.classList.remove('sp-open'); };
  fab.addEventListener('click', e => { e.stopPropagation(); panel.classList.contains('open') ? closeP() : openP(); });
  panel.querySelector('.sp-backdrop').addEventListener('click', closeP);
  // ── đổi ngôn ngữ: dịch thật toàn bộ UI ──
  panel.querySelectorAll('[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => {
      const to = btn.dataset.lang;
      if (to === LANG) { closeP(); return; }
      applyLang(document.body, to);      // dịch mọi thứ đang có trong DOM
      LANG = to;
      panel.querySelectorAll('[data-lang]').forEach(x => {
        const on = x.dataset.lang === to;
        x.className = 'langopt flex-1 h-8 rounded-full text-[13px] leading-5 transition-colors press '

      });
      closeP();
      toast(to === 'en' ? 'Switched to English' : 'Đã chuyển sang Tiếng Việt');
    });
  });

  panel.querySelectorAll('[data-skin]').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = applySkin(btn.dataset.skin);
      if (!s) return;
      closeP();
      toast('Bộ da: ' + s[1]);
    });
  });

  panel.querySelectorAll('[data-theme]').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = applyTheme(btn.dataset.theme);
      if (!t) return;
      closeP();
      toast('Giao diện: ' + t[1]);
    });
  });

  panel.querySelectorAll('[data-font]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.font;
      const f = FONTS.find(x => x[0] === id);
      if (!f) return;
      currentFont = id;
      document.documentElement.style.setProperty('--font-app', f[2]);
      document.documentElement.classList.add('font-override');
      /* chọn font ĐƠN là rời chế độ cặp: heading quay về cùng font body */
      currentPair = '';
      document.documentElement.classList.remove('font-pair');
      ['--font-head', '--pair-adj', '--pair-head-ls', '--pair-head-lh']
        .forEach(v => document.documentElement.style.removeProperty(v));
      panel.querySelectorAll('[data-font-pair] .fp-tick').forEach(t => t.classList.add('opacity-0'));
      panel.querySelectorAll('[data-font]').forEach(x =>
        x.querySelector('.fo-tick').classList.toggle('opacity-0', x.dataset.font !== id));
      closeP();
      toast('Phông chữ: ' + f[1]);
    });
  });

  panel.querySelectorAll('[data-font-pair]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = applyFontPair(btn.dataset.fontPair);
      if (!p) return;
      closeP();
      toast('Cặp font: ' + p[1]);

  });
})();

   CSS .dk-drawer, nên sửa logic thì sửa cả 2 file cùng một chỗ.

   nút "Áp dụng ưu đãi" mới ghi vào cartVouchers. Nếu ghi thẳng thì mỗi lần chạm
   thử một mã là khối tiền phía sau nhảy một lần — và không có đường lùi. */
function voucherSumOf(sel) {
  return sel.map(voucherByCode).filter(v => v && voucherEligible(v)).reduce((s, v) => s + voucherValue(v), 0);
}
/* Thẻ 1 ưu đãi. Mã chưa đủ điều kiện KHÔNG bị giấu đi — vẫn hiện, làm mờ, khoá
   bấm và nói rõ còn thiếu gì ("Mua thêm 4,000,000đ để dùng mã"): đó là thứ đẩy
   giỏ hàng lên, giấu đi thì người mua không biết mình sắp có gì. */
function voucherCardHTML(v, on) {
  const ok = voucherEligible(v);
  const why = ok ? '' : voucherBlockReason(v);
  const cond = [];
  if (v.note)   cond.push(v.note);
  if (v.cap)    cond.push(`Tối đa ${v.cap.toLocaleString('en-US')}đ`);
  if (v.worth)  cond.push(`Trị giá ${v.worth.toLocaleString('en-US')}đ`);
  if (v.minSub) cond.push(`Đơn từ ${v.minSub.toLocaleString('en-US')}đ`);
  if (v.minQty) cond.push(`Mua từ ${v.minQty} sản phẩm`);
  return `
  <button class="vc-item opt ${on ? 'on' : ''} w-full flex gap-3 items-start border ${on ? 'border-border-5' : 'border-border'} rounded-md p-3 text-left ${ok ? 'press' : ''}"
          data-vc="${v.code}" ${ok ? '' : 'disabled style="opacity:.45"'}>
    <span class="w-9 h-9 rounded-xs bg-secondary flex items-center justify-center shrink-0">${I.ticket()}</span>
    <span class="flex-1 min-w-0 flex flex-col gap-1">
      <span class="flex items-center gap-2">
        <span class="flex-1 min-w-0 text-[14px] font-medium leading-5 text-foreground">${voucherTitle(v)}</span>
        <span data-i18n-skip class="text-[12px] font-medium leading-4 text-muted-foreground shrink-0">${v.code}</span>
      </span>
      ${cond.map(c => `<span class="block text-[12px] leading-4 text-secondary-foreground">${c}</span>`).join('')}
      <span class="flex items-center gap-1 pt-0.5">
        <span data-i18n-skip class="text-[12px] leading-4 text-muted-foreground truncate">${v.prog}</span>
        <span class="text-[12px] leading-4 text-muted-foreground shrink-0">· HSD ${v.exp}</span>
      </span>
      ${why ? `<span class="block text-[12px] leading-4 text-destructive">${why}</span>` : ''}
    </span>
    <span class="radio ${on ? 'on' : ''} w-4 h-4 mt-0.5 rounded-full border-2 ${on ? 'border-primary' : 'border-border'} flex items-center justify-center shrink-0">
      <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
    </span>
  </button>`;
}
/* Danh sách theo nhóm. Mã `hidden` (bộ JUNE* cũ) chỉ hiện khi đang được chọn —
   gõ tay xong phải thấy nó ở đâu đó để còn bỏ chọn được. Trong mỗi nhóm, mã
   dùng được xếp lên trước. */
function voucherSheetHTML(sel) {
  return VOUCHER_GROUPS.map(g => {
    const items = VOUCHERS
      .filter(v => v.group === g.key && (!v.hidden || sel.includes(v.code)))
      .sort((a, b) => (voucherEligible(b) ? 1 : 0) - (voucherEligible(a) ? 1 : 0));
    if (!items.length) return '';
    return `
    <div class="flex flex-col gap-2 pt-4 first:pt-1">
      <div class="flex items-baseline justify-between gap-2">
        <p class="text-[14px] font-medium leading-5 text-foreground">${g.title}</p>
        <span class="text-[12px] leading-4 text-muted-foreground shrink-0">Chọn tối đa 1</span>
      </div>
      ${items.map(v => voucherCardHTML(v, sel.includes(v.code))).join('')}
    </div>`;
  }).join('');
}

(() => {
  const sh    = document.getElementById('vcSheet');
  const panel = sh.querySelector('.vc-panel');
  const list  = sh.querySelector('#vcList');
  const input = sh.querySelector('#vcCode');
  const codeBtn = sh.querySelector('#vcCodeApply');
  let temp = [], onDone = null;

  /* resetCode dọn luôn dòng lỗi: ô trống thì lỗi cũ không còn nghĩa. Cũng là
     chỗ duy nhất chạy khi MỞ LẠI sheet, nên lỗi không sống sót qua 2 lần mở. */
  const resetCode = () => { input.value = ''; codeBtn.disabled = true; codeBtn.style.opacity = '.4'; clearFieldErr(input); };
  const syncFoot = () => {
    const n = temp.filter(c => voucherEligible(voucherByCode(c))).length;
    const sum = voucherSumOf(temp);
    sh.querySelector('#vcCount').textContent = n ? `Đã chọn ${n} ưu đãi` : 'Chưa chọn ưu đãi nào';
    sh.querySelector('#vcSum').textContent   = sum ? `-${sum.toLocaleString('en-US')}đ` : '';
    localizeNew(sh.querySelector('#vcCount'));
  };
  const render = () => {
    list.innerHTML = voucherSheetHTML(temp);
    localizeNew(list);
    list.querySelectorAll('[data-vc]').forEach(b => b.addEventListener('click', () => {
      const v = voucherByCode(b.dataset.vc);
      if (!v || !voucherEligible(v)) return;
      pickVoucher(v, temp.includes(v.code));
    }));
    syncFoot();
  };
  /* 1 mã / nhóm: chọn mã mới thì mã cùng nhóm tự nhả; bấm lại đúng mã đang
     chọn = bỏ chọn (không cần nút "bỏ chọn" riêng). */
  const pickVoucher = (v, off) => {
    temp = temp.filter(c => { const o = voucherByCode(c); return !o || o.group !== v.group; });
    if (!off) temp.push(v.code);
    render();
  };

  input.addEventListener('input', () => {
    const has = input.value.trim().length > 0;
    codeBtn.disabled = !has; codeBtn.style.opacity = has ? '1' : '.4';
    clearFieldErr(input);   // gõ lại thì lỗi cũ hết nghĩa
  });
  const useCode = () => {
    const code = input.value.trim().toUpperCase();
    if (!code) return;
    const v = voucherByCode(code);
    if (!v) { setFieldErr(input, 'Mã không hợp lệ'); return; }
    if (!voucherEligible(v)) { setFieldErr(input, voucherBlockReason(v)); return; }
    if (temp.includes(code)) { setFieldErr(input, 'Mã đã được chọn'); return; }
    pickVoucher(v, false);
    resetCode();
    toast('Đã chọn ' + code);
  };
  codeBtn.addEventListener('click', useCode);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); useCode(); } });

  const close = () => {
    sh.querySelector('.vc-backdrop').classList.add('opacity-0');
    panel.classList.add('translate-y-full');
    sh.classList.add('pointer-events-none');
    unlockBodyScroll();
    setTimeout(() => sh.setAttribute('aria-hidden', 'true'), 300);
  };
  const open = done => {
    onDone = done || null;
    temp = [...cartVouchers];
    resetCode();
    render();
    localizeNew(panel);      // panel nằm ngoài .screen nên không được applyLang lúc đổi ngôn ngữ
    list.scrollTop = 0;
    sh.classList.remove('pointer-events-none'); sh.setAttribute('aria-hidden', 'false');
    sh.querySelector('.vc-backdrop').classList.remove('opacity-0');
    panel.classList.remove('translate-y-full');
    lockBodyScroll();
  };

  sh.querySelector('#vcApply').addEventListener('click', () => {
    const had = cartVouchers.length;
    cartVouchers = temp.filter(c => voucherEligible(voucherByCode(c)));
    close();
    if (onDone) onDone();
    const n = cartVouchers.length;
    toast(n ? `Đã áp dụng ${n} ưu đãi` : (had ? 'Đã gỡ ưu đãi' : 'Chưa chọn ưu đãi nào'));
  });
  sh.querySelector('.vc-backdrop').addEventListener('click', close);
  sh.querySelector('#vcClose').addEventListener('click', close);
  // Esc đóng panel (bàn phím là đường chính trên desktop) — chỉ khi đang mở
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sh.getAttribute('aria-hidden') === 'false') close(); });
  window.__openVoucherSheet = open;
})();


/* ════════════════════════════════════════════════════════════════
   LAYER TÌM KIẾM — mở từ nút "Tìm kiếm" trên header
   Bản mobile để tìm kiếm thành một MÀN riêng (screenSearch) phủ kín; desktop

  /* ══ BẢN A — dải "Gợi ý mua kèm" ADAPT TỪ FIGMA (28/08, node 108:3746) ══════
     User sửa thẳng trên Figma rồi bảo port về code. Khác bản dựng đầu:
       · 4 thẻ nhỏ 265,5 -> 3 THẺ LỚN 330, khe 8 -> 24 (Figma ghi 329,8 vì cột
         chữ bên đó đo ra 282,6 — xem --look-aside);
       · hàng có NỀN XÁM cao 352, đệm 32 dọc / 24 ngang (bản Figma là secondary
         #f2f2f2 + kẻ mảnh mép trên; 31/08 user hạ về accent-0 và gỡ kẻ);
       · thẻ CANH ĐÁY băng, ẢNH TRỒI LÊN 227,7 khỏi mép băng (đo Figma);
       · tiêu đề về CANH TRÁI (user đổi), nằm sát mép trên băng.
     Lưới đặt TUYỆT ĐỐI (bottom 32) chứ không nằm trong dòng chảy: nhờ vậy ảnh
     cao bao nhiêu cũng KHÔNG đẩy băng cao thêm, tự trồi lên phần trống 273 phía
     trên — đúng cách Figma dựng (grid y = -227,7, băng vẫn 352).
     `--look-aside` là biến để dải hẹp chỉ phải đổi MỘT số: lưới đọc theo nó. */
  .dk-look-band {
    /* ── SỐ ĐO CỦA DẢI — ĐẶT TÊN HẾT (02/09/2026, cùng lượt đưa bản A sang cả
       6 PDP). Trước lượt này 3 số quan trọng nhất là hằng cứng: 273 (chỗ chừa
       cho ảnh trồi lên), 282,6 (cột chữ), 32/24 (đệm). 273 không nói ra nó gồm
       những gì, nên thẻ đổi chiều cao là ảnh đâm vào khối trên mà không biết
       phải sửa số nào — nay nó là phép cộng của 2 biến có tên.

       LƯỚI: khung 1392 (= 1440 − 2×24 của px-6), 12 cột × 94 + 11 máng × 24.
       · Cột chữ = ĐÚNG 3 cột = 94×3 = 282.
         Số cũ 282,6 là SAI SỐ ĐO TỪ FIGMA, và nó đẩy 3 thẻ về 329,8 — lẻ pixel
         (chính con số 329,8 ghi trong ghi chú bản A ở trên là dấu vết của nó).
         Về 282 thì thẻ ra CHẴN 330 = 3 cột + 2 máng, cả dải khớp lưới:
             282 + 24 + 330×3 + 24×2 = 1344 = bề ngang TRONG băng. */
    --look-aside: 282px;
    --look-pad-y: 32px;      /* đệm dọc băng — cũng là khoảng thẻ cách mép đáy */
    --look-pad-x: 24px;      /* đệm ngang băng = đúng MỘT máng lưới */
    --look-h: 352px;         /* chiều cao băng (số Figma) */
    --look-rise: 221px;      /* phần ảnh TRỒI LÊN khỏi mép trên băng
                                = chiều cao thẻ (541) − (--look-h − --look-pad-y) */
    --look-clear: 56px;      /* hở giữa ĐỈNH ẢNH trồi lên và khối phía trên.
                                Đo ra 52 (273 − 221) — số duy nhất trong cả dải
                                rơi ngoài nấc 8; kéo lên 56 cho đồng nhịp với
                                32/24/16 còn lại. Lệch 4px, không đổi bố cục. */
    position: relative;
    height: var(--look-h);
    /* Chỗ chừa = phần ảnh trồi lên CỘNG khoảng hở muốn thấy (= 277). */
    margin-top: calc(var(--look-rise) + var(--look-clear));
    padding: var(--look-pad-y) var(--look-pad-x);
    /* 31/08/2026 (lệnh user): nấc màu XUỐNG accent-0 (#f7f7f7 ở skin-mt) —
       nhạt hơn secondary #f2f2f2 đúng 1 nấc, tách hẳn khỏi nền ảnh CDN nướng
       sẵn #f1f1f1 nên 3 ô ảnh nổi lên thay vì chìm vào băng. Kẻ mảnh mép trên
       GỠ THEO: mảng nền đã tự ngăn dải này với khối trên, giữ kẻ nữa là ngăn
       hai lần ở cùng một mép (đúng cách đã xử discountPanel + #cartCta 24/08). */
    background: var(--unofficial-accent-0);
  }
  /* pt = BÙ QUANG HỌC, không phải một nấc đệm riêng: chữ luôn bị thụt xuống bởi
     phần leading trống phía trên nó, nên phải trừ ngược lại để tiêu đề ĐỌC RA
     thẳng hàng với mép đệm 32 của băng.
     16 -> 2 (02/09): dòng đầu xuống 24px (xem ::first-line) nên phần leading
     trống dày thêm ~14. Đo trên trang chạy: bản cũ (một bậc 40/50, pt 16) mực
     chữ nằm 48px dưới mép băng; pt 2 với dòng đầu 24 ra ĐÚNG 48 — giữ nguyên
     vị trí thị giác đã chốt, chỉ đổi cỡ chữ. */
  .dk-look-aside { width: var(--look-aside); padding-top: 2px; }
  .dk-look-grid {
    position: absolute; bottom: var(--look-pad-y); right: var(--look-pad-x);
    left: calc(var(--look-pad-x) + var(--look-aside) + 24px);
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px; align-items: end;
  }

  /* ══ BẢN B — "so le" theo ảnh tham chiếu user gửi (28/08) ══════════════════
     Lệnh: *"tạo thêm 1 phiên bản như hình đính kèm nhưng align bottom và cho
     text vào vị trí trống ở trên khi align top"*. Ảnh tham chiếu xếp thẻ CANH
     TRÊN, cao lệch nhau (mép dưới răng cưa). Bản này LẬT LẠI: canh ĐÁY nên mép
     TRÊN răng cưa, và chỗ trống sinh ra ở trên thẻ thấp nhất chính là chỗ đặt
     tiêu đề — tiêu đề nằm TRONG lưới (cột 1), không có cột chữ riêng như bản A.
     Cao lệch = đổi TỈ LỆ ô ảnh theo cột (1/1 · 4/5 · 3/4), thấp -> cao từ trái
     sang phải. !important vì productCard in aspect-ratio bằng style inline. */
  .dk-lookb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: end; }
  .dk-lookb-col { display: flex; flex-direction: column; justify-content: flex-end; gap: 24px; }
  .dk-lookb .lookb-short > div:first-child { aspect-ratio: 1 / 1 !important; }
  .dk-lookb .lookb-mid   > div:first-child { aspect-ratio: 4 / 5 !important; }

  /* ══ BẢN C — "magazine editorial", đặt cho PDP#2 (28/08, lệnh user) ════════
     Khác A/B ở CHỖ ĐỨNG của ảnh: bỏ hẳn lưới thẻ đều nhau, đi bố cục BÁO CHÍ —
     cột chữ · MỘT ảnh chủ đề cắt NGANG 3:2 · cột danh sách ngăn bằng kẻ dọc.
     Bám đúng lưới 12 của khung 1392: 330 (3 cột) + 24 + 684 (6 cột) + 24 + 330.
     Cột giữa để `1fr` nên ở 1440 ra đúng 684, hẹp hơn thì tự co — 2 cột biên
     giữ nguyên vì chúng chở CHỮ, co vào là gãy dòng.
     Chất tạp chí đến từ: ảnh chủ đề cắt ngang (ảnh sản phẩm vốn dọc 3:4) · chú
     thích ảnh có kẻ mảnh phía trên · số thứ tự 01/02 ở cột danh sách · kẻ DỌC
     ngăn cột · mọi kẻ 1px token border.
     KHÔNG dùng chữ HOA / small-caps dù tạp chí hay dùng — luật dự án cấm; chất
     biên tập ở đây do bố cục + kẻ + bậc chữ trưng bày lo. */
  .dk-lookc { display: grid; grid-template-columns: 330px 1fr 330px; gap: 24px; }
  .dk-lookc-photo { width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: var(--general-secondary); }
  /* Ảnh sản phẩm vốn DỌC 3:4 (ảnh người mẫu toàn thân); cắt xuống 3:2 chỉ còn
     một nửa chiều cao, để mặc định 50% là cắt trúng ngang bụng. Kéo điểm cắt
     lên 18% để lấy dải đầu-thân — cùng cách hero thương hiệu ở PLP làm
     (object-position:50% 18%). */
  .dk-lookc-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
  .dk-lookc-cap { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--general-border);
                  display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  .dk-lookc-list { border-left: 1px solid var(--general-border); padding-left: 24px; }
  .dk-lookc-item { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--general-border); }
  .dk-lookc-item:first-child { padding-top: 0; }
  .dk-lookc-item:last-child  { border-bottom: 0; }
  .dk-lookc-thumb { width: 96px; flex: none; aspect-ratio: 3 / 4; overflow: hidden; background: var(--general-secondary); }
  .dk-lookc-thumb img { width: 100%; height: 100%; object-fit: cover; }

  /* ══ Tiêu đề dải "Gợi ý mua kèm" (PDP#1): 40/50 ═══════════════════════════
     Lệnh user 28/08: *"bỏ subtitle đi, tăng font lên 40px"*.

     ⚠ NGOẠI LỆ GHI DANH — 40 KHÔNG có trong thang chữ dự án
     (12/14/16/18/24/32/48) và cũng không có trong thang trưng bày của
     FONT-LIBRE-INTER F2 (24/32 · T0 32/40 · T00 48/60). Phạm vi ngoại lệ đúng
     MỘT dòng chữ này, không mở bậc mới cho ai khác dùng. Bậc on-scale gần nhất
     cho vai "tiêu đề biên tập" là T00 48/60 — đã tính sẵn ở F2, đổi 2 số là
     sang được nếu user chốt lại.
     Dòng 50 = 40 × 1,25, đúng tỉ lệ của 2 bậc trưng bày lớn (32/40 · 48/60).
     Đậm 400: cỡ trưng bày ở đây là chữ THƯỜNG, mà luật buộc 500 luôn đi cặp
     chữ hoa (STYLE-RULES §1).

     PHẢI là class ngữ nghĩa và PHẢI RỜI class .text-[18px]: hook của skin-li là
     chính utility đó — rule `html.skin-mt.skin-li :is(h1,h2,p):is(.text-[18px],
     .text-[32px])` (specificity 0,3,2) gom mọi bậc trưng bày về MỘT bậc 24/32,
     mang utility đó vào là bị kéo về 24 bất kể khai gì ở class thường.
     Rời hook nên phải tự cấp họ chữ trưng bày: `--font-head` (Libre Bodoni ở
     skin-li/Maika, rơi về chữ thân bài ở các bộ da không khai).
     KHÔNG gác theo dppx như bậc 24: F1 gác vì nét mảnh Bodoni = 0,031 × cỡ, ở
     24px chỉ 0,74 CSS px nên màn 1× bôi thành xám; ở 40px nét = 1,24 px, sống
     cả trên màn 1× — đúng lý do F2 cho 2 bậc lớn dùng Bodoni vô điều kiện. */
  .dk-look-title {
    font-family: var(--font-head, inherit);
    font-size: 40px;
    line-height: 50px;
    font-weight: 400;
    /* NGẮT DÒNG CÓ CHỦ ĐÍCH: "Gợi ý / mua kèm" · "Complete / the look"
       (lệnh user 28/08). Ngắt bằng KÝ TỰ XUỐNG DÒNG trong chuỗi + pre-line,
       KHÔNG dùng <br>: <br> chẻ tiêu đề thành HAI text node, mà máy dịch tra
       từ điển theo từng text node -> phải thêm khoá cho 2 mảnh rời "Gợi ý" và
       "mua kèm". Đã kiểm: "Gợi ý" CÒN đứng riêng ở chỗ khác trong file, thêm
       khoá cho mảnh đó là dịch lây sang đấy. Giữ một text node thì cả câu vẫn
       đi bằng MỘT khoá (xem I18N: 'Gợi ý\nMua kèm').
       pre-line vẫn cho chữ tự wrap thêm khi cột hẹp, chỉ là luôn có sẵn 1 lần
       ngắt ở đúng chỗ mình đặt. */
    white-space: pre-line;
    /* CANH TRÁI — bản Figma user sửa 28/08 để chữ thẳng cột với mép trái băng
       xám (lượt trước là căn giữa; user đổi khi dựng lại bố cục 3 thẻ lớn). */
    text-align: left;
  }

  /* DÒNG ĐẦU nhỏ hơn dòng sau — "Gợi ý" 24/32 trên "Mua kèm" 40/50
     (lệnh user 02/09/2026). Nhịp kicker-trên-tiêu-đề của trang biên tập.

     ⚠ PHẢI làm bằng ::first-line, KHÔNG được chẻ tiêu đề thành 2 <span>:
     chẻ ra là mỗi mảnh thành một TEXT NODE riêng, mà máy dịch tra từ điển theo
     từng text node — và khoá 'Gợi ý' ĐÃ TỒN TẠI trong I18N (màn Search:
     'Gợi ý' -> 'Suggestions'), nên dòng đầu sẽ bị dịch thành "Suggestions".
     Giữ MỘT text node thì cả câu vẫn đi bằng một khoá, đúng như ghi chú ngắt
     dòng ở rule trên đã dặn.
     Dòng đầu luôn đúng là "Gợi ý" vì chuỗi có sẵn ký tự xuống dòng + pre-line.

     24/32 là bậc CÓ TRONG thang trưng bày (T1 của FONT-LIBRE-INTER) — không mở
     thêm ngoại lệ nào ngoài bậc 40 vốn đã ghi danh ở rule ngay trên. */
  .dk-look-title::first-line { font-size: 24px; line-height: 32px; }

  /* ════════════════ DẢI DESKTOP HẸP (768 → 1279) ════════════════
     Trang dựng theo khung Figma 1440: cột phải của PDP/giỏ/thanh toán là
     px cứng, lưới sản phẩm 4-5 cột. Từ 1280 trở lên GIỮ NGUYÊN thiết kế;
     hẹp hơn thì các cột cứng co theo vw (clamp: sàn - tỉ lệ - trần đúng
     bằng số px thiết kế) và lưới bớt cột. Bộ chọn để kèm luôn class
     w-[…] gốc nên đọc là thấy ngay trần của từng cột.
     Dưới 768 không cần lo: cầu nối đã chuyển sang bản mobile. */
  /* ── TRANG GIỎ: bề rộng 2 cột theo Figma "Cart / desktop 1440" (đo lại
     31/08/2026, node 57:613) ────────────────────────────────────────────────
     Cột tóm tắt 427 -> 448, khe giữa 2 cột 40 -> 24 (khe đổi ở markup: gap-6).
     Cột danh sách KHÔNG khai số: nó là flex-1 nên tự ra 1440 - 24*2 (lề main)
     - 24 (khe) - 448 = 920, đúng số Figma.
     Khai class NGỮ NGHĨA thay vì utility `w-[448px]`: tailwind.css là bản build
     sẵn, không có sẵn bậc 448 -> utility đó là CLASS CHẾT (đã dính 28/08 với
     w-14 ở mini cart và w-[569px] ở PDP#1).
     MÀN THANH TOÁN vẫn giữ `w-[427px]`: Figma chưa đổi màn đó. */
  .dk-cart-summary { width: 448px; }
  /* KHUÔN CHUNG CHO MỌI KHỐI QUÀ (31/08/2026, lệnh user: *"cái cục order gift
     cũng phải dùng chung style, size của cái gift ở trên luôn, áp dụng cả 2
     phiên bản"*): quà kèm sản phẩm · quà theo mốc đơn · ô mốc kế tiếp — tất cả
     THỤT 40 để mép trái thẳng cột ẢNH của món (16 lề dòng + 16 ô tick + 8 khe),
     mép phải ăn hết cột. ĐẢO chốt 21/08 ("dài bằng cả thẻ, không thụt vô").
     Nhịp DỌC thì theo bối cảnh, không gộp được:
       · khối kèm sản phẩm chèn GIỮA hai dòng hàng -> tự mang 16 trên/dưới
         (đúng wrapper pad 16/0/16/40 của Figma node 57:739);
       · khối theo mốc đơn nằm trong dải riêng, khoảng cách do container lo
         (flex gap 8) — thêm margin nữa là cộng dồn thành 40.
     KHAI GIỐNG HỆT ở index.html — sửa 1 file nhớ sửa cả 2. */
  [data-screen="cart"] .gift-group.gift-inset { margin-left: 40px; }
  [data-screen="cart"] .gift-group.gift-inset[data-gift-of] { margin-top: 16px; margin-bottom: 16px; }
  /* OPTION B của khối quà (.gift-plain): KHÔNG mặt nhấn, KHÔNG thụt lề — nó đọc
     như một dòng hàng nữa nên phải nằm đúng hệ lề của .cart-row. Ô tick ở trạng
     thái ĐÃ CHỌN + KHOÁ: mờ đi để nói "không bấm được" và chặn luôn con trỏ,
     KHÔNG dùng `disabled` vì đây là <span> (không phải control).
     KHAI GIỐNG HỆT ở 2 file — sửa 1 file nhớ sửa cả 2. */
  [data-screen="cart"] .gift-group.gift-plain { background: transparent; margin-left: 0; }
  /* (rule .chk-locked đã gỡ 31/08 cùng lúc với ô tick khoá — user bỏ hẳn ô đó) */
  /* Badge "Quà tặng" của OPTION B: rời khỏi ảnh, đứng TRÊN tên. Giữ nền đen —
     đó là dấu phân biệt quà với hàng mua (xem ghi chú giftCard). Số đo lấy từ
     Figma node badge/gift: 10/14, đệm 2/4, Regular (KHÔNG semibold như bản đè
     ảnh — §1.1 khoá 500+ vào chữ hoa, mà đây là chữ thường).
     Viết bằng CSS ngữ nghĩa thay vì chuỗi utility: đây là việc MỚI (STYLE-RULES
     §8) và nhờ vậy không phụ thuộc bậc nào có sẵn trong tailwind.css. */
  [data-screen="cart"] .gift-badge {
    display: inline-flex; align-items: center;
    align-self: flex-start;   /* nằm trong cột dọc (flex-col) nên phải tự co, không thì kéo giãn hết bề ngang */
    padding: 2px 4px;
    background: var(--general-primary);
    color: var(--general-primary-foreground);
    font-size: 10px; line-height: 14px; font-weight: 400;
  }

  @media (max-width: 1279px) {
    .dk-cart-summary            { width: clamp(280px, 32vw, 448px); }   /* tóm tắt GIỎ (Figma 31/08) */
    /* Cột thông tin PDP — CẢ 6 bản từ 04/09: 44vw để tại đúng 1280 nó đang ở
       ~563, tức không nhảy bậc khi kéo qua mốc; sàn giữ 292 như các cột khác
       để dải hẹp không bóp chết ô ảnh. Rule 34vw/451 của 5 PDP cũ đã xoá cùng
       lượt bỏ nhánh w-[451px] trong markup. */
    .dk-sticky-info.dk-info-wide { width: clamp(292px, 44vw, 569px); }
    .dk-look-band               { --look-aside: clamp(200px, 22vw, 282px); }     /* cột chữ dải Gợi ý mua kèm (mọi PDP từ 02/09) — lưới đọc theo biến này */
    .dk-sticky-side.w-\[427px\] { width: clamp(280px, 32vw, 427px); }   /* tóm tắt giỏ / thanh toán */
    .dk-sticky-side.w-\[280px\] { width: clamp(216px, 22vw, 280px); }
    .dk-policy-aside            { width: clamp(200px, 22vw, 280px); }   /* menu trang chính sách */
    .dk-brand-hero              { width: clamp(240px, 38vw, 575px); }   /* ảnh campaign dải thương hiệu */
  }
  @media (max-width: 1023px) {
    /* Lưới sản phẩm: 4 cột ở dải này chỉ còn ~170px/thẻ nên rút về 3.
       !important vì nút đổi 3/4 cột của PLP set class trực tiếp lên #plpGrid;
       ở ≥1024 nút vẫn hoạt động bình thường. */
    #plpGrid            { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
    .grid.grid-cols-5   { grid-template-columns: repeat(3, minmax(0, 1fr)); }  /* carousel gợi ý */
    .dk-commit-grid     { grid-template-columns: repeat(2, minmax(0, 1fr)); }  /* 4 cam kết DAFC */
    /* Dải "Gợi ý mua kèm" của PDP#1 dưới 1024: bỏ trò ảnh TRỒI LÊN (băng cao
       cứng 352 + lưới tuyệt đối) vì ở khổ này ảnh trồi che mất khối phía trên.
       Cho băng về dòng chảy thường: chữ lên trên, 3 ảnh xuống dưới. */
    .dk-look-band       { height: auto; margin-top: 32px; }
    .dk-look-aside      { width: 100%; padding-bottom: 24px; }
    .dk-look-grid       { position: static; left: auto; right: auto; bottom: auto; }
    .dk-lookb           { align-items: stretch; }
    /* Bản C dưới 1024: 3 cột 330/1fr/330 chỉ còn ~300 cho ảnh chủ đề -> xếp DỌC,
       kẻ dọc ngăn cột đổi thành kẻ ngang cho đúng hướng đọc mới. */
    .dk-lookc           { grid-template-columns: minmax(0, 1fr); }
    .dk-lookc-list      { border-left: 0; padding-left: 0; border-top: 1px solid var(--general-border); padding-top: 16px; }
    .dk-lookb .lookb-short > div:first-child,
    .dk-lookb .lookb-mid   > div:first-child { aspect-ratio: 189 / 252 !important; }
  }
  @media (max-width: 899px) {
    /* Ảnh PDP: 2 cột ở đây chỉ còn ~180px/ảnh, về 1 cột cho ra tấm ảnh thật */
    #pdpGallery { grid-template-columns: minmax(0, 1fr); }
  }
  /* ── KHUÔN CHUNG CHO MỌI LỚP NỔI (modal · drawer · popover · thẻ cookie) ──
     Chốt 17/08/2026 (yêu cầu user): dùng CHUNG một viền + một đổ bóng, không
     mặt nào tự chế. Trước đó có 5 giá trị bóng khác nhau (.22 / .18 / .16 /
     .16 / .14) và chỉ 2 mặt (#cookieBar, .sp-card) có viền.
     Lấy bóng của .dk-modal làm chuẩn vì nó đang phủ nhiều mặt nhất.
     Bo góc KHÔNG gom vào đây vì phụ thuộc chỗ đứng: nổi giữa màn thì bo 8
     (.dk-modal, .is-panel, .sp-card, .lp-card), dính mép màn thì vuông
     (.dk-drawer, .fs-panel, .ds-sheet, #cookieBar, #cookiePrefs .cp-panel).
     KHÔNG ĐỔ BÓNG (chốt 17/08/2026, yêu cầu user — tham chiếu cettire.com/vn):
     đi hẳn hướng phẳng, viền lo việc tách mặt phẳng khỏi nền, backdrop tối lo
     phần còn lại. Trước đó có 5 giá trị bóng, gom về 1 rồi bỏ luôn.
     2 mặt KHÔNG nằm trong danh sách này vì phải LIỀN MẠCH với header (kính nối
     kính, không viền không bóng): `.dk-mega` (panel menu) và `#dkSearchLayer
     .ds-sheet` (tấm gợi ý tìm kiếm) — xem rule riêng của từng cái.
     Sửa 1 chỗ này là đổi cả bộ; ĐỪNG thêm border/box-shadow vào từng mặt. */
  .dk-modal, .dk-drawer, .lp-card, .cc-drop,
  #infoSheet .is-panel, #filterSheet .fs-panel,
  #cookieBar, #cookiePrefs .cp-panel, #settingsPanel .sp-card, #sortMenu, [data-pick-list] {
    border: 1px solid var(--general-border);
    box-shadow: none;
  }
  /* Option trong menu Sắp xếp có phản hồi rê/focus (bổ sung 28/08 — trước đây
     .sort-opt trần trụi, rê qua không đổi gì, lạc lõng giữa bản desktop nơi
     hover là ngôn ngữ chính): lấy đúng nền ghost-hover đang dùng cho các hàng
     cùng vai, không mở mặt mới. */
  #sortMenu .sort-opt:hover, #sortMenu .sort-opt:focus-visible {
    background: var(--unofficial-ghost-hover);
  }

  /* ── Modal desktop: tái dùng bottom sheet mobile nhưng hiện GIỮA màn hình.
     Class `translate-y-full` vẫn được JS toggle làm cờ đóng/mở — ở đây map nó
     sang trạng thái mờ + thu nhỏ thay vì trượt xuống đáy. Đặt sau tailwind.css
     nên thắng các utility cùng specificity. ── */
  .dk-modal {
    left: 50% !important; top: 50% !important; right: auto !important; bottom: auto !important;
    width: 520px; max-width: calc(100vw - 64px); max-height: 84vh;
    border-radius: 8px !important; overflow: hidden;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    transition: opacity .25s ease, transform .28s cubic-bezier(.22,1,.36,1);
  }
  .dk-modal.translate-y-full { transform: translate(-50%, -46%) scale(.97); opacity: 0; }
  .dk-modal .safe-b { padding-bottom: 0; }
  /* ── Quick add: khổ 2 CỘT (19/08/2026, layout tham chiếu user gửi) ──
     Rộng 960 thay cho drawer 560 cũ vì giờ phải chứa 2 cột. CAO CỐ ĐỊNH 620 —
     bắt buộc: cột trái là ảnh `h-full`, không chốt chiều cao thì ảnh không có
     mốc để cao theo và panel co về đúng chiều cao cột phải.
     `min()` để màn thấp vẫn vừa; `.dk-modal` đã có `max-height: 84vh` nhưng
     max-height KHÔNG ghì được `height` khi viewport hụt nên vẫn tính lại ở đây.
     Cột ảnh 46% — hẹp hơn nửa panel một chút vì cột phải phải chứa lưới 6 ô size
     cộng lề 24; tham chiếu chia gần 50/50 nhưng panel của họ rộng hơn ta 220px. */
  #quickAddSheet .qa-panel { width: 960px; height: min(620px, 84vh); }
  #quickAddSheet .qa-media { width: 46%; }
  /* Vị trí hàng chấm: khai bằng CSS chứ KHÔNG dùng utility `bottom-4 left-6`.
     Lý do: `tailwind.css` là bản BUILD TĨNH, quét class có sẵn trong 2 file HTML —
     2 utility đó chưa chỗ nào dùng nên KHÔNG có trong bản build, gõ vào markup là
     rơi im lặng (chấm dính đúng mép ảnh). Đã đo và bắt được lúc kiểm.
     Khai ở đây rẻ hơn nhiều so với rebuild lại cả stylesheet giữa chừng; nếu sau
     này có rebuild thì rule này vẫn đúng, chỉ là thừa. */
  #quickAddSheet #qaDots { left: 24px; bottom: 16px; }

  /* ── "Đã thêm vào giỏ hàng": DROPDOWN NGAY DƯỚI ICON GIỎ ──────────────────────
     Chốt 19/08/2026 (yêu cầu user): *"ở bản desktop 'đã thêm vào giỏ hàng' ngay
     tại icon giỏ hàng sẽ dropdown xuống thay vì đè popup lên"*.
     Trước đây nó mượn `.dk-modal` -> nổi GIỮA màn + nền tối 45%, tức chặn cả trang
     chỉ để báo một việc vừa xong. Nay là tấm thả xuống neo vào icon giỏ, giống
     mini-cart của sàn thật: không tối nền, không khoá cuộn.
     KHÔNG dùng `.dk-modal` nữa vì class đó ép `left/top: 50% !important`.
     Toạ độ do JS đặt (đo rect của nút giỏ lúc mở) — CSS chỉ lo khuôn + hiệu ứng.
     Vẫn dùng chung cờ `translate-y-full` mà JS toggle, y như mọi sheet khác trong
     dự án, nên đoạn JS đóng/mở không phải viết lại. */
  .cc-drop {
    position: fixed; width: 380px; max-width: calc(100vw - 32px);
    border-radius: 8px; overflow: hidden;
    transform: translateY(0); opacity: 1;
    transition: opacity .18s ease, transform .2s cubic-bezier(.22,1,.36,1);
    /* CHIỀU CAO TẤM = 80% chiều cao màn (lệnh user 03/09/2026). Đặt ở CHÍNH TẤM,
       không phải ở danh sách: tấm là cột flex (header + #ccList flex-1 + #ccFoot)
       nên khoá ở đây thì danh sách tự lấy hết phần còn lại và khối tổng + nút
       luôn ghim đáy. Trước 03/09 trần nằm ở `#ccList: max-height 46vh` — tấm chỉ
       cao ~62vh, danh sách chứa gọn 4 dòng.
       `height` (KHÔNG phải max-height): giỏ demo chỉ 5 món nên nội dung cao 68vh,
       để max-height thì tấm hug nội dung và không bao giờ chạm 80%. Đánh đổi:
       giỏ ÍT món (1-2 dòng) sẽ hở khoảng trắng giữa dòng hàng cuối và khối tổng
       — đúng khuôn mini-cart chiều cao cố định. Muốn hug thay vì cố định thì đổi
       một chữ: height -> max-height.
       Tấm neo dưới icon giỏ ở ~92px nên 80vh còn dư 20vh - 92 > 0 với mọi khổ
       desktop thực tế (từ ~470px cao trở lên tấm vẫn nằm trong màn). */
    height: 80vh;
  }
  /* Trạng thái ĐÓNG: nhích lên 8px + mờ đi, đúng hướng "thả xuống từ icon" */
  .cc-drop.translate-y-full { transform: translateY(-8px); opacity: 0; }
  .cc-drop .safe-b { padding-bottom: 0; }
  /* Nền chặn click-ra-ngoài: TRONG SUỐT (dropdown không được tối trang).
     Vẫn giữ phần tử để bấm ra ngoài là đóng — bỏ hẳn thì phải nghe click trên
     document rồi tự loại trừ, dài dòng hơn mà cùng kết quả. */
  #cartConfirm .cc-backdrop { background: transparent; }
  /* TÓM TẮT GIỎ trong tấm (28/08/2026, lệnh user): danh sách CUỘN trong tấm chứ
     KHÔNG để tấm dài ra khỏi màn. 03/09/2026 — trần chuyển LÊN CHÍNH TẤM
     (`.cc-drop: max-height 80vh`), ở đây chỉ còn cờ cuộn: markup đã cho #ccList
     `flex-1 min-h-0` nên nó tự lấy đúng phần còn lại giữa header và khối tổng,
     không phải chặn bằng một con số vh thứ hai (hai trần vh chồng nhau là chỗ
     dễ nói ngược nhau khi đổi chiều cao tấm). Kẻ ngăn dòng + kẻ trên khối tổng
     dùng token viền, KHÔNG dùng utility divide-* (tailwind.css bản build sẵn
     không chắc có -> class chết). */
  #ccList { overflow-y: auto; }
  #ccList > .cc-row + .cc-row { border-top: 1px solid var(--general-border); }
  #ccFoot { border-top: 1px solid var(--general-border); }
  /* PEEK = tấm mở do RÊ CHUỘT vào icon giỏ. Khác lần "vừa thêm món": nền chặn
     KHÔNG được bắt chuột, kẻo tấm mở ra là cả trang hoá vô cảm với con trỏ (nền
     trong suốt phủ toàn màn). Chỉ CHÍNH TẤM nhận chuột, để rê vào tấm còn giữ
     được nó và bấm được nút. Bấm-ra-ngoài-để-đóng lúc này không cần: rời chuột
     là tấm tự rút. */
  #cartConfirm.cc-peek { pointer-events: none; }
  #cartConfirm.cc-peek .cc-panel { pointer-events: auto; }
  /* ── Drawer desktop: panel cao hết màn, TRƯỢT VÀO TỪ MÉP PHẢI (yêu cầu user
     17/08/2026 cho sheet chọn ưu đãi). Vẫn dùng chung cờ `translate-y-full` mà
     JS toggle như bottom sheet mobile — nhờ vậy hai bản chạy đúng một đoạn JS,
     chỉ khác cách class đó được vẽ ra. Không dùng cho modal giữa màn (.dk-modal). ── */
  .dk-drawer {
    left: auto !important; right: 0 !important; top: 0 !important; bottom: 0 !important;
    width: 440px; max-width: calc(100vw - 64px); max-height: none !important;
    border-radius: 0 !important;
    /* viền + bóng: xem khối "KHUÔN CHUNG CHO MỌI LỚP NỔI" phía trên */
    transform: translateX(0);
    transition: transform .32s cubic-bezier(.22,1,.36,1);
  }
  .dk-drawer.translate-y-full { transform: translateX(100%); }
  .dk-drawer .safe-b { padding-bottom: 0; }
  /* ── Cookie: thẻ đồng ý + panel "Tùy chọn Cookie" — CHUNG MỘT Ô ──
     Desktop không dùng cổng chặn như mobile: đây là THẺ vuông góc dưới-trái
     (kiểu ARKET), trang vẫn xem và cuộn được phía sau (không nền tối). Đặt
     bên trái để không chèn nút chat/lên đầu trang thường nằm góc phải.

     Chốt 18/08/2026 (yêu cầu khách): panel "Tùy chọn Cookie" KHÔNG căn giữa màn
     nữa mà ĐÈ ĐÚNG ô của thẻ — bấm "Tùy chọn Cookie" thì panel hiện ngay nơi
     mắt đang đọc chứ không nhảy ra giữa màn. Vì phải trùng khít nên 2 mặt dùng
     CHUNG khối toạ độ dưới đây; ĐỪNG khai lại left/bottom/width cho riêng mặt
     nào — panel đè lên thẻ nên lệch 1px là lộ ngay. */
  #cookieBar, #cookiePrefs .cp-panel {
    /* min(): ở dải desktop hẹp thẻ vẫn chừa mép 32px mỗi bên */
    position: fixed; left: 32px; bottom: 32px; width: min(420px, calc(100vw - 64px));
    background: var(--general-background);
    /* viền: xem khối "KHUÔN CHUNG CHO MỌI LỚP NỔI" phía trên */
    /* Chữ bản khách 17/08/2026 dài gấp đôi bản cũ: chặn trần chiều cao rồi cho
       phần chữ tự cuộn, không thì thẻ góc leo gần hết màn 800px. */
    display: flex; flex-direction: column; max-height: min(600px, calc(100vh - 64px));
  }
  #cookieBar {
    z-index: 190;
    transform: translateY(calc(100% + 48px)); transition: transform .45s cubic-bezier(.22,1,.36,1);
    pointer-events: none;
  }
  #cookieBar.open { transform: translateY(0); pointer-events: auto; }
  /* Panel tuỳ chọn KHÔNG trượt từ đáy như thẻ: nó chiếm đúng chỗ thẻ nên vào
     bằng mờ-dần + phóng nhẹ, gốc phóng đặt ở góc dưới-trái (chính chỗ nó đứng)
     để không thấy nó "bò" khỏi ô.
     Class `translate-y-full` vẫn là cờ đóng/mở mà openMD/closeMD toggle — giữ
     nguyên tên, chỉ đổi cách vẽ ra, đúng lối .dk-modal và .dk-drawer đang dùng.
     Không cần z-index: cùng cha #cookiePrefs và đứng SAU .cp-backdrop trong DOM. */
  #cookiePrefs .cp-panel {
    transform-origin: left bottom;
    transform: scale(1); opacity: 1;
    transition: opacity .25s ease, transform .28s cubic-bezier(.22,1,.36,1);
  }
  #cookiePrefs .cp-panel.translate-y-full { transform: scale(.98); opacity: 0; }
  /* Công tắc 40×24 cho modal tuỳ chọn — bản desktop của .cg-sw ở index.html */
  .cg-sw { position: relative; width: 40px; height: 24px; flex-shrink: 0;
    border-radius: 999px; background: var(--general-border); transition: background .2s ease; }
  .cg-sw[aria-checked="true"] { background: var(--general-primary); }
  .cg-sw[aria-disabled="true"] { opacity: .4; }
  .cg-sw i { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    border-radius: 999px; background: var(--general-background); box-shadow: 0 1px 3px rgba(0,0,0,.25);
    transition: transform .2s ease; }
  .cg-sw[aria-checked="true"] i { transform: translateX(16px); }
  /* ── Mega menu — hiệu ứng kiểu Farfetch ──
     Panel KHÔNG còn nằm trong .dk-nav-item mà là sibling của thanh cuộn: thanh
     danh mục có overflow-x (để có mũi tên trượt) sẽ CẮT MẤT panel nếu panel là
     con của nó. Vì tách ra nên hover-intent 120ms chuyển sang JS
     (wireSubheader) thay vì transition-delay. */
  .dk-mega {
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateY(6px);
    transition: opacity .18s ease, transform .22s cubic-bezier(.22,1,.36,1), visibility 0s linear .2s;
  }
  .dk-mega.open {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: none; transition-delay: 0s;
  }
  /* ── ĐỔI GIỮA CÁC MỤC SUBHEADER cho liền mạch kiểu Farfetch (17/08/2026) ──
     Mỗi mục là MỘT panel riêng, nên bản cũ đổi mục = panel cũ fade-out trong khi
     panel mới fade-in TỪ 0 + trượt 6px, lại chờ hover-intent 120ms lần nữa =>
     nhìn ra một nhịp "tắt rồi bật", chưa kể chiều cao nhảy tới 144px.
     Nay: nội dung đổi NGAY (class .mega-swap khoá transition opacity/transform,
     chỉ để `height` chạy) — mặt phẳng đứng yên, chỉ cao thấp đổi mượt.
     `overflow: hidden` để lúc cao đang chạy nội dung bị cắt gọn thay vì tràn. */
  .dk-mega { overflow: hidden; }
  .dk-mega.mega-swap { transition: height .26s cubic-bezier(.22,1,.36,1) !important; }
  /* ── Lưới mega menu: 4 CỘT ĐỀU NHAU — 3 cột nội dung + 1 cột ảnh ──
     Chốt 17/08/2026 (yêu cầu user). Trước đó cột nội dung tự co theo số nhóm
     (flex-wrap, mỗi cột min 168px) còn ảnh cố định 264px, nên mỗi mục menu ra
     một bề rộng cột khác nhau — mở "Túi xách" (2 cột) và "Thương hiệu" (4 cột)
     là 2 lưới lệch hẳn nhau.
     Ảnh LUÔN ở cột 4 (`grid-column: 4`) kể cả khi nội dung chỉ có 1–2 cột, nếu
     không nó bị kéo sát vào chữ. Khai tay ở đây vì `col-start-4` không được
     build ra trong tailwind.css.
     Gap 64 (17/08/2026, theo cettire.com/vn — nới thở cho panel). */
  .dk-mega-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 64px; align-items: start; }
  .dk-mega-teaser { grid-column: 4; }
  /* LIỀN MẠCH VỚI HEADER: panel menu là phần nối dài của thanh trắng phía trên,
     KHÔNG viền KHÔNG bóng (tham chiếu cettire.com/vn — panel của họ cũng vậy).
     Mép dưới đọc ra được nhờ scrim tối `.dk-scrim` phủ phần trang bên dưới.
     Đây là ngoại lệ CÓ CHỦ Ý của khối "KHUÔN CHUNG CHO MỌI LỚP NỔI". */
  .dk-mega { border: 0; box-shadow: none; }
  /* Mục đang mở panel: chữ đậm lên như state hover (Ghost Muted) */
  .dk-nav-item.on .dk-nav-link { color: var(--general-foreground); }

  /* Mũi tên trượt thanh danh mục — chỉ hiện khi tràn (ngành Làm đẹp 11 mục).
     Cùng khuôn Icon Button 36×36 ghost của Figma. */
  .dk-nav-strip { scroll-behavior: smooth; }
  /* CHỈ khai hover/disabled ở đây. Kích thước + display để utility trong markup:
     rule này nằm SAU tailwind.css nên nếu khai `display:flex` thì nó cùng
     specificity (0,1,0) mà đứng sau -> đè luôn `.hidden{display:none}`, khiến
     2 mũi tên vẫn chiếm chỗ dù JS đã gắn class hidden. */
  .dk-nav-arrow { transition: background-color .15s ease; }
  .dk-nav-arrow:hover { background: var(--unofficial-ghost-hover); }

  /* ── DẢI "SẢN PHẨM TƯƠNG TỰ" Ở PDP — 4 thẻ một lượt, cuộn ngang, mũi tên hiện
     khi RÊ CHUỘT (chốt user 03/09/2026: *"sản phẩm tương tự sẽ hiện 1 list 4 cái
     có gap tương tự ở listing, có thể swipe và khi hover vào sẽ có button mũi
     tên"*). Trước đó là `grid grid-cols-5 gap-2` ĐỨNG YÊN, không cuộn được.
     BỀ RỘNG THẺ tính bằng %, KHÔNG đặt 345px cứng: 4 thẻ + 3 khe 4px = 100% bề
     ngang dải. Ở khổ 1440 ra đúng 345 — chính bằng thẻ của lưới listing, nên
     dải và listing cùng một cỡ thẻ mà không phải in cứng số nào.
     `gap: 4px` = đúng `gap-x-1` của `#plpGrid` desktop (yêu cầu "gap tương tự ở
     listing"). Kéo-để-cuộn dùng lại class `.drag-x` + `dragScroll()` có sẵn. */
  .dk-rail { position: relative; }
  .dk-rail-track { scroll-behavior: smooth; }
  .dk-rail-item { flex: 0 0 calc((100% - 12px) / 4); }
  /* Mũi tên là OVERLAY (cùng lối .dk-nav-arrow ở subheader): ẩn/hiện không đổi
     bề rộng track nên thẻ không nhảy. Nền ĐỤC + kẻ 1px vì nút nằm ĐÈ LÊN ẢNH
     sản phẩm — nút ghost trần sẽ không đọc ra. KHÔNG bóng, theo khuôn lớp nổi
     của dự án. Cỡ 40 = bậc `size=icon` của DS. */
  .dk-rail-arrow {
    /* CANH GIỮA THEO Ô ẢNH, KHÔNG phải giữa cả thẻ (chốt user 03/09/2026).
       Thẻ = ảnh 460 + khối chữ 130 = 590, nên giữa THẺ là 295 — lệch 65px xuống
       dưới so với giữa ẢNH (230). Mắt đọc mũi tên theo ảnh, không theo cả block.
       Không tính được bằng CSS thuần: `top: %` của phần tử absolute quy theo
       CHIỀU CAO khối chứa, còn chiều cao ảnh lại suy từ BỀ RỘNG thẻ
       (aspect-ratio 189/252) — hai trục khác nhau, `calc` không nối được. Nên
       wireRail() ĐO ô ảnh rồi ghi vào biến `--rail-arrow-y` (đo lại khi resize).
       50% là giá trị dự phòng cho lúc JS chưa chạy. */
    position: absolute; top: var(--rail-arrow-y, 50%); transform: translateY(-50%);
    width: 40px; height: 40px; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--general-background) 88%, transparent);
    -webkit-backdrop-filter: blur(7.5px);
            backdrop-filter: blur(7.5px);
    border: 1px solid var(--general-border);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, background-color .15s ease;
  }
  /* `:focus-within` để đi bàn phím vẫn thấy nút; `[hidden]` là hướng ĐÃ HẾT
     nội dung — không bày nút bấm vào chẳng làm gì (cùng luật với subheader). */
  .dk-rail:hover .dk-rail-arrow,
  .dk-rail:focus-within .dk-rail-arrow { opacity: 1; pointer-events: auto; }
  .dk-rail-arrow[hidden] { display: none; }
  .dk-rail-arrow:hover { background: var(--general-background); }
  .dk-rail-prev { left: 8px; }
  .dk-rail-next { right: 8px; }
  /* Nền hover của 2 biến thể Button trong nav:
     · Ghost (hàng giới tính + nút tiện ích) → "nhún" nền đen 5%
       (Button/Ghost/Hover: fill #000 5%, label #0a0a0a)
     · Ghost Muted (danh mục subheader)     → chỉ đậm chữ #404040→#0a0a0a,
       không nền — markup đã có hover:text-foreground, không cần rule thêm */
  .ghost-hover { transition: background-color .15s ease; }
  .ghost-hover:hover { background: var(--unofficial-ghost-hover); color: var(--general-primary); }
  /* ── HOVER = GẠCH CHÂN, CHỈ TRONG DROPDOWN (chốt 17/08/2026, yêu cầu user) ──
     Đường dẫn trong mega panel gạch chân khi hover (kiểu cettire.com/vn), chữ
     lúc nghỉ vẫn sạch.
     THANH NAV GIỮ NGUYÊN NHƯ CŨ — hàng ngành hàng (.dk-dept) và danh mục
     subheader (.dk-nav-link) chỉ đổi màu theo thang mực 3 bậc, KHÔNG gạch chân
     (đúng quyết định 10/08/2026, đối chứng component Button trong Figma).
     ĐỪNG thêm 2 selector đó vào rule này.
     Cũng không đụng ảnh teaser (`.dk-mega-grid > button`, vốn gạch chân sẵn).
     Offset 2px cho khớp `underline-offset-2` dùng sẵn trong file.
     Bản mobile KHÔNG có rule này: menu ở đó là panel trượt, không có hover. */
  .dk-mega-grid > div button:hover {
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  /* ── Nav: thang mực 3 bậc (chỉ đạo user 13/08/2026, theo component) ──
     Khách thấy default và đang chọn chưa khác nhau đủ. Đã đọc thật component
     `Button` (10:11763) và `Header` (2171:13006) trong Figma qua MCP:
       Ghost / Ghost Muted · Default : #525252 (unofficial/ghost foreground)
       Ghost / Ghost Muted · Hover   : #0a0a0a (+ nền đen 5% chỉ ở Ghost)
       Ghost / Ghost Muted · Active  : #0a0a0a, NỀN TRONG SUỐT — KHÔNG có pill
       Header: dept đang chọn "Nam" #0a0a0a, 2 dept còn lại #525252
     => Chốt theo component: state đang chọn CHỈ đổi màu chữ, không nền, không
     đổi độ đậm. Để khoảng cách đủ nhìn thì HẠ TONE DEFAULT thay vì tô thêm
     nền cho state (bản pill trước đó user đã loại).

     Thang mực riêng của nav, 3 bậc rõ rệt:
       nghỉ  #737373 (general/muted foreground = neutral/500)  — 4.74:1, còn đạt AA
       hover #404040 (unofficial/foreground-alt)                — bậc trung gian
       đang chọn #0a0a0a (general/primary)                     — đậm nhất
     Phải chèn bậc hover riêng: hover của component cũng là #0a0a0a, giữ nguyên
     thì mục chỉ-đang-hover trông y hệt mục đang chọn (ở hàng dept còn đậm hơn vì
     được thêm nền 5%).

     TẤT CẢ scope trong .navbar — KHÔNG hạ token --unofficial-mid-alt: token đó
     còn gánh copy footer 16/300 trên #f5f5f5 (hạ 1 bậc là trủt WCAG AA), nhãn 2
     nút outline "Huỷ đơn hàng"/"Theo dõi đơn hàng", và 8 chỗ non-nav ở index.html.
     KHÔNG khai box-shadow — .press:focus-visible đang dùng box-shadow làm vòng
     focus duy nhất của nav. */
  .navbar .dk-dept,
  /* Kéo theo cả nhóm tiện ích cùng thanh (English / Danh sách cửa hàng): trong
     component chúng DÙNG CHUNG mức với dept ở trạng thái nghỉ, hạ mỗi dept thì
     hàng tiện ích bỗng dưng đậm hơn menu — trông như lỗi căn mức. */
  .navbar .text-mid-alt { color: var(--general-muted-foreground); }
  .navbar .dk-dept:hover { color: var(--unofficial-foreground-alt); }
  .navbar .dk-dept[aria-current],
  .navbar .dk-nav-link[aria-current] { color: var(--general-primary); }
  /* ── SUBHEADER: mặc định secondary-foreground, hover thì LÀM MỜ CÁC MỤC KHÁC ──
     Chốt 17/08/2026 (yêu cầu user). Trước đây subheader dùng chung thang mực 3
     bậc với hàng dept (nghỉ #737373 → hover #404040), tức phải HOVER mới đọc rõ.
     Nay: nghỉ đã là #262626 cho dễ đọc; hover vào thanh thì mọi mục tụt về
     #737373 và mục đang trỏ ĐẬM LÊN #0a0a0a (chốt lại 17/08/2026 — bản đầu giữ
     mục đang trỏ ở #262626, user chê chưa đủ tối so với phần còn lại).
     => Hover ăn 2 chiều một lúc: mục đang trỏ đen nhất, các mục kia mờ nhất,
     khoảng cách 3 bậc mực nên nhìn ra ngay đang trỏ vào đâu.
     · `:not([aria-current])` để mục đang xem vẫn đứng ở #0a0a0a, không mờ theo.
     · `:not(.text-destructive)` để "Khuyến mãi" giữ màu đỏ ở mọi state (đúng
       component Destructive). */
  .navbar .dk-nav-link:not(.text-destructive) { color: var(--general-secondary-foreground); }
  /* `:not(:hover)` trong rule làm mờ là BẮT BUỘC, không phải cho đẹp: bản đầu
     viết `.dk-nav-strip:hover .dk-nav-link:not(.text-destructive):not([aria-current])`
     (specificity 5) còn rule cho mục đang trỏ là `.dk-nav-strip .dk-nav-link:not(...):hover`
     (specificity 4) -> rule mờ THẮNG luôn cả mục đang trỏ, nên hover vào thì cả
     thanh mờ đều, không mục nào đen lên (đúng lỗi user báo). Loại thẳng mục đang
     trỏ ra khỏi rule mờ thì hết phải đấu specificity. */
  .dk-nav-strip:hover .dk-nav-link:not(:hover):not(.text-destructive):not([aria-current]) { color: var(--general-muted-foreground); }
  .dk-nav-strip .dk-nav-link:not(.text-destructive):hover { color: var(--general-primary); }
  /* Hàng giới tính + Làm đếp còn thêm KÊNH ĐỘ DÀY (chỉ đạo user 13/08/2026):
     nghỉ 400 — đúng component Header (dept row là Regular, khác hàng danh mục
     subheader là Medium) — và đang chọn 600 (chốt lại 13/08/2026, nhảy 2 bậc
     cho rõ; Montserrat đã nạp đủ 300/400/500/600/700 nên không bị giả đậm). Trước đó markup đặt font-medium
     cho CẢ 3 nút nên "nâng active lên 500" không tạo ra khác biệt nào.
     Để ở CSS thay vì class để độ dày và màu cùng nằm 1 chỗ, khóa theo
     aria-current — không để 2 cơ chế đánh nhau trên cùng thuộc tính.
     Chỉ hàng dept: danh mục subheader giữ Medium ở mọi state theo component. */
  .navbar .dk-dept { font-weight: 400; }
  .navbar .dk-dept[aria-current] { font-weight: 600; }
  /* "Khuyến mãi" là mục duy nhất có màu riêng — component ghi rõ Destructive
     KHÔNG đổi màu khi hover, mà .btn-gm:hover đang bôi đen nó. Giữ đỏ ở mọi
     state; đang chọn thì chỉ đậm hơn bằng độ dày (không có bậc mực nào đậm hơn
     đỏ để dùng). */
  .navbar .dk-nav-link.text-destructive,
  .navbar .dk-nav-link.text-destructive:hover { color: var(--general-destructive); }
  .navbar .dk-nav-link.text-destructive[aria-current] { font-weight: 600; }

  /* ══ THANH MENU: MỘT KHUÔN CHUNG THEO skin-mt — ÁP CHO BỘ DA MẶC ĐỊNH ═════════
     (25/08/2026, chốt user: *"Thanh menu header 2 thiết bị sẽ theo skin-mt (có thể
     khác font tùy theo set up) áp dụng các skin còn lại"*.)
     Bản desktop của cùng một lượt; khối song sinh nằm trong `index.html`. Bộ da mặc
     định là ô cuối còn lại trong `SKINS` (`skin-mp` đã áp 24/08, Maika lấy trọn bộ
     số từ đầu, skin-mt là nguồn).

     KHÔNG khai `font-family`: *"có thể khác font tùy theo set up"* — mặt chữ vẫn của
     từng bộ da. Khối này chỉ chạm CỠ · DÒNG · ĐẬM · HOA · TRACKING + cách đánh dấu
     state.

     `html:not([class*="skin-"])` = "<html> không mang bộ da nào" = ô `['default', …,
     '']` của `SKINS`. An toàn: 4 class còn lại mà JS gắn lên <html> (`theme-*` ·
     `font-override` · `font-pair` · `sp-open`) không chứa chuỗi "skin-".

     Số đo nguồn — `getComputedStyle` trên trang chạy, khổ 1440, skin-mt, 25/08/2026:
       vai              | mặc định TRƯỚC              | skin-mt = đích
       .dk-dept         | 16/24 · **600** · thường    | 12/16 · 500 · HOA · ls .5
       .dk-nav-link     | 16/24 · 500 · thường        | 12/16 · 500 · HOA · ls .5
       .search-tab      | 16/24 · 500/300 · thường    | 12/16 · 500 · HOA · ls .5
       nhãn nhóm mega   | 14/20 · **600** · HOA · ls 1.12 | 12/18 · 500 · HOA · ls .5
       hàng trong mega  | 14/20 · 400 · thường        | 12/18 · 400 · thường · ls .5

     ĐỔI LUÔN CƠ CHẾ ĐÁNH DẤU STATE, không phải thêm cho đẹp: bộ mặc định đang đánh
     dấu bằng ĐỘ ĐẬM (dept nghỉ 400 → đang chọn 600; "Khuyến mãi" đang chọn 600). Về
     500 một mức ở mọi state là mất mốc thị giác, mà 600 thì §1.1 cấm hẳn — nên lấy
     luôn gạch chân 2px của skin-mt (mục 2 + mục 7 của khối đó), đúng cách skin-mp và
     Maika đang làm. Sau lượt này cả 4 bộ da đánh dấu nav bằng MỰC + GẠCH, không bằng
     độ đậm.

     KHÔNG LẤY: nền trắng đặc / kẻ dọc teaser / `gap: 14px` của `.dk-mega` — đó là
     bảng màu và nhịp dọc của skin-mt, không phải thang chữ của thanh menu. Cũng
     KHÔNG lấy gạch đỏ dưới "Khuyến mãi" của skin-mp: skin-mt để gạch đen ở mọi mục,
     giữ 1:1 với nguồn.

     ⚠ Lệch `STYLE-RULES.md` §1.2 ở đúng một chỗ: luật ghi nav ngành hàng = T3 **14/20
     giống hệt cả 2 bản**, số đo desktop đang chạy là 12/16 và chốt là lấy số đo. Ghi
     lại để lần sửa luật kéo cả 4 bộ da + `home.html` cùng lúc, không sửa lẻ ở đây. */
  html:not([class*="skin-"]) .navbar .dk-dept,
  html:not([class*="skin-"]) .navbar .dk-dept[aria-current],
  html:not([class*="skin-"]) .navbar .dk-nav-link,
  html:not([class*="skin-"]) .navbar .dk-nav-link[aria-current],
  /* Selector thứ 5 KHÔNG dư: rule gốc `.navbar .dk-nav-link.text-destructive[aria-current]`
     là (0,4,0), cao hơn 4 dòng trên (0,3,1) nên "Khuyến mãi" đang chọn vẫn ra 600
     nếu thiếu dòng này. */
  html:not([class*="skin-"]) .navbar .dk-nav-link.text-destructive[aria-current],
  /* Hàng tab ngành hàng ở màn Search — cùng vai với `.dk-dept` nhưng nằm NGOÀI
     `.navbar`. Phải giữ chữ `button` (bẫy specificity, xem mục 2 khối skin-mt). */
  html:not([class*="skin-"]) button.search-tab {
    font-size: 12px; line-height: 16px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  /* Cấp 2 của cùng thanh menu: nhãn nhóm + đường dẫn trong mega panel.
     `> div > p` trúng cả thẻ `&nbsp;` giữ chỗ ở 2 cột thương hiệu (`dkMegaCol` dùng
     chung class) nên 4 cột vẫn thẳng hàng chữ đầu. `> div button` KHÔNG trúng ảnh
     teaser cột 4 — ảnh đó là `.dk-mega-grid > button`, con trực tiếp của lưới. */
  html:not([class*="skin-"]) .dk-mega-grid > div > p {
    font-size: 12px; line-height: 18px; font-weight: 500;
    letter-spacing: 0.5px; color: var(--general-primary);
  }
  html:not([class*="skin-"]) .dk-mega-grid > div a,
  html:not([class*="skin-"]) .dk-mega-grid > div button {
    font-size: 12px; line-height: 18px; letter-spacing: 0.5px;
  }
  /* Gạch chân 2px thay kênh độ đậm — sao y mục 2 + mục 7 của skin-mt.
     left/right 16px = px-4 của nút nên vạch dài đúng bằng chữ; `bottom: 0` của
     `.dk-dept` là đáy NÚT h-9 (không phải đáy hàng 64px), của `.dk-nav-item` là đáy
     thanh 52px. */
  html:not([class*="skin-"]) .navbar .dk-dept,
  html:not([class*="skin-"]) .navbar .dk-nav-item { position: relative; }
  html:not([class*="skin-"]) .navbar .dk-dept::after,
  html:not([class*="skin-"]) .navbar .dk-nav-item::after {
    content: ''; position: absolute; left: 16px; right: 16px; bottom: 0; height: 2px;
    background: var(--general-primary); opacity: 0; transition: opacity .15s ease;
  }
  html:not([class*="skin-"]) .navbar .dk-dept[aria-current]::after,
  html:not([class*="skin-"]) .navbar .dk-nav-item.on::after,
  html:not([class*="skin-"]) .navbar .dk-nav-item:has([aria-current])::after { opacity: 1; }
  /* Scrim tối phủ nội dung trang khi panel mở (chữ ký của Farfetch).
     Nằm TRONG stacking context z-50 của .navbar nên vẫn đè lên nội dung trang,
     nhưng z:-1 để 3 tầng header + panel (sibling vẽ sau) nổi lên trên.
     Chỉ bật khi thật sự có panel đang mở (.dk-sub.mega-open do JS gắn) —
     Pre-loved/Khuyến mãi không có panel thì không làm tối trang. */
  .dk-scrim {
    position: fixed; inset: 0; z-index: -1;
    background: rgba(0,0,0,.45);          /* cùng độ tối với các backdrop khác của app */
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .25s ease, visibility 0s linear .3s;
  }
  .navbar:has(.dk-sub.mega-open) .dk-scrim { opacity: 1; visibility: visible; }
  /* ── Layer tìm kiếm — mở từ nút "Tìm kiếm" trên header ──
     Tấm trắng đổ từ mép trên xuống + nền tối phía dưới, thay cho dropdown
     420px neo dưới ô nhập của bản trước. Nội dung bên trong bó về 600px cho
     dễ đọc dù layer trải hết bề ngang. z-index 200 để nằm trên header (50)
     và mega panel, nhưng dưới toast/sheet (220+). */
  /* overflow:hidden + visibility có TRỄ — SỬA LỖI user chụp 17/08/2026 "đóng
     search mà layer chưa mất hẳn":
     tấm `.ds-sheet` lúc đóng bị đẩy `translateY(-100%)`. Trước đây khung layer
     bắt đầu từ mép trên màn nên phần đẩy lên đó ra ngoài viewport là biến mất.
     Từ khi ô nhập dời lên header, layer bắt đầu DƯỚI thanh nav (top = đáy nav)
     nên phần bị đẩy lên rơi đúng vào dải thanh nav và VẪN HIỆN, đè lên header
     (z-index 200 > nav 50) — nhìn ra mấy dòng "Khăn lụa / Thắt lưng" + giá gạch
     ngang lởn vởn trên đầu trang.
     `overflow: hidden` cắt đúng phần tràn ra ngoài khung; `visibility` trễ .36s
     là lưới an toàn cho trường hợp transform không chạy (tab nền/cửa sổ ẩn). */
  #dkSearchLayer {
    position: fixed; inset: 0; z-index: 200; pointer-events: none;
    overflow: hidden;
    /* XẾP DỌC: tấm gợi ý trên, nền tối là phần còn lại (17/08/2026).
       Trước đó nền tối là `inset: 0` và JS đo chiều cao tấm rồi set `top` cho nó
       một lần lúc mở — gõ chữ vào là cột trái đổi nội dung, tấm tụt từ 552 xuống
       479px mà mốc nền tối vẫn 552 -> HỞ 73px nền trang không bị làm tối (lỗi
       user báo). Để flex tự chia thì nền tối luôn bắt đầu đúng đáy tấm, tấm cao
       bao nhiêu cũng khớp, không cần đo. */
    display: flex; flex-direction: column;
    visibility: hidden; transition: visibility 0s linear .36s;
  }
  #dkSearchLayer .ds-backdrop {
    position: relative; flex: 1 1 auto; background: rgba(0,0,0,.45);
    opacity: 0; transition: opacity .3s ease;
  }
  #dkSearchLayer .ds-sheet {
    position: relative; flex: 0 0 auto;   /* item đầu của layer flex-col */
    /* Nền: glass-95 + backdrop-blur-[7.5px] khai ở MARKUP, đúng bộ của thanh nav
       và mega panel (17/08/2026, yêu cầu user "dùng blur background như menu").
       Không đặt background ở đây nữa kẻo đè lên lớp kính.
       Cũng KHÔNG viền/bóng — cùng lý do với .dk-mega: tấm này bám ngay dưới hàng
       nav nên phải đọc ra là phần nối dài của thanh, không phải thẻ nổi. */
    border: 0; box-shadow: none;
    max-height: 86vh; overflow-y: auto;
    transform: translateY(-100%); transition: transform .35s cubic-bezier(.22,1,.36,1);
  }
  #dkSearchLayer.open { pointer-events: auto; visibility: visible; transition-delay: 0s; }
  #dkSearchLayer.open .ds-backdrop { opacity: 1; }
  #dkSearchLayer.open .ds-sheet { transform: none; }
  /* Các số đo dưới đây không có sẵn trong tailwind.css đã build nên đặt tay.
     Khung trong bó 1240 (cùng cỡ với khung thanh toán), riêng Ô NHẬP vẫn giữ
     max 600 canh giữa như yêu cầu trước. */
  #dkSearchLayer .ds-inner { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  /* ── Ô nhập tìm kiếm ĐÈ LÊN HÀNG NAV, CANH GIỮA (17/08/2026, yêu cầu user —
     tham chiếu stradivarius.com) ──
     Ô absolute trong #dkNavRow với LỀ HAI BÊN BẰNG NHAU (`--dk-search-inset`)
     nên nó nằm chính giữa hàng nav thay vì tràn hết sang trái như bản đầu.
     Con số 230 = bề rộng cụm phải TỪ icon search trở đi (search 44 + ngôn ngữ
     ~94 + tài khoản 44 + giỏ 44 = 226) + 4 hở → mép phải của ô đứng sát ngay
     icon search, và vì icon search là phần tử ĐẦU của cụm nên hiệu ứng quét từ
     phải sang trái vẫn đọc ra là "ô trượt ra từ icon search".
     KIỂU Ô: nền xám đặc (--general-secondary) + bo 2, KHÔNG gạch chân — chốt
     17/08/2026; focus thì viền chuyển primary, cùng ngôn ngữ với mọi input khác
     trong file (`focus:border-primary`).
     Animation: `clip-path` (không animate width vì chữ bị nén, không scaleX vì
     méo chữ). Ngành hàng + logo mờ đi để hàng nav sạch, ô nổi giữa. */
  #dkNavRow { --dk-search-inset: 230px; }
  #dkNavSearchField {
    position: absolute; left: var(--dk-search-inset); right: var(--dk-search-inset);
    top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; height: 40px; padding: 0 12px;
    background: var(--general-secondary);
    border: 1px solid transparent; border-radius: var(--radius-2);
    clip-path: inset(0 0 0 100%); opacity: 0; pointer-events: none;
    transition: clip-path .38s cubic-bezier(.22,1,.36,1), opacity .18s ease, border-color .15s ease;
  }
  /* Cờ trạng thái đặt trên .navbar (không phải #dkNavRow) vì còn phải tắt cả
     subheader — nó là khối EM của hàng nav, không nằm trong #dkNavRow. */
  .navbar.search-open #dkNavSearchField { clip-path: inset(0); opacity: 1; pointer-events: auto; }
  #dkNavSearchField:focus-within { border-color: var(--general-primary); }
  #dkNavLeft, #dkNavLogo, #dkSubRow { transition: opacity .22s ease; }
  .navbar.search-open #dkNavLeft,
  .navbar.search-open #dkNavLogo,
  /* Mở tìm kiếm thì SUBHEADER TẮT (17/08/2026, yêu cầu user) — tắt bằng opacity
     chứ không display:none để navbar không tụt 52px làm cả trang giật. */
  .navbar.search-open #dkSubRow { opacity: 0; pointer-events: none; }
  #dkSearchInput {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    padding: 0; -webkit-appearance: none; appearance: none;
    font-size: 14px; line-height: 20px; color: var(--general-foreground);
  }
  #dkSearchInput::placeholder { color: var(--general-muted-foreground); }
  #dkSearchInput::-webkit-search-cancel-button { display: none; }
  /* 2 cột: trái = lịch sử/gợi ý + từ khóa · phải = sản phẩm nổi bật, ngăn bằng
     đường dọc như tham chiếu Versace. */
  /* CHỐT CHIỀU CAO phần 2 cột (17/08/2026, yêu cầu user "fix height"): cột trái
     đổi nội dung theo phím gõ (lịch sử 6 dòng ↔ gợi ý ↔ "không tìm thấy") nên
     tấm co giãn liên tục, nhìn nhảy.
     552 = chiều cao ĐO THẬT của trạng thái cao nhất (6 dòng lịch sử + 5 từ khoá
     phổ biến) và ĐÃ GỒM `pt-8 pb-10` vì box-sizing là border-box — đặt 480 như
     bản đầu thì padding ăn hết, tấm vẫn tụt xuống 480. Trạng thái nào cao hơn
     552 thì tấm cứ giãn, nền tối bám theo nhờ flex nên không hở. */
  #dkSearchLayer .ds-cols { display: flex; gap: 40px; min-height: 552px; }
  #dkSearchLayer .ds-side { width: 280px; flex-shrink: 0; }
  #dkSearchLayer .ds-main {
    flex: 1; min-width: 0;
    border-left: 1px solid var(--general-border); padding-left: 40px;
  }
  /* Dải desktop hẹp: 2 cột xếp chồng, đường ngăn dọc đổi thành ngang */
  @media (max-width: 1023px) {
    #dkSearchLayer .ds-cols { flex-direction: column; gap: 24px; }
    #dkSearchLayer .ds-side { width: auto; }
    #dkSearchLayer .ds-main {
      border-left: 0; padding-left: 0;
      border-top: 1px solid var(--general-border); padding-top: 24px;
    }
  }
  /* Thẻ thanh toán: Figma cho 4 thẻ CAO BẰNG NHAU 64 (thẻ "trả góp 0%" xuống
     2 dòng kéo cả nhóm lên 64). Đặt sàn ở đây thay vì trong richRadio để thẻ
     vận chuyển vẫn ôm sát nội dung như cũ. */
  #payOpts .opt { min-height: 64px; }
  /* Ô nhập sai: tailwind build sẵn không có border-destructive nên đặt tay.
     !important vì utility .border-border cùng mức specificity và thắng cascade. */
  .fld-err, .fld-err:focus { border-color: var(--general-destructive) !important; }

  /* ══ OFFSET STICKY CANH THEO ĐÁY HEADER — GOM MỘT CHỖ ══════════════════════
     4 mặt dưới đây phải ghim ngay dưới đáy header khi cuộn. Header = promo bar 32
     (cuộn khỏi màn nhờ .navbar sticky top-[-32px]) + hàng nav 60 + subheader 72.
     Subheader lên 72 (chốt 18/08/2026) nên cả 4 số CỘNG 20 so với trước.
     ÁP CHO MỌI BỘ DA — không nhét vào khối bộ da nào.

     Khai TAY ở đây thay vì để utility trong markup vì `top-[132px]` /
     `top-[148px]` / `scroll-mt-[148px]` KHÔNG có trong `tailwind.css` đã build
     (giống lý do `col-start-4` phải khai tay). Gom 1 chỗ cũng đúng hơn: 4 số này
     BUỘC phải dịch cùng nhau mỗi lần chiều cao header đổi, để rải rác trong
     markup là chắc chắn có cái bị bỏ sót.
     `#plpFilterAnchor` là id (1,0,0) nên thắng mọi utility class còn sót. */
  #plpFilterAnchor            { top: 132px; }   /* 112 + 20 */
  .dk-policy-aside            { top: 148px; }   /* 128 + 20 */
  [data-policy-sec]           { scroll-margin-top: 148px; }
  /* ── PDP desktop: cột info dính khi cuộn gallery ── */
  .dk-sticky-info { position: sticky; top: 156px; align-self: flex-start; }   /* 136 + 20 */
  .dk-sticky-side { position: sticky; top: 156px; align-self: flex-start; }   /* 136 + 20 */
  /* Bề ngang cột info của PDP#1 (.dk-info-wide) và cột chữ dải "Gợi ý mua kèm"
     (.dk-look-aside) KHÔNG khai ở đây mà nằm NGAY TRÊN khối "DẢI DESKTOP HẸP":
     hai class đó là class ngữ nghĩa của chính file này, nên phải đứng TRƯỚC các
     @media override, kẻo cùng specificity thì rule khai sau thắng và dải hẹp
     mất hiệu lực (đã dính đúng lỗi đó lúc dựng). */

  /* ══ CHIỀU CAO 2 HÀNG HEADER = 64/64 — PHẦN GEOMETRY CỦA KHUÔN MENU CHUNG ════
     (25/08/2026, cùng lượt chốt *"Thanh menu header 2 thiết bị sẽ theo skin-mt …
     áp dụng các skin còn lại"*; user báo tiếp: *"spacing của menu bản maika có vẻ
     đang lớn hơn của skin-mt"* — đúng, đo ra hàng danh mục 72 vs 64.)

     Base ở trên là 60 + 72 = số của bộ thiết kế gốc. skin-mt về **64 + 64**, nên
     header tổng 32 + 64 + 64 = 160 và đáy header khi cuộn = 128 — BỚT 4px so với
     base (132), 4 offset sticky phải trừ theo. Trước lượt này chỉ skin-mt có, nên
     Maika và bộ mặc định vẫn 60/72 dù menu đã theo skin-mt về thang chữ.

     AI ĐƯỢC 64/64: mọi bộ da TRỪ `skin-mp`. Một discriminator `html:not(.skin-mp)`
     là đủ — nó gom bộ mặc định, skin-mt, và **Maika** (từ 25/08 Maika là
     `skin-mt skin-mk`, không còn mang `skin-mp`). Bộ da mới sau này mặc định vào
     nhóm 64/64, đúng hướng khuôn chung.
     *(Bản trước có thêm nhánh `html.skin-mk` vì hồi đó Maika mang cả `skin-mp` nên
     `:not(.skin-mp)` không với tới nó. Đổi gốc Maika xong thì nhánh đó thành dư —
     đã gỡ.)*
     `skin-mp` GIỮ 60/72 của base: thang nav 2 tầng 16/14 của nó cần chỗ hơn, và đó
     là chốt riêng 24/08 chưa bị đảo. Muốn nó vào khuôn luôn thì đổi discriminator
     thành `html` — 1 dòng.

     GOM MỘT CHỖ, và đây là chỗ duy nhất: 6 rule trùng trong khối `skin-mt` đã GỠ
     (xem mục 6 của khối đó). Lý do y như ghi chú base ngay trên — 4 số này buộc
     phải dịch cùng nhau mỗi lần chiều cao header đổi.

     ⚠ PHẢI bám `#dkSubRow`, TUYỆT ĐỐI KHÔNG dùng `.dk-sub > div`: 9 panel `.dk-mega`
     cũng là con TRỰC TIẾP của `.dk-sub` (render ngoài thanh cuộn để overflow-x không
     cắt panel), nên `.dk-sub > div` ép luôn cả panel về 64px — `.dk-mega` có
     `overflow: hidden` nên nội dung 362px bị cắt còn một dải 64px, nhìn ra là "mega
     menu không hiển thị được" (lỗi user báo 18/08). */
  html:not(.skin-mp) #dkNavRow,
  html:not(.skin-mp) #dkSubRow        { height: 64px; }
  html:not(.skin-mp) #plpFilterAnchor { top: 128px; }             /* 132 - 4 */
  html:not(.skin-mp) .dk-policy-aside { top: 144px; }             /* 148 - 4 */
  html:not(.skin-mp) [data-policy-sec] { scroll-margin-top: 144px; }
  html:not(.skin-mp) .dk-sticky-info,
  html:not(.skin-mp) .dk-sticky-side  { top: 152px; }             /* 156 - 4 */

  /* toast desktop nằm giữa đáy, không đụng FAB */
  #toast { bottom: 48px; }

  /* ── TẠM ẨN dải "Mua thêm … để nhận …" (20/08/2026, yêu cầu user) ─────────────
     Phần TEASER của `orderGiftInner()` — mốc quà kế tiếp CHƯA đạt, dựng với
     `data-gift-next`. Ẩn bằng CSS chứ không xoá trong JS: `refreshCartGifts` vẫn
     dựng lại như cũ nên bật lại chỉ là xoá 2 dòng dưới đây. ÁP CHO MỌI BỘ DA —
     chuyện nội dung demo, không phải style. Rule thứ 2 cho trường hợp mốc đã đạt
     bị rớt (bỏ tick sản phẩm): khi đó khối chỉ còn teaser, không ẩn thì ở
     `skin-mt` còn lại một tấm trắng rỗng.
     KHAI GIỐNG HỆT ở index.html — sửa 1 file nhớ sửa cả 2. */
  [data-gift-next] { display: none; }
  #orderGift:not(:has([data-gift-tier])) { display: none; }

  /* ── SỐ TIỀN TRONG GIỎ DÙNG CHỮ SỐ ĐẲNG CHIỀU (20/08/2026) ────────────────────
     Màn giỏ xếp giá theo CỘT ở mép phải (giá từng món, tạm tính, các dòng giảm,
     tổng cộng). Chữ số tỉ lệ của Montserrat có bề rộng khác nhau nên cột số bị
     răng cưa; `tabular-nums` ép về cùng bề rộng -> cột thẳng, và số lượng ở stepper
     không nhảy ngang khi đổi 1 <-> 2. Đặt Ở BASE, không trong bộ da: chuyện đọc số,
     đúng cho cả 3 bộ da. KHAI GIỐNG HỆT ở index.html. */
  [data-screen="cart"] { font-variant-numeric: tabular-nums; }

  /* ══ BỘ DA "Editorial · MR PORTER" — bật/tắt từ popover Cài đặt ═════════════
     (18/08/2026, yêu cầu user: "bản desktop chưa switch được sang style này".)
     MỌI selector gắn tiền tố `html.skin-mp` nên khi KHÔNG có class thì file này
     chạy y nguyên như trước — khối này inert 100%, không phải bản fork.
     `html.skin-mp` thay cho `:root`: cùng trỏ <html> nhưng specificity (0,1,1) >
     `:root` (0,1,0) nên thắng bảng token gốc. Xem SKINS / applySkin.

     PORT TỪ desktop-editorial.html, nhưng CHỈ những gì file này còn thiếu —
     4 mục của bản kia đã có sẵn ở đây nên KHÔNG chép lại:
       · tắt bóng: file này đã "không đổ bóng" từ 17/08
       · header trắng: 2 thanh kính vốn đã trắng (bản kia phải tô lại vì từng
         thử header đen của NET-A-PORTER)
       · dải đen giữa 2 hàng header: user đã bỏ, không port
       · hairline đáy .dk-sub: file này đã có 1 hairline ở đáy cả khối
         (.navbar::after) nên không thêm — cũng vì vậy KHÔNG cần bù offset sticky
     Khác biệt cấu trúc phải đổi selector: mega panel ở đây là LƯỚI
     `.dk-mega-grid` (4 cột), bản kia là flex-wrap `.dk-mega-cols`.
     GIỮ NGUYÊN thang mực hover 2 chiều của thanh nav (chốt 17/08): màu nghỉ của
     `.dk-nav-link` vốn đã là `--general-secondary-foreground`, trong bảng màu
     MR PORTER token đó = #1a1a1a nên tự ra gần đen, không cần đè màu. */

  /* ⚠ KHÔNG DÙNG ĐEN ĐẶC #000000 TRONG BẢNG TOKEN CỦA BỘ DA (20/08/2026) ────────
     User rà lại: color system của dự án KHÔNG có đen đặc. Kiểm `tokens.css`: mực
     đậm nhất là **#0a0a0a** (`--general-foreground` / `--general-primary`), và
     `--unofficial-contrast` là #010101 ở mode D. Đen đặc chỉ xuất hiện KÈM ALPHA
     (backdrop `#00000099`, ghost-hover `#0000000d`, outline-hover `#00000008`) —
     tức dùng làm lớp phủ, không phải làm mực.
     Hai bộ da bên dưới trước đó khai `#000000` đặc vì số đo của mytheresa và
     mrporter đều ra đen thật. Nay kéo hết về `#0a0a0a`: lệch 10/255 nên mắt không
     phân biệt được, mà bộ da không còn đẻ sắc ngoài color system.
     · GIỮ NGUYÊN mọi giá trị có alpha — hệ token gốc cũng làm đúng như vậy.
     · GIỮ NGUYÊN chữ "#000" trong comment ghi SỐ ĐO của site tham chiếu: đó là ghi
       chép đo đạc, sửa đi là làm sai lịch sử.
     Xem khối cùng tên ở index.html. */

  /* ── 1. Token: bảng trắng–đen trung tính ── */
  html.skin-mp {
    --unofficial-body-background: #ffffff;
    --general-background: #ffffff;
    --general-background-blur: #ffffffe5;
    /* ⚠ 20/08/2026: các số dưới đây ĐO LẠI TỪ CHÍNH mrporter.com/en-vn (khổ
       mobile 375, trang chủ) thay cho số cũ lấy từ net-a-porter làm proxy — xem
       khối cùng tên trong index.html cho bảng đo đầy đủ. Token màu không phụ
       thuộc khổ nên áp cho cả 2 file. */
    --general-secondary: #f0f0f0;
    --general-muted: #f0f0f0;
    --unofficial-accent-0: #f7f7f7;
    --unofficial-border-0: #f0f0f0;
    --unofficial-secondary-hover: #f7f7f7;
    --unofficial-secondary-active: #ebebeb;
    --unofficial-accent-2: #ebebeb;
    --popover-popover: #0a0a0a;
    --popover-popover-foreground: #ffffff;
    --general-foreground: #0a0a0a;
    --general-primary: #0a0a0a;
    --general-primary-foreground: #f0f0f0;
    --general-primary-hover: #262626;
    --general-primary-active: #1a1a1a;
    --general-secondary-foreground: #333333;
    --unofficial-foreground-alt: #333333;
    --unofficial-foreground-alt-2: #333333;
    --general-body-text: #0a0a0a;
    --unofficial-ghost-foreground: #333333;
    --unofficial-mid-alt: #4d4d4d;
    /* #656565 = 6.0:1 trên trắng (số đo thật của họ; bản proxy cũ là #767676) */
    --general-muted-foreground: #656565;
    --unofficial-mid-deprecated: #656565;
    --unofficial-contrast: #0a0a0a;
    --general-border: #e0e0e0;
    --unofficial-border-1: #ebebeb;
    --unofficial-border-3: #d9d9d9;
    --unofficial-border-4: #a6a6a6;
    --unofficial-border-5: #767676;
    --unofficial-accent: #0a0a0a;
    --unofficial-accent-foreground: #ffffff;
    --unofficial-accent-3: #d9d9d9;
    --unofficial-ghost-hover: rgba(0,0,0,.05);
    --unofficial-outline-hover: rgba(0,0,0,.04);
    --unofficial-outline-active: rgba(0,0,0,.06);
    /* đỏ sale MR PORTER — kéo cả badge -% và giá sale theo token, không sửa markup */
    --general-destructive: #d81e05;
    --unofficial-destructive-foreground: #d81e05;
    --unofficial-destructive-subtle: #fdecea;
    --unofficial-destructive-border: #f0a79c;
    --unofficial-destructive-active: #b81904;
    --general-success: #2e7d4f;
    --general-warning: #8a6100;
    --general-info: #2f6fa8;
    --focus-ring: #656565;
    --focus-ring-error: #d81e05;
    --btn-focus-ring: #656565;
    --surface-dark: #0a0a0a;
    --unofficial-backdrop: rgba(0,0,0,.5);
  }
  html.skin-mp.theme-dplus { --unofficial-accent: #0a0a0a; --general-muted-foreground: #595959; --focus-ring: #595959; }

  /* ── 2. Nav: thang chữ 2 tầng + đánh dấu bằng gạch chân ──
     Hàng dept giữ 16/24, hàng SUBMENU hạ về 14/20 (chốt 18/08) — lệch 1 nấc thang
     chữ nên đọc ra ngay cái nào cấp trên.
     MR PORTER không phân biệt state bằng độ đậm: đè 2 rule font-weight 600 của
     khối gốc, việc đánh dấu để gạch chân lo. */
  html.skin-mp .navbar .dk-nav-link { font-size: 14px; line-height: 20px; }
  /* CẢ 4 selector về 400, không chỉ [aria-current]: markup đặt `font-medium` cho
     .dk-nav-link nên thiếu 2 dòng đầu là nav ra 500 trong khi nav MR PORTER là
     regular — và lệch với chính bộ da này ở desktop-editorial.html. */
  html.skin-mp .navbar .dk-dept, html.skin-mp .navbar .dk-dept[aria-current],
  html.skin-mp .navbar .dk-nav-link, html.skin-mp .navbar .dk-nav-link[aria-current] { font-weight: 400; }
  /* ── MENU CHỮ HOA CHO skin-mp (24/08/2026, lệnh user: *"ở skin mr porter, hãy lấy
     bộ menu uppercase giống skin-mt"* → *"tiến hành làm trên bản desktop luôn"*) ────
     Ở KHỔ NÀY "bộ menu" của skin-mt chỉ gồm 2 vai: nav ngành hàng `.dk-dept` + nav
     danh mục `.dk-nav-link`. Đã đo để chắc:
       · nhãn nhóm mega panel của skin-mp VỐN ĐÃ hoa (14/20 · 600 · ls 2.1px + gạch
         ::after — idiom uppercase của chính bộ da này) -> không phải làm gì;
       · hàng trong mega: cả 2 bộ da đều chữ thường -> giữ;
       · **drawer `#menuSheet` của khổ desktop: skin-mt CŨNG KHÔNG hoa** (đo được toàn
         bộ w400 chữ thường) nên "giống skin-mt" ở đây nghĩa là KHÔNG hoa drawer —
         khác bản mobile, nơi drawer chính là menu và skin-mt hoa nó.
     GIỮ w400 CÓ CHỦ Ý: rule ngay trên khai 400 cho cả 4 selector theo số đo thật của
     MR PORTER (*"nav MR PORTER là regular"*, đánh dấu state bằng gạch chân + mực chứ
     không bằng độ đậm). Đổi chữ hoa thì không có lý do gì đảo chốt đó — nên đây là
     chỗ DUY NHẤT trong bộ da lệch cặp "500 đi với hoa" của skin-mt, và lệch có căn cứ.
     Trạng thái đang chọn vẫn đọc được: mực #0a0a0a vs #656565 + gạch 2px của
     `.dk-nav-item::after`. Nội dung trang không đụng: 2 selector đều trong `.navbar`. */
  html.skin-mp .navbar .dk-dept, html.skin-mp .navbar .dk-dept[aria-current],
  html.skin-mp .navbar .dk-nav-link, html.skin-mp .navbar .dk-nav-link[aria-current] {
    text-transform: uppercase;
    /* 25/08/2026 — TRỌN CẶP 500⇔HOA (§1.1). Rule ở trên (cùng selector, viết trước)
       ép nav về 400 để bỏ phân biệt state bằng độ đậm; rồi 24/08 khối menu thêm chữ
       HOA vào — hai quyết định riêng lẻ cộng lại thành "hoa mà 400", nửa cặp mà §1.1
       cấm. Bản mobile đã vá đúng chỗ này bằng `.ms-tab { font-weight: 500 }`; đây là
       bản desktop của cùng lượt vá, để 2 bản không lệch nhau.
       State vẫn đọc được bằng mực #0a0a0a vs #656565 + gạch 2px, không cần chênh đậm. */
    font-weight: 500;
  }
  /* Gạch chân 2px sát đáy hàng danh mục cho mục đang chọn / đang mở panel.
     Đặt trên .dk-nav-item (cao hết thanh 52px) nên vạch nằm đúng mép dưới;
     left/right 16px = px-4 của nút để vạch dài đúng bằng chữ. */
  html.skin-mp .navbar .dk-nav-item { position: relative; }
  html.skin-mp .navbar .dk-nav-item::after {
    content: ''; position: absolute; left: 16px; right: 16px; bottom: 0; height: 2px;
    background: var(--general-primary); opacity: 0; transition: opacity .15s ease;
  }
  html.skin-mp .navbar .dk-nav-item.on::after,
  html.skin-mp .navbar .dk-nav-item:has([aria-current])::after { opacity: 1; }
  html.skin-mp .navbar .dk-nav-item:has(.text-destructive)::after { background: var(--general-destructive); }

  /* ── 3. Thanh thông báo trên cùng: TRẢ VỀ NỀN ĐEN CHỮ TRẮNG ──────────────────
     (24/08/2026, lệnh user: *"promo bar nằm trên thanh header sẽ màu đen nhé"* — áp cho
     cả 2 bộ da, cả 2 bản.) Bản gốc vốn đã đen (nền inline `var(--surface-dark)` + chữ
     `text-primary-foreground`); chính bộ da này đảo nó thành `#d9d9d9` chữ `#1a1a1a`.
     Nên GỠ 2 rule đè, không khai màu đen mới. Token `--surface-dark` không đụng: nó còn
     tô thẻ "mặt tối lớn" ở màn khác. */

  /* ── 4. Mega panel: trắng đặc, nhịp dọc thoáng, nhãn nhóm có vạch ngắn ──
     Panel gốc dùng nền KÍNH để liền mạch với header; bộ da này tô trắng đặc cho
     khớp ảnh MR PORTER. `.glass-95` chỉ (0,1,0) nên bị đè dễ dàng. */
  html.skin-mp .dk-mega { background: #fff; border-bottom: 1px solid #e0e0e0; }
  html.skin-mp .dk-mega > div { padding-top: 40px; padding-bottom: 48px; }
  html.skin-mp .dk-mega-grid > div { gap: 14px; }
  /* Nhãn nhóm + VẠCH NGẮN 32×1px bên dưới — trong ảnh "SHOP BY CATEGORY" /
     "SHOP BY SPORT" đều có một vạch nằm giữa nhãn và danh sách. */
  /* Weight +1 NAC (yeu cau user 18/08/2026): nhan nhom trong dropdown subheader
     day len 1 bac o CA BAN GOC LAN 2 BO DA, de doi bo da nao cung thay doi:
       ban goc  font-medium 500 -> font-semibold 600 (sua o markup)
       skin-mp  500 -> 600
       skin-mt  400 -> 500 (bo da nay ep moi thu ve 400 nen nac cua no thap hon)
     Khong gop 1 gia tri chung: moi bo da co diem xuat phat weight rieng. */
  html.skin-mp .dk-mega-grid > div > p {
    /* 600 -> 500 (25/08/2026): §1.1 cấm hẳn 600, và nhãn này VỐN ĐÃ chữ hoa nên 500
       là đúng nửa còn lại của cặp. mytheresa cũng không có nấc nào trên 500. */
    color: #1a1a1a; font-weight: 500; position: relative; padding-bottom: 26px;
  }
  html.skin-mp .dk-mega-grid > div > p::after {
    content: ''; position: absolute; left: 0; bottom: 12px; width: 32px; height: 1px; background: #1a1a1a;
  }
  /* Kẻ dọc tách khối danh mục khỏi ảnh editorial (ảnh MR PORTER có đúng 1 kẻ dọc) */
  html.skin-mp .dk-mega-teaser { border-left: 1px solid #e0e0e0; padding-left: 40px; }

  /* ══ MAIKA (`skin-mk`) — DỰNG LẠI TRÊN `skin-mt`, 25/08/2026 ══════════════════
     Lệnh user: *"hãy quên skin mp đi, giờ tôi đang muốn dùng giao diện của skin-mt
     nhưng điều chỉnh lại sử dụng mix font inter và libre"*.

     ĐỔI GỐC, KHÔNG PORT TỪNG RULE. Trước lượt này Maika = `skin-mp skin-mk`: thân
     trang của MR PORTER + lớp phủ khai lại menu/bộ lọc theo số của skin-mt. Cách đó
     buộc mỗi nâng cấp của skin-mt phải port tay một lần nữa — quét 25/08 đếm được
     **37 selector lõi ở mobile + 40 ở desktop** mà chỉ skin-mt có (dải size hover
     thay quick add · giỏ editorial · hệ viền đen · ô tìm kiếm gạch dưới · accordion
     đảo vách…), xem `SYNC-SKIN-MT.md`.
     Nay bộ chọn da gắn **`skin-mt skin-mk`**: Maika thừa hưởng NGUYÊN giao diện
     skin-mt, kể cả mọi thay đổi về sau, và lớp phủ này rút về đúng 2 việc:
       1. đổi MẶT CHỮ sang cặp Inter + Libre Bodoni;
       2. giữ 1 quyết định riêng đã chốt: cụm accordion PDP một cỡ 14, không chữ hoa.
     Ba khối cũ đã GỠ HẲN vì skin-mt vốn đã làm đúng y như vậy: menu (`#menuSheet` ·
     `.dk-dept`/`.dk-nav-link` · mega panel · token viền menu), geometry header
     64/64, và cả khối "bộ lọc bê y nguyên" viết sáng cùng ngày (26 token + 9 rule).
     `SKINS`/`applySkin` không phải sửa gì ngoài ô class — nó vốn add/remove theo
     từng class (`.split(' ')`).

     ⚠ TIỀN TỐ `html.skin-mt.skin-mk`, KHÔNG phải `html.skin-mk`: khối `skin-mt` rải
     rule ở CẢ TRƯỚC lẫn SAU chỗ này trong file, nên cùng specificity thì thứ tự
     quyết định — và thứ tự đó không kiểm soát được. Bám cả 2 class là +1 class,
     thắng chắc mọi rule `html.skin-mt …` cùng cấu trúc. */

  /* 1 — MẶT CHỮ. Chỉ 2 token; mọi thứ khác (thang chữ, tracking .5px, độ đậm, chữ
     hoa nhãn) để skin-mt lo — đó chính là "giao diện skin-mt".
     KHÔNG đi qua `applyFontPair`/`.font-pair`: cơ chế đó đặt inline
     `font-size-adjust` (FONT-LIBRE-INTER **F3 cấm hẳn** — nó bóp Inter 2,8% nên chữ
     khai 12px vẽ ra ~11,7px) và giao `--font-head` cho cả `text-[18px]`/`h1-h3`
     (đẩy Bodoni xuống dưới sàn F1). Khai token thẳng ở CSS là đúng đường. */
  html.skin-mt.skin-mk {
    --font-app: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --font-head: 'Libre Bodoni', ui-serif, Georgia, serif;
  }
  html.skin-mt.skin-mk body { font-family: var(--font-app); }

  /* 2 — BẬC TRƯNG BÀY dùng Libre Bodoni, GÁC THEO MẬT ĐỘ MÀN (FONT-LIBRE-INTER F1).
     Nét mảnh Libre Bodoni = 0,031 × cỡ chữ: ở 24px là 0,74 CSS px — trên màn 1x nó
     dưới 1 pixel THIẾT BỊ nên bị khử răng cưa bôi thành xám, mất đúng cái làm nên
     Didone. Vì vậy Bodoni chỉ vào khi màn ≥2×; màn 1x rơi về Inter, có chủ ý.
     Bậc này ở skin-mt là 24/32 (blanket gom 22·24·32·48 về đó), nên chỉ cần đổi
     `font-family` — KHÔNG khai lại cỡ/dòng, để thang chữ vẫn một nguồn là skin-mt.
     `text-[48px]` hiện KHÔNG có phần tử nào trong 2 file; để trong danh sách cho
     tương lai. Tracking không khai: skin-mt đã đặt 0,5px ở `body`. */
  @media (min-resolution: 2dppx) {
    html.skin-mt.skin-mk :where(.text-\[22px\], .text-\[24px\], .text-\[32px\], .text-\[48px\]) {
      font-family: var(--font-head);
    }
  }

  /* 3 — CỤM ACCORDION PDP: MỘT CỠ 14, KHÔNG CHỮ HOA (lệnh user 25/08: *"ở skin maika,
     cho toàn bộ các Accordion (mô tả sản phẩm,...) up lên font 14 hết, không cần
     uppercase"* + *"accordion tăng fontweight lên 1 nấc"*).
     ⚠ CẬP NHẬT CUỐI NGÀY 25/08 — lệnh user *"nội dung bên trong accordions sẽ là font
     size 12, title accordions giữ ở 14"*, phạm vi chốt là "cả demo, mọi bộ da". NỘI DUNG
     hạ 14 -> **12/16**, nhãn GIỮ 14/20 · 500. Vì vậy khối này thôi lệch skin-mt về CỠ:
     cùng nhãn 14/20, cùng nội dung 12/16. Chỗ Maika còn cố ý lệch nay đúng MỘT thứ:
     **skin-mt hoa nhãn, Maika để chữ thường** (cộng mặt chữ Inter/Bodoni ở mục 1-2).
     Nhánh `[data-screen="pdp3"]` giữ lại làm đai an toàn: rule pdp3 riêng của skin-mt đã
     GỠ cùng ngày nên không còn ai để tranh.
     (Trạng thái trước cập nhật: skin-mt để nhãn 12/16 · 500 · HOA và riêng pdp3 lên
     14/20 — Maika kéo cả 6 bản về 14/20, nhãn 500, nội dung 400, chữ thường.)
     Vì sao 500 + chữ thường không phạm §1.1: luật cặp 500⇔HOA mở đầu bằng *"mọi chữ
     trong skin-mt"* và đây là ngoại lệ do user chốt đích danh cho bộ da này; nhãn
     accordion ở footer/giỏ của bộ da vốn cũng đã 500 chữ thường.
     PHẢI có nhánh `[data-screen="pdp3"]`: rule pdp3 của skin-mt là (0,4,2) — đúng
     bằng nhánh chung ở đây — và nó khai SAU trong file, nên thiếu nhánh này thì riêng
     PDP3 tuột về số của skin-mt.
     KHAI GIỐNG HỆT ở index.html và desktop.html. */
  html.skin-mt.skin-mk [data-pdp-acc] .acc-trigger > span:first-child,
  html.skin-mt.skin-mk [data-screen="pdp3"] [data-pdp-acc] .acc-trigger > span:first-child {
    font-size: 14px; line-height: 20px; font-weight: 500; text-transform: none;
  }
  html.skin-mt.skin-mk [data-pdp-acc] .acc-inner :is(div, p, span),
  html.skin-mt.skin-mk [data-screen="pdp3"] [data-pdp-acc] .acc-inner :is(div, p, span) {
    font-size: 12px; line-height: 16px; font-weight: 400; text-transform: none;
  }

  /* ══ BỘ DA "LIBRE + INTER" (`skin-li`) — CLONE skin-mt, ĐỔI HỆ CHỮ, 25/08/2026 ══
     Lệnh user: *"tạo clone 1 skin-mt ra đặt tên là skin-Libre inter. dùng toàn bộ lại
     của skin-mt nhưng áp dụng quy cách font size của bộ font libre inter với các
     heading như brand ở pdp,..."*

     CÁCH DỰNG — GHÉP, KHÔNG NHÂN BẢN: ô class trong `SKINS` là **`skin-mt skin-li`**,
     nên "dùng toàn bộ lại của skin-mt" là đúng nghĩa chữ: giao diện, bảng màu, hệ
     viền, thang chữ, chữ hoa nhãn… tất cả của skin-mt, kể cả nâng cấp sau này. Khối
     này chỉ khai phần HỆ CHỮ theo `FONT-LIBRE-INTER.md`.
     Trọng tài của khối này là `FONT-LIBRE-INTER.md` (F1 · F2 · F4 · F8), không phải
     số đo mytheresa.

     ⚠ TIỀN TỐ `html.skin-mt.skin-li`, KHÔNG phải `html.skin-li`: khối `skin-mt` rải
     rule ở CẢ TRƯỚC lẫn SAU chỗ này, nên cùng specificity thì thứ tự khai quyết định
     — và thứ tự đó không kiểm soát được. Bám 2 class là +1 class, thắng chắc.

     KHÁC GÌ BỘ DA MAIKA: Maika (`skin-mt skin-mk`) cũng là skin-mt + cặp font này,

     **12 tổ hợp phần tử** đang ở 12/16 mà chữ THẬT SỰ xuống dòng. Gom thành 6 hook,
     mỗi hook nhắm đúng một container — KHÔNG dùng blanket:
       1. ghi chú pre-order trong accordion checkout (`#shipOpts` · `#ckSections`).
       2. khối cam kết PDP/giỏ (`p.text-[12px].text-secondary-foreground`, 28 lượt).
       3. 2 dòng pháp lý ở footer — `p` KHÔNG có class nào, nên khai ở CONTAINER
          (`.text-[12px].leading-4.text-mid-alt`) và để `p` thừa hưởng.
       4. ghi chú sheet thông báo hàng về (`.ns-panel p.text-[11px]`).
       5. thẻ Cookie: 3 đoạn `p` + 3 mục `li` (span con thừa hưởng từ `li`).
       6. ghi chú khuyến mãi ở giỏ (`#promoPeek`).
     ⚠ **THÂN ACCORDION PDP ĐÃ RA KHỎI DANH SÁCH NÀY 25/08** (hook cũ số 1,
     `[data-pdp-acc] .acc-inner :is(p, div).text-\[12px\]`): mục 7 dưới đây kéo cả cụm
     accordion PDP lên **14/20**, nên nó không còn là chuyện 12/16 nữa. Điều kiện không
     chạm dòng của Inter là `1,14 × cỡ` = 15,96 ≤ 20 → 14/20 thoáng dư, F5 tự đạt.
     PHẢI GỠ chứ không để chung: hook cũ là (0,5,2), rule mục 7 là (0,4,2) — để lại thì
     hook cũ THẮNG và riêng thân accordion tuột về 12/18 trong khi nhãn đã 14/20.
     Accordion CHECKOUT (`#shipOpts`/`#ckSections`) thì GIỮ ở hook 1 — nó không nằm
     trong `[data-pdp-acc]` nên mục 7 không với tới, và nó vẫn ở cỡ 12.
     Vì sao thắng skin-mt mà không cần `!important`: blanket của nó là
     `:where(.leading-4, .leading-6) { line-height: 16px }` — (0,1,1) và khai SAU
     blanket cỡ, nên `leading-4` mới là thứ kéo về 16. Mọi hook dưới đây từ (0,3,1)
     trở lên.
     PHẠM VI KHOÁ TRONG `skin-li`: skin-mt giữ nguyên 12/16 để còn so — với Montserrat
     đây chỉ là chuyện nhịp, không phải chuyện chạm dấu.
     KHAI GIỐNG HỆT ở index.html và desktop.html. */
  html.skin-mt.skin-li :is(#shipOpts, #ckSections) .acc-inner p.text-\[12px\],
  html.skin-mt.skin-li p.text-\[12px\].text-secondary-foreground,
  html.skin-mt.skin-li .text-\[12px\].leading-4.text-mid-alt,
  html.skin-mt.skin-li .ns-panel p.text-\[11px\],
  html.skin-mt.skin-li :is(#cookieGate, #cookieBar) p.text-\[12px\],
  html.skin-mt.skin-li :is(#cookieGate, #cookieBar) li.text-\[12px\],
  html.skin-mt.skin-li #promoPeek p.text-\[12px\] {
    font-size: 12px; line-height: 18px;
  }

  /* 7 — CỤM ACCORDION PDP: MỘT CỠ 14, KHÔNG CHỮ HOA, NHÃN NHÍCH MỘT NẤC ĐẬM.
     Lệnh user 25/08: *"Trong pdp ở skin-li, các accordions sẽ không uppercase toàn bộ,
     chỉ tăng font lên 14, tăng nhẹ font weight là được"*.
     Đây là quyết định mà khối này trước đây CỐ Ý không lấy của Maika (ghi ở đầu khối:

     ⚠ CẬP NHẬT CUỐI NGÀY 25/08 — lệnh user *"nội dung bên trong accordions sẽ là font
     size 12, title accordions giữ ở 14"*, phạm vi chốt "cả demo, mọi bộ da". NỘI DUNG hạ
     14 -> **12/18**, nhãn GIỮ 14/20 · 500 · chữ thường. Dòng lấy **18 chứ không phải 16**:

     quyết, không phải hook mục 5 — chỉ là hai chỗ nay cùng số.)
     Bảng thông số pdp2 cũng theo 12/18 vì nằm chung `:is(div, p, span)`; nếu muốn trả hàng
     thông số về 12/16 (một dòng, không xuống dòng → 1,33) thì tách `span` ra một rule.

     ⚠ `500` + CHỮ THƯỜNG LÀ NGOẠI LỆ, không phải sơ suất. §1.1 khai `500` và `chữ hoa`
     là cặp không tách rời. Ngoại lệ này đã có tiền lệ ghi danh: Maika mang đúng cặp
     `500` chữ thường ở chính cụm này (chốt 25/08), và trong CHÍNH bộ da gốc thì trigger
     accordion ở **footer** (14/21 · 500) và ở **giỏ hàng** (14/20 · 500) vốn đã là 500
     chữ thường từ trước — tức cụm PDP mới là chỗ lệch, không phải chỗ này.

     ĐO TRƯỚC KHI SỬA (skin-li): nhãn `12/16 · 500 · HOA` ở 5 bản, `14/20 · 500 · HOA` ở
     riêng pdp3; nội dung `12/18` (mục 5 vừa kéo lên) trừ bảng thông số pdp2 còn `12/16`.
     Tức lệnh này gom **3 mức khác nhau về 1**.

     VÌ SAO PHẢI KHAI CẢ 2 NHÁNH `[data-screen="pdp3"]`: rule pdp3 của `skin-mt` là
     (0,4,2) — ĐÚNG BẰNG nhánh chung ở đây — và nó khai SAU trong file, nên cùng
     specificity thì nó thắng. Với `font-size`/`line-height` thì vô hại (cùng 14/20),
     nhưng thiếu nhánh này là để một rule của bộ da khác quyết số của bộ da mình; thêm
     nhánh cho lên (0,5,2) là hết phụ thuộc thứ tự khai. Maika làm y vậy.

     `:is(div, p, span)` cho phần nội dung, KHÔNG phải `> div`: 2 file dựng ruột

     hàng thông số `<span>`. Một selector phủ cả hai thì rule khai giống hệt được ở 2
     file. Kèm theo: **bảng thông số lên 14 luôn** (mục 5 trước đây cố ý bỏ `span` để
     không đổi nhịp bảng — nay cả cụm cùng một cỡ nên không còn lý do chừa).

     BÁM `[data-pdp-acc]` chứ không `.acc` trơn: accordion FOOTER cũng là `.acc.border-b`
     và nằm chung màn, còn accordion GIỎ/CHECKOUT thì ở màn khác — cả ba đều không được
     trúng. Móc `[data-pdp-acc]` gắn ở cụm tab của cả 6 bản PDP nên một rule phủ hết.
     HỆ QUẢ: sau lượt này 6 bản PDP của `skin-li` không còn khác nhau ở cụm accordion —
     kể cả pdp3 (vốn là bản duy nhất ở cỡ 14) và pdp2 (bảng thông số). Muốn giữ pdp3

     KHAI GIỐNG HỆT ở index.html và desktop.html. */
  html.skin-mt.skin-li [data-pdp-acc] .acc-trigger > span:first-child,
  html.skin-mt.skin-li [data-screen="pdp3"] [data-pdp-acc] .acc-trigger > span:first-child {
    font-size: 14px; line-height: 20px; font-weight: 500; text-transform: none;

  html.skin-mt.skin-li [data-pdp-acc] .acc-inner :is(div, p, span),
  html.skin-mt.skin-li [data-screen="pdp3"] [data-pdp-acc] .acc-inner :is(div, p, span) {
    font-size: 12px; line-height: 18px; font-weight: 400; text-transform: none;

     MYTHERESA" bên dưới, cùng lượt khách chốt cặp font. */

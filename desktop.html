(() => {
  const bar = document.getElementById('cookieBar');
  const md  = document.getElementById('cookiePrefs');
  const panel = md.querySelector('.cp-panel');
  const sws = [...md.querySelectorAll('[data-cg-cat]')];

  const openBar  = () => { bar.classList.add('open'); bar.setAttribute('aria-hidden', 'false'); };
  const closeBar = () => { bar.classList.remove('open'); bar.setAttribute('aria-hidden', 'true'); };
  const openMD = () => {
    md.classList.remove('pointer-events-none'); md.setAttribute('aria-hidden', 'false');
    md.querySelector('.cp-backdrop').classList.remove('opacity-0');
    panel.classList.remove('translate-y-full');
    lockBodyScroll();
  };
  const closeMD = () => {
    md.querySelector('.cp-backdrop').classList.add('opacity-0');
    panel.classList.add('translate-y-full');
    md.classList.add('pointer-events-none');
    unlockBodyScroll();
    setTimeout(() => md.setAttribute('aria-hidden', 'true'), 300);
  };

  const setAll = on => sws.forEach(s => { if (s.getAttribute('aria-disabled') !== 'true') s.setAttribute('aria-checked', String(on)); });
  const chosen = () => sws.filter(s => s.getAttribute('aria-checked') === 'true').length;

  sws.forEach(s => s.addEventListener('click', () => {
    if (s.getAttribute('aria-disabled') === 'true') { toast('Cookie cần thiết luôn bật, không thể tắt'); return; }
    s.setAttribute('aria-checked', s.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
  }));
  /* 2 lối mở modal: nút "Tùy chọn Cookie" ở cụm nút và chữ cùng tên trong đoạn
     cuối thẻ */
  bar.querySelectorAll('[data-cg-prefs]').forEach(b => b.addEventListener('click', openMD));
  /* Link "tại đây" -> trang chính sách. Demo chỉ có route 'privacy' (Chính sách
     bảo mật) nên tạm trỏ vào đó; khi có trang "Chính sách bảo vệ dữ liệu cá
     nhân" thật thì đổi route ở đây. Khác mobile: thẻ desktop không chặn trang
     nên GIỮ NGUYÊN thẻ khi chuyển màn — đọc chính sách xong chọn tiếp tại chỗ. */
  bar.querySelector('[data-cg-privacy]').addEventListener('click', () => go('privacy'));
  md.querySelector('[data-cp-close]').addEventListener('click', closeMD);
  md.querySelector('.cp-backdrop').addEventListener('click', closeMD);
  /* Chấp nhận / từ chối tất cả chỉ còn ở thẻ (modal nay chỉ có nút Lưu) — vẫn
     quét cả 2 khối để thêm nút ở đâu cũng chạy */
  document.querySelectorAll('#cookieBar [data-cg-all], #cookiePrefs [data-cg-all]').forEach(b =>
    b.addEventListener('click', () => { setAll(true); closeMD(); closeBar(); toast('Đã chấp nhận tất cả Cookie'); }));
  /* Từ chối tất cả = tắt hết nhóm tuỳ chọn, chỉ giữ nhóm cần thiết đang khoá */
  document.querySelectorAll('#cookieBar [data-cg-none], #cookiePrefs [data-cg-none]').forEach(b =>
    b.addEventListener('click', () => { setAll(false); closeMD(); closeBar(); toast('Đã từ chối Cookie không cần thiết'); }));
  md.querySelector('[data-cg-save]').addEventListener('click', () => {
    const n = chosen(); closeMD(); closeBar();
    toast(n === sws.length ? 'Đã chấp nhận tất cả Cookie' : `Đã lưu lựa chọn Cookie · ${n}/${sws.length} nhóm`);
  });

  localizeNew(bar); localizeNew(md);
  setTimeout(openBar, 700);
})();

    box.innerHTML = `
      ${opts.length > 8 ? `
      <label class="flex items-center gap-2 h-10 px-3 border-b border-border shrink-0">
        <span class="w-4 h-4 flex items-center justify-center shrink-0 [&_svg]:w-4 [&_svg]:h-4">${I.search}</span>
        <input data-pk-search type="search" placeholder="Tìm kiếm" autocomplete="off"
               class="flex-1 min-w-0 outline-none text-[14px] leading-5 text-foreground placeholder:text-muted-foreground"
               style="background:transparent;border:0;padding:0;-webkit-appearance:none;appearance:none">
      </label>` : ''}
      <div data-pk-rows class="flex-1 min-h-0 overflow-y-auto no-scrollbar"></div>`;
    const rows = box.querySelector('[data-pk-rows]');
    const search = box.querySelector('[data-pk-search]');

    const paint = () => {
      const raw = search ? search.value.trim() : '';
      const q = norm(raw);
      const shown = q ? opts.filter(o => norm(o).includes(q)) : opts;
      rows.innerHTML = shown.length ? shown.map(o => `
        <button type="button" role="option" aria-selected="${o === current}" data-pk-opt="${o}"
                class="w-full min-h-11 flex items-center gap-2 px-3 py-2 text-left transition-colors press ${o === current ? 'bg-secondary' : 'ghost-hover'}">
          <span class="flex-1 min-w-0 text-[14px] leading-5 text-foreground">${highlightMatch(o, raw)}</span>
          ${o === current ? tick : ''}
        </button>`).join('')
        : '<p class="px-3 py-4 text-[14px] leading-5 text-muted-foreground">Không tìm thấy kết quả</p>';
      rows.querySelectorAll('[data-pk-opt]').forEach(b => b.addEventListener('click', () => {
        const v = b.dataset.pkOpt;
        close();
        cb(v);
      }));
      rows.scrollTop = 0;
      localizeNew(rows);
    };
    if (search) search.addEventListener('input', paint);
    paint();
    wrap.appendChild(box);
    localizeNew(box);   // placeholder "Tìm kiếm"; tên địa giới không có trong I18N nên giữ nguyên
    btn.setAttribute('aria-expanded', 'true');
    const caret = wrap.querySelector('[data-pick-caret]');
    if (caret) caret.style.transform = 'translateY(-50%) rotate(180deg)';
    if (search) search.focus();
    cur = { wrap, btn, box };
  };
  window.__openPickDD = openDD;
})();

/* Popup đăng nhập nhanh nằm ngoài .screen nên wire() không chạm tới */
wirePasswordToggles(document.getElementById('loginPop'));

wireFilter();

/* ── Khởi động: nhận trạng thái từ bản kia (nếu vừa đổi bản qua mốc 768) ──
   RESP dựng ở <head>. Khi trang đang bị chuyển sang file kia thì KHÔNG dựng
   màn hình nào nữa — đỡ vẽ thừa một trang sắp bị bỏ.
   Ngôn ngữ/phông lặp lại đúng các bước của nút trong bảng Cài đặt, chỉ bỏ
   toast vì đây là khôi phục trạng thái chứ không phải người dùng vừa bấm.
   Đặt LANG trước go() nên nhãn đổi ngôn ngữ trên header desktop (render theo
   LANG) cũng ra đúng chiều, không cần sửa tay. */
if (!RESP.swapped) {
  const st = RESP.read();

  if (st.lang === 'en') {
    applyLang(document.body, 'en');
    LANG = 'en';
    document.querySelectorAll('#settingsPanel [data-lang]').forEach(x => {
      x.className = 'langopt flex-1 h-8 rounded-full text-[13px] leading-5 transition-colors press '
        + (x.dataset.lang === 'en' ? 'bg-background text-foreground font-medium shadow-sm' : 'text-muted-foreground');
    });
  }

  if (st.theme) applyTheme(st.theme);

  const f = FONTS.find(x => x[0] === st.font);
  if (f) {
    currentFont = f[0];
    document.documentElement.style.setProperty('--font-app', f[2]);
    document.documentElement.classList.add('font-override');
    document.querySelectorAll('#settingsPanel [data-font]').forEach(x =>
      x.querySelector('.fo-tick').classList.toggle('opacity-0', x.dataset.font !== f[0]));
  }

  /* hasOwnProperty chứ không phải RENDER[...] trực tiếp: hash là dữ liệu ngoài,
     mà key kế thừa từ Object.prototype (#screen=__proto__, =constructor) cũng
     "truthy" — lọt vào go() là ném lỗi giữa boot, trang trắng và mất luôn
     RESP.watch() bên dưới (hết chuyển bản khi kéo cửa sổ). */
  const first = Object.prototype.hasOwnProperty.call(RENDER, st.screen) ? st.screen : 'plp';
  window.history.replaceState({ screen: first }, '');
  /* fromPopstate: chặn go() push thêm một entry TRÙNG với replaceState vừa rồi
     — nếu không, mỗi lần tải trang để lại 2 entry cùng state và cú bấm back
     đầu tiên không làm gì (go() thoát sớm vì name === current). */
  go(first, { fromPopstate: true });

  /* Hash chỉ là kênh chuyển giao MỘT LẦN — dọn ngay sau khi nhận, để lát nữa
     người dùng đi sang màn khác rồi tải lại trang thì không bị kéo ngược về
     màn cũ. Bọc try vì một số trình duyệt chặn đổi URL trên file://. */
  if (location.hash) {
    try { window.history.replaceState({ screen: first }, '', location.pathname + location.search); } catch (e) {}
  }

  /* Thu cửa sổ hẹp < 768 -> sang bản mobile, mang theo màn + cài đặt */
  RESP.watch(() => [current, LANG, currentFont, currentTheme]);
}
</script>

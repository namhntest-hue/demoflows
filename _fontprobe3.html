<title>probe3</title>
<pre id="out" style="font:11px monospace;white-space:pre-wrap">…</pre>
<script>
const ALL=["Montserrat","Playfair Display","Cormorant Garamond","EB Garamond","Lora","Newsreader",
"Fraunces","Spectral","Crimson Pro","Libre Bodoni","Petrona","Literata","Source Serif 4",
"Noto Serif Display","Vollkorn","Faustina","Bitter","Old Standard TT","Yeseva One","Prata",
"Inter","Mona Sans","Manrope","Mulish","Work Sans","Public Sans","Be Vietnam Pro","Archivo","Geist",
"Epilogue","Plus Jakarta Sans","Lexend","Raleway","Nunito Sans","Chivo","Familjen Grotesk",
"Hanken Grotesk","Wix Madefor Text","Bricolage Grotesque","Josefin Sans"];
const B=+(new URLSearchParams(location.search).get("b")||0);
const FAM=ALL.slice(B*14,B*14+14);
FAM.forEach(f=>{const l=document.createElement("link");l.rel="stylesheet";
 l.href="https://fonts.googleapis.com/css2?family="+f.replace(/ /g,"+")+"&display=block";
 document.head.appendChild(l);});
const cv=document.createElement("canvas");cv.width=600;cv.height=400;
const cx=cv.getContext("2d",{willReadFrequently:true});
function sig(font,ch){cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle="#000";
 cx.textBaseline="alphabetic";cx.font=font;cx.fillText(ch,40,300);
 const d=cx.getImageData(0,0,600,400).data;let n=0,sx=0,sy=0;
 for(let i=0;i<d.length;i+=4){if(d[i+3]>110){n++;sx+=(i/4)%600;sy+=Math.floor((i/4)/600);}}
 return n+":"+sx+":"+sy;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{
 const res={};
 for(const fam of FAM){
  let ok=false;
  for(let k=0;k<10;k++){
   try{await document.fonts.load("400 100px '"+fam+"'","ếđ₫0123");}catch(e){}
   cx.font="400 100px '"+fam+"'";const w1=cx.measureText("ế").width;
   cx.font="400 100px '__nope__'";const w2=cx.measureText("ế").width;
   if(Math.abs(w1-w2)>0.5){ok=true;break;} await sleep(400);
  }
  const fb=sig("400 200px '__nope__'","₫"), me=sig("400 200px '"+fam+"'","₫");
  const fb2=sig("400 200px '__nope__'","đ"), me2=sig("400 200px '"+fam+"'","đ");
  res[fam]={vn_ok:ok,dong:me!==fb,dbar:me2!==fb2};
 }
 window.__R=res;document.title="done";
 document.getElementById("out").textContent=JSON.stringify(res);
})();
</script>

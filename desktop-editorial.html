        <label class="flex items-center gap-3 min-h-10 bg-secondary rounded-xs p-2">
          <span class="w-5 h-5 flex items-center justify-center shrink-0 [&_svg]:w-4 [&_svg]:h-4">${I.search}</span>
          <input id="pkSearch" type="search" placeholder="Tìm kiếm" autocomplete="off" enterkeyhint="search"
                 class="flex-1 min-w-0 outline-none text-[14px] leading-6 font-light text-foreground placeholder:text-muted-foreground"
                 style="background:transparent;border:0;padding:0;-webkit-appearance:none;appearance:none">
          <button id="pkClear" type="button" class="shrink-0 text-[14px] leading-5 text-muted-foreground press" style="display:none">Xóa</button>
        </label>
      </div>
      <div id="pkList" class="flex-1 min-h-0 overflow-y-auto no-scrollbar"></div>
      <div class="safe-b"></div>
    </div>
  </div>`);
(() => {
  const pk = document.getElementById('pickSheet');
  const panel = pk.querySelector('.pk-panel');
  const list = pk.querySelector('#pkList');
  const search = pk.querySelector('#pkSearch');
  const clear = pk.querySelector('#pkClear');
  let onPick = null, allOpts = [], curVal = '';

  /* Bỏ dấu + đ→d để gõ "da nang" vẫn ra "TP. Đà Nẵng" — người dùng hiếm khi
     gõ đủ dấu khi đang điền địa chỉ trên điện thoại. */
  const norm = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                     .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();

  const tick = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="shrink-0"><path d="m3 8.5 3 3 7-7" stroke="var(--general-primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const paintList = () => {
    const raw = search.value.trim();
    const q = norm(raw);
    const shown = q ? allOpts.filter(o => norm(o).includes(q)) : allOpts;
    clear.style.display = raw ? '' : 'none';
    list.innerHTML = shown.length ? shown.map(o => `
      <button class="w-full min-h-[52px] flex items-center gap-2 px-4 py-4 press text-left transition-colors ${o === curVal ? 'bg-secondary' : ''}" data-pk-opt="${o}">
        <span class="flex-1 min-w-0 text-[14px] font-medium leading-5 text-foreground">${highlightMatch(o, raw)}</span>
        ${o === curVal ? tick : ''}
      </button>`).join('')
      : '<p class="px-4 py-6 text-[14px] leading-5 text-muted-foreground">Không tìm thấy kết quả</p>';
    list.querySelectorAll('[data-pk-opt]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.pkOpt;
      closePK();
      if (onPick) onPick(v);
    }));
    list.scrollTop = 0;
    localizeNew(list);
  };
  search.addEventListener('input', paintList);
  clear.addEventListener('click', () => { search.value = ''; paintList(); search.focus(); });

  const closePK = () => {
    pk.querySelector('.pk-backdrop').classList.add('opacity-0');
    panel.classList.add('translate-y-full');
    pk.classList.add('pointer-events-none');
    unlockBodyScroll();
    setTimeout(() => pk.setAttribute('aria-hidden', 'true'), 300);
  };
  const openPK = (title, opts, current, cb) => {
    onPick = cb; allOpts = opts; curVal = current || '';
    pk.querySelector('#pkTitle').textContent = title;
    search.value = '';        // mỗi lần mở là danh sách đầy đủ, không dính từ khoá cũ
    paintList();
    localizeNew(panel);   // cả tiêu đề + placeholder; tên địa giới không có trong I18N nên giữ nguyên
    pk.classList.remove('pointer-events-none'); pk.setAttribute('aria-hidden', 'false');
    pk.querySelector('.pk-backdrop').classList.remove('opacity-0');
    panel.classList.remove('translate-y-full');
    lockBodyScroll();
  };
  pk.querySelector('.pk-backdrop').addEventListener('click', closePK);
  pk.querySelector('#pkClose').addEventListener('click', closePK);
  window.__openPicker = openPK;
})();

/* Popup đăng nhập nhanh nằm ngoài .screen nên wire() không chạm tới */
wirePasswordToggles(document.getElementById('loginPop'));

wireFilter();

/* ── Khởi động: nhận trạng thái từ bản kia (nếu vừa đổi bản qua mốc 768) ──
   RESP dựng ở <head>. Khi trang đang bị chuyển sang file kia thì KHÔNG dựng
   màn hình nào nữa — đỡ vẽ thừa một trang sắp bị bỏ.
   Ngôn ngữ/phông lặp lại đúng các bước của nút trong bảng Cài đặt, chỉ bỏ
   toast vì đây là khôi phục trạng thái chứ không phải người dùng vừa bấm.
   Đặt LANG trước go() nên nhãn đổi ngôn ngữ trên header desktop (render theo
   LANG) cũng ra đúng chiều, không cần sửa tay. */
if (!RESP.swapped) {
  const st = RESP.read();

  if (st.lang === 'en') {
    applyLang(document.body, 'en');
    LANG = 'en';
    document.querySelectorAll('#settingsPanel [data-lang]').forEach(x => {
      x.className = 'langopt flex-1 h-8 rounded-full text-[13px] leading-5 transition-colors press '
        + (x.dataset.lang === 'en' ? 'bg-background text-foreground font-medium shadow-sm' : 'text-muted-foreground');
    });
  }

  if (st.theme) applyTheme(st.theme);

  const f = FONTS.find(x => x[0] === st.font);
  if (f) {
    currentFont = f[0];
    document.documentElement.style.setProperty('--font-app', f[2]);
    document.documentElement.classList.add('font-override');
    document.querySelectorAll('#settingsPanel [data-font]').forEach(x =>
      x.querySelector('.fo-tick').classList.toggle('opacity-0', x.dataset.font !== f[0]));
  }

  /* hasOwnProperty chứ không phải RENDER[...] trực tiếp: hash là dữ liệu ngoài,
     mà key kế thừa từ Object.prototype (#screen=__proto__, =constructor) cũng
     "truthy" — lọt vào go() là ném lỗi giữa boot, trang trắng và mất luôn
     RESP.watch() bên dưới (hết chuyển bản khi kéo cửa sổ). */
  const first = Object.prototype.hasOwnProperty.call(RENDER, st.screen) ? st.screen : 'plp';
  window.history.replaceState({ screen: first }, '');
  /* fromPopstate: chặn go() push thêm một entry TRÙNG với replaceState vừa rồi
     — nếu không, mỗi lần tải trang để lại 2 entry cùng state và cú bấm back
     đầu tiên không làm gì (go() thoát sớm vì name === current). */
  go(first, { fromPopstate: true });

  /* Hash chỉ là kênh chuyển giao MỘT LẦN — dọn ngay sau khi nhận, để lát nữa
     người dùng đi sang màn khác rồi tải lại trang thì không bị kéo ngược về
     màn cũ. Bọc try vì một số trình duyệt chặn đổi URL trên file://. */
  if (location.hash) {
    try { window.history.replaceState({ screen: first }, '', location.pathname + location.search); } catch (e) {}
  }

  /* Thu cửa sổ hẹp < 768 -> sang bản mobile, mang theo màn + cài đặt */
  RESP.watch(() => [current, LANG, currentFont, currentTheme]);
}
</script>
</body>
</html>

/* Card sản phẩm — Card-item của Figma (2541:175787)
   giá bán #d62845 Medium 14/20 + badge -%% nền #fef2f2 · giá gốc gạch ngang #737373
   Dùng chung cho: grid PLP, hàng gợi ý PDP, "Show more". */
function productCard(p, i, { w = '', badge = '', noColors = false, pillBadges = null } = {}) {
  /* 28/08 (port chốt 27/08 của bản chuẩn): 'Pre-order' THÔI làm nhãn đè ảnh —
     nó xuống đứng trước TÊN, cùng hàng. Chặn một chỗ nên mọi nơi gọi vẫn
     truyền badge như cũ. Nhãn khác (New Season…) vẫn đè ảnh bình thường. */
  if (badge === 'Pre-order') badge = '';
  return `
  <div class="bg-card flex flex-col cursor-pointer group ${w}" data-product="${i}">
    <div class="relative w-full overflow-hidden bg-secondary" style="aspect-ratio:189/252">
      <img src="${A}${p.img}" alt="${p.name}" class="absolute inset-0 w-full h-full object-cover lazy">
      ${(() => {
        // Frame 427319869: chồng dọc gap 4, cách mép trên 8 / sát trái;
        // mỗi nhãn px 4, chữ Medium 12/16 #0a0a0a, nền trắng 90%
        const tags = [...(badge ? [badge] : []), ...(pillBadges || [])];
        return tags.length ? `
      <div class="pc-badges absolute top-2 left-0 flex flex-col items-start gap-1">
        ${tags.map(b => `<span class="px-1 text-[12px] font-medium leading-4 text-foreground" style="background:rgba(255,255,255,.9)">${b}</span>`).join('')}
      </div>` : '';
      })()}
      <button class="quick-add press" data-quick="${i}" aria-label="Thêm nhanh vào giỏ"
        style="display:flex;min-width:36px;min-height:36px;padding:var(--spacing-2);justify-content:center;align-items:center;position:absolute;right:8px;bottom:8px;border-radius:var(--radius-infinite);border:1px solid var(--general-border);background:rgba(255,255,255,.9);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m21,6h-3c0-3.309-2.691-6-6-6s-6,2.691-6,6h-3c-1.654,0-3,1.346-3,3v10.5c0,2.481,2.019,4.5,4.5,4.5h12c.276,0,.5-.224.5-.5s-.224-.5-.5-.5H4.5c-1.93,0-3.5-1.57-3.5-3.5v-10.5c0-1.103.897-2,2-2h3v3.5c0,.276.224.5.5.5s.5-.224.5-.5v-3.5h10v3.5c0,.276.224.5.5.5s.5-.224.5-.5v-3.5h3c1.103,0,2,.897,2,2v7.5c0,.276.224.5.5.5s.5-.224.5-.5v-7.5c0-1.654-1.346-3-3-3Zm-14,0c0-2.757,2.243-5,5-5s5,2.243,5,5H7Zm17,13.5c0,.276-.224.5-.5.5h-3.5v3.5c0,.276-.224.5-.5.5s-.5-.224-.5-.5v-3.5h-3.5c-.276,0-.5-.224-.5-.5s.224-.5.5-.5h3.5v-3.5c0-.276.224-.5.5-.5s.5.224.5.5v3.5h3.5c.276,0,.5.224.5.5Z" fill="var(--general-primary)"/></svg>
      </button>
    </div>
    <div class="flex flex-col px-1 py-2">
      <div class="flex flex-col gap-0.5 pb-2">
        <p class="pc-brand text-[14px] font-medium leading-5 text-foreground truncate">${p.brand}</p>
        <!-- BADGE PRE-ORDER ĐỨNG TRƯỚC TÊN (port 28/08 từ bản chuẩn, chốt 27/08):
             nhãn chiến dịch thuộc về ẢNH, còn Pre-order nói TÌNH TRẠNG BÁN của
             chính SKU — chỗ của nó là cạnh tên. Dùng lớp .tag-note sẵn có của
             fork (nền vàng nhạt pre-order), nhãn tiếng Việt "Đặt trước" dịch
             được qua khoá sẵn có, không cần data-i18n-skip. -->
        <div class="flex items-center gap-1.5 min-w-0">
          ${p.preorder ? `<span class="tag-note px-1 text-[12px] font-medium leading-4 shrink-0">Đặt trước</span>` : ''}
          <p class="text-[14px] leading-5 text-secondary-foreground truncate w-full min-w-0">${p.name}</p>
        </div>
      </div>
      <div class="flex flex-col pb-2">
        <!-- whitespace-nowrap: chuỗi giá có space thường trước ₫ nên flex thiếu chỗ
             là ₫ rớt xuống dòng riêng — khoá lại (port 28/08). -->
        <div class="flex gap-1 items-center">
          <p class="whitespace-nowrap text-[14px] font-medium leading-5 ${p.off ? 'text-destructive' : 'text-foreground'}">${p.price}</p>
          ${p.off ? `<span class="bg-destructive-subtle rounded-xs px-1 py-0.5 text-[12px] font-medium leading-4 text-destructive shrink-0">${p.off}</span>` : ''}
        </div>
        <p class="whitespace-nowrap text-[12px] leading-4 text-muted-foreground line-through ${p.was ? '' : 'invisible'}">${p.was || '&nbsp;'}</p>
      </div>
      ${(!noColors && p.colors && p.colors.length) ? `
      <!-- Frame 427319709: gap 8, mỗi ô 20×20 (viền 1px khi chọn) bọc chấm màu 16×16 -->
      <div class="flex gap-2 items-center pt-0.5" data-swatches>
        ${p.colors.map((c, ci) => `
          <button class="cw w-5 h-5 rounded-full shrink-0 flex items-center justify-center border transition-colors duration-200 ${ci===0 ? 'border-primary' : 'border-transparent'} press" data-cw="${ci}" title="${c.name}">
            <span class="block w-4 h-4 rounded-full ${['#ffffff','#f1f1f1','#fafafa'].includes(c.hex.toLowerCase()) ? 'border border-border-3' : ''}" style="background:${c.hex}"></span>
          </button>`).join('')}
        ${p.moreColors ? `<span class="text-[12px] leading-4 text-muted-foreground">+${p.moreColors}</span>` : ''}
      </div>` : ''}
    </div>
  </div>`;
}

/* Subheader ĐỔI THEO DEPT đang chọn — tương đương việc bấm tab Nam/Nữ/Làm đẹp

   nhau — sửa cây beauty một chỗ là cả mobile lẫn desktop đổi theo. */
function dkNavCats() {
  if (dkDept !== 'Làm đẹp') return DK_NAV_CATS;
  return MENU_DATA['Làm đẹp'].cats.map(([label, sub]) => {
    if (label === 'Thương hiệu') return { label, brands: true };

    // nhóm có cây con -> mega panel 1 cột; không có -> link phẳng (vd Sản phẩm mới)
    return sub ? { label, dept: 'Làm đẹp', sub } : { label };
  });
}

/* attrs điều hướng PLP chế độ danh mục (dùng chung với hàng menu mobile) */
const dkCatAttrs = (title, crumbs = []) =>

/* Một cột nội dung của mega panel — port 2 quyết định 18/08/2026 từ desktop.html:

   1. CẢ PANEL MỘT CỠ 14 (trước: tiêu đề 12, đường dẫn 13 — cả hai ngoài/dưới
      thang chữ). Phân cấp lo bằng WEIGHT + MÀU, không bằng cỡ chữ:
        · tiêu đề nhóm  14 MEDIUM uppercase, secondary-foreground #262626
        · đường dẫn     14 regular, foreground-alt, hover gạch chân
      UPPERCASE bằng CLASS `uppercase`, KHÔNG gõ hoa vào chuỗi: chuỗi gốc là key
      i18n ("Nam"/"Nữ"/"Thương hiệu"…), gõ hoa vào là mất bản dịch. Đây là ngoại
      lệ có chủ ý của quy ước "không dùng uppercase" — chỉ áp cho nhãn nhóm mega.

   2. BỎ HẲN dòng "Tất cả …" — mọi cột vào thẳng danh mục con. Vẫn NHẬN
      `allLabel`/`allAttrs` và data `.all` còn nguyên: bật lại tốn 1 dòng, và
      `all` còn được panel menu trượt (.ms-view → headRow) dùng nên KHÔNG được
      xoá khỏi data.

   Gạch chân khi hover do rule `.dk-mega-grid > div button:hover` lo (xem khối
   EDITORIAL LAYOUT) — bản này panel là flex-wrap chứ không phải .dk-mega-grid
   như desktop.html, nên rule đã viết lại cho đúng cây DOM ở đây. */
function dkMegaCol(title, allLabel, allAttrs, items, itemAttrs) {
  return `
  <div class="flex flex-col gap-2 min-w-[168px]">
    <p class="text-[14px] font-semibold leading-5 tracking-[0.08em] uppercase text-secondary-foreground pb-1">${title}</p>
    ${items.map(it => `<button ${itemAttrs(it)} class="text-left text-[14px] font-normal leading-5 text-foreground-alt hover:text-foreground transition-colors press">${it}</button>`).join('')}
  </div>`;
}

/* Tách mảng items có phần tử {header} thành các nhóm [{title, items}] —
   MENU_DATA khai chung với mobile (submenu 1 cột, header xen giữa), desktop
   dựng lại thành nhiều CỘT nên phải cắt theo header. */
function splitByHeader(items) {
  const out = [];
  let cur = { title: '', items: [] };
  for (const it of items) {
    if (it && it.header) { if (cur.items.length) out.push(cur); cur = { title: it.header, items: [] }; }
    else cur.items.push(it);
  }
  if (cur.items.length) out.push(cur);
  return out;
}

/* Panel mega menu cho 1 mục subheader — cột nội dung + teaser ảnh phải.
   `id` khớp với data-mega của nút tương ứng: panel render tách khỏi thanh cuộn
   nên không còn quan hệ cha-con để CSS :hover bắt được, phải nối bằng id. */
function dkMegaPanel(item, id) {
  let cols = '';
  if (item.newIn) {
    /* Sản phẩm mới — theo menu thật shop.dafc.com.vn: [Bộ sưu tập mới] + cột
       NAM + cột NỮ. Mobile bỏ tầng giới tính vì tab đã là giới tính; desktop
       GIỮ vì subheader không gắn giới tính và mọi mục khác cũng dựng 2 cột
       Nam/Nữ. Nguồn data vẫn là MENU_DATA dùng chung với mobile. */
    const subOf = dept => MENU_DATA[dept].cats.find(([lb]) => lb === 'Sản phẩm mới')[1];
    const colls = splitByHeader(subOf('Nam').items).find(g => g.title === 'Bộ sưu tập mới');
    cols = dkMegaCol('Bộ sưu tập mới', '', '', colls ? colls.items : [], it => dkCatAttrs(it, ['Sản phẩm mới']))
      + ['Nam', 'Nữ'].map(dept => {
          const sub = subOf(dept);
          const cats = splitByHeader(sub.items).find(g => g.title === 'Danh mục');
          return dkMegaCol(dept, sub.all, dkCatAttrs(sub.all, [dept, 'Sản phẩm mới']),
            cats ? cats.items : [], it => dkCatAttrs(it, [dept, 'Sản phẩm mới']));
        }).join('');
  } else if (item.brands) {
    const n = 3, split = [[], [], []];
    MENU_BRANDS.forEach((b, i) => split[i % n].push(b));
    cols = `
      ${dkMegaCol('Thương hiệu', 'Tất cả thương hiệu', 'data-nav="plp"', [], () => '')}
      ${split.map(col => `
      <div class="flex flex-col gap-2 min-w-[168px] pt-6">
        ${col.map(b => `<button data-nav="plp" class="text-left text-[13px] leading-5 text-foreground-alt hover:text-foreground transition-colors press">${b}</button>`).join('')}
      </div>`).join('')}`;
  } else if (item.beauty) {
    /* Nhánh này hiện KHÔNG mục nào trong DK_NAV_CATS dùng — "Làm đẹp" đã lên
       hàng dept dạng link phẳng. Giữ lại để bật lại panel beauty ở subheader
       chỉ bằng cách thêm { label:'Làm đẹp', beauty:true } vào DK_NAV_CATS. */
    const cats = MENU_DATA['Làm đẹp'].cats.filter(([, sub]) => sub);
    cols = cats.map(([, sub]) =>
      dkMegaCol(sub.title, sub.all, dkCatAttrs(sub.all, ['Làm đẹp', sub.title]),
        sub.items, it => dkCatAttrs(it, ['Làm đẹp', sub.title]))
    ).join('');
  } else if (item.sub) {
    /* 1 nhóm của ngành Làm đẹp — chỉ 1 cột vì ngành này không tách giới tính */
    const sub = item.sub;
    cols = dkMegaCol(sub.title, sub.all, dkCatAttrs(sub.all, [item.dept, sub.title]),
      sub.items, it => dkCatAttrs(it, [item.dept, sub.title]));
  } else if (item.cat) {
    cols = ['Nam', 'Nữ'].map(dept => {
      const hit = MENU_DATA[dept].cats.find(([lb]) => lb === item.cat);
      if (!hit || !hit[1]) return '';
      const sub = hit[1];
      return dkMegaCol(dept, sub.all, dkCatAttrs(sub.all, [dept, sub.title]),
        sub.items, it => dkCatAttrs(it, [dept, sub.title]));
    }).join('');
  } else {
    return '';
  }
  return `
  <div class="dk-mega absolute left-0 right-0 top-full bg-background border-b border-border shadow-xl z-50" data-mega="${id}">
    <div class="max-w-[1440px] mx-auto px-6 py-8 flex gap-14">
      <!-- flex-wrap: cây Làm đẹp có 8 danh mục, 1 hàng sẽ tràn 1440 -> xuống 2 hàng.
           .dk-mega-cols là HOOK cho rule hover-gạch-chân: bám vào class riêng chứ
           không bám chuỗi utility (flex-wrap...) kẻo sửa layout là đứt selector. -->
      <div class="dk-mega-cols flex-1 flex flex-wrap gap-x-14 gap-y-8">${cols}</div>
      <button ${dkCatAttrs(item.label)} class="dk-mega-teaser w-[342px] shrink-0 flex flex-col gap-2 text-left press group">
        <span class="block w-full overflow-hidden bg-secondary" style="aspect-ratio:1/1">
          <img src="${A}brand-hero.png" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-[1.03]" alt="${item.label}">
        </span>
        <span class="text-[14px] font-medium leading-5 text-foreground underline underline-offset-2">Bộ sưu tập mới</span>
      </button>
    </div>
  </div>`;
}

function navBar({ logoOnly = false, plp = false } = {}) {

      </div>
    </div>`;
  }

  /* dept trái — pad 8/16, 14px medium (component Button/Ghost). MÀU do CSS cấp
     hết (thang 3 bậc #737373 / #404040 / #0a0a0a, xem khối <style>), markup chỉ
     mang `aria-current` để state nằm đúng 1 nơi. Nền giữ ghost hover 5%. */
  /* Dựng panel 1 lần rồi dùng lại cho cả nút (data-mega) lẫn khối panel bên dưới */
  const dkCats = dkNavCats().map((item, i) => ({ item, i, panel: dkMegaPanel(item, i) }));

  /* crumbs = [dept] chứ không để rỗng: `isBeautyPlp()` nhận diện ngành hàng qua
     crumbs[0], thiếu thì bấm "Làm đẹp" ra nhầm hàng thời trang + bộ lọc sai facet. */
  /* Danh mục ĐANG XEM cho subheader — KHÔNG thêm biến state, suy từ plpMode
     (cùng cách isBeautyPlp() đang làm).
     · crumbs[1] LÀ tầng danh mục: link trong mega panel đóng dấu [dept, sub.title]
       và sub.title trùng nhãn subheader.
     · Phải xét crumbs[1] TRƯỚC title, không thì SÁNG 2 MỤC: panel "Sản phẩm mới"
       liệt kê lại chính 'Quần áo'/'Giày dép'/... làm item, bấm vào thì title là
       'Quần áo' nhưng crumbs=['Nam','Sản phẩm mới'] — đúng là chỉ sáng
       'Sản phẩm mới'.
     · crumbs=[dept] mà title===dept là nút hàng dept -> subheader không sáng gì.
     · Cờ `plp` do screenPLPList truyền: KHÔNG dùng được `current` vì go() gán nó
       SAU khi RENDER[name]() chạy, và goPlp() còn set current = null.
     KHÔNG đặt tên biến là dkCrumbs — đó là TÊN HÀM breadcrumb, che mất là vỡ.
     CHƯA PHỦ (chấp nhận): 'Thương hiệu' — nút brand trong panel chỉ có
     data-nav="plp" trơn nên goPlp ra type:'brand', không mang title/crumbs. */
  const curCrumbs = plpMode.crumbs || [];
  const dkCurCat = (!plp || plpMode.type !== 'category') ? ''
    : curCrumbs.length >= 2 ? curCrumbs[1]
    : curCrumbs.length === 1
      ? (curCrumbs[0] === plpMode.title ? ''
         : (DK_DEPTS.includes(curCrumbs[0]) ? (plpMode.title || '') : curCrumbs[0]))
      : (plpMode.title || '');

  const dept = DK_DEPTS.map(d => `
    <button ${dkCatAttrs(d, [d])} data-dkdept="${d}"${d === dkDept ? ' aria-current="true"' : ''} class="dk-dept ghost-hover h-9 px-4 rounded-xs flex items-center text-[14px] leading-5 transition-colors press">${d}</button>`).join('');

  return `
  <div class="navbar sticky top-[-32px] z-50">
    <!-- scrim Farfetch: position fixed nên đặt đầu khối, không ảnh hưởng layout -->
    <div class="dk-scrim" aria-hidden="true"></div>
    <!-- promo bar #262626 (Frame 42) — dùng lại slider PROMO_MESSAGES của mobile -->
    <div class="h-8 overflow-hidden relative" style="background:var(--surface-dark)">
      <div id="promoSlider" class="flex h-full transition-transform ease-in-out" style="transition-duration:.5s">
        ${PROMO_MESSAGES.map(msg => `

            <span class="text-[14px] font-medium leading-5 text-primary-foreground text-center truncate">${msg}</span>
          </div>`).join('')}
      </div>
    </div>

    <!-- main nav (Nav 1440×60): dept trái · logo giữa · tiện ích phải
         Figma Nav không có viền dưới — chỉ giữ 1 hairline ở đáy cả khối (.navbar::after) -->
    <div class="glass-95 backdrop-blur-[7.5px]">
      <div class="max-w-[1440px] mx-auto h-[60px] px-2 flex items-center">
        <div class="flex-1 flex items-center justify-start">${dept}</div>
        <img src="${A}logo.png" alt="DAFC" class="h-5 w-[93px] object-contain cursor-pointer press shrink-0" data-nav="plp">
        <!-- Cụm tiện ích LẤY THEO LAYOUT desktop.html (yêu cầu user 18/08/2026):
             nút TÌM KIẾM dời từ subheader lên đây và đứng ĐẦU cụm · nút ngôn ngữ
             rút thành CỜ + mã 3 chữ (dkLangChip) · BỎ nút "Danh sách cửa hàng".
             Khác desktop.html một điểm: bản chính còn ô nhập tìm kiếm đè lên cả
             hàng nav (#dkNavSearchField, kiểu stradivarius) — bản này giữ cơ chế
             sẵn có là mở layer tìm kiếm phủ trang (#dkSearchLayer), nên nút chỉ
             cần gọi __openDkSearch như cũ. -->
        <div class="flex-1 flex items-center justify-end px-0.5">
          <button id="dkSearchBtn" class="ghost-hover w-11 h-11 rounded-xs flex items-center justify-center press [&_svg]:w-4 [&_svg]:h-4" aria-label="Tìm kiếm">${I.search}</button>
          <button data-dklang class="ghost-hover h-9 px-3 rounded-xs flex items-center gap-2 text-[14px] font-medium leading-5 text-mid-alt transition-colors press" aria-label="Đổi ngôn ngữ">${dkLangChip()}</button>

          <button data-nav="cart" class="ghost-hover w-11 h-11 rounded-xs flex items-center justify-center press relative [&_svg]:w-4 [&_svg]:h-4" aria-label="Giỏ hàng">
            ${I.bag}
            <span class="cart-badge absolute top-1.5 right-1 min-w-[15px] h-[15px] px-1 rounded-full bg-destructive text-primary-foreground text-[9px] font-bold flex items-center justify-center">${cartQty}</span>
          </button>
        </div>
      </div>
    </div>

    <!-- subheader (1440×52): category nav + mega menu + search.
         Nút giữ ĐÚNG size Figma (Button/Ghost Muted/Regular: h-36, padding 8/16
         = h-9 px-4). Ngành Làm đẹp có 11 mục nên tràn -> thanh cuộn ngang +
         2 mũi tên kiểu Farfetch, KHÔNG bóp padding nút. Mega panel render NGOÀI
         thanh cuộn (sibling) vì overflow-x sẽ cắt mất panel nếu để bên trong. -->
    <div class="dk-sub glass-95 backdrop-blur-[7.5px] relative">
      <!-- Cao 72 (chốt 18/08/2026, yêu cầu user — trước là 52), ÁP CHO MỌI BỘ DA
           nên đổi ở markup base chứ không nhét vào khối bộ da nào.
           Nút danh mục vẫn h-9 (36px) nên chỉ thoáng thêm; nhưng header cao thêm
           20px thì MỌI offset sticky canh theo đáy header phải dịch theo — xem
           khối "OFFSET STICKY CANH THEO ĐÁY HEADER" trong <style>. -->
      <div id="dkSubRow" class="max-w-[1440px] mx-auto h-[72px] px-2 flex items-center justify-between gap-4">
        <!-- Mũi tên là OVERLAY ở 2 mép (kiểu Farfetch), không nằm trong luồng:
             ẩn/hiện chúng không đổi bề rộng thanh cuộn nên danh mục không bị
             nhảy khi cuộn. Mỗi bên chỉ hiện khi hướng đó CÒN nội dung. -->
        <nav class="flex-1 min-w-0 relative flex items-center h-full">
          <div class="dk-nav-strip flex-1 min-w-0 flex items-center h-full overflow-x-auto no-scrollbar">
            ${dkCats.map(({ item, i, panel }) => `
            <div class="dk-nav-item h-full flex items-center shrink-0"${panel ? ` data-mega="${i}"` : ''}>
              <button ${item.dept ? dkCatAttrs(item.label, [item.dept]) : dkCatAttrs(item.label)}${dkCurCat && item.label === dkCurCat ? ' aria-current="page"' : ''} class="dk-nav-link btn-gm h-9 px-4 rounded-xs flex items-center text-[14px] font-medium leading-5 whitespace-nowrap press transition-colors ${item.sale ? 'text-destructive' : ''}">${item.label}</button>

          <div data-nav-next-wrap class="hidden absolute right-0 top-0 bottom-0 z-10 items-center pl-8"

          </div>

      </div>
      <!-- Mega panel: sibling của hàng nav (không nằm trong .dk-nav-strip có
           overflow-x). Vẫn absolute top-full bám .dk-sub nên rơi đúng dưới
           subheader như cũ. JS nối nút <-> panel qua data-mega. -->
      ${dkCats.map(({ panel }) => panel).join('')}
    </div>
  </div>`;
}

/* PLP đang ở ngành hàng Làm đẹp? — quyết định lọc sản phẩm và bộ lọc nào hiện */
const isBeautyPlp = () => plpMode.type === 'category' && (plpMode.crumbs || [])[0] === 'Làm đẹp';

/* GIỚI TÍNH của PLP đang đứng — nhận qua ĐÚNG chỗ isBeautyPlp() nhận ngành hàng:
   crumbs[0] là dept. null ở PLP thương hiệu / tìm kiếm → cây ĐỦ. (26/08 #4) */
const plpGender = () => {
  const d = plpMode.type === 'category' ? (plpMode.crumbs || [])[0] : null;
  return d === 'Nam' || d === 'Nữ' ? d : null;
};

   duy nhất là NGỮ CẢNH GIỚI TÍNH NỮ. Bảng của khách ghi "chỉ áp dụng vs GIÀY NỮ" nên
   hàng nam và ngành làm đẹp vẫn không có mục này.
   Trước đó mục này còn ràng theo nhánh Giày dép (breadcrumb) và tự hiện/ẩn khi tick
   cate Giày dép trong panel — ĐÃ GỠ cả hai cùng lượt, kèm `syncHeelSection()`,
   `SHOE_BRANCH_LABELS` và `data-cat-name` vốn chỉ tồn tại để phục vụ cơ chế đó. */
const heelSection = () => plpGender() === 'Nữ' && !isBeautyPlp();

/* Danh sách sản phẩm theo chế độ PLP (giữ index gốc cho router PDP/quick-add) */
function plpProducts() {
  const all = PRODUCTS.map((p, i) => ({ p, i }));
  if (plpMode.type === 'search') {   // tìm kiếm quét cả 2 ngành hàng
    const q = (plpMode.query || '').trim().toLowerCase();
    return q ? all.filter(({ p }) => `${p.brand} ${p.name}`.toLowerCase().includes(q)) : all;
  }
  const beauty = isBeautyPlp();
  return all.filter(({ p }) => (p.dept === 'beauty') === beauty);
}

/* ════════════════════════════════════════════════════════════════

   04 no-result ("Không tìm thấy kết quả" + Sản phẩm nổi bật)

let searchQuery = '';
let searchTab = 0;
let searchHistory = ['Áo sơ mi', 'Túi xách da', 'Versace loafer', 'Đầm dạ hội', 'Giày thể thao'];

function highlightMatch(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + `<span class="font-medium">${text.slice(idx, idx + q.length)}</span>` + text.slice(idx + q.length);
}

function searchSuggestions(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return [];
  const pool = [];
  PRODUCTS.forEach(p => { pool.push(p.brand); pool.push(p.name); });
  return [...new Set(pool)].filter(s => s.toLowerCase().includes(needle)).slice(0, 6);
}

function searchSuggestHTML() {
  const q = searchQuery.trim();
  const sug = searchSuggestions(q);
  return `

    <h2 class="px-4 text-[12px] leading-4 text-muted-foreground">Gợi ý</h2>

    </ul>` : `<p class="px-4 py-3 text-[14px] leading-5 font-medium text-foreground">Không tìm thấy kết quả</p>`}

}

function searchHistoryHTML() {
  if (!searchHistory.length) return '';
  return `
  <section class="flex flex-col py-4">
    <h2 class="px-4 py-2 text-[12px] leading-4 text-muted-foreground">Vừa tìm kiếm</h2>

        <button class="search-suggest flex-1 min-w-0 text-left px-4 py-3 text-[14px] leading-5 text-foreground press truncate" data-suggest="${h}">${h}</button>

}

function promoCardsSplit(keys) {

/* ════════════════════════════════════════════════════════════════
   SCREEN: CART
════════════════════════════════════════════════════════════════ */
/* ════════════════════════════════════════════════════════════════
   QUÀ TẶNG TRONG GIỎ — 2 cơ chế (yêu cầu user 13/08/2026)

   1) QUÀ THEO SẢN PHẨM — item nào có field `gift` thì dòng quà nằm NGAY DƯỚI
      dòng sản phẩm đó. Điều kiện duy nhất: item đang được TICK CHỌN (bỏ tick =
      không nằm trong đơn nữa nên quà rút theo).
   2) QUÀ THEO ĐƠN — mốc giá trị đơn trong ORDER_GIFT_TIERS, tính trên các item
      ĐANG TICK × số lượng. Vừa chạm mốc là quà hiện ngay tại chỗ (tăng số lượng
      hoặc tick thêm sản phẩm), tụt xuống dưới mốc thì quà rút đi.

   Cả 2 cơ chế dùng chung 1 khuôn THẺ QUÀ (giftCard) và cùng danh mục quà; mỗi quà
   nằm trong 1 nhóm mang tên chương trình (giftGroupHTML).
   Giá gạch ngang là giá gốc để thấy "được tặng bao nhiêu", giá thật luôn 0 ₫ —
   quà KHÔNG cộng vào tạm tính.

   Mốc chọn quanh giá trị giỏ mặc định (186.057.000 ₫ khi tick đủ 5 item — đã
   gồm đầm pre-order 72.557.000 ₫ từ 14/08/2026) để demo được cả 2 chiều: mốc 1
   (150tr) đã đạt sẵn (bỏ tick đầm hoặc túi Lou là rớt), mốc 2 (200tr) chỉ cần
   tăng thêm 1 số lượng bất kỳ là chạm (món rẻ nhất 15,6tr cũng đủ).
════════════════════════════════════════════════════════════════ */
const GIFT_CATALOG = {
  mini:    { img:'b1.jpg',    brand:'Versace', name:'Nước hoa Crystal Noir EDP 5 ml',   variant:'5 ml',            was:'1.150.000 ₫' },
  edt:     { img:'b2.jpg',    brand:'Versace', name:'Nước hoa Eros Energy EDP 5 ml',    variant:'5 ml',            was:'1.050.000 ₫' },
  scarf:   { img:'g2.jpg',    brand:'Versace', name:'Khăn lụa Broken Jewels 84 x 5 cm', variant:'Onesize',         was:'6.775.000 ₫' },
  sneaker: { img:'p6-v2.jpg', brand:'Versace', name:'Giày thể thao Greca Court trắng',  variant:'Onesize , White', was:'21.502.000 ₫' },
};

/* Quà luôn thuộc về MỘT CHƯƠNG TRÌNH, không đứng lẻ: thẻ quà nào cũng có nhãn
   tên chương trình phía trên. Ngoài việc nói rõ "quà này từ đâu ra", đây còn là
   chỗ để đổi quà — chương trình có nhiều hơn 1 lựa chọn thì hiện nút "Đổi quà"
   và danh sách chọn ngay trong nhóm (yêu cầu user 13/08/2026).
   `gifts[0]` là quà mặc định; lựa chọn của user lưu ở giftPick. */
const GIFT_PROGRAMS = {
  bagBundle: { name: 'Quà tặng kèm túi Lou mini',  gifts: ['mini', 'edt'] },
  tier150:   { name: 'Ưu đãi đơn từ 150 triệu',    gifts: ['scarf', 'edt'] },
  tier200:   { name: 'Ưu đãi đơn từ 200 triệu',    gifts: ['sneaker'] },
};
let giftPick = {};        // {chương trình: key quà đang chọn} — rỗng = lấy gifts[0]

const ORDER_GIFT_TIERS = [
  { min: 150000000, program: 'tier150' },
  { min: 200000000, program: 'tier200' },
];
const giftOf = pk => GIFT_CATALOG[giftPick[pk] || (GIFT_PROGRAMS[pk] || {}).gifts?.[0]];

/* Tạm tính SỐNG: chỉ cộng item đang tick, nhân số lượng. Thay cho hằng số
   CART_SUBTOTAL cũ (in cứng 113.500.000) — nếu còn in cứng thì tăng số lượng
   hay bỏ tick sẽ không đổi tổng, và điều kiện nhận quà theo đơn vô nghĩa. */
/* `removed` = đã bấm thùng rác. Không splice khỏi CART vì dòng DOM còn tham
   chiếu chỉ số qua data-row (splice là mọi chỉ số sau đó lệch 1). */
const cartItems = () => CART.filter(c => !c.removed);
/* NHỮNG MÓN THỰC SỰ ĐANG MUA = chưa xoá VÀ đang tick. cartItems() (chỉ lọc
   `removed`) chỉ dùng để DỰNG MÀN GIỎ — nơi món bỏ tick vẫn phải hiện ra để
   tick lại. Mọi chỗ coi giỏ là "đơn hàng" (thanh toán, tóm tắt, chốt đơn) phải
   dùng cartSelected(), không thì màn thanh toán liệt kê 4 món mà chỉ tính tiền
   3 món. */
const cartSelected = () => CART.filter(c => !c.removed && c.sel !== false);
/* Điểm thưởng của đơn: demo dùng đúng tỉ lệ 1 điểm / 100.000 ₫ (giỏ mặc định
   186.057.000 ₫ khi tick đủ 5 món -> 1.860 điểm; con số tự tính nên thêm/bớt
   món là các màn tự khớp theo). */
const rewardPointsEarned = () => Math.floor(cartSubtotal() / 100000);
function cartSubtotal() {
  return cartItems().reduce((s, c) => s + (c.sel === false ? 0 : vndNum(c.now) * (c.qty || 1)), 0);
}
/* Mốc đã đạt (theo thứ tự mốc) và mốc kế tiếp chưa đạt — dùng cho khối quà
   theo đơn và dòng gợi ý "mua thêm ... để nhận ...". */
function orderGiftState() {
  const sub = cartSubtotal();
  const tiers = [...ORDER_GIFT_TIERS].sort((a, b) => a.min - b.min);
  return {
    sub,
    earned: tiers.filter(t => sub >= t.min),
    next:   tiers.find(t => sub < t.min) || null,
  };
}

/* Ưu đãi chương trình DAFC Rewards — chọn 1 trong 2 (radio, không phải checkbox):
   giảm giá thành viên 4% HOẶC dùng điểm thưởng (tối đa 10%). Mặc định theo Figma
   (2843:45231): "Sử dụng điểm thưởng" được chọn sẵn. */
const REWARD_POINTS = 1240;      // = "Điểm thưởng hiện có" ở tab Điểm thưởng (accPoints) — 2 nơi phải cùng 1 số
const REWARD_POINT_VALUE = 1000;
let cartReward = 'points';       // 'member' | 'points'
let cartVoucherDiscount = 0;     // cộng dồn với ưu đãi hội viên, từ mã giảm giá nhập tay
let cartVoucherCode = '';        // mã đang active (để hiện chip + gỡ) — chỉ 1 mã tại 1 thời điểm
let cartPbh = [];                // [{code, amount}] — phiếu mua hàng đang áp, có thể nhiều mã cùng lúc

function rewardAmount(kind) {
  const sub = cartSubtotal();
  if (kind === 'member') return Math.round(sub * 0.04);
  if (kind === 'points') return Math.min(REWARD_POINTS * REWARD_POINT_VALUE, Math.round(sub * 0.10));
  return 0;
}

/* ── Thẻ quà tặng ──
   Yêu cầu user 13/08/2026: thẻ quà dùng ĐÚNG khuôn thẻ sản phẩm trong giỏ
   (ảnh 100×133, brand 14 Medium, tên 14, phân loại 12, giá 14 Medium ghim đáy)
   — chỉ khác 3 chỗ, và cả 3 đều có lý do:
     · KHÔNG có ô tick: quà không phải thứ người dùng chọn mua, nó theo điều
       kiện. Vẫn chừa đúng cột 16px + gap 8 để ảnh quà thẳng hàng với ảnh sản
       phẩm phía trên.
     · KHÔNG có nút xoá và KHÔNG có stepper: số lượng luôn 01, in tĩnh ở đúng
       vị trí stepper để không thủng bố cục.
     · Giá 0 ₫ kèm giá gốc gạch ngang, để thấy được tặng bao nhiêu.
   Badge "Quà tặng" đè góc trên trái ảnh — chỗ mà thẻ sản phẩm để badge -%. */
function giftCard(g) {
  return `
  <div class="flex gap-2 px-4 pb-4">
    <span class="w-4 shrink-0" aria-hidden="true"></span>

      <span class="absolute top-0 left-0 tag-gift text-[10px] font-semibold leading-3 px-1 py-0.5">Quà tặng</span>
    </span>
    <span class="flex-1 min-w-0 flex flex-col justify-between">
      <span class="block">
        <span class="block pb-2">
          <span class="block text-[14px] font-medium leading-5 text-foreground truncate">${g.brand}</span>
          <span class="block text-[14px] leading-5 text-secondary-foreground truncate">${g.name}</span>
        </span>
        <span class="block text-[12px] leading-4 text-muted-foreground">${g.variant}</span>

      <span class="flex items-end justify-between gap-0.5">
        <span class="pt-1 flex flex-col justify-end min-w-0">

          <span class="block text-[12px] leading-4 text-muted-foreground line-through">${g.was}</span>
        </span>
        <!-- Số lượng in tĩnh, KHÔNG có nút +/− nên cho NẮM SÁT MÉP PHẢI (chỉ đạo
             user 13/08/2026): thẳng cột với mép ngoài của stepper thẻ sản phẩm và với
             nút "Đổi quà" ở hàng nhãn. Trước đó có margin-right 28px để góng theo CON
             SỐ của stepper — nhưng chừa chỗ cho nút "+" không tồn tại chỉ làm thẻ quà
             trông như bị thiếu mất một nút. -->
        <span class="w-7 min-h-6 flex items-center justify-center shrink-0 text-[12px] font-medium leading-4" style="color:var(--unofficial-ghost-foreground)">01</span>
      </span>

}

/* Danh sách đổi quà — chỉ dựng khi chương trình có nhiều hơn 1 lựa chọn.
   Dùng lại đúng khuôn .opt/.radio của project (vòng radio 1px, card đang chọn
   đổi viền, không tô nền — quy ước 12/08/2026). */
function giftOptionsHTML(pk) {
  const p = GIFT_PROGRAMS[pk];
  const cur = giftPick[pk] || p.gifts[0];
  return `
  <div class="px-4 pb-4 flex flex-col gap-2">

      const g = GIFT_CATALOG[k], on = k === cur;
      return `

        <span class="radio ${on ? 'on' : ''} w-4 h-4 rounded-full border border-border-3 flex items-center justify-center shrink-0">
          <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>

        <!-- 52×60: kích thước thumb CÓ SẮN trong tailwind.css (mini cart dùng chung).
               w-[40px]/h-[46px] KHÔNG được build — dùng là ảnh bụng ra kích thước gốc 1200×1484. -->
          <span class="w-[52px] h-[60px] shrink-0 bg-secondary overflow-hidden">

        </span>
        <span class="text-right shrink-0">
          <span class="block text-[12px] leading-4 text-muted-foreground line-through">${g.was}</span>
          <span class="block text-[14px] font-medium leading-5 text-foreground">0 ₫</span>
        </span>
      </button>`;
    }).join('')}

}

/* Nhóm quà = [tên chương trình + nút Đổi quà] + [thẻ quà] + [danh sách đổi].
   Luôn có nhãn chương trình, kể cả chương trình chỉ tặng 1 món: quà phải nói
   được nó từ đâu ra, và đây là chỗ móc sẵn cho việc đổi quà. */
function giftGroupHTML(pk, attrs = '', tone = 'tint') {
  const p = GIFT_PROGRAMS[pk], g = giftOf(pk);
  if (!p || !g) return '';
  const many = p.gifts.length > 1;
  /* tone='tint' : tự mang nền (quà kèm sản phẩm — dải riêng dính ngay dưới dòng hàng)
     tone='bare' : không nền (quà theo đơn — nằm trong dải chung cùng nhãn section,
                   xem orderGiftInner; nếu tự tô nền nữa thì xám đè xám) */
  return `
  <div class="gift-group ${tone === 'tint' ? 'bg-accent-0' : ''}" data-gift-prog="${pk}" data-sig="${pk}|${giftPick[pk] || p.gifts[0]}" ${attrs}>
    <!-- Chừa đúng cột 16px + gap 8 như thẻ quà bên dưới để nhãn chương trình
         THẲNG HÀNG VỚI ẢNH, không thò ra sát mép (yêu cầu user 13/08/2026).
         Nút "Đổi quà" vẫn ở mép phải, thẳng cột giá của thẻ. -->
    <div class="flex items-center gap-2 px-4 pt-3 pb-2">
      <span class="w-4 shrink-0" aria-hidden="true"></span>
      <p class="min-w-0 flex-1 text-[12px] font-medium leading-4 text-foreground-alt truncate">${p.name}</p>
      ${many ? `<button data-gift-swap="${pk}" class="shrink-0 text-[12px] font-medium leading-4 text-secondary-foreground underline press">Đổi quà</button>` : ''}
    </div>
    ${giftCard(g)}
  </div>`;
}

/* Nhóm quà theo sản phẩm — chỉ dựng khi item đang tick. `data-gift-of` trỏ về
   chỉ số dòng sản phẩm để refreshCartGifts() biết chèn/gỡ ở đâu. */
function productGiftHTML(c, i) {
  if (!c.gift || !GIFT_PROGRAMS[c.gift] || c.sel === false) return '';
  return giftGroupHTML(c.gift, `data-gift-of="${i}"`);
}

/* Ruột khối quà theo đơn — tách khỏi vỏ để cập nhật tại chỗ mỗi lần đổi số
   lượng / tick mà không dựng lại cả màn.

   MỖI MỐC LÀ MỘT Ô RIÊNG mang đúng tên chương trình (yêu cầu user 13/08/2026):
   KHÔNG còn title lớn "Quà tặng theo đơn hàng" và số đếm "N quà" — tên promo chi
   tiết ("Ưu đãi đơn từ 150 triệu") nói đủ việc rồi, thêm 1 tầng tiêu đề nữa chỉ
   làm loãng. Thoả thêm 1 mốc => thêm 1 ô y hệt, xếp dưới, cách nhau 8px.

   Mốc KẾ TIẾP chưa đạt cũng là 1 ô cùng khuôn (cùng nhãn tên chương trình), chỉ
   thay thẻ quà bằng dòng "mua thêm ..." + thanh tiến độ — nhìn ra ngay phải mua
   thêm bao nhiêu thì ô đó "sáng" lên thành quà thật. */
function orderGiftInner() {
  const { sub, earned, next } = orderGiftState();
  if (!cartItems().length) return '';
  /* Câu gợi ý tách làm 2 text node để applyLang dịch được: vế trái khớp luật
     regex (có số tiền), tên quà là key riêng trong I18N. Nhét cả câu vào 1 node
     thì tên quà không bao giờ được dịch. */
  const teaser = next ? `
    <div class="gift-group bg-accent-0" data-gift-next="${next.min}">
      <div class="flex items-center gap-2 px-4 pt-3 pb-2">
        <span class="w-4 shrink-0" aria-hidden="true"></span>
        <p class="min-w-0 flex-1 text-[12px] font-medium leading-4 text-foreground-alt truncate">${GIFT_PROGRAMS[next.program].name}</p>
      </div>
      <div class="flex gap-2 px-4 pb-4">
        <span class="w-4 shrink-0" aria-hidden="true"></span>
        <span class="flex-1 min-w-0 flex flex-col gap-1.5">
          <span class="block text-[12px] leading-4 text-muted-foreground">
            <span>Mua thêm ${vndDot(next.min - sub)} để nhận</span>
            <span class="font-medium text-foreground">${giftOf(next.program).name}</span>
          </span>
          <span class="block h-0.5 w-full bg-border overflow-hidden">
            <span class="block h-0.5 bg-primary" style="width:${Math.min(100, Math.round(sub / next.min * 100))}%"></span>
          </span>
        </span>
      </div>
    </div>` : '';
  return `
    <div class="flex flex-col gap-2 pt-2">
      ${earned.map(t => giftGroupHTML(t.program, `data-gift-tier="${t.min}"`)).join('')}
      ${teaser}
    </div>`;
}

/* Mọi quà đang được nhận, đúng thứ tự người dùng thấy ở giỏ: quà kèm từng sản
   phẩm đang tick trước, rồi đến quà theo mốc đơn đã đạt. Dùng cho màn Thanh toán
   và (qua ckOrderGifts) màn Hoàn tất. */
function activeGifts() {
  const list = [];
  cartSelected().forEach(c => { if (c.gift && GIFT_PROGRAMS[c.gift]) list.push(c.gift); });
  orderGiftState().earned.forEach(t => list.push(t.program));
  return list;
}

/* 1 dòng quà trong TÓM TẮT ĐƠN (thanh toán / hoàn tất) — cùng khuôn dòng sản phẩm
   của tóm tắt (thumb 52×60, chữ 13/12/12) để đọc liền mạch; khác 3 chỗ: badge
   "Quà tặng" trên ảnh, dòng thứ 3 là TÊN CHƯƠNG TRÌNH thay cho "phân loại · SL",
   và giá 0 ₫. `g` truyền vào khi đọc từ bản chốt lúc đặt hàng (giỏ đã dọn rỗng). */
function giftSummaryRow(pk, g, big) {
  const p = GIFT_PROGRAMS[pk];
  g = g || giftOf(pk);
  if (!p || !g) return '';
  /* Bản big (thumb 100×133, giá 0 ₫ ghim đáy-phải): dùng ở panel Tóm tắt đơn hàng
     của checkout — cùng khuôn dòng sản phẩm sau khi đồng bộ theo tóm tắt mobile
     (yêu cầu user 14/08/2026). Màn Hoàn tất vẫn gọi bản 52×60 gọn. */
  const info = `
                  <p class="text-[13px] font-medium text-foreground truncate">${g.brand}</p>
                  <p class="text-[12px] text-secondary-foreground ${big ? 'line-clamp-2' : 'truncate'}">${g.name}</p>
                  <p class="text-[12px] text-muted-foreground ${big ? 'mt-0.5' : ''} truncate">${p.name}</p>`;
  return `
              <div class="flex gap-3 ${big ? '' : 'items-center'}">
                <span class="relative ${big ? 'w-[100px] h-[133px]' : 'w-[52px] h-[60px]'} shrink-0 bg-secondary overflow-hidden">
                  <img src="${A}${g.img}" class="w-full h-full object-cover lazy" alt="">
                  <span class="absolute top-0 left-0 tag-gift text-[10px] font-semibold leading-3 ${big ? 'px-1 py-0.5' : 'px-1'} whitespace-nowrap">Quà tặng</span>
                </span>
                ${big ? `
                <div class="flex-1 min-w-0 flex flex-col justify-between">
                  <div>${info}</div>
                  <p class="text-[13px] font-medium text-foreground self-end">0 ₫</p>
                </div>` : `
                <div class="flex-1 min-w-0">${info}</div>
                <p class="text-[13px] font-medium text-foreground shrink-0">0 ₫</p>`}
              </div>`;
}

function orderGiftBox() {
  return `<div id="orderGift" class="rise">${orderGiftInner()}</div>`;
}

function dafcRewards() {
  /* Rich Radio Group (2843:45234/45235): card viền + radio tròn, chọn 1 trong 2.
     Card đang chọn -> viền #262626 đậm hơn card thường (border #e5e5e5), do
     .opt.on cấp; vòng radio giữ 1px #d4d4d4 ở cả 2 trạng thái.
     Không còn wrapper riêng — nằm trong card "Ưu đãi chương trình DAFC Rewards"
     của discountPanel(), padding/heading do khối cha cấp (theo Figma 3428:55499). */
  const opt = (id, title, sub) => {
    const on = cartReward === id;
    return `
    <button class="opt ${on ? 'on' : ''} w-full flex gap-2 items-start border border-border bg-background rounded-xs px-3 py-2 btn-o press text-left" data-reward="${id}">
      <span class="radio ${on ? 'on' : ''} w-4 h-4 mt-0.5 rounded-full border border-border-3 flex items-center justify-center shrink-0">
        <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
      </span>
      <span class="flex-1 min-w-0 flex flex-col gap-1">
        <span class="block text-[14px] font-medium leading-5 text-foreground-alt">${title}</span>
        <span class="block text-[12px] leading-4 text-muted-foreground">${sub}</span>
      </span>
    </button>`;
  };
  const pointsSub = `Đã áp dụng <b class="font-medium text-foreground">${REWARD_POINTS} điểm</b> ( 1 điểm = ${REWARD_POINT_VALUE.toLocaleString('en-US')}đ ).`;
  return `
  <div id="rewardOpts" class="flex flex-col gap-2">
    ${opt('member', 'Giảm giá thành viên', 'Ưu đãi 4% trên sản phẩm nguyên giá')}
    ${opt('points', 'Sử dụng điểm thưởng ( tối đa 10% )', pointsSub)}
  </div>`;
}

/* Voucher đang active hiện thành chip có nút gỡ, cạnh tiêu đề "Mã giảm giá"
   (thay cho chỉ đọc ở dòng Tổng cộng như trước) — chỉ 1 mã tại 1 thời điểm. */
function voucherChip() {
  if (!cartVoucherCode) return '';
  // Cùng style badge với phiếu mua hàng (bg-secondary, rounded, h-6) — hiện dưới
  // ô input, không còn cạnh tiêu đề "Mã giảm giá" như trước.
  return `
  <span id="voucherChip" class="bg-secondary rounded flex items-center gap-1.5 px-2 py-0.5 h-6">
    <span class="text-[12px] font-medium leading-4 text-secondary-foreground">${cartVoucherCode}</span>
    <span class="text-[12px] font-medium leading-4 text-destructive">-${cartVoucherDiscount.toLocaleString('en-US')}đ</span>
    <button data-voucher-remove class="w-3 h-3 flex items-center justify-center shrink-0 press [&_svg]:w-3 [&_svg]:h-3">${IcoCross}</button>
  </span>`;
}

/* Phiếu mua hàng: demo không có backend tra cứu mã thật, nên sinh số tiền giảm
   ổn định theo chuỗi mã (cùng 1 mã luôn ra cùng 1 số tiền) — 50,000 .. 1,000,000đ,
   bước 50,000. Nhiều mã cộng dồn vào tổng nhưng chỉ hiện 1 dòng "Phiếu mua hàng"
   trong summary (xem discountLinesHTML) — từng mã cụ thể xem ở badge dưới input. */
function pbhAmount(code) {
  let h = 0;
  for (let i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) >>> 0;
  return 50000 + (h % 20) * 50000;
}
function cartPbhTotal() { return cartPbh.reduce((s, p) => s + p.amount, 0); }

/* Các dòng Tạm tính / giảm giá trong summary — sinh động theo state (đăng nhập,
   reward đang chọn, voucher, N mã phiếu mua hàng), dùng chung cho cả lần render
   đầu (screenCART) và mỗi lần cập nhật sau tương tác (refreshCartSummary).
   Theo đúng Figma 3437:55820: MỖI mã (voucher hoặc phiếu mua hàng) có 1 dòng
   riêng dạng "Giảm giá(<CODE>)" — cả 2 loại dùng CHUNG format nhãn này, không
   gộp/rút gọn thành 1 dòng tổng như bản trước. */
function discountLinesHTML() {
  /* py-2 (không h-9 cố định) + items-start: mã dài (VOUCHERPBH...) sẽ XUỐNG
     DÒNG thay vì bị cắt "..." — đúng theo Figma (dòng đó cao 56px = 2 dòng
     label, không phải 36px 1 dòng như các dòng còn lại). */
  const line = (label, amount, isDiscount) => `
    <div class="flex justify-between items-start gap-2 py-1.5">
      <span class="text-[16px] font-light leading-6 ${isDiscount ? 'text-destructive' : 'text-muted-foreground'}">${label}</span>
      <span class="text-[16px] font-light leading-6 ${isDiscount ? 'text-destructive' : 'text-foreground'} shrink-0">${isDiscount ? '-' : ''}${amount.toLocaleString('en-US')}đ</span>
    </div>`;
  const sub = cartSubtotal();
  const rows = [line('Tạm tính', sub, false)];
  /* Không còn món nào được chọn thì KHÔNG in dòng giảm giá nào: "Tạm tính 0đ"
     kèm "Giảm giá(JUNE2000) -2.000.000đ" rồi "Tổng cộng 0đ" là 3 dòng không
     cộng lại thành nhau — mã vẫn giữ nguyên, tick lại món là hiện lại. */
  if (sub > 0) {
    if (ckAuth) {
      const amt = rewardAmount(cartReward);
      if (amt > 0) rows.push(line(cartReward === 'points' ? `Dùng ${REWARD_POINTS} điểm` : 'Giảm giá thành viên', amt, true));
    }
    if (cartVoucherDiscount > 0) rows.push(line(`Giảm giá(${cartVoucherCode})`, cartVoucherDiscount, true));
    cartPbh.forEach(p => rows.push(line(`Giảm giá(${p.code})`, p.amount, true)));
  }
  return rows.join('');
}

/* Tổng ưu đãi đang áp, CHẶN TRẦN theo tạm tính (giỏ teo lại vì bỏ tick / xoá
   món thì ưu đãi không được lớn hơn tiền hàng) + tổng phải trả. Tách riêng để
   lúc dựng màn và lúc cập nhật tại chỗ dùng chung đúng 1 công thức. */
function cartDiscountTotal() {
  const reward = ckAuth ? rewardAmount(cartReward) : 0;
  return Math.min(reward + cartVoucherDiscount + cartPbhTotal(), cartSubtotal());
}
function cartTotalNow() { return Math.max(0, cartSubtotal() - cartDiscountTotal()); }

/* Khối hợp nhất theo Figma 3458:56933 (đọc lại lần 4 — user xác nhận "chưa
   đúng thiết kế", bỏ hẳn kiểu "card nổi bo góc" của 2 vòng trước): panel giờ
   lại là full-bleed sát viền màn hình (KHÔNG margin trắng quanh, KHÔNG bo
   góc — chỉ 1 lớp pad[24,16,24,16] trực tiếp trên chính panel, không còn
   wrapper ngoài + card trong lồng nhau). Nền secondary (#f5f5f5) giữ nguyên.
   Summary KHÔNG còn thụt vào thêm 8px như trước — giờ rộng bằng 2 card phía
   trên (358px, không phải 342px). "Chương trình khuyến mãi" vẫn để ngoài
   khối này. "Bạn có phiếu mua hàng?" ở #cartCta (screenCART()), gap với nút
   "Đặt hàng" tăng 8px→16px theo số liệu mới. */
function discountPanel() {
  const rewardsCard = ckAuth ? `
    <div class="bg-background border border-border-1 rounded-md p-3 flex flex-col gap-4">
      <p class="text-[16px] font-medium leading-6 text-foreground">Ưu đãi chương trình DAFC Rewards</p>
      ${dafcRewards()}
    </div>` : '';
  return `
  <div class="py-6 px-4 bg-secondary flex flex-col gap-4 rise">
    <div class="flex flex-col gap-2">
      ${rewardsCard}
      <div class="bg-background border border-border-1 rounded-md py-1 px-3">
        <div class="py-2 flex flex-col gap-2">
          <p class="text-[14px] font-medium leading-5 text-foreground">Mã giảm giá</p>
          <div class="flex gap-1">
            <input id="voucher" placeholder="Nhập voucher" class="flex-1 min-w-0 h-10 bg-input border border-border rounded-xs px-2 text-[14px] text-foreground placeholder:text-muted-foreground outline-none focus:border-primary transition-colors">
            <button id="applyVoucher" disabled class="h-10 px-4 shrink-0 bg-secondary border border-border rounded-xs text-[14px] font-medium leading-5 text-foreground btn-s press">Áp dụng</button>
          </div>
          <div id="voucherChipSlot" class="${cartVoucherCode ? 'flex gap-2 flex-wrap' : 'hidden'}">${voucherChip()}</div>
        </div>
      </div>
    </div>

    <div class="flex flex-col">
      <div id="discountLines" class="flex flex-col">${discountLinesHTML()}</div>
      <div class="border-t border-border flex justify-between items-center h-14">
        <span class="text-[16px] font-medium leading-6 text-foreground">Tổng cộng</span>
        <span id="cartTotal" class="text-[16px] font-medium leading-6 text-foreground">${vndCom(cartTotalNow())}</span>
      </div>
      <p class="text-[14px] leading-5 text-secondary-foreground">${ckAuth
        ? `Hoàn tất đơn hàng để nhận ngay <b id="cartPointsVal" class="font-bold">${rewardPointsEarned().toLocaleString('vi-VN')}</b> điểm thưởng`
        : `<button data-nav="login" class="underline font-medium text-foreground press">Đăng nhập</button> và hoàn tất đơn hàng để nhận ngay <b id="cartPointsVal" class="font-bold">${rewardPointsEarned().toLocaleString('vi-VN')}</b> điểm thưởng`}</p>
    </div>
  </div>`;
}

/* Rule text 1 mục khuyến mãi — 3 tầng chữ: Headline 14px medium (tên chương
   trình + thời gian), Scheme 14px regular (cơ chế giảm giá), T&Cs 12px regular
   (điều kiện/loại trừ). scheme/tnc để trống khi mục không có (ví dụ dòng
   freeship đơn lẻ, không kèm mã/điều kiện riêng) — chỉ hiện dòng headline. */
function promoRule(headline, scheme, tnc) {
  return `
  <div class="flex flex-col gap-1">
    <p class="text-[14px] font-medium leading-5 text-foreground">${headline}</p>
    ${scheme ? `<p class="text-[14px] leading-5 text-foreground">${scheme}</p>` : ''}
    ${tnc ? `<p class="text-[12px] leading-4 text-foreground">${tnc}</p>` : ''}
  </div>`;
}

function screenCART() {
  // Tổng tiền: ưu đãi hội viên (chỉ khi đã đăng nhập) + mã giảm giá + N phiếu mua hàng
  // Tổng tiền: xem cartDiscountTotal()/cartTotalNow() — ưu đãi chặn trần theo tạm tính

  /* item-cart — đồng bộ với component 2851:28705 của bản mobile (bản mới nhất,
     không có variant desktop): [checkbox 16 canh giữa] [ảnh 100×133] [thông tin]
     · brand 14 Medium + nút xoá 14 cùng hàng · name 14 · variant 12
     · giá 14 Medium (+ badge -% nền subtle CẠNH GIÁ, không đè lên ảnh)
     · stepper ghost KHÔNG viền [− 12][02 12 Medium][+ 12] cao 24, ghim đáy phải */
  const row = (c, i) => `
    <div class="cart-row flex gap-2 px-4 py-4" data-row="${i}">
      <div class="w-4 shrink-0 flex items-center">
        <button class="chk ${c.sel === false ? '' : 'on'} w-4 h-4 border border-border bg-background-3 rounded-xs shadow-sm flex items-center justify-center btn-o press" data-check>${I.tick}</button>
      </div>
      <div class="relative w-[100px] h-[133px] shrink-0 bg-secondary overflow-hidden cursor-pointer" data-product="7">
        <img src="${A}${c.img}" class="w-full h-full object-cover lazy" alt="">
      </div>
      <div class="flex-1 min-w-0 flex flex-col justify-between">
        <div class="flex flex-col">
          <div class="pb-2">
            <div class="flex items-center gap-2 h-5">
              <p class="flex-1 min-w-0 text-[14px] font-medium leading-5 text-foreground truncate">${c.brand}</p>
              <button class="del w-3.5 h-3.5 shrink-0 flex items-center justify-center press" aria-label="Xóa sản phẩm">${I.trash}</button>
            </div>
            <!-- 03/09/2026: badge "Đặt trước" THÔI đè ảnh, xuống đứng TRƯỚC TÊN cùng hàng với tên - đúng khuôn thẻ PLP chốt 27/08. -->
            <div class="flex items-center gap-1.5 min-w-0">
              ${c.preorder ? `<span class="tag-note px-1 text-[12px] font-medium leading-4 shrink-0">Đặt trước</span>` : ''}
              <p class="w-full min-w-0 text-[14px] leading-5 text-secondary-foreground truncate">${c.name}</p>
            </div>
          </div>
          <p class="text-[12px] leading-4 text-muted-foreground">${c.variant}</p>
          ${c.preorder ? `<p class="text-[12px] leading-4 text-foreground-alt pt-1">Nhận hàng dự kiến <span class="font-medium">${c.preorder}</span></p>` : ''}
        </div>
        <!-- giá + stepper ghim đáy ô, giá thường đen / giá khuyến mãi đỏ (item-cart 2851:28705) -->
        <div class="flex items-end justify-between gap-0.5">
          <div class="pt-1 flex flex-col justify-end min-w-0">
            <div class="flex gap-1 items-center">
              <p class="price text-[14px] font-medium leading-5 ${c.off ? 'text-destructive' : 'text-foreground'}">${c.now}</p>
              ${c.off ? `<span class="bg-destructive-subtle rounded-xs px-1 py-0.5 text-[12px] font-medium leading-4 text-destructive shrink-0">${c.off}</span>` : ''}
            </div>
            ${c.was ? `<p class="text-[12px] leading-4 text-muted-foreground line-through">${c.was}</p>` : ''}
          </div>
          <!-- stepper ghost không viền: [− 12px][02 12 medium][+ 12px], cao 24 -->
          <div class="flex items-center shrink-0">
            <button class="qty-btn min-h-6 px-2 rounded-xs flex items-center justify-center press" data-step="-1" aria-label="Giảm số lượng"><svg width="12" height="12" viewBox="0 0 24 24" fill="var(--unofficial-ghost-foreground)"><path d="M23.5,12.5H.5c-.276,0-.5-.224-.5-.5s.224-.5,.5-.5H23.5c.276,0,.5,.224,.5,.5s-.224,.5-.5,.5Z"/></svg></button>
            <span class="qty w-7 min-h-6 flex items-center justify-center text-[12px] font-medium leading-4" style="color:var(--unofficial-ghost-foreground)">${String(c.qty).padStart(2,'0')}</span>
            <button class="qty-btn min-h-6 px-2 rounded-xs flex items-center justify-center press" data-step="1" aria-label="Tăng số lượng"><svg width="12" height="12" viewBox="0 0 24 24" fill="var(--unofficial-ghost-foreground)"><path d="M24,12c0,.276-.224,.5-.5,.5H12.5v11c0,.276-.224,.5-.5,.5s-.5-.224-.5-.5V12.5H.5c-.276,0-.5-.224-.5-.5s.224-.5,.5-.5H11.5V.5c0-.276,.224-.5,.5-.5s.5,.224,.5,.5V11.5h11c.276,0,.5,.224,.5,.5Z"/></svg></button>
          </div>
        </div>
      </div>
    </div>`;

  return `
  <div class="w-full" data-scroller>
    ${navBar()}
    <div class="max-w-[1440px] mx-auto w-full px-6 pt-6 pb-20">
      <div class="flex items-start gap-10">

        <!-- ── CỘT TRÁI: danh sách giỏ hàng ── -->
        <div class="flex-1 min-w-0">
          <div class="py-4 rise">
            <h2 class="text-[24px] font-light leading-8 text-foreground">Giỏ hàng <span id="cartCount" class="text-muted-foreground">(${cartItems().length})</span></h2>
          </div>

          <!-- Không bọc card viền quanh selectAll / danh sách — đồng bộ quy ước
               "giữa các block không kẻ border" của bản mobile (2851:28697) -->
          <div class="flex items-center justify-between gap-3 px-4 py-2 rise">
            <button id="selectAll" class="flex items-center gap-2 press">
              <!-- Ô tick tổng SUY TỪ STATE (không in cứng "on"): tick chọn là state sống
                   qua các lần vào/ra màn -->
              <span class="chk ${cartItems().length && cartItems().every(c => c.sel !== false) ? 'on' : ''} w-4 h-4 border border-border-3 rounded-xs shadow-sm flex items-center justify-center">${I.tick}</span>

const ETA = 'Thời gian nhận hàng dự kiến từ ngày 14/07 đến ngày 18/07';

/* Rich radio: label + mô tả phụ */
/* Figma "Rich Radio Group": thẻ p12 r2 viền 1px — #e5e5e5 thường, #262626 khi
   chọn (đổi trong .opt.on); vòng radio 16 viền 1px #d4d4d4 KHÔNG đổi màu, chấm
   giữa 8px. Trước đây viền vòng dày 2px và cả thẻ lẫn vòng đều chuyển đen. */
/* icon (tuỳ chọn) = [file, width, alt] — logo đối tác thanh toán đặt cuối hàng,
   cao 24 và giữ tỉ lệ bằng object-contain. Bề rộng lấy đúng Figma 3028:47246:
   76 cho cặp Visa+Mastercard, 38 cho các logo đơn. Không có class w-[76px]
   trong bản tailwind build sẵn nên đặt bằng style. */
function richRadio(id, label, sub, on, icon) {
  /* Có dòng phụ (phương thức vận chuyển) -> canh MÉP TRÊN để nút radio thẳng
     hàng với dòng tiêu đề. Chỉ một dòng (phương thức thanh toán) -> canh GIỮA,
     vì thẻ cao 64 mà chữ dính mép trên nhìn lệch hẳn so với logo vốn đã căn
     giữa. mt-0.5 của nút radio cũng chỉ cần khi canh mép trên. */
  const single = !sub;
  return `
  <button class="opt ${on ? 'on' : ''} w-full flex ${single ? 'items-center' : 'items-start'} gap-2 border border-border bg-background rounded-xs p-3 text-left btn-o press" data-opt="${id}">
    <span class="radio ${on ? 'on' : ''} w-4 h-4 ${single ? '' : 'mt-0.5 '}rounded-full border border-border-3 flex items-center justify-center shrink-0">
      <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
    </span>
    <span class="flex-1 min-w-0">
      <span class="block text-[14px] font-medium leading-5 text-foreground">${label}</span>
      ${sub ? `<span class="block text-[14px] leading-5 text-foreground">${sub}</span>` : ''}
    </span>
    ${icon ? `<img src="${A}${icon[0]}" alt="${icon[2] || ''}" class="shrink-0 self-center h-6 object-contain" style="width:${icon[1]}px">` : ''}
  </button>`;
}

/* Một section: head + phần mở (editable) + phần thu gọn (tóm tắt) */
/* Xuất hóa đơn VAT — 2 loại (Figma 3028:47246): Cá nhân / Công ty, mỗi loại
   một bộ field khác nhau (Công ty cần thêm Mã số thuế, Cá nhân thì không).
   Hoist lên module scope vì cả screenCHECKOUT() (render lần đầu) và wire()
   (đổi tab sau khi mount) đều cần gọi vatFieldRows(). */
const vatFieldSets = {
  personal: [
    ['Họ và tên', 'Nhập Họ và tên', ''],
    ['Địa chỉ', 'Nhập Địa chỉ', ''],
    ['Email nhận hóa đơn VAT', 'Nhập Email nhận hóa đơn VAT', 'email'],
  ],
  company: [
    ['Tên công ty', 'Nhập Tên công ty', ''],
    ['Địa chỉ công ty', 'Nhập Địa chỉ công ty', ''],
    ['Mã số thuế', 'Nhập Mã số thuế', 'numeric'],
    ['Email nhận hóa đơn VAT', 'Nhập Email nhận hóa đơn VAT', 'email'],
  ],
};
function vatFieldRows(type) {
  return vatFieldSets[type].map(([lb, ph, im]) => `
    <div class="px-4 py-2 flex flex-col gap-2">
      <label class="text-[14px] font-medium leading-5 text-foreground">${lb}</label>
      <input ${im ? `inputmode="${im}"` : ''} placeholder="${ph}" class="h-10 bg-input border border-border rounded-xs px-2 text-[14px] text-foreground placeholder:text-muted-foreground outline-none focus:border-primary transition-colors">
    </div>`).join('');
}

/* ── Cặp nút phân đoạn (segmented toggle) — đồng bộ với index.html ──
   Quy ước: mục ĐANG CHỌN **nổi lên** — nền trắng + đổ bóng nhẹ trên rãnh xám,
   giống cặp đổi ngôn ngữ ở bảng Cài đặt. Kiểu cũ (viền hộp, tô xám đúng mục
   đang chọn) đọc ngược: mục được chọn nhìn như bị lún xuống.
   segBtnClass là nguồn class duy nhất, dùng cho cả lúc dựng markup lẫn lúc JS
   đổi trạng thái, để 2 chỗ không lệch nhau. */
const SEG_ON  = 'bg-background text-foreground font-medium shadow-sm';
const SEG_OFF = 'text-muted-foreground';
const segBtnClass = (on, h = 'h-9') =>
  `seg flex-1 ${h} rounded-xs text-[14px] leading-5 transition-colors press ` + (on ? SEG_ON : SEG_OFF);
function segToggle(attr, items, active, h) {
  return `
  <div class="flex p-0.5 rounded-xs bg-secondary" role="group">
    ${items.map(([id, label]) => `
    <button ${attr}="${id}" class="${segBtnClass(id === active, h)}">${label}</button>`).join('')}
  </div>`;
}

function ckSection(i, title, openBody, doneBody) {
  return `
  <div class="ck-sec border-t border-border-1" data-sec="${i}">
    <!-- Hàng tiêu đề bước 56 -> 72px: nhịp thoáng kiểu Farfetch (14/08/2026) -->
    <div class="h-[72px] px-4 flex items-center justify-between">
      <p class="ck-title text-[16px] font-medium leading-6 text-foreground transition-opacity duration-300">${title}</p>
      <button class="ck-change text-[16px] font-light leading-6 text-foreground press" data-goto="${i}">Thay đổi</button>
    </div>
    <div class="ck-open acc-body"><div class="acc-inner">${openBody}</div></div>
    <div class="ck-done acc-body"><div class="acc-inner">${doneBody || ''}</div></div>
  </div>`;
}

/* ── Cửa hàng cho luồng "Nhận tại cửa hàng" (đồng bộ với index.html) ──

/* ckMode: 'ship' = giao tận nơi (mặc định) · 'pickup' = nhận tại cửa hàng
   ckHome = tỉnh/thành người nhận đang sinh sống (chỉ hỏi ở luồng nhận tại cửa
   hàng, tách khỏi ckProvince của địa chỉ giao hàng).
   ckName/ckPhone/ckEmail: 3 ô người nhận PHẢI có state vì phần này bị dựng lại
   mỗi khi đổi thành phố/cửa hàng — không giữ thì gõ xong đổi cửa hàng là mất
   trắng. Cũng là nguồn để phần tóm tắt nhắc lại người nhận sau khi Xác nhận. */
let ckMode = 'ship', ckCity = '', ckStore = '', ckHome = '';
let ckName = '', ckPhone = '', ckEmail = '';
/* Bước giao hàng: ckAddr = chỉ số địa chỉ đã lưu đang chọn, hoặc 'new' khi

/* Đã đặt hàng xong: khoá không cho đặt lại đơn thứ hai khi bấm back, và giữ

let ckPlaced = false, ckOrderId = '', ckOrderTotal = '', ckOrderPoints = '';   // tổng + điểm chốt lúc đặt hàng (giỏ bị dọn ngay sau đó)
let ckOrderGifts = [];   // [{pk, g}] quà của đơn vừa đặt — chốt luôn cả MÓN đang chọn, không chỉ key chương trình
let ckOrderPre = '';     // ngày nhận pre-order của đơn vừa đặt — chốt lúc placeOrder vì sau đó giỏ bị dọn rỗng

/* field/pickField để Ở NGOÀI screenCHECKOUT vì bước "Nhận tại cửa hàng" dựng
   lại phần thân của nó nhiều lần (ckPickupOpen), không chỉ lúc render màn.

   opts (đều tuỳ chọn, mọi call site cũ giữ nguyên chữ ký 3 tham số):
     val  — giá trị đang giữ trong state, để dựng lại không mất chữ đã gõ
     key  — khoá state (data-ckf), input handler ghi ngược lại vào biến
     auto — autocomplete để trình duyệt gợi ý điền sẵn
   id sinh bằng bộ đếm chứ không slug hoá nhãn: cùng một nhãn xuất hiện ở
   nhiều khối (pickup và VAT) nên slug sẽ đụng id. */
let _fldId = 0;
const field = (label, ph, type, opts = {}) => {
  const id = 'fld' + (++_fldId);
  const { val = '', key = '', auto = '' } = opts;
  return `
    <div class="px-4 py-2 flex flex-col gap-2">
      <label for="${id}" class="text-[14px] font-medium leading-5 text-foreground">${label}</label>
      <input id="${id}"${type ? ` type="${type}" inputmode="${type}"` : ''}${auto ? ` autocomplete="${auto}"` : ''}${key ? ` data-ckf="${key}"` : ''} value="${val}" placeholder="${ph}"
             class="h-10 bg-background border border-border rounded-xs px-3 text-[14px] text-foreground placeholder:text-muted-foreground outline-none focus:border-primary transition-colors">
    </div>`;
};

/* Ô chọn địa giới: nhìn y như input ở trên (h-10, viền, r2) nhưng là button
   mở dialog chọn — cùng cách PDP thay <select> bằng sheet chọn size.
   label[for] + id trên button: bấm nhãn cũng mở được dialog và trình đọc màn
   hình đọc được tên nút; aria-haspopup báo trước là sẽ mở hộp thoại. */
const pickField = (label, ph, key, val) => `
    <div class="px-4 py-2 flex flex-col gap-2">
      <label for="pk-${key}" class="text-[14px] font-medium leading-5 text-foreground">${label}</label>
      <div class="relative">
        <button type="button" id="pk-${key}" data-pick="${key}" aria-haspopup="dialog" class="w-full h-10 bg-background border border-border rounded-xs pl-3 pr-9 text-[14px] text-left flex items-center btn-o press transition-colors focus:border-primary">
          <span class="pick-label truncate ${val ? 'text-foreground' : 'text-muted-foreground'}">${val || ph}</span>
        </button>
        <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">${I.chevD('var(--general-primary)')}</span>
      </div>
    </div>`;

/* Thẻ chọn cửa hàng — KHÔNG dùng chung richRadio vì richRadio gộp phần phụ
   thành MỘT dòng: địa chỉ và giờ mở cửa dính nhau ở cùng cỡ chữ với tên cửa
   hàng, và cả chuỗi gộp thành một text node nên i18n không dịch nổi. Ở đây
   tách 3 dòng theo đúng thứ bậc. Vỏ ngoài giữ .opt/.radio + data-opt để
   handler và CSS trạng thái đang có chạy y nguyên. */
function storeOpt(name, addr, hours, on) {
  return `
  <button type="button" role="radio" aria-checked="${on}" class="opt ${on ? 'on' : ''} w-full flex items-start gap-2 border border-border bg-background rounded-xs p-3 text-left btn-o press" data-opt="store:${name}">
    <span class="radio ${on ? 'on' : ''} w-4 h-4 mt-0.5 rounded-full border border-border-3 flex items-center justify-center shrink-0">
      <span class="radio-dot w-2 h-2 rounded-full bg-primary"></span>
    </span>
    <span class="flex-1 min-w-0">
      <span class="block text-[14px] font-medium leading-5 text-foreground">${name}</span>
      <span class="block pt-0.5 text-[13px] leading-5 text-secondary-foreground">${addr}</span>
      <span class="block text-[13px] leading-5 text-muted-foreground"><span>Mở cửa</span> <span>${hours}</span></span>
    </span>
  </button>`;
}

/* ── Bước "Nhận tại cửa hàng" — HIỆN DẦN theo tiến độ chọn (đồng bộ index.html) ──
   1) dropdown Thành phố → 2) DANH SÁCH cửa hàng của thành phố đó (thẻ chọn,
   không phải dropdown) → 3) các ô nhập của người nhận. Dòng "Bước n/3" nói
   trước còn mấy chặng. Đổi thành phố = xoá cửa hàng đang chọn nên phần 2 và 3
   tự thu lại, nhưng chữ đã gõ vẫn còn (state ckName/ckPhone/ckEmail).
   Khác bản mobile: danh sách cửa hàng xếp 2 cột, SĐT/email chia cột. */
function ckPickupOpen() {
  const step = !ckCity ? 'Bước 1/3 · Chọn thành phố'
             : !ckStore ? 'Bước 2/3 · Chọn cửa hàng'
             : 'Bước 3/3 · Thông tin người nhận';
  const stores = ckCity ? storesOf(ckCity) : [];
  return `
    <div class="px-4 pt-3">
      <p class="text-[12px] leading-4 text-muted-foreground">${step}</p>
    </div>
    <div class="grid grid-cols-2">
      ${pickField('Thành phố','Chọn thành phố','city', ckCity)}
    </div>
    ${!ckCity ? `
    <div class="px-4 pb-2">
      <p class="text-[13px] leading-5 text-muted-foreground">Chọn thành phố để xem các cửa hàng DAFC có thể nhận hàng.</p>
    </div>` : `
    <div id="ckStoreGroup" class="px-4 py-2 flex flex-col gap-2">
      <div class="flex items-baseline justify-between">
        <span id="storeOptsLbl" class="text-[14px] font-medium leading-5 text-foreground">Cửa hàng</span>
        <span class="text-[13px] leading-5 text-muted-foreground">${stores.length} cửa hàng</span>
      </div>
      <div id="storeOpts" role="radiogroup" aria-labelledby="storeOptsLbl" class="grid grid-cols-2 gap-3">
        ${stores.map(([name, addr, hours]) => storeOpt(name, addr, hours, name === ckStore)).join('')}
      </div>
    </div>`}
    ${ckStore ? `
    <div id="ckRecipient">
      <div class="px-4 pt-6 pb-1">
        <p class="text-[12px] leading-4 tracking-wide text-muted-foreground">Thông tin người nhận</p>
      </div>
      ${field('Họ và tên','Nhập họ và tên','', { val: ckName, key: 'name', auto: 'name' })}
      <div class="grid grid-cols-2">
        ${field('Số điện thoại','0 1234 5678','tel', { val: ckPhone, key: 'phone', auto: 'tel' })}
        ${field('Email','Nhập email','email', { val: ckEmail, key: 'email', auto: 'email' })}
      </div>
      <div class="grid grid-cols-2">
        ${pickField('Tỉnh thành sinh sống','Chọn tỉnh / thành phố','home', ckHome)}
      </div>
      <div class="px-4 pt-3">
        <p class="text-[13px] leading-5 text-secondary-foreground">Đơn hàng được giữ tại cửa hàng trong 3 ngày kể từ khi có thông báo sẵn sàng nhận.</p>
      </div>
      <div class="px-4 pt-6 pb-8">
        <button class="ck-next h-12 px-10 rounded-xs bg-primary text-primary-foreground text-[16px] btn-p press inline-flex items-center justify-center" data-next="1" data-require="store">Xác nhận</button>
      </div>
    </div>` : ''}`;
}

/* Dựng lại nguyên màn checkout tại chỗ — dùng khi CẤU TRÚC đổi (đổi hình thức
   nhận hàng, chọn xong thành phố, chọn cửa hàng lần đầu). */
function rerenderCheckout(root) {
  scrollCleanups.forEach(fn => fn());
  scrollCleanups = [];
  root.innerHTML = RENDER.checkout();
  wire(root);
  localizeNew(root);
}

function screenCHECKOUT() {
  /* Đã đặt hàng rồi mà quay lại (back vật lý) thì KHÔNG vẽ form nữa — trước
     đây bấm "Đặt hàng" lần nữa là ra đơn thứ hai, không cảnh báo gì. */
  if (ckPlaced) return `
  <div class="w-full" data-scroller>
    ${navBar({ logoOnly: true })}
    <div class="max-w-[1240px] mx-auto w-full px-6 pt-16 pb-24 flex flex-col items-center text-center gap-3">
      <div class="w-12 h-12 rounded-full border border-primary text-primary flex items-center justify-center">${I.tick}</div>
      <p class="text-[24px] font-light leading-8 text-foreground">Đơn ${ckOrderId} đã được đặt</p>
      <p class="text-[14px] leading-5 text-muted-foreground">Đơn hàng đang được xử lý. Bạn không cần đặt lại.</p>
      <div class="flex gap-3 pt-2">
        <button data-order="0" class="h-12 px-8 rounded-xs bg-primary text-primary-foreground text-[16px] btn-p press">Xem chi tiết đơn hàng</button>
        <button data-nav="plp" data-reset class="h-12 px-8 rounded-xs border border-border bg-background text-foreground text-[14px] font-medium btn-o press">Tiếp tục mua sắm</button>
      </div>
    </div>
  </div>`;

  /* Đăng nhập xong router nhảy tới ckStep = 1 (bỏ qua bước địa chỉ). Ở chế độ
     nhận tại cửa hàng, bước 1 là Thanh toán — chưa chọn cửa hàng thì không
     được nhảy qua, nên kéo về bước 0. */
  if (ckMode === 'pickup' && !ckStore) { ckStep = 0; ckMaxStep = 0; }

  const notice = ckAuth
    ? `<p class="text-[14px] leading-5 text-foreground">Đăng nhập tài khoản <b class="font-medium">UserOne</b></p>`
    : `<p class="text-[14px] font-medium leading-5 text-foreground">Bạn đang thanh toán không đăng nhập</p>
       <p class="text-[14px] leading-5 text-foreground">Đăng nhập và hoàn tất đơn hàng để nhận ngay <b class="font-medium">${rewardPointsEarned().toLocaleString('vi-VN')} điểm thưởng</b></p>
       <button data-nav="login" class="self-start text-[14px] font-medium leading-5 text-foreground underline press">Đăng nhập</button>`;

  /* Cặp nút Giao hàng / Nhận tại cửa hàng — nằm ĐẦU thân section "Vận chuyển"
     (yêu cầu user 14/08/2026), cùng khuôn segmented với Cá nhân/Công ty của VAT.
     px-4 thẳng hàng nội dung section; id giữ nguyên để paintCheckout ẩn khi đã
     tới bước Thanh toán. */
  const modeTabs = `
    <div id="ckModeTabs" class="px-4 pt-1 pb-4">
      <div class="max-w-[360px]">
        ${segToggle('data-ck-mode', [['ship','Giao hàng'], ['pickup','Nhận tại cửa hàng']], ckMode, 'h-10')}
      </div>
    </div>`;
  /* ── Section 0: Thông tin giao hàng ──
     Khách ĐÃ ĐĂNG NHẬP thì mở ra là sổ địa chỉ đã lưu (chọn 1 chạm là xong
     bước này), cuối danh sách mới là "Thêm địa chỉ mới" xổ form. Khách vãng
     lai vẫn thấy form ngay như cũ. Thẻ địa chỉ xếp 2 cột theo khuôn desktop. */
  const addrForm = `
    <div class="grid grid-cols-2">
      ${field('Tên','Nhập tên','', { val: ckShipName, key: 'sname', auto: 'given-name' })}
      ${field('Họ','Nhập họ')}

/* Vẽ lại trạng thái mở / thu gọn / chờ của 3 section */
function paintCheckout(root) {
  root.querySelectorAll('.ck-sec').forEach(sec => {
    const i = +sec.dataset.sec;
    // đang mở > đã từng xong (kể cả section nằm SAU section đang sửa) > chưa tới
    const state = i === ckStep ? 'open' : (i <= ckMaxStep ? 'done' : 'pending');
    sec.querySelector('.ck-open').classList.toggle('is-open', state === 'open');
    sec.querySelector('.ck-done').classList.toggle('is-open', state === 'done');
    sec.querySelector('.ck-title').style.opacity = state === 'pending' ? '0.4' : '1';
    const chg = sec.querySelector('.ck-change');
    chg.style.display = state === 'done' ? '' : 'none';
  });
  /* Tới bước Thanh toán thì ẩn cặp Giao hàng / Nhận tại cửa hàng: lúc này hình
     thức nhận hàng đã chốt, để đó chỉ tổ bấm nhầm — mà đổi tab là ckStep về 0,
     tức mất sạch bước vừa làm. Muốn đổi thì bấm "Thay đổi" ở section trên, lúc
     đó cặp nút hiện lại. Bước Thanh toán là section 1 ở luồng nhận tại cửa
     hàng (chỉ 2 section) và section 2 ở luồng giao hàng. */
  const tabs = root.querySelector('#ckModeTabs');
  if (tabs) tabs.classList.toggle('hidden', ckMaxStep >= (ckMode === 'pickup' ? 1 : 2));

  /* Section đang mở mà TRƯỚC ĐÓ đã xong rồi thì đây là lần sửa lại: nút đổi
     nhãn "Lưu thay đổi" và bấm xong nhảy thẳng về bước xa nhất. */
  const openSec = root.querySelector(`.ck-sec[data-sec="${ckStep}"] .ck-next`);
  if (openSec) {
    openSec.textContent = ckMaxStep > ckStep ? 'Lưu thay đổi' : 'Xác nhận';
    localizeNew(openSec);
  }
}

function catTreeFor(gender) {
  const src = FILTER_CATS.filter(([c]) => c !== 'Làm đẹp');
  const drop = gender === 'Nam' ? CATS_WOMEN_ONLY : gender === 'Nữ' ? CATS_MEN_ONLY : null;
  if (!drop) return src;
  return src
    .map(([cat, subs]) => [cat, subs.reduce((acc, sub) => {
      const name = Array.isArray(sub) ? sub[0] : sub;
      if (drop.has(name)) return acc;
      if (!Array.isArray(sub)) { acc.push(sub); return acc; }
      const kids = sub[1].filter(k => !drop.has(k));
      if (kids.length) acc.push([sub[0], kids]);
      return acc;
    }, [])])
    .filter(([, subs]) => subs.length);
}

/* ── Bộ lọc THẬT lọc lưới (12/08/2026) ──

   nút Áp dụng phải đếm số kết quả, nên con số buộc phải khớp lưới — không thể
   bịa. Nguồn duy nhất vẫn là `plpFilters` (mảng NHÃN): facet được SUY RA từ nhãn
   nên xoá chip ở hàng "đang áp dụng" là lưới tự cập nhật, không cần state thứ hai.

   Lọc được (dữ liệu PRODUCTS có): thương hiệu · màu · đang giảm giá · hàng mới về.

   Nếu sau này thêm `sizes`/`cat` vào PRODUCTS thì bổ sung vào matchProducts(). */
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
/* Màu sản phẩm mang tên tiếng Ý (Nero/Bianco/Cuoio…) nên không so tên được —
   quy về ô màu bộ lọc GẦN NHẤT theo khoảng cách RGB. Cache theo hex vì
   PRODUCTS lặp lại rất nhiều mã màu giống nhau. */
const __colorBucket = {};
/* Quy màu sản phẩm về ô màu bộ lọc. KHÔNG dùng khoảng cách RGB: RGB không phân
   biệt sắc, nên "gần nhất" từng gán #a5d48c (xanh lá) vào "Xám" và #f5d6e0
   (hồng) vào "Beige", còn "Đỏ"/"Xanh dương" thì không bao giờ khớp gì.
   Cách đúng: tách 2 nhóm.
   · Ô trung tính (Đen/Trắng/Xám/Bạc, S < .15) chỉ nhận màu cũng trung tính, chọn
     theo độ sáng gần nhất.
   · Ô có sắc chỉ nhận màu có sắc và lệch HUE trong 40°; xa hơn thì trả null —
     thà không khớp còn hơn khớp sai. */
function rgbHsl(hex) {
  const [r, g, b] = hexRgb(hex).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
  const sat = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  let h = 0;
  if (d !== 0) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { h, s: sat, l };
}
const NEUTRAL_S = 0.15, HUE_TOL = 40;
const __filterHsl = FILTER_COLORS
  .filter(([, hex]) => /^#[0-9a-f]{6}$/i.test(hex))   // bỏ ô "Nhiều màu" (gradient)
  .map(([name, hex]) => ({ name, ...rgbHsl(hex) }));
function colorBucketOf(hex) {
  hex = (hex || '').toLowerCase();
  if (!/^#[0-9a-f]{6}$/.test(hex)) return null;
  if (hex in __colorBucket) return __colorBucket[hex];
  const c = rgbHsl(hex);
  const pool = __filterHsl.filter(f => (f.s < NEUTRAL_S) === (c.s < NEUTRAL_S));
  const hueGap = f => Math.min(Math.abs(f.h - c.h), 360 - Math.abs(f.h - c.h));
  let best = null, bestScore = Infinity, bestHue = Infinity;
  pool.forEach(f => {
    /* Trung tính: chỉ có độ sáng để phân biệt. Có sắc: hue là chính, nhưng phải
       CỘNG phạt độ sáng — Nâu (#664232) và Beige (#e4d8c9) gần như cùng hue
       (18° vs 33°), khác nhau ở độ sáng; chỉ so hue thì màu da nâu #a06a3f rơi
       vào Beige. Hệ số 60 đủ để tách 2 ô đó mà không phá các ô còn lại. */
    /* 26/08 CỘNG THÊM phạt ĐỘ NO: bảng 15 ô của khách có ô Cam (#e0762d, h 24.5°)
       nằm gần như đúng hue của Nâu và của da bò #a06a3f Cuoio (26.6°) — hai thứ chỉ
       khác nhau ở chỗ cam thì RỰC (s .74) còn da bò thì ĐỤC (s .43). Không có số
       hạng này thì túi Cuoio bị xếp vào "Cam". */
    const score = c.s < NEUTRAL_S
      ? Math.abs(f.l - c.l)
      : hueGap(f) + 60 * Math.abs(f.l - c.l) + 60 * Math.abs(f.s - c.s);
    if (score < bestScore) { bestScore = score; bestHue = hueGap(f); best = f.name; }
  });
  if (c.s >= NEUTRAL_S && bestHue > HUE_TOL) best = null;   // ngưỡng xét trên HUE, không phải score
  return (__colorBucket[hex] = best);
}

function plpGridInner(list, card) {
  if (!list.length && plpFilters.length) return plpFilterEmptyHTML();
  return list.map(({ p, i }) => card(p, i)).join('');
}
function matchProducts(list, labels) {
  const brands = labels.filter(l => FILTER_BRANDS.includes(l));
  /* "Nhiều màu" tách khỏi mảng màu đơn sắc — nó không có bucket HSL, lọc bằng cờ
     `multi` của sản phẩm; tick cùng ô màu khác vẫn là HỢP (OR). */
  const colors = labels.filter(l => l !== 'Nhiều màu' && FILTER_COLORS.some(([n]) => n === l));
  const multi  = labels.includes('Nhiều màu');
  const flags  = labels.filter(l => FILTER_FLAGS.includes(l));
  const sizes  = labels.filter(l => FILTER_VOLUMES.includes(l));
  const heels  = labels.filter(l => FILTER_HEELS.some(([n]) => n === l));
  return list.filter(({ p }) => {
    if (brands.length && !brands.includes(p.brand)) return false;
    if (colors.length || multi) {
      const buckets = (p.colors || []).map(c => colorBucketOf(c.hex));
      const hit = colors.some(c => buckets.includes(c)) || (multi && !!p.multi);
      if (!hit) return false;
    }
    if (flags.includes('Đang giảm giá') && !p.off) return false;
    if (flags.includes('Hàng mới về') && !/new/i.test(p.tag || '')) return false;
    if (flags.includes('Chỉ hàng có sẵn') && p.preorder) return false;   /* lọc thật 28/08 */
    /* Dung tích LỌC THẬT: 8 sản phẩm beauty trong PRODUCTS có field `sizes` trùng
       khít FILTER_VOLUMES. (Size quần áo/giày thì vẫn không lọc được — PRODUCTS
       không mang size thời trang, chỉ PDP_DATA có.) */
    if (sizes.length) {
      const has = p.sizes || [];
      if (!sizes.some(v => has.includes(v))) return false;
    }
    /* Độ cao giày (feedback 26/08 #3) — SP không khai `heel` thì KHÔNG khớp mức
       nào. Biên [lo, hi] đóng 2 đầu vì bảng khách đọc là "0 - 5.5". */
    if (heels.length) {
      if (p.heel == null) return false;
      const hit = heels.some(l => {
        const r = (FILTER_HEELS.find(([n]) => n === l) || ['', [0, 0]])[1];
        return p.heel >= r[0] && p.heel <= r[1];
      });
      if (!hit) return false;
    }
    return true;
  });
}
